  function renderOrderDetailPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageOrderDetailHTML();
    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    // 취소·반품 요청 버튼(주문내역, 구매자 모드) — 팝업을 띄운다.
    wrapper.querySelectorAll('[data-buyer-cancel-open]').forEach(btn => {
      btn.addEventListener('click', () => openBuyerCancelModal(btn.dataset.buyerCancelOpen));
    });
    wrapper.querySelectorAll('[data-cr-open]').forEach(btn => {
      btn.addEventListener('click', () => {
        openCrModal(btn.dataset.crOpen, btn.dataset.crType);
      });
    });

    // 배송확정 버튼(주문내역, 구매자 모드) — 확인 팝업을 띄운다.
    wrapper.querySelectorAll('[data-delivery-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openDeliveryConfirmModal(btn.dataset.deliveryConfirm);
      });
    });

    // 취소·반품 처리 버튼(주문접수관리, 공급자 모드) — 요청 조정 또는 직권 처리 팝업을 띄운다.
    wrapper.querySelectorAll('[data-supplier-cr-open]').forEach(btn => {
      btn.addEventListener('click', () => {
        openSupplierCrModal(btn.dataset.supplierCrOpen, btn.dataset.crType);
      });
    });

    // 결제확인 버튼(주문접수관리, 공급자 모드) — 목록과 동일한 방식으로 결제상태만 즉시 반영한다.
    wrapper.querySelectorAll('[data-payment-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = ORDER_LIST.find(x => x.orderNo === btn.dataset.paymentConfirm);
        if (!o) return;
        o.paymentStatus = '결제완료';
        o.paidAt = mockNowStamp(); // 결제완료 일시 — 매출조회 결제총액의 기준일
        renderOrderDetailPage();
      });
    });

    // 배송확정 버튼(주문접수관리, 공급자 모드) — 셀렉이 아닌 별도 확인 팝업을 거친다.
    wrapper.querySelectorAll('[data-supplier-delivery-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openSupplierDeliveryConfirmModal(btn.dataset.supplierDeliveryConfirm);
      });
    });

    bindWsStageButtons(wrapper, renderOrderDetailPage, false);
  }

  // ---- 취소·반품 요청 팝업(모달) ----
  // 주문내역(구매자 모드)에서 리스트/상세 어디서 열든 동일한 팝업을 사용한다.
  // 제출 시 상태는 항상 '요청'으로만 반영되며, 공급자가 상세 화면에서 승인·반려를 확정해야 한다(구매자가 직접 확정하지 않음).
  function crModalHTML(orderNo, crType) {
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    const isTransfer = o.paymentMethod === 'transfer';
    return `
      <div class="modal-scrim" id="crModalScrim">
        <div class="modal-box">
          <h3>${crType} 요청</h3>
          <div class="form-grid">
            ${isTransfer ? `
            <div class="form-field">
              <label>환불은행<span class="req">*</span></label>
              <input class="form-input" type="text" id="crModalRefundBank" placeholder="예: 신한은행">
            </div>
            <div class="form-field">
              <label>예금주<span class="req">*</span></label>
              <input class="form-input" type="text" id="crModalRefundHolder" placeholder="예금주명을 입력해주세요.">
            </div>
            <div class="form-field form-field-wide">
              <label>환불계좌번호<span class="req">*</span></label>
              <input class="form-input" type="text" id="crModalRefundAccount" data-fmt="account" inputmode="numeric" maxlength="20" placeholder="'-' 없이 숫자만 입력">
            </div>` : `
            <div class="form-field form-field-wide">
              <div class="field-hint">카드결제 건은 승인 시 PG사를 통해 자동으로 결제가 취소됩니다.</div>
            </div>`}
            <div class="form-field form-field-wide">
              <label>${crType} 사유<span class="req">*</span></label>
              <textarea class="form-input" id="crModalReason" rows="3" placeholder="${crType} 사유를 입력해주세요."></textarea>
            </div>
          </div>
          <div class="form-error-banner" id="crModalError" style="margin-top:12px;" hidden></div>
          <div class="field-hint" style="margin-top:8px;">${crType} 요청 후에는 공급자 확인을 거쳐 처리됩니다.</div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="crModalCancelBtn">닫기</button>
            <button type="button" class="btn-primary" id="crModalSubmitBtn">${crType} 요청</button>
          </div>
        </div>
      </div>`;
  }

  function closeCrModal() {
    const root = document.getElementById('crModalRoot');
    if (root) root.remove();
  }

  function openCrModal(orderNo, crType) {
    closeCrModal();
    const root = document.createElement('div');
    root.id = 'crModalRoot';
    root.innerHTML = crModalHTML(orderNo, crType);
    document.body.appendChild(root);
    bindCrModal(orderNo, crType);
  }

  function bindCrModal(orderNo, crType) {
    const root = document.getElementById('crModalRoot');
    if (!root) return;

    root.querySelector('#crModalCancelBtn').addEventListener('click', closeCrModal);
    root.querySelector('#crModalScrim').addEventListener('click', e => {
      if (e.target.id === 'crModalScrim') closeCrModal();
    });

    root.querySelector('#crModalSubmitBtn').addEventListener('click', () => {
      const o = ORDER_LIST.find(x => x.orderNo === orderNo);
      if (!o) { closeCrModal(); return; }

      const reason = root.querySelector('#crModalReason').value.trim();
      const isTransfer = o.paymentMethod === 'transfer';
      let refundBank = '', refundAccount = '', refundHolder = '';
      const errors = [];
      if (!reason) errors.push(`${crType} 사유를 입력해주세요.`);
      if (isTransfer) {
        refundBank = root.querySelector('#crModalRefundBank').value.trim();
        refundAccount = root.querySelector('#crModalRefundAccount').value.trim();
        refundHolder = root.querySelector('#crModalRefundHolder').value.trim();
        if (!refundBank) errors.push('환불은행을 입력해주세요.');
        if (!refundAccount) errors.push('환불계좌번호를 입력해주세요.');
        if (!refundHolder) errors.push('예금주를 입력해주세요.');
      }

      const errorBox = root.querySelector('#crModalError');
      if (errors.length) {
        errorBox.hidden = false;
        errorBox.textContent = errors.join(' ');
        return;
      }

      // 구매자 제출 시점에는 항상 '요청' 상태로만 반영 — 승인/반려는 공급자가 상세 화면에서 확정한다.
      o.cancelReturnStatus = `${crType}요청`;
      o.cancelReturnReason = reason;
      o.cancelReturnRequestedAt = mockNowStamp();
      o.cancelReturnResolvedAt = null;
      o.cancelReturnSellerNote = null;
      o.processStatus = null;
      if (isTransfer) {
        o.refundBank = refundBank;
        o.refundAccount = refundAccount;
        o.refundHolder = refundHolder;
      }

      closeCrModal();
      if (currentItem === 'wholesale-order-status') {
        renderOrderHistoryPage();
      } else if (currentItem === 'wholesale-order-detail') {
        renderOrderDetailPage();
      }
    });
  }

  // ---- 구매자 즉시취소 확인 팝업(모달) ----
  // 주문접수 단계의 카드결제·결제대기 건은 판매자 승인 없이 즉시 취소 승인 상태로 확정된다(처리 주체: 구매자).
  // 재고는 자동 복원되고, 카드 결제완료 건은 결제가 전액 취소된다. 취소 실패 시에는 취소가 처리되지 않고 구매자가 다시 시도한다.
  function closeBuyerCancelModal() {
    const root = document.getElementById('buyerCancelModalRoot');
    if (root) root.remove();
  }
  function openBuyerCancelModal(orderNo) {
    closeBuyerCancelModal();
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return;
    const paidByCard = o.paymentMethod === 'card' && o.paymentStatus === '결제완료';
    const hint = paidByCard ? '카드 결제가 전액 취소되며 결제상태가 결제취소로 변경됩니다.' : '입금 전 주문이므로 환불 없이 결제취소 처리됩니다.';
    const root = document.createElement('div');
    root.id = 'buyerCancelModalRoot';
    root.innerHTML = `
      <div class="modal-scrim" id="buyerCancelScrim">
        <div class="modal-box">
          <h3>주문 취소</h3>
          <div class="field-hint">주문번호 ${o.orderNo} 건을 취소하시겠습니까?</div>
          <div class="field-hint" style="margin-top:8px;">${hint} 취소 후에는 되돌릴 수 없습니다.</div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="buyerCancelCloseBtn">닫기</button>
            <button type="button" class="btn-danger" id="buyerCancelConfirmBtn">주문취소</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(root);
    root.querySelector('#buyerCancelCloseBtn').addEventListener('click', closeBuyerCancelModal);
    root.querySelector('#buyerCancelScrim').addEventListener('click', e => {
      if (e.target.id === 'buyerCancelScrim') closeBuyerCancelModal();
    });
    root.querySelector('#buyerCancelConfirmBtn').addEventListener('click', () => {
      const stamp = mockNowStamp();
      o.cancelReturnStatus = '취소승인';
      o.cancelReturnPrevStatus = '주문접수';
      o.cancelReturnInitiator = 'buyer';
      o.cancelReturnReason = null;
      o.cancelReturnRequestedAt = stamp;
      o.cancelReturnResolvedAt = stamp; // 승인 건은 이 일시가 매출조회 취소·환불액의 기준일이 된다.
      o.processStatus = null;
      o.paymentStatus = '결제취소';
      if (paidByCard) {
        o.refundType = 'full';
        o.productRefundAmount = o.itemsTotal;
        o.shippingFeeRefunded = true;
        o.totalRefundAmount = o.grandTotal;
      }
      closeBuyerCancelModal();
      if (currentItem === 'wholesale-order-status') renderOrderHistoryPage();
      else if (currentItem === 'wholesale-order-detail') renderOrderDetailPage();
    });
  }

  // ---- 배송확정 확인 팝업(모달) ----
  // 배송중 건을 구매자가 직접 배송확정 처리한다. 배송확정 후에는 취소·반품 요청이 불가하고, 소매상품등록 대상이 되므로
  // 되돌릴 수 없는 처리임을 팝업에서 먼저 안내하고 확인을 받는다.
  function deliveryConfirmModalHTML(orderNo) {
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    // 완료 처리 시점에 결제상태가 아직 결제대기라면 결제도 함께 결제완료로 전환한다 — 소매 픽업완료/배달완료 완료 처리와 동일한 방식이다.
    const paymentNoteHTML = o.paymentStatus === '결제대기'
      ? `<div class="field-hint" style="margin-top:8px;">결제대기 상태인 경우 결제도 함께 완료 처리됩니다.</div>` : '';
    return `
      <div class="modal-scrim" id="deliveryModalScrim">
        <div class="modal-box">
          <h3>배송확정 처리</h3>
          <div class="field-hint">주문번호 ${o.orderNo} 상품을 정상적으로 수령하셨습니까?</div>
          <div class="field-hint" style="margin-top:8px;">배송확정 처리 후에는 취소·반품을 요청할 수 없으며, 소매상품으로 등록할 수 있습니다.</div>
          ${paymentNoteHTML}
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="deliveryModalCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="deliveryModalConfirmBtn">배송확정</button>
          </div>
        </div>
      </div>`;
  }

  function closeDeliveryConfirmModal() {
    const root = document.getElementById('deliveryModalRoot');
    if (root) root.remove();
  }

  function openDeliveryConfirmModal(orderNo) {
    closeDeliveryConfirmModal();
    const root = document.createElement('div');
    root.id = 'deliveryModalRoot';
    root.innerHTML = deliveryConfirmModalHTML(orderNo);
    document.body.appendChild(root);
    bindDeliveryConfirmModal(orderNo);
  }

  function bindDeliveryConfirmModal(orderNo) {
    const root = document.getElementById('deliveryModalRoot');
    if (!root) return;

    root.querySelector('#deliveryModalCancelBtn').addEventListener('click', closeDeliveryConfirmModal);
    root.querySelector('#deliveryModalScrim').addEventListener('click', e => {
      if (e.target.id === 'deliveryModalScrim') closeDeliveryConfirmModal();
    });
    root.querySelector('#deliveryModalConfirmBtn').addEventListener('click', () => {
      const o = ORDER_LIST.find(x => x.orderNo === orderNo);
      if (o) {
        o.processStatus = '배송확정';
        o.deliveryConfirmedAt = mockNowStamp();
        o.processedAt = o.deliveryConfirmedAt;
        o.deliveryConfirmedBy = 'manual';
        if (o.paymentStatus === '결제대기') { o.paymentStatus = '결제완료'; o.paidAt = mockNowStamp(); }
      }

      closeDeliveryConfirmModal();
      if (currentItem === 'wholesale-order-status') {
        renderOrderHistoryPage();
      } else if (currentItem === 'wholesale-order-detail') {
        renderOrderDetailPage();
      }
    });
  }

  // ---- 취소·반품 처리 팝업(모달, 주문접수관리 · 공급자 모드) ----
  // 두 가지 모드로 동작한다.
  // - 조정 모드: 구매자 요청(취소요청/반품요청)이 진행중일 때 — 처리 방식(승인/반려)을 선택해 반영한다.
  // - 직권 모드: 요청 이력이 없거나 반려로 종료된 건일 때 — 공급자가 제출 즉시 승인 처리한다.
  // 환불 영역(금액 조회·환불구분·총환불금액·환불계좌)은 승인일 때만 노출하며, 구성 규칙은 crRefundSectionHTML을 따른다.
  function supplierCrModalHTML(orderNo, crType) {
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    const isAdjust = o.cancelReturnStatus === `${crType}요청`;
    const options = crStatusOptions(crType);

    // 처리 방식(승인/반려) — 조정 모드 전용. 기본 선택값은 "승인"이다.
    const statusRadioHTML = isAdjust ? `
      <div class="form-field form-field-wide">
        <label>처리 방식</label>
        <div class="radio-row">
          ${options.map((op, i) => `<label><input type="radio" name="supplierCrDecision" value="${op.value}" ${i === 0 ? 'checked' : ''}> ${op.label}</label>`).join('')}
        </div>
      </div>` : '';

    // 재고 반영 여부 — 이 주문에 내 도매상품(PRODUCT_LIST) 재고로 복원할 품목이 있을 때만 노출한다.
    // 조정 모드에서는 처리 방식이 "승인"일 때만 노출한다. 기본값은 체크 상태이며 주문 전체 품목 수량을 함께 복원한다.
    const stockRestoreHTML = orderHasRestorableStock(o) ? `
      <div class="stock-restore-box" id="supplierCrStockRestoreBox">
        <label>
          <input type="checkbox" id="supplierCrStockRestoreCheckbox" checked>
          <span>재고 반영 — 체크 시 이 주문의 품목 수량만큼 도매수량을 복원합니다.</span>
        </label>
        <div class="field-hint">현재는 주문 전체 단위로만 처리됩니다. 품목이 여러 건이어도 전체 품목의 수량이 함께 복원됩니다.</div>
      </div>` : '';

    return crModalShellHTML({
      p: 'supplierCr',
      title: `${crType}처리`,
      infoHTML: crInfoFieldHTML('처리 주체', isAdjust ? '구매자 요청' : '공급자 직권') + '<div class="form-field"></div>'
        + crInfoFieldHTML('결제수단', o.paymentMethod === 'transfer' ? '계좌이체' : '카드결제')
        + crInfoFieldHTML('결제상태', escapeHtml(o.paymentStatus)),
      statusRadioHTML,
      refundSectionHTML: crRefundSectionHTML(o, 'supplierCr', 'wholesale'),
      reason: isAdjust ? o.cancelReturnReason : '',
      note: isAdjust ? o.cancelReturnSellerNote : '',
      notePlaceholder: '예: 배송 준비가 이미 완료되어 취소가 어렵습니다.',
      stockRestoreHTML,
      submitLabel: `${crType}처리`,
    });
  }

  function closeSupplierCrModal() {
    const root = document.getElementById('supplierCrModalRoot');
    if (root) root.remove();
  }

  function openSupplierCrModal(orderNo, crType) {
    closeSupplierCrModal();
    const root = document.createElement('div');
    root.id = 'supplierCrModalRoot';
    root.innerHTML = supplierCrModalHTML(orderNo, crType);
    document.body.appendChild(root);
    bindSupplierCrModal(orderNo, crType);
  }

  function bindSupplierCrModal(orderNo, crType) {
    const root = document.getElementById('supplierCrModalRoot');
    if (!root) return;
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) { closeSupplierCrModal(); return; }
    const isAdjust = o.cancelReturnStatus === `${crType}요청`;
    const isTransfer = o.paymentMethod === 'transfer';
    const isPending = o.paymentStatus === '결제대기';

    root.querySelector('#supplierCrModalCancelBtn').addEventListener('click', closeSupplierCrModal);
    root.querySelector('#supplierCrModalScrim').addEventListener('click', e => {
      if (e.target.id === 'supplierCrModalScrim') closeSupplierCrModal();
    });

    const refundSection = root.querySelector('#supplierCrRefundSection');
    const stockRestoreBox = root.querySelector('#supplierCrStockRestoreBox');
    const isApproved = () => {
      if (!isAdjust) return true;
      const checked = root.querySelector('input[name="supplierCrDecision"]:checked');
      return !!checked && checked.value === `${crType}승인`;
    };
    const refundCtl = bindCrRefundInputs(root, o, 'supplierCr', 'wholesale');
    const updateSubmitState = bindCrSubmitState(root, 'supplierCr', refundCtl, isApproved);

    // 조정 모드 — 처리 방식(승인/반려) 라디오에 따라 환불 영역·재고 반영 체크박스 노출 여부를 토글한다.
    if (isAdjust) {
      root.querySelectorAll('input[name="supplierCrDecision"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const approved = isApproved();
          if (refundSection) refundSection.hidden = !approved;
          if (stockRestoreBox) stockRestoreBox.hidden = !approved;
          updateSubmitState();
        });
      });
    }

    root.querySelector('#supplierCrModalSubmitBtn').addEventListener('click', () => {
      const approvedNow = isApproved(); // 이번 제출로 "취소승인/반품승인" 상태가 확정되는지 — 재고·환불 반영 판단 기준
      if (approvedNow && !refundCtl.validate()) return;
      const decision = approvedNow && !isPending ? readCrRefund(root, o, 'supplierCr', 'wholesale') : null;

      o.cancelReturnSellerNote = root.querySelector('#supplierCrNoteInput').value.trim() || null;
      // 환불계좌 입력 필드는 계좌이체이면서 결제완료(실제로 환불이 필요)인 경우에만 화면에 존재한다.
      if (approvedNow && isTransfer && !isPending) {
        o.refundBank = root.querySelector('#supplierCrRefundBank').value.trim() || null;
        o.refundAccount = root.querySelector('#supplierCrRefundAccount').value.trim() || null;
        o.refundHolder = root.querySelector('#supplierCrRefundHolder').value.trim() || null;
      }

      if (isAdjust) {
        // 조정 모드 — 구매자 요청 건의 상태를 승인/반려 라디오 선택값대로 반영한다. 반려 시 요청 이전 단계로 복귀한다.
        const restoreTrack = crType === '취소' ? '주문접수' : '배송중';
        o.cancelReturnStatus = approvedNow ? `${crType}승인` : `${crType}반려`;
        o.processStatus = approvedNow ? null : restoreTrack;
      } else {
        // 직권 모드 — 요청 이력 없이 공급자가 바로 승인 처리한다.
        o.cancelReturnStatus = `${crType}승인`;
        o.cancelReturnInitiator = 'supplier';
        o.cancelReturnReason = null;
        o.cancelReturnRequestedAt = null;
        o.processStatus = null;
      }
      o.cancelReturnResolvedAt = mockNowStamp(); // 승인 건은 이 일시가 매출조회 취소·환불액의 기준일이 된다.
      if (o.processStatus) o.processedAt = o.cancelReturnResolvedAt; // 반려로 이전 단계에 복귀한 건은 처리시점도 반려 일시로 갱신
      if (!o.cancelReturnRequestedAt) o.cancelReturnRequestedAt = o.cancelReturnResolvedAt;
      // 승인 확정과 함께 결제상태를 결제취소로 전환한다. 카드결제 건은 페이앱 결제취소 성공 응답을 확인한 뒤에만 이 단계에 도달한다(목업은 성공으로 가정).
      if (approvedNow) o.paymentStatus = '결제취소';

      // 결제대기 건은 승인해도 결제취소만 일어날 뿐 환불이 발생하지 않으므로 환불값을 남기지 않는다.
      if (decision) applyCrRefund(o, decision, 'wholesale');

      // 재고 반영 — 취소·반품이 승인으로 확정되는 시점에만, 체크박스가 노출·선택된 경우 주문 전체 품목 수량을 도매수량에 복원한다.
      const stockRestoreCheckbox = root.querySelector('#supplierCrStockRestoreCheckbox');
      const stockRestoreVisible = stockRestoreBox && !stockRestoreBox.hidden;
      if (approvedNow && stockRestoreVisible && stockRestoreCheckbox && stockRestoreCheckbox.checked) {
        restoreOwnWholesaleStock(o);
        o.cancelReturnStockRestored = true;
      } else if (approvedNow && stockRestoreVisible) {
        o.cancelReturnStockRestored = false;
      }

      closeSupplierCrModal();
      if (currentItem === 'wholesale-order-receive') {
        renderOrderReceivePage();
      } else if (currentItem === 'wholesale-order-detail') {
        renderOrderDetailPage();
      }
    });
  }

  // ---- 배송확정 확인 팝업(모달, 주문접수관리 · 공급자 모드) ----
  // 배송중 건의 처리상태를 셀렉에 두면 실수로 배송확정까지 선택될 위험이 있어, 배송확정만 별도 버튼 + 확인 팝업으로 분리한다.
  // 주문내역(구매자 모드)의 배송확정 팝업과 동일한 방식이나, 공급자 관점 문구(수령 여부가 아닌 배송확정 처리 의사 확인)를 사용한다.
  function supplierDeliveryConfirmModalHTML(orderNo) {
    const o = ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    // 완료 처리 시점에 결제상태가 아직 결제대기라면 결제도 함께 결제완료로 전환한다 — 소매 픽업완료/배달완료 완료 처리와 동일한 방식이다.
    const paymentNoteHTML = o.paymentStatus === '결제대기'
      ? `<div class="field-hint" style="margin-top:8px;">결제대기 상태인 경우 결제도 함께 완료 처리됩니다.</div>` : '';
    return `
      <div class="modal-scrim" id="supplierDeliveryModalScrim">
        <div class="modal-box">
          <h3>배송확정 처리</h3>
          <div class="field-hint">주문번호 ${o.orderNo} 배송을 확정 처리하시겠습니까?</div>
          <div class="field-hint" style="margin-top:8px;">배송확정 처리 후에는 처리상태 변경, 취소처리·반품처리가 모두 불가능합니다.</div>
          ${paymentNoteHTML}
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="supplierDeliveryModalCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="supplierDeliveryModalConfirmBtn">배송확정</button>
          </div>
        </div>
      </div>`;
  }

  function closeSupplierDeliveryConfirmModal() {
    const root = document.getElementById('supplierDeliveryModalRoot');
    if (root) root.remove();
  }

  function openSupplierDeliveryConfirmModal(orderNo) {
    closeSupplierDeliveryConfirmModal();
    const root = document.createElement('div');
    root.id = 'supplierDeliveryModalRoot';
    root.innerHTML = supplierDeliveryConfirmModalHTML(orderNo);
    document.body.appendChild(root);
    bindSupplierDeliveryConfirmModal(orderNo);
  }

  function bindSupplierDeliveryConfirmModal(orderNo) {
    const root = document.getElementById('supplierDeliveryModalRoot');
    if (!root) return;

    root.querySelector('#supplierDeliveryModalCancelBtn').addEventListener('click', closeSupplierDeliveryConfirmModal);
    root.querySelector('#supplierDeliveryModalScrim').addEventListener('click', e => {
      if (e.target.id === 'supplierDeliveryModalScrim') closeSupplierDeliveryConfirmModal();
    });
    root.querySelector('#supplierDeliveryModalConfirmBtn').addEventListener('click', () => {
      const o = ORDER_LIST.find(x => x.orderNo === orderNo);
      if (o) {
        o.processStatus = '배송확정';
        o.deliveryConfirmedAt = mockNowStamp();
        o.processedAt = o.deliveryConfirmedAt;
        o.deliveryConfirmedBy = 'manual';
        if (o.paymentStatus === '결제대기') { o.paymentStatus = '결제완료'; o.paidAt = mockNowStamp(); }
      }

      closeSupplierDeliveryConfirmModal();
      if (currentItem === 'wholesale-order-receive') {
        renderOrderReceivePage();
      } else if (currentItem === 'wholesale-order-detail') {
        renderOrderDetailPage();
      }
    });
  }

  // ---- 주문내역 (구매자 모드) ----
  // 주문접수관리와 동일한 데이터를 seller !== MY_SELLER_NAME 기준으로 보여준다.
  // 기간검색에 더해 배송확정 / 취소·반품요청 / 취소·반품승인 상태 필터를 함께 제공한다.
  function orderHistoryRows() {
    let rows = myPurchases();
    if (orderHistoryPeriod === 'custom') {
      if (orderHistoryDateFrom) {
        const from = inputDateToOrderDate(orderHistoryDateFrom);
        rows = rows.filter(o => orderDatePart(o) >= from);
      }
      if (orderHistoryDateTo) {
        const to = inputDateToOrderDate(orderHistoryDateTo);
        rows = rows.filter(o => orderDatePart(o) <= to);
      }
    } else if (orderHistoryPeriod !== 'all') {
      const months = { '1m': 1, '3m': 3, '6m': 6 }[orderHistoryPeriod];
      const from = monthsAgoOrderDate(months);
      rows = rows.filter(o => orderDatePart(o) >= from);
    }
    if (orderHistoryStatusFilter !== 'all') {
      rows = rows.filter(o => orderTabGroup(o) === orderHistoryStatusFilter);
    }
    return rows.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
  }

  // 취소·반품 요청은 정책상 주문접수 단계는 취소만, 배송중 단계는 반품 또는 배송확정만 가능하다.
  // 이미 취소·반품 이력이 있는 건은 구매자가 다시 요청하지 않고 상세에서 진행 상황만 조회한다.
  // 주문접수 단계 구매자 취소 — 카드결제 건과 결제대기 건은 판매자 승인 없이 즉시 취소되고([주문취소]),
  // 계좌이체 결제완료 건은 환불이 판매자 수동 처리라 승인 요청([취소요청])으로 진행한다.
  function buyerCancelIsImmediate(o) {
    return o.paymentMethod === 'card' || o.paymentStatus === '결제대기';
  }
  function buyerCancelButtonHTML(o) {
    return buyerCancelIsImmediate(o)
      ? `<button type="button" class="btn-danger" data-buyer-cancel-open="${o.orderNo}">주문취소</button>`
      : `<button type="button" class="btn-danger" data-cr-open="${o.orderNo}" data-cr-type="취소">취소요청</button>`;
  }

  function orderHistoryRowActionsHTML(o) {
    if (!o.cancelReturnStatus) {
      if (o.processStatus === '주문접수') {
        return `
          <div class="row-actions row-actions-stack">
            ${buyerCancelButtonHTML(o)}
            <button type="button" data-order-detail="${o.orderNo}">상세보기</button>
          </div>`;
      }
      if (o.processStatus === '배송중') {
        return `
          <div class="row-actions row-actions-stack">
            <button type="button" class="btn-primary" data-delivery-confirm="${o.orderNo}">배송확정</button>
            <button type="button" class="btn-danger" data-cr-open="${o.orderNo}" data-cr-type="반품">반품요청</button>
            <button type="button" data-order-detail="${o.orderNo}">상세보기</button>
          </div>`;
      }
    }
    if (o.cancelReturnStatus === '반품반려' && o.processStatus === '배송중') {
      return `
        <div class="row-actions row-actions-stack">
          <button type="button" class="btn-primary" data-delivery-confirm="${o.orderNo}">배송확정</button>
          <button type="button" data-order-detail="${o.orderNo}">상세보기</button>
        </div>`;
    }
    return `<div class="row-actions row-actions-stack"><button type="button" data-order-detail="${o.orderNo}">상세보기</button></div>`;
  }

  function pageOrderHistoryHTML() {
    const rows = orderHistoryRows();
    const pgOh = pgSlice('orderHistory', JSON.stringify([orderHistoryPeriod, orderHistoryDateFrom, orderHistoryDateTo, orderHistoryStatusFilter]), rows);

    const periodChipsHTML = ORDER_HISTORY_PERIOD_DEFS.map(p => `
      <button type="button" class="tab-btn-sub ${orderHistoryPeriod === p.id ? 'active' : ''}" data-order-history-period="${p.id}">${p.label}</button>`).join('');
    const statusTabsHTML = ORDER_HISTORY_STATUS_DEFS.map(s => `
      <button type="button" class="tab-btn ${orderHistoryStatusFilter === s.id ? 'active' : ''}" data-order-history-status="${s.id}">${s.label}</button>`).join('');

    const tr = pgOh.rows.map(o => {
      const itemsLabel = o.items.length > 1 ? `${escapeHtml(o.items[0].name)} 외 ${o.items.length - 1}건` : escapeHtml(o.items[0].name);
      return `
        <tr>
          <td>${o.orderNo}</td>
          <td>${o.createdAt}</td>
          <td>${escapeHtml(o.seller)}</td>
          <td>${itemsLabel}</td>
          <td>${o.paymentMethod === 'card' ? '카드결제' : '계좌이체'}</td>
          <td>${paymentStatusHTML(o)}</td>
          <td>${o.processStatus ? statusTag(o.processStatus) : '-'}</td>
          <td>${orderBadgeHTML(o) || '-'}</td>
          <td class="num">${o.grandTotal.toLocaleString()}원</td>
          <td class="col-actions">${orderHistoryRowActionsHTML(o)}</td>
        </tr>`;
    }).join('');

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>주문내역</h2>
          </div>

          <div class="tab-row-sub" style="align-items:center;">
            ${periodChipsHTML}
            ${orderHistoryPeriod === 'custom' ? `
            <span style="display:flex; align-items:center; gap:6px; margin-left:4px;">
              <input class="filter-select" type="date" id="orderHistoryDateFrom" value="${orderHistoryDateFrom}">
              <span style="color:var(--text-secondary);">~</span>
              <input class="filter-select" type="date" id="orderHistoryDateTo" value="${orderHistoryDateTo}">
            </span>` : ''}
          </div>
          <div class="tab-row">${statusTabsHTML}</div>

          <div class="table-toolbar">
            <span class="table-count">전체 ${rows.length}건</span>
          </div>

          <div class="table-wrap">
            <table class="tpl-table">
              <thead>
                <tr>
                  <th class="c-l">주문번호</th><th class="c-m">주문일시</th><th class="c-m">공급자</th><th class="c-flex">상품정보</th>
                  <th class="c-s">결제수단</th><th class="c-s">결제상태</th><th class="c-s">처리상태</th><th class="c-s">취소·반품</th><th class="c-m">합계금액</th><th class="col-actions">관리</th>
                </tr>
              </thead>
              <tbody>${tr || `<tr><td colspan="10" style="text-align:center; color:var(--text-secondary); padding:32px 0;">해당 조건의 주문이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>

          ${pgOh.html}

        </div>
      </div>`;
  }

  function renderOrderHistoryPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageOrderHistoryHTML();

    wrapper.querySelectorAll('[data-order-history-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        orderHistoryPeriod = btn.dataset.orderHistoryPeriod;
        if (orderHistoryPeriod !== 'custom') { orderHistoryDateFrom = ''; orderHistoryDateTo = ''; }
        renderOrderHistoryPage();
      });
    });
    wrapper.querySelectorAll('[data-order-history-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        orderHistoryStatusFilter = btn.dataset.orderHistoryStatus;
        renderOrderHistoryPage();
      });
    });
    const dateFromInput = wrapper.querySelector('#orderHistoryDateFrom');
    const dateToInput = wrapper.querySelector('#orderHistoryDateTo');
    if (dateFromInput) {
      dateFromInput.addEventListener('change', e => {
        orderHistoryDateFrom = e.target.value;
        renderOrderHistoryPage();
      });
    }
    if (dateToInput) {
      dateToInput.addEventListener('change', e => {
        orderHistoryDateTo = e.target.value;
        renderOrderHistoryPage();
      });
    }

    wrapper.querySelectorAll('[data-order-detail]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentOrderDetailNo = btn.dataset.orderDetail;
        currentOrderDetailFrom = 'wholesale-order-status';
        currentItem = 'wholesale-order-detail';
        renderAll();
      });
    });

    wrapper.querySelectorAll('[data-buyer-cancel-open]').forEach(btn => {
      btn.addEventListener('click', () => openBuyerCancelModal(btn.dataset.buyerCancelOpen));
    });
    wrapper.querySelectorAll('[data-cr-open]').forEach(btn => {
      btn.addEventListener('click', () => {
        openCrModal(btn.dataset.crOpen, btn.dataset.crType);
      });
    });

    // 배송확정 버튼(목록) — 확인 팝업을 띄운다.
    wrapper.querySelectorAll('[data-delivery-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openDeliveryConfirmModal(btn.dataset.deliveryConfirm);
      });
    });
  }

  // ==================================================================
  // 소매관리 > 주문관리 > 주문목록 · 주문상세 · 채팅주문설정
  // ==================================================================

  // 1차 탭 그룹핑 — 픽업/배달 두 처리 트랙을 하나의 탭 체계로 묶는다. 배달중은 배달 건에만 존재한다.
  function retailOrderTabGroup(o) {
    if (o.cancelReturnStatus === '취소요청' || o.cancelReturnStatus === '반품요청') return 'cr-req';
    if (o.cancelReturnStatus === '취소승인' || o.cancelReturnStatus === '반품승인') return 'cr-approved';
    if (o.processStatus === '픽업대기' || o.processStatus === '배달대기') return 'wait';
    if (o.processStatus === '픽업완료' || o.processStatus === '배달완료') return 'done';
    return o.processStatus; // '주문접수' | '배달중' | null
  }

  // 노쇼후보 판정 — 처리상태가 주문접수 또는 픽업대기인 픽업 건 중 공통 픽업가능기간(주문 시점 스냅샷)의 종료일이 지난 건(종료일 다음날 00:00부터).
  // 취소·반품 요청이 진행 중인 건은 제외하고, 요청이 반려되어 정상 트랙으로 복귀한 건은 포함한다.
  // 처리상태를 바꾸지 않고 렌더 시점에 판정만 한다(판매자 수동 확인).
  function retailNoShowCandidate(o) {
    const crClosedOrNone = !o.cancelReturnStatus || o.cancelReturnStatus === '취소반려' || o.cancelReturnStatus === '반품반려';
    return o.salesMethod === 'pickup' &&
      (o.processStatus === '픽업대기' || o.processStatus === '주문접수') &&
      !!o.pickupEndDate && o.pickupEndDate < RETAIL_MOCK_TODAY && crClosedOrNone;
  }

  const RETAIL_ORDER_TAB1_DEFS = [
    { id: 'all', label: '전체' },
    { id: '주문접수', label: '주문접수' },
    { id: 'wait', label: '픽업·배달대기' },
    { id: '배달중', label: '배달중' },
    { id: 'done', label: '픽업·배달완료' },
    { id: 'cr-req', label: '취소·반품요청' },
    { id: 'cr-approved', label: '취소·반품승인' },
  ];
  const RETAIL_ORDER_TAB2_DEFS = [
    { id: 'all', label: '전체' },
    { id: '결제대기', label: '결제대기' },
    { id: '결제완료', label: '결제완료' },
    { id: '결제취소', label: '결제취소' },
    { id: '반려', label: '반려' },
  ];
  const RETAIL_ORDER_PAYMETHOD_LABELS = { card: '카드결제', transfer: '계좌이체', onsite: '현장결제' };

  let retailOrderChannelFilter = 'all';     // all | link | chat — 주문경로 셀렉
  let retailOrderPayMethodFilter = 'all'; // all | card | transfer | onsite — 결제수단 셀렉
  let retailOrderSalesMethodFilter = 'all'; // all | pickup | delivery — 수령방식 셀렉
  let retailOrderDateFrom = '';
  let retailOrderDateTo = '';
  let retailOrderSearch = '';
  let retailOrderTab1 = 'all';
  let retailOrderTab2 = 'all';
  let currentRetailOrderDetailNo = null;

  function retailOrderCounts() {
    const counts = { all: RETAIL_ORDER_LIST.length };
    RETAIL_ORDER_TAB1_DEFS.forEach(t => { if (t.id !== 'all') counts[t.id] = RETAIL_ORDER_LIST.filter(o => retailOrderTabGroup(o) === t.id).length; });
    return counts;
  }

  function retailOrderRows() {
    let rows = RETAIL_ORDER_LIST.slice();
    if (retailOrderChannelFilter !== 'all') rows = rows.filter(o => o.orderChannel === retailOrderChannelFilter);
    if (retailOrderSalesMethodFilter !== 'all') rows = rows.filter(o => o.salesMethod === retailOrderSalesMethodFilter);
    if (retailOrderPayMethodFilter !== 'all') rows = rows.filter(o => o.paymentMethod === retailOrderPayMethodFilter);
    if (retailOrderSearch) {
      rows = rows.filter(o => searchMatch(retailOrderSearch, o.orderNo, o.buyerName, (retailOrderMember(o) || {}).nicknameCode, ...o.items.map(i => i.name)));
    }
    if (retailOrderDateFrom) {
      const from = inputDateToOrderDate(retailOrderDateFrom);
      rows = rows.filter(o => orderDatePart(o) >= from);
    }
    if (retailOrderDateTo) {
      const to = inputDateToOrderDate(retailOrderDateTo);
      rows = rows.filter(o => orderDatePart(o) <= to);
    }
    if (retailOrderTab1 !== 'all') rows = rows.filter(o => retailOrderTabGroup(o) === retailOrderTab1);
    if (retailOrderTab2 !== 'all') {
      if (retailOrderTab2 === '반려') {
        rows = rows.filter(o => o.cancelReturnStatus === '취소반려' || o.cancelReturnStatus === '반품반려');
      } else {
        rows = rows.filter(o => o.paymentStatus === retailOrderTab2);
      }
    }
    return rows.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
  }

  // 수령방식별 처리상태 셀렉 옵션 — 완료 단계(픽업완료/배달완료)는 셀렉이 아닌 별도 완료 버튼+확인 팝업으로만 진입한다.
  function retailOrderStatusSelectOptions(o) {
    return o.salesMethod === 'pickup' ? ['주문접수', '픽업대기'] : ['주문접수', '배달대기', '배달중'];
  }
  // 완료 버튼이 노출되는 마지막 사전단계 — 픽업은 픽업대기, 배달은 배달중.
  function retailOrderLastPreCompletionStage(o) {
    return o.salesMethod === 'pickup' ? '픽업대기' : '배달중';
  }
  function retailOrderCompletionLabel(o) {
    return o.salesMethod === 'pickup' ? '픽업완료' : '배달완료';
  }

  // 수령방식별 처리 단계 — 다음 단계 버튼은 단계 순서대로 한 칸씩만 진행하며, 완료 단계(픽업완료/배달완료)는
  // 확인 팝업을 거친다. 되돌리기는 직전 단계로만 복귀하며 완료·취소·반품 상태에서는 제공하지 않는다.
  function retailStageSeq(o) {
    return o.salesMethod === 'pickup' ? ['주문접수', '픽업대기', '픽업완료'] : ['주문접수', '배달대기', '배달중', '배달완료'];
  }
  function retailStageNext(o) {
    const seq = retailStageSeq(o);
    const i = seq.indexOf(o.processStatus);
    return i >= 0 && i < seq.length - 1 ? seq[i + 1] : null;
  }
  function retailStagePrev(o) {
    const seq = retailStageSeq(o);
    const i = seq.indexOf(o.processStatus);
    return i > 0 && i < seq.length - 1 ? seq[i - 1] : null;
  }
  function retailOrderCompletionButtonLabel(o) {
    if (o.salesMethod === 'pickup' && o.paymentStatus === '결제대기') return '결제·픽업완료';
    return retailOrderCompletionLabel(o);
  }
  function retailOrderIsActive(o) {
    const g = retailOrderTabGroup(o);
    return g !== 'cr-req' && g !== 'cr-approved' && g !== 'done';
  }
  function retailNextButtonHTML(o) {
    if (!retailOrderIsActive(o)) return '';
    const next = retailStageNext(o);
    if (!next) return '';
    if (next === retailOrderCompletionLabel(o)) {
      return `<button type="button" class="btn-primary" data-retail-completion-confirm="${o.orderNo}">${retailOrderCompletionButtonLabel(o)}</button>`;
    }
    return `<button type="button" class="btn-primary" data-retail-next-stage="${o.orderNo}" data-stage="${next}">${next}</button>`;
  }
  function retailRevertButtonHTML(o) {
    if (!retailOrderIsActive(o) || !retailStagePrev(o)) return '';
    return `<button type="button" class="btn-revert" data-retail-revert="${o.orderNo}">${REVERT_ICON_HTML}되돌리기</button>`;
  }
  function retailPaymentButtonHTML(o, inList) {
    const g = retailOrderTabGroup(o);
    // 취소·반품 요청·승인 건은 취소·반품 처리가 진행 중이거나 종결된 상태이므로 결제확인 버튼을 노출하지 않는다.
    if (g === 'cr-req' || g === 'cr-approved') return '';
    // 목록에서는 주문접수 단계에만 노출한다. 픽업대기는 [결제·픽업완료]로 통합되어 있어 상세에서만 결제확인한다.
    if (inList && o.processStatus !== '주문접수') return '';
    return paymentConfirmButtonHTML(o, inList);
  }
  // 취소·반품처리 — 요청 건은 조정 모드, 완료 건은 반품처리, 그 외 완료 이전 단계는 취소처리(공통 픽업가능기간이 지난 노쇼후보는 팝업에서 처리 주체로 노쇼처리를 선택).
  function retailCancelButtonsHTML(o, inList) {
    const g = retailOrderTabGroup(o);
    if (g === 'cr-req') {
      const crType = orderCrType(o);
      return `<button type="button" class="btn-primary" data-retail-supplier-cr-open="${o.orderNo}" data-cr-type="${crType}">${crType}처리</button>`;
    }
    if (g === 'cr-approved') return '';
    if (g === 'done') {
      return `<button type="button" class="btn-danger" data-retail-supplier-cr-open="${o.orderNo}" data-cr-type="반품">반품처리</button>`;
    }
    return `<button type="button" class="btn-danger" data-retail-supplier-cr-open="${o.orderNo}" data-cr-type="취소">취소처리</button>`;
  }

  // 관리 컬럼(목록) — 버튼은 한 줄로 배치하며 순서는 다음단계 | 결제확인 | 취소·반품처리 | 상세보기 | 되돌리기(회색 텍스트)다.
  function retailOrderRowActionsHTML(o) {
    return `
      <div class="row-actions row-actions-stack">
        ${retailNextButtonHTML(o)}
        ${retailPaymentButtonHTML(o, true)}
        ${retailCancelButtonsHTML(o, true)}
        <button type="button" data-retail-order-detail="${o.orderNo}">상세보기</button>
        ${retailRevertButtonHTML(o)}
      </div>`;
  }

  // 일괄변경 — 반영 가능 조건(선택 건 중 조건에 맞는 건만 반영)
  const RETAIL_BULK_OPTIONS = ['픽업대기', '배달대기', '배달중'];
  function retailBulkCanApply(o, label) {
    if (retailOrderTabGroup(o) === 'cr-req' || retailOrderTabGroup(o) === 'cr-approved') return false;
    if (!retailOrderIsActive(o)) return false;
    if (label === '픽업대기') return o.salesMethod === 'pickup' && o.processStatus === '주문접수';
    if (label === '배달대기') return o.salesMethod === 'delivery' && o.processStatus === '주문접수';
    if (label === '배달중') return o.salesMethod === 'delivery' && o.processStatus === '배달대기';
    return false;
  }
  function retailBulkApply(o, label) {
    o.processedAt = mockNowStamp();
    o.processStatus = label;
  }

  function pageRetailOrderListHTML() {
    const counts = retailOrderCounts();
    const rows = retailOrderRows();
    const pgRo = pgSlice('retailOrder', JSON.stringify([retailOrderChannelFilter, retailOrderSalesMethodFilter, retailOrderPayMethodFilter, retailOrderDateFrom, retailOrderDateTo, retailOrderSearch, retailOrderTab1, retailOrderTab2]), rows, { onMove: () => retailOrderChecked.clear() });
    selCountReg.retailOrder = () => pgRo.rows.filter(o => retailOrderChecked.has(o.orderNo)).length;

    const tab1HTML = RETAIL_ORDER_TAB1_DEFS.map(t => `
      <button type="button" class="tab-btn ${retailOrderTab1 === t.id ? 'active' : ''}" data-retail-order-tab1="${t.id}">
        ${t.label}<span class="tab-count">${t.id === 'all' ? counts.all : counts[t.id]}</span>
      </button>`).join('');
    const tab2HTML = RETAIL_ORDER_TAB2_DEFS.map(t => `
      <button type="button" class="tab-btn-sub ${retailOrderTab2 === t.id ? 'active' : ''}" data-retail-order-tab2="${t.id}">${t.label}</button>`).join('');

    const tr = pgRo.rows.map(o => {
      const itemsLabel = o.items.length > 1 ? `${escapeHtml(o.items[0].name)} 외 ${o.items.length - 1}건` : escapeHtml(o.items[0].name);
      const channelLabel = o.orderChannel === 'chat'
        ? `<span class="tag tag-key">채팅주문</span>`
        : `<span class="tag" style="background:var(--bg); color:var(--text-secondary);">링크주문</span>`;
      const methodLabel = `<span class="tag tag-key">${o.salesMethod === 'pickup' ? '픽업' : '배달'}</span>`;
      return `
        <tr>
          <td class="col-check"><input type="checkbox" data-retail-order-check="${o.orderNo}" ${retailOrderChecked.has(o.orderNo) ? 'checked' : ''}></td>
          <td>${o.orderNo}</td>
          <td>${o.createdAt}</td>
          <td>${escapeHtml(o.buyerName)}</td>
          <td>${escapeHtml((retailOrderMember(o) || {}).nicknameCode || '-')}</td>
          <td>${itemsLabel}</td>
          <td>${channelLabel}</td>
          <td>${methodLabel}</td>
          <td>${RETAIL_ORDER_PAYMETHOD_LABELS[o.paymentMethod]}</td>
          <td>${paymentStatusHTML(o)}</td>
          <td><div class="status-stack">${o.processStatus ? statusTag(o.processStatus) : '-'}${retailNoShowCandidate(o) ? '<span class="tag noshow-warn-text">노쇼후보</span>' : ''}</div></td>
          <td>${orderBadgeHTML(o) || '-'}</td>
          <td class="num">${o.grandTotal.toLocaleString()}원</td>
          <td class="col-actions">${retailOrderRowActionsHTML(o)}</td>
        </tr>`;
    }).join('');

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>주문목록</h2>
          </div>

          <div class="filter-bar">
            <select class="filter-select" id="retailOrderChannelFilter">
              <option value="all" ${retailOrderChannelFilter === 'all' ? 'selected' : ''}>주문경로 전체</option>
              <option value="link" ${retailOrderChannelFilter === 'link' ? 'selected' : ''}>링크주문</option>
              <option value="chat" ${retailOrderChannelFilter === 'chat' ? 'selected' : ''}>채팅주문</option>
            </select>
            <select class="filter-select" id="retailOrderSalesMethodFilter">
              <option value="all" ${retailOrderSalesMethodFilter === 'all' ? 'selected' : ''}>수령방식 전체</option>
              <option value="pickup" ${retailOrderSalesMethodFilter === 'pickup' ? 'selected' : ''}>픽업</option>
              <option value="delivery" ${retailOrderSalesMethodFilter === 'delivery' ? 'selected' : ''}>배달</option>
            </select>
            <select class="filter-select" id="retailOrderPayMethodFilter">
              <option value="all" ${retailOrderPayMethodFilter === 'all' ? 'selected' : ''}>결제수단 전체</option>
              <option value="card" ${retailOrderPayMethodFilter === 'card' ? 'selected' : ''}>카드결제</option>
              <option value="transfer" ${retailOrderPayMethodFilter === 'transfer' ? 'selected' : ''}>계좌이체</option>
              <option value="onsite" ${retailOrderPayMethodFilter === 'onsite' ? 'selected' : ''}>현장결제</option>
            </select>
            <span class="fb-group fb-dates"><input class="filter-select" type="date" id="retailOrderDateFrom" value="${retailOrderDateFrom}">
            <span class="fb-tilde">~</span>
            <input class="filter-select" type="date" id="retailOrderDateTo" value="${retailOrderDateTo}"></span>
            <span class="fb-group fb-search"><input class="search-input" type="text" id="retailOrderSearchInput" placeholder="주문번호, 주문자명, 회원주문 코드, 상품명 검색" value="${escapeHtml(retailOrderSearch)}">
            <button type="button" class="btn-secondary" id="retailOrderSearchBtn">검색</button></span>
          </div>

          <div class="tab-row">${tab1HTML}</div>
          <div class="tab-row-sub">${tab2HTML}</div>

          <div class="table-toolbar">
            ${selCountHTML('retailOrder', rows.length, selCountReg.retailOrder())}
            <div class="bulk-bar">
              <select class="filter-select" id="retailBulkSelect">
                <option value="">처리 선택</option>
                ${RETAIL_BULK_OPTIONS.map(l => `<option value="${l}">${l}</option>`).join('')}
              </select>
              <button type="button" class="btn-secondary" id="retailBulkApplyBtn">일괄변경</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="tpl-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="retailOrderCheckAll"></th>
                  <th class="c-l">주문번호</th><th class="c-m">주문일시</th><th class="c-m">주문자</th><th class="c-s">회원주문 코드</th><th class="c-flex">상품정보</th>
                  <th class="c-s">주문경로</th><th class="c-s">수령방식</th><th class="c-s">결제수단</th><th class="c-s">결제상태</th><th class="c-s">처리상태</th>
                  <th class="c-s">취소·반품</th><th class="c-m">합계금액</th><th class="col-actions">관리</th>
                </tr>
              </thead>
              <tbody>${tr || `<tr><td colspan="14" style="text-align:center; color:var(--text-secondary); padding:32px 0;">해당 조건의 주문이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>

          ${pgRo.html}
        </div>
      </div>`;
  }

  function bindRetailStageButtons(wrapper, rerender, includeCr) {
    wrapper.querySelectorAll('[data-retail-next-stage]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = RETAIL_ORDER_LIST.find(x => x.orderNo === btn.dataset.retailNextStage);
        if (!o) return;
        o.processedAt = mockNowStamp();
        o.processStatus = btn.dataset.stage;
        rerender();
      });
    });
    wrapper.querySelectorAll('[data-retail-revert]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = RETAIL_ORDER_LIST.find(x => x.orderNo === btn.dataset.retailRevert);
        const prev = o && retailStagePrev(o);
        if (!prev) return;
        o.processedAt = mockNowStamp();
        o.processStatus = prev;
        rerender();
      });
    });
    if (includeCr) {
      wrapper.querySelectorAll('[data-retail-supplier-cr-open]').forEach(btn => {
        btn.addEventListener('click', () => openRetailSupplierCrModal(btn.dataset.retailSupplierCrOpen, btn.dataset.crType));
      });
    }
  }

  function renderRetailOrderListPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailOrderListHTML();

    wrapper.querySelectorAll('[data-retail-order-tab1]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailOrderTab1 = btn.dataset.retailOrderTab1;
        retailOrderTab2 = 'all';
        renderRetailOrderListPage();
      });
    });
    wrapper.querySelectorAll('[data-retail-order-tab2]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailOrderTab2 = btn.dataset.retailOrderTab2;
        renderRetailOrderListPage();
      });
    });

    const searchInput = wrapper.querySelector('#retailOrderSearchInput');
    function runSearch() { retailOrderSearch = searchInput.value.trim(); renderRetailOrderListPage(); }
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    wrapper.querySelector('#retailOrderSearchBtn').addEventListener('click', runSearch);

    wrapper.querySelector('#retailOrderDateFrom').addEventListener('change', e => {
      retailOrderDateFrom = e.target.value;
      renderRetailOrderListPage();
    });
    wrapper.querySelector('#retailOrderDateTo').addEventListener('change', e => {
      retailOrderDateTo = e.target.value;
      renderRetailOrderListPage();
    });
    wrapper.querySelector('#retailOrderChannelFilter').addEventListener('change', e => {
      retailOrderChannelFilter = e.target.value;
      renderRetailOrderListPage();
    });
    wrapper.querySelector('#retailOrderPayMethodFilter').addEventListener('change', e => {
      retailOrderPayMethodFilter = e.target.value;
      renderRetailOrderListPage();
    });
    wrapper.querySelector('#retailOrderSalesMethodFilter').addEventListener('change', e => {
      retailOrderSalesMethodFilter = e.target.value;
      renderRetailOrderListPage();
    });

    wrapper.querySelectorAll('[data-retail-order-detail]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRetailOrderDetailNo = btn.dataset.retailOrderDetail;
        currentItem = 'retail-order-detail';
        renderAll();
      });
    });

    // 결제확인 — 결제상태만 결제완료로 전환한다.
    wrapper.querySelectorAll('[data-payment-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = RETAIL_ORDER_LIST.find(x => x.orderNo === btn.dataset.paymentConfirm);
        if (!o) return;
        o.paymentStatus = '결제완료';
        o.paidAt = mockNowStamp(); // 결제완료 일시 — 매출조회 결제총액의 기준일
        renderRetailOrderListPage();
      });
    });

    // 다음 단계 · 되돌리기 · 취소·반품처리 — 목록 관리 컬럼 버튼
    bindRetailStageButtons(wrapper, renderRetailOrderListPage, true);

    // 일괄변경 — 선택한 주문 중 반영 가능한 건만 처리한다.
    const retailRows = pgPageRows('retailOrder', retailOrderRows());
    const retailCheckAll = wrapper.querySelector('#retailOrderCheckAll');
    wrapper.querySelectorAll('[data-retail-order-check]').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) retailOrderChecked.add(chk.dataset.retailOrderCheck); else retailOrderChecked.delete(chk.dataset.retailOrderCheck);
        retailCheckAll.checked = retailRows.length > 0 && retailRows.every(o => retailOrderChecked.has(o.orderNo));
      });
    });
    retailCheckAll.checked = retailRows.length > 0 && retailRows.every(o => retailOrderChecked.has(o.orderNo));
    retailCheckAll.addEventListener('change', () => {
      retailRows.forEach(o => { if (retailCheckAll.checked) retailOrderChecked.add(o.orderNo); else retailOrderChecked.delete(o.orderNo); });
      wrapper.querySelectorAll('[data-retail-order-check]').forEach(chk => { chk.checked = retailCheckAll.checked; });
    });
    wrapper.querySelector('#retailBulkApplyBtn').addEventListener('click', () => {
      const label = wrapper.querySelector('#retailBulkSelect').value;
      runBulkChange({
        rows: retailRows, checked: retailOrderChecked, label, note: BULK_NOTI_NOTE_RETAIL,
        canApply: o => retailBulkCanApply(o, label),
        apply: o => retailBulkApply(o, label),
        onDone: renderRetailOrderListPage,
      });
    });

    // 완료 버튼(픽업완료/배달완료) — 확인 팝업을 거친다.
    wrapper.querySelectorAll('[data-retail-completion-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openRetailCompletionConfirmModal(btn.dataset.retailCompletionConfirm);
      });
    });
  }

  // ---- 완료 확인 팝업(모달, 픽업완료/배달완료 공통) ----
  // 완료 처리 시점에 결제상태가 아직 결제대기(현장결제·계좌이체 미확인)라면 결제도 함께 결제완료로 전환한다.
  function retailCompletionConfirmModalHTML(orderNo) {
    const o = RETAIL_ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    const label = retailOrderCompletionLabel(o);
    const paymentNoteHTML = o.paymentStatus === '결제대기'
      ? `<div class="field-hint" style="margin-top:8px;">결제대기 상태인 경우 결제도 함께 완료 처리됩니다.</div>` : '';
    return `
      <div class="modal-scrim" id="retailCompletionModalScrim">
        <div class="modal-box">
          <h3>${label} 처리</h3>
          <div class="field-hint">주문번호 ${o.orderNo} 건을 ${label} 처리하시겠습니까?</div>
          ${paymentNoteHTML}
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="retailCompletionModalCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="retailCompletionModalConfirmBtn">${label}</button>
          </div>
        </div>
      </div>`;
  }

  function closeRetailCompletionConfirmModal() {
    const root = document.getElementById('retailCompletionModalRoot');
    if (root) root.remove();
  }

  function openRetailCompletionConfirmModal(orderNo) {
    closeRetailCompletionConfirmModal();
    const root = document.createElement('div');
    root.id = 'retailCompletionModalRoot';
    root.innerHTML = retailCompletionConfirmModalHTML(orderNo);
    document.body.appendChild(root);
    bindRetailCompletionConfirmModal(orderNo);
  }

  function bindRetailCompletionConfirmModal(orderNo) {
    const root = document.getElementById('retailCompletionModalRoot');
    if (!root) return;
    root.querySelector('#retailCompletionModalCancelBtn').addEventListener('click', closeRetailCompletionConfirmModal);
    root.querySelector('#retailCompletionModalScrim').addEventListener('click', e => {
      if (e.target.id === 'retailCompletionModalScrim') closeRetailCompletionConfirmModal();
    });
    root.querySelector('#retailCompletionModalConfirmBtn').addEventListener('click', () => {
      const o = RETAIL_ORDER_LIST.find(x => x.orderNo === orderNo);
      if (o) {
        o.processStatus = retailOrderCompletionLabel(o);
        o.completedAt = mockNowStamp();
        o.processedAt = o.completedAt; // 반품요청 가능 기한(완료 후 7일)의 기준일
        if (o.paymentStatus === '결제대기') { o.paymentStatus = '결제완료'; o.paidAt = mockNowStamp(); }
      }
      closeRetailCompletionConfirmModal();
      if (currentItem === 'retail-order-list') renderRetailOrderListPage();
      else if (currentItem === 'retail-order-detail') renderRetailOrderDetailPage();
    });
  }

  // ---- 소매관리 > 주문관리 > 주문상세 ----
  // 도매 주문상세와 달리 구매자가 관리자 계정이 아니므로 buyer/supplier 모드 구분이 없다 — 공급자 관점 단일 화면이다.
  // 취소는 완료 이전 어느 단계에서도 공급자 직권으로 가능하고, 반품은 완료 이후에만 가능하다. 이미 요청이 접수된
  // 건(cr-req)은 조정 모드(승인/반려/철회)로, 요청 이력이 없는 건은 직권 모드로 동일한 팝업에서 함께 처리한다.
  // 상세 하단 처리 영역 — 순서는 되돌리기(텍스트) | 다음단계 | 결제확인 | 취소·반품처리다. 상세보기 버튼은 없다.
  function retailOrderDetailActionsHTML(o) {
    const g = retailOrderTabGroup(o);
    if (g === 'cr-approved') {
      return `<span class="field-hint">처리 완료된 주문입니다.</span>`;
    }
    return `${retailRevertButtonHTML(o)}${retailNextButtonHTML(o)}${retailPaymentButtonHTML(o, false)}${retailCancelButtonsHTML(o)}`;
  }

  function pageRetailOrderDetailHTML() {
    const o = RETAIL_ORDER_LIST.find(x => x.orderNo === currentRetailOrderDetailNo);
    if (!o) return pagePlaceholder('주문 상세', '주문 정보를 찾을 수 없습니다.');

    const channelLabel = o.orderChannel === 'chat' ? '채팅주문' : '링크주문';
    const methodLabel = o.salesMethod === 'pickup' ? '픽업' : '배달';
    const bottomActionsHTML = retailOrderDetailActionsHTML(o);
    // 주문자 휴대폰번호·채팅주문 닉네임은 주문 시점 값(스냅샷), 회원주문 코드는 연결된 회원정보(RETAIL_MEMBERS)를 조회해 보여준다.
    // 배달지·요청사항은 이와 달리 회원정보 실시간 조회값이 아니라 주문 시점의 스냅샷(o.deliveryAddress/o.requestNote)이다 —
    // 회원이 이후 회원정보의 배송지를 변경·삭제해도 이미 생성된 주문의 배달지·요청사항은 바뀌지 않는다.
    const member = retailOrderMember(o);

    const showItemPickup = o.salesMethod === 'pickup';
    const rows = o.items.map(i => `
      <tr>
        <td>${escapeHtml(i.name)}</td>
        ${showItemPickup ? `<td>${escapeHtml(pickupPeriodAdminText(i.pickupStartDate, i.pickupEndDate))}</td>` : ''}
        <td class="num">${i.price.toLocaleString()}원</td>
        <td class="num">${i.qty}</td>
        <td class="num">${(i.price * i.qty).toLocaleString()}원</td>
      </tr>`).join('');

    const itemsTotal = o.items.reduce((sum, i) => sum + i.price * i.qty, 0);
    // 배달비 — 배달 주문에 한해 주문 시점의 소매설정 기본 배달비(RETAIL_MALL_INFO.baseDeliveryFee)가 shippingFee로 저장되며, 배달 주문이면 0원이어도 0원으로 노출한다.
    const shippingFeeRowHTML = o.salesMethod === 'delivery'
      ? `<div class="detail-item"><span class="detail-label">배달비</span><span class="detail-value">${(o.shippingFee || 0).toLocaleString()}원</span></div>` : '';

    // 픽업/배달정보 — 배달지·요청사항은 주문 시점에 소비자가 입력한 값의 스냅샷(o.deliveryAddress/o.requestNote)이다.
    // 기본값은 회원정보의 대표배달지를 불러오지만, 소비자가 그 주문에서만 다른 배달지를 입력할 수도 있어 회원정보와
    // 다를 수 있다. 픽업 주문은 배달지가 필요 없으므로 표시하지 않는다.
    const fulfillmentSectionTitle = o.salesMethod === 'pickup' ? '픽업정보' : '배달정보';
    const deliveryAddress = o.deliveryAddress || null;
    const requestNote = o.requestNote || null;
    const deliveryAddressRowHTML = o.salesMethod === 'pickup' ? '' :
      `<div class="detail-item"><span class="detail-label">배달지</span><span class="detail-value">${escapeHtml(deliveryAddress || '-')}</span></div>`;
    // 공통 픽업가능기간 — 주문 시점 품목들의 픽업가능기간이 겹치는 기간을 스냅샷으로 저장한 값이다(이후 상품 설정이 바뀌어도
    // 이 주문의 값은 불변). 배달 주문에는 해당 개념이 없으므로 표시하지 않는다.
    const pickupPeriodRowHTML = o.salesMethod === 'pickup'
      ? `<div class="detail-item"><span class="detail-label">공통 픽업가능기간</span><span class="detail-value">${escapeHtml(pickupPeriodAdminText(o.pickupStartDate, o.pickupEndDate))}</span></div>` : '';
    const isNoShowCandidate = retailNoShowCandidate(o);
    const noShowBannerHTML = isNoShowCandidate
      ? `<div class="notice-banner">공통 픽업가능기간(${escapeHtml(pickupPeriodAdminText(o.pickupStartDate, o.pickupEndDate))})이 지났습니다. 노쇼 여부를 확인한 뒤 하단의 [취소처리]에서 처리 주체를 노쇼처리로 선택해 주세요.</div>` : '';

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" data-goto="retail-order-list">← 주문목록으로</button>
          <div class="card-head">
            <h2>주문 상세</h2>
            <div style="display:flex; gap:6px;">
              <span class="tag tag-key">${channelLabel}</span>
              <span class="tag tag-key">${methodLabel}</span>
            </div>
          </div>

          <section class="form-section">
            <h3 class="form-section-title">주문상품</h3>
            <div class="table-wrap">
              <table class="tpl-table tpl-line">
                <thead><tr><th class="c-flex">상품명</th>${showItemPickup ? '<th class="c-l">픽업가능기간</th>' : ''}<th class="c-m">구매가</th><th class="c-s">수량</th><th class="c-m">소계</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">주문정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">주문번호</span><span class="detail-value">${o.orderNo}</span></div>
              <div class="detail-item"><span class="detail-label">주문일시</span><span class="detail-value">${o.createdAt}</span></div>
              <div class="detail-item"><span class="detail-label">주문경로</span><span class="detail-value">${channelLabel}</span></div>
              <div class="detail-item"><span class="detail-label">수령방식</span><span class="detail-value">${methodLabel}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">주문자정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">주문자명</span><span class="detail-value">${escapeHtml(o.buyerName)}</span></div>
              <div class="detail-item"><span class="detail-label">휴대폰번호</span><span class="detail-value">${escapeHtml(o.buyerPhone || '-')}</span></div>
              <div class="detail-item"><span class="detail-label">회원주문 코드</span><span class="detail-value">${escapeHtml(member ? member.nicknameCode : '-')}</span></div>
              <div class="detail-item"><span class="detail-label">채팅주문 닉네임</span><span class="detail-value">${escapeHtml(o.buyerChatNick || '-')}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">${fulfillmentSectionTitle}</h3>
            ${noShowBannerHTML}
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">처리상태</span><span class="detail-value">${retailProcessStatusHTML(o, isNoShowCandidate)}</span></div>
              ${pickupPeriodRowHTML}
              ${deliveryAddressRowHTML}
              <div class="detail-item"><span class="detail-label">요청사항</span><span class="detail-value">${escapeHtml(requestNote || '-')}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">결제정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">결제상태</span><span class="detail-value">${paymentStatusDetailHTML(o)}</span></div>
              <div class="detail-item"><span class="detail-label">결제수단</span><span class="detail-value">${RETAIL_ORDER_PAYMETHOD_LABELS[o.paymentMethod]}</span></div>
              ${o.paymentMethod === 'transfer' ? `<div class="detail-item"><span class="detail-label">입금자명</span><span class="detail-value">${escapeHtml(o.depositorName || '-')}</span></div>` : ''}
              <div class="detail-item"><span class="detail-label">상품금액</span><span class="detail-value">${itemsTotal.toLocaleString()}원</span></div>
              ${shippingFeeRowHTML}
              <div class="detail-item"><span class="detail-label">총 결제금액</span><span class="detail-value" style="font-weight:700;">${o.grandTotal.toLocaleString()}원</span></div>
            </div>
          </section>

          ${cancelReturnSectionHTML(o, 'supplier')}
        </div>
      </div>

      <div class="market-buybar">
        <span style="font-size: 12px; color:var(--text-secondary);">주문번호 ${o.orderNo}</span>
        <div class="buybar-actions" style="flex-wrap:wrap;">${bottomActionsHTML}</div>
      </div>`;
  }

  function renderRetailOrderDetailPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailOrderDetailHTML();

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    wrapper.querySelectorAll('[data-payment-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = RETAIL_ORDER_LIST.find(x => x.orderNo === btn.dataset.paymentConfirm);
        if (!o) return;
        o.paymentStatus = '결제완료';
        o.paidAt = mockNowStamp(); // 결제완료 일시 — 매출조회 결제총액의 기준일
        renderRetailOrderDetailPage();
      });
    });

    bindRetailStageButtons(wrapper, renderRetailOrderDetailPage, false);

    wrapper.querySelectorAll('[data-retail-completion-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openRetailCompletionConfirmModal(btn.dataset.retailCompletionConfirm);
      });
    });

    wrapper.querySelectorAll('[data-retail-supplier-cr-open]').forEach(btn => {
      btn.addEventListener('click', () => {
        openRetailSupplierCrModal(btn.dataset.retailSupplierCrOpen, btn.dataset.crType);
      });
    });

  }

  // ---- 취소·반품 처리 팝업(모달, 소매 주문상세 · 공급자 전용) ----
  // 도매의 supplierCrModal과 동일한 조정/직권 두 모드 구조와 팝업 구성을 사용한다. 판매가능수량으로 복원 가능한 품목이 있는
  // 주문에는 재고 반영 체크박스도 동일한 방식으로 둔다. 반려 시 되돌아갈 처리상태는 cancelReturnPrevStatus에 보관된 값을 사용한다.
  function retailSupplierCrModalHTML(orderNo, crType, initiator) {
    const o = RETAIL_ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) return '';
    const isAdjust = o.cancelReturnStatus === `${crType}요청`;
    const options = crStatusOptions(crType);
    // 노쇼처리 버튼으로 진입한 경우 처리 주체를 "노쇼 처리"로 구분 표시한다 — 통상 취소처리와 동일한
    // 직권 모드 로직을 그대로 쓰되, cancelReturnInitiator만 별도로(noshow) 기록한다.
    const isNoShowChoice = !isAdjust && crType === '취소' && retailNoShowCandidate(o);
    const initiatorLabelInModal = isAdjust ? '구매자 요청' : '공급자 직권';
    const actionLabel = crType + '처리';
    const initiatorFieldHTML = isNoShowChoice
      ? `<div class="form-field form-field-wide"><label>처리 주체</label><div class="radio-row"><label><input type="radio" name="retailSupplierCrInitiator" value="supplier"> 공급자 직권취소</label><label><input type="radio" name="retailSupplierCrInitiator" value="noshow"> 노쇼처리</label></div></div>`
      : crInfoFieldHTML('처리 주체', initiatorLabelInModal);

    // 처리 방식(승인/반려) — 조정 모드 전용. 기본 선택값은 "승인"이다.
    const statusRadioHTML = isAdjust ? `
      <div class="form-field form-field-wide">
        <label>처리 방식</label>
        <div class="radio-row">
          ${options.map((op, i) => `<label><input type="radio" name="retailSupplierCrDecision" value="${op.value}" ${i === 0 ? 'checked' : ''}> ${op.label}</label>`).join('')}
        </div>
      </div>` : '';

    // 재고 반영 여부 — 이 주문의 품목 중 판매가능수량으로 복원 가능한 것이 하나라도 있을 때만 노출한다.
    // 조정 모드에서는 처리 방식이 "승인"일 때만 노출한다. 기본값은 체크 상태이며 주문 전체 품목 수량을 함께 복원한다.
    const stockRestoreHTML = retailOrderHasRestorableQty(o) ? `
      <div class="stock-restore-box" id="retailSupplierCrStockRestoreBox">
        <label>
          <input type="checkbox" id="retailSupplierCrStockRestoreCheckbox" checked>
          <span>재고 반영 — 체크 시 이 주문의 품목 수량만큼 판매가능수량을 복원합니다.</span>
        </label>
        <div class="field-hint">현재는 주문 전체 단위로만 처리됩니다. 품목이 여러 건이어도 전체 품목의 수량이 함께 복원됩니다.</div>
      </div>` : '';

    return crModalShellHTML({
      p: 'retailSupplierCr',
      title: actionLabel,
      infoHTML: initiatorFieldHTML
        + crInfoFieldHTML('수령방식', o.salesMethod === 'pickup' ? '픽업' : '배달')
        + crInfoFieldHTML('결제수단', RETAIL_ORDER_PAYMETHOD_LABELS[o.paymentMethod] || o.paymentMethod)
        + crInfoFieldHTML('결제상태', escapeHtml(o.paymentStatus)),
      statusRadioHTML,
      refundSectionHTML: crRefundSectionHTML(o, 'retailSupplierCr', 'retail'),
      reason: isAdjust ? o.cancelReturnReason : '',
      note: isAdjust ? o.cancelReturnSellerNote : '',
      notePlaceholder: '예: 재고 부족으로 취소 처리합니다.',
      stockRestoreHTML,
      submitLabel: actionLabel,
    });
  }

  function closeRetailSupplierCrModal() {
    const root = document.getElementById('retailSupplierCrModalRoot');
    if (root) root.remove();
  }

  function openRetailSupplierCrModal(orderNo, crType, initiator) {
    closeRetailSupplierCrModal();
    const root = document.createElement('div');
    root.id = 'retailSupplierCrModalRoot';
    root.innerHTML = retailSupplierCrModalHTML(orderNo, crType, initiator);
    document.body.appendChild(root);
    bindRetailSupplierCrModal(orderNo, crType, initiator);
  }

  function bindRetailSupplierCrModal(orderNo, crType, initiator) {
    const root = document.getElementById('retailSupplierCrModalRoot');
    if (!root) return;
    const o = RETAIL_ORDER_LIST.find(x => x.orderNo === orderNo);
    if (!o) { closeRetailSupplierCrModal(); return; }
    const isAdjust = o.cancelReturnStatus === `${crType}요청`;
    const isTransfer = o.paymentMethod === 'transfer';
    const isPending = o.paymentStatus === '결제대기';

    root.querySelector('#retailSupplierCrModalCancelBtn').addEventListener('click', closeRetailSupplierCrModal);
    root.querySelector('#retailSupplierCrModalScrim').addEventListener('click', e => {
      if (e.target.id === 'retailSupplierCrModalScrim') closeRetailSupplierCrModal();
    });

    const refundSection = root.querySelector('#retailSupplierCrRefundSection');
    const stockRestoreBox = root.querySelector('#retailSupplierCrStockRestoreBox');
    const isApproved = () => {
      if (!isAdjust) return true;
      const checked = root.querySelector('input[name="retailSupplierCrDecision"]:checked');
      return !!checked && checked.value === `${crType}승인`;
    };
    const refundCtl = bindCrRefundInputs(root, o, 'retailSupplierCr', 'retail');
    const isNoShowChoice = !isAdjust && crType === '취소' && retailNoShowCandidate(o);
    const pickedInitiator = () => { const c = root.querySelector('input[name="retailSupplierCrInitiator"]:checked'); return c ? c.value : null; };
    const baseSubmitState = bindCrSubmitState(root, 'retailSupplierCr', refundCtl, isApproved);
    const updateSubmitState = () => {
      baseSubmitState();
      if (isNoShowChoice && !pickedInitiator()) root.querySelector('#retailSupplierCrModalSubmitBtn').disabled = true;
    };
    if (isNoShowChoice) {
      root.querySelectorAll('input[name="retailSupplierCrInitiator"]').forEach(r => r.addEventListener('change', updateSubmitState));
      root.addEventListener('cr-refund-change', updateSubmitState);
      updateSubmitState();
    }

    // 조정 모드 — 처리 방식(승인/반려) 라디오에 따라 환불 영역·재고 반영 체크박스 노출 여부를 토글한다.
    if (isAdjust) {
      root.querySelectorAll('input[name="retailSupplierCrDecision"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const approved = isApproved();
          if (refundSection) refundSection.hidden = !approved;
          if (stockRestoreBox) stockRestoreBox.hidden = !approved;
          updateSubmitState();
        });
      });
    }

    root.querySelector('#retailSupplierCrModalSubmitBtn').addEventListener('click', () => {
      const approvedNow = isApproved(); // 이번 제출로 "취소승인/반품승인" 상태가 확정되는지 — 재고·환불 반영 판단 기준
      if (approvedNow && !refundCtl.validate()) return;
      const decision = approvedNow && !isPending ? readCrRefund(root, o, 'retailSupplierCr', 'retail') : null;

      o.cancelReturnSellerNote = root.querySelector('#retailSupplierCrNoteInput').value.trim() || null;
      // 환불계좌 입력 필드는 계좌이체이면서 결제완료(실제로 환불이 필요)인 경우에만 화면에 존재한다.
      if (approvedNow && isTransfer && !isPending) {
        o.refundBank = root.querySelector('#retailSupplierCrRefundBank').value.trim() || null;
        o.refundAccount = root.querySelector('#retailSupplierCrRefundAccount').value.trim() || null;
        o.refundHolder = root.querySelector('#retailSupplierCrRefundHolder').value.trim() || null;
      }

      if (isAdjust) {
        // 조정 모드 — 구매자 요청 건의 상태를 승인/반려 라디오 선택값대로 반영한다.
        o.cancelReturnStatus = approvedNow ? `${crType}승인` : `${crType}반려`;
        o.processStatus = approvedNow ? null : o.cancelReturnPrevStatus;
      } else {
        // 직권 모드 — 요청 이력 없이 공급자가 바로 승인 처리한다. 반려될 경우를 대비해 처리 전 처리상태를 보관해둔다.
        // 노쇼후보 건은 처리 주체 라디오에서 노쇼처리를 선택한 경우에만 cancelReturnInitiator를 'noshow'로 구분 기록한다.
        o.cancelReturnPrevStatus = o.processStatus;
        o.cancelReturnStatus = `${crType}승인`;
        o.cancelReturnInitiator = isNoShowChoice && pickedInitiator() === 'noshow' ? 'noshow' : 'supplier';
        o.cancelReturnReason = null;
        o.cancelReturnRequestedAt = null;
        o.processStatus = null;
      }
      o.cancelReturnResolvedAt = mockNowStamp(); // 승인 건은 이 일시가 매출조회 취소·환불액의 기준일이 된다.
      if (o.processStatus) o.processedAt = o.cancelReturnResolvedAt; // 반려로 이전 단계에 복귀한 건은 처리시점도 반려 일시로 갱신
      if (!o.cancelReturnRequestedAt) o.cancelReturnRequestedAt = o.cancelReturnResolvedAt;
      // 승인 확정과 함께 결제상태를 결제취소로 전환한다. 카드결제 건은 페이앱 결제취소 성공 응답을 확인한 뒤에만 이 단계에 도달한다(목업은 성공으로 가정).
      if (approvedNow) o.paymentStatus = '결제취소';

      // 결제대기 건은 승인해도 결제취소만 일어날 뿐 환불이 발생하지 않으므로 환불값을 남기지 않는다.
      if (decision) applyCrRefund(o, decision, 'retail');

      // 재고 반영 — 취소·반품이 승인으로 확정되는 시점에만, 체크박스가 노출·선택된 경우 주문 전체 품목 수량을 판매가능수량에 복원한다.
      const stockRestoreCheckbox = root.querySelector('#retailSupplierCrStockRestoreCheckbox');
      const stockRestoreVisible = stockRestoreBox && !stockRestoreBox.hidden;
      if (approvedNow && stockRestoreVisible && stockRestoreCheckbox && stockRestoreCheckbox.checked) {
        restoreRetailAvailableQty(o);
        o.cancelReturnStockRestored = true;
      } else if (approvedNow && stockRestoreVisible) {
        o.cancelReturnStockRestored = false;
      }

      closeRetailSupplierCrModal();
      if (currentItem === 'retail-order-list') renderRetailOrderListPage();
      else if (currentItem === 'retail-order-detail') renderRetailOrderDetailPage();
    });

  // 알림톡 설정과 채팅주문 허용 상품 목록은 각각 별도 메뉴(시스템관리 > 알림설정, 소매관리 > 상품관리 > 상품목록)에서 다룬다.

  // 않거나, 코드는 일치하지만 발신자의 실제 채팅 닉네임이 그 회원의 등록된 채팅주문 닉네임과 다른 경우

  // [매칭 적용]하면 되며, 상품·수량은 조정하지 않는다. 매칭에 성공하면 RETAIL_ORDER_LIST에

  function chatUnmatchedRows() {
    let rows = RETAIL_CHAT_UNMATCHED.slice();
    if (chatUnmatchedSearch.trim()) {
      rows = rows.filter(u => searchMatch(chatUnmatchedSearch, u.rawMessage, u.items.map(it => `${it.name} ${it.qty}개`).join(', '), u.chatNickname, u.chatCode));
    }
    if (chatUnmatchedDateFrom) {
      const from = inputDateToOrderDate(chatUnmatchedDateFrom);
      rows = rows.filter(u => u.receivedAt.slice(0, 8) >= from);
    }
    if (chatUnmatchedDateTo) {
      const to = inputDateToOrderDate(chatUnmatchedDateTo);
      rows = rows.filter(u => u.receivedAt.slice(0, 8) <= to);
    }
    return rows.sort((a, b) => b.receivedAt.localeCompare(a.receivedAt));
  }
