  function renderProductEditPage() {
    const wrapper = document.getElementById('contentWrapper');
    const p = PRODUCT_LIST.find(x => x.code === currentProductCode);
    if (!p) {
      wrapper.innerHTML = pagePlaceholder('도매상품 수정', '상품 정보를 찾을 수 없습니다.');
      return;
    }
    wrapper.innerHTML = productEditHTML(p);

    const cat1 = wrapper.querySelector('#editCat1');
    const cat2 = wrapper.querySelector('#editCat2');
    cat1.addEventListener('change', () => {
      cat2.innerHTML = cat2FormOptionsHTML(cat1.value, '');
    });

    // 도매수량이 변경되면 잠금 조건(도매수량 0, 또는 소매 배정수량 도달)을 다시 계산해 판매상태 선택을 즉시 반영한다.
    const editStockInput = wrapper.querySelector('#editStock');
    const editSaleStatusSelect = wrapper.querySelector('#editSaleStatus');
    const editSaleStatusHint = wrapper.querySelector('#editSaleStatusHint');
    function updateWholesaleStatusLock() {
      const stock = parseInt(editStockInput.value, 10) || 0;
      const locked = wholesaleLockState(stock, p.retailAllocatedQty).locked;
      editSaleStatusSelect.disabled = locked;
      editSaleStatusHint.hidden = !locked;
      editSaleStatusHint.textContent = stock <= 0
        ? '보유수량이 0이 되어 품절로 고정됩니다.'
        : '소매에 배정된 판매가능수량만큼 도매 가용재고가 소진되어 품절로 고정됩니다.';
      if (locked) editSaleStatusSelect.value = 'soldout';
    }
    editStockInput.addEventListener('input', updateWholesaleStatusLock);

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });

    wrapper.querySelector('#editSaveBtn').addEventListener('click', () => {
      const name = wrapper.querySelector('#editName').value.trim();
      const price = parseInt(wrapper.querySelector('#editPrice').value, 10) || 0;
      const unit = wrapper.querySelector('#editUnit').value.trim();
      const stock = parseInt(wrapper.querySelector('#editStock').value, 10) || 0;
      const origin = wrapper.querySelector('#editOrigin').value.trim();
      const expiry = wrapper.querySelector('#editExpiry').value.trim();
      const wholesaleVisible = wrapper.querySelector('#editWholesaleVisible').value === 'visible';
      const detailContent = wrapper.querySelector('#editDetailEditor').textContent.trim();

      const errors = [...imageCountErrors(wrapper.querySelector('[data-img-uploader]'))];
      if (!name) errors.push('상품명을 입력해주세요.');
      if (!cat1.value) errors.push('카테고리 1차를 선택해주세요.');
      errors.push(...priceErrors(wrapper.querySelector('#editPrice').value, '공급가'));
      // 보유수량은 0도 유효한 입력값이다(0 입력 시 판매상태가 자동으로 품절 처리된다) — 빈 값만 오류로 처리한다.
      errors.push(...qtyErrors(editStockInput.value, '보유수량'));
      if (p.retailAllocatedQty > 0 && stock < p.retailAllocatedQty) {
        errors.push(`보유수량은 이미 소매로 배정된 판매가능수량(${p.retailAllocatedQty}개)보다 낮게 수정할 수 없습니다. 소매정보를 먼저 수정한 뒤 다시 시도해주세요.`);
      }

      const banner = wrapper.querySelector('#formErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      // 잠금 상태(도매수량 0, 또는 소매 배정수량 도달)에서는 무조건 품절로 저장하고, 그 외에는 선택한 판매상태를 그대로 저장한다.
      const saleStatusLocked = wholesaleLockState(stock, p.retailAllocatedQty).locked;
      const saleStatus = saleStatusLocked ? 'soldout' : editSaleStatusSelect.value;

      const today = mockNowStamp();
      Object.assign(p, {
        name, cat1: cat1.value, cat2: cat2.value || null,
        scope: wrapper.querySelector('#editScope').value,
        price, unit: unit || '-', stock, origin, expiry, wholesaleVisible, detailContent,
        saleStatus,
        updatedAt: today,
      });

      currentItem = 'wholesale-product-mylist';
      renderAll();
    });
  }

    const retailToggle = wrapper.querySelector('#regRetailToggle');
    const retailFieldsGrid = wrapper.querySelector('#retailFieldsGrid');
    const stockInput = wrapper.querySelector('#regStock');
    const originInput = wrapper.querySelector('#regOrigin');
    const expiryInput = wrapper.querySelector('#regExpiry');
    const listPriceInput = wrapper.querySelector('#regListPrice');
    const salePriceInput = wrapper.querySelector('#regSalePrice');
    const discountRateInput = wrapper.querySelector('#regDiscountRate');
    const retailQtyInput = wrapper.querySelector('#regRetailQty');
    const retailQtyError = wrapper.querySelector('#retailQtyError');
    const wholesaleAvailableNote = wrapper.querySelector('#wholesaleAvailableNote');

    cat1.addEventListener('change', () => {
      cat2.innerHTML = cat2FormOptionsHTML(cat1.value, '');
    });
    retailCat1.addEventListener('change', () => {
      retailCat2.innerHTML = cat2FormOptionsHTML(retailCat1.value, '', 'r');
    });

    function updateWholesaleAvailableNote() {
      const stock = parseInt(stockInput.value, 10) || 0;
      const allocated = parseInt(retailQtyInput.value, 10) || 0;
      wholesaleAvailableNote.textContent = `도매 판매 가능재고: ${Math.max(stock - allocated, 0)}개 (소매배정 ${allocated}개 제외)`;
    }

    function validateRetailQty() {
      const stock = parseInt(stockInput.value, 10) || 0;
      const allocated = parseInt(retailQtyInput.value, 10) || 0;
      retailQtyError.hidden = allocated <= stock;
      if (!retailQtyError.hidden) retailQtyError.textContent = `보유수량(${stock}개)을 초과할 수 없습니다.`;
      if (retailToggle.checked) {
        wholesaleAvailableNote.hidden = false;
        updateWholesaleAvailableNote();
      }
    }

    retailToggle.addEventListener('change', () => {
      retailFieldsGrid.hidden = !retailToggle.checked;
      if (retailToggle.checked) {
        wholesaleAvailableNote.hidden = false;
        updateWholesaleAvailableNote();
      } else {
        wholesaleAvailableNote.hidden = true;
      }
    });

    function updateDiscountRate() {
      const listPrice = parseFloat(listPriceInput.value) || 0;
      const salePrice = parseFloat(salePriceInput.value) || 0;
      if (listPrice > 0 && salePrice > 0 && salePrice <= listPrice) {
        discountRateInput.value = `${Math.round((1 - salePrice / listPrice) * 100)}%`;
      } else {
        discountRateInput.value = '0%';
      }
    }
    listPriceInput.addEventListener('input', updateDiscountRate);
    salePriceInput.addEventListener('input', updateDiscountRate);

    stockInput.addEventListener('input', validateRetailQty);
    retailQtyInput.addEventListener('input', validateRetailQty);

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });

    // 채팅주문 허용 — 수령방식이 배달이면 영역만 비운다(채팅주문은 픽업 건만 지원). 소매상품등록과 동일한 방식이다.
    let chatNameChecked = false;
    let chatNameCheckedValue = null;
    const chatOrderBlock = wrapper.querySelector('#regChatOrderBlock');
    const chatOrderToggle = wrapper.querySelector('#regChatOrderEnabled');
    const chatOrderNameField = wrapper.querySelector('#regChatOrderNameField');
    const chatOrderNameInput = wrapper.querySelector('#regChatOrderName');
    const chatOrderDupResult = wrapper.querySelector('#regChatOrderDupResult');
    const pickupStartField = wrapper.querySelector('#regPickupStartField');
    const pickupEndField = wrapper.querySelector('#regPickupEndField');
    wrapper.querySelectorAll('input[name="salesMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        chatOrderBlock.style.visibility = radio.value === 'delivery' ? 'hidden' : 'visible';
        if (radio.value === 'delivery') {
          chatOrderToggle.checked = false;
          chatOrderNameField.style.display = 'none';
        }
        pickupStartField.style.display = radio.value === 'delivery' ? 'none' : '';
        pickupEndField.style.display = radio.value === 'delivery' ? 'none' : '';
      });
    });
    wrapper.querySelector('input[name="salesMethod"]:checked').dispatchEvent(new Event('change'));
    chatOrderToggle.addEventListener('change', () => {
      chatOrderNameField.style.display = chatOrderToggle.checked ? '' : 'none';
    });
    wrapper.querySelector('#regChatOrderDupCheckBtn').addEventListener('click', () => {
      const val = chatOrderNameInput.value.trim();
      chatOrderDupResult.style.display = 'block';
      if (!val) {
        chatOrderDupResult.textContent = '채팅주문상품명을 입력해주세요.';
        chatNameChecked = false;
        return;
      }
      const dup = retailActiveChatListing(val);
      if (dup) {
        chatOrderDupResult.textContent = '이미 등록된 채팅주문상품명입니다.';
        chatNameChecked = false;
      } else {
        chatOrderDupResult.textContent = '사용 가능한 채팅주문상품명입니다.';
        chatNameChecked = true;
        chatNameCheckedValue = val;
      }
    });

    wrapper.querySelector('#regSaveBtn').addEventListener('click', () => {
      const name = wrapper.querySelector('#regName').value.trim();
      const scope = wrapper.querySelector('#regScope').value;
      const price = parseInt(wrapper.querySelector('#regPrice').value, 10) || 0;
      const unit = wrapper.querySelector('#regUnit').value.trim();
      const stock = parseInt(stockInput.value, 10) || 0;
      const allocated = parseInt(retailQtyInput.value, 10) || 0;

      const errors = [...imageCountErrors(wrapper.querySelector('[data-img-uploader]'))];
      if (!name) errors.push('상품명을 입력해주세요.');
      if (!cat1.value) errors.push('카테고리 1차를 선택해주세요.');
      errors.push(...priceErrors(wrapper.querySelector('#regPrice').value, '공급가'));
      // 보유수량은 0도 유효한 입력값이다(0 입력 시 판매상태가 자동으로 품절로 등록된다) — 빈 값만 오류로 처리한다.
      errors.push(...qtyErrors(stockInput.value, '보유수량'));
      if (retailToggle.checked && !retailCat1.value) errors.push('소매정보의 카테고리 1차를 선택해주세요.');
      if (retailToggle.checked) {
        errors.push(...priceErrors(listPriceInput.value, '소비자가'));
        errors.push(...discountErrors(salePriceInput.value, parseInt(listPriceInput.value, 10) || 0));
        errors.push(...qtyErrors(retailQtyInput.value, '판매가능수량'));
        if (allocated > stock) errors.push('판매가능수량은 보유수량을 초과할 수 없습니다.');
      }
      const chatOrderEnabled = retailToggle.checked && chatOrderToggle.checked;
      const chatOrderName = chatOrderNameInput.value.trim();
      if (chatOrderEnabled) {
        if (!chatOrderName) errors.push('채팅주문상품명을 입력해주세요.');
        else if (!chatNameChecked || chatNameCheckedValue !== chatOrderName) errors.push('채팅주문상품명 중복확인을 먼저 완료해주세요.');
      }
      const pickupStart = wrapper.querySelector('#regPickupStart').value.trim();
      const pickupEnd = wrapper.querySelector('#regPickupEnd').value.trim();
      const retailSalesMethod = wrapper.querySelector('input[name="salesMethod"]:checked').value;
      if (retailToggle.checked && retailSalesMethod !== 'delivery') {
        errors.push(...pickupErrors(pickupStart, pickupEnd, true));
      }

      const banner = wrapper.querySelector('#formErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      const code = `P${String(productCodeSeq++).padStart(4, '0')}`;
      const today = mockNowStamp();
      const wholesaleVisible = wrapper.querySelector('#regWholesaleVisible').value === 'visible';
      const origin = originInput.value.trim();
      const expiry = expiryInput.value.trim();
      const retailExposed = retailToggle.checked;
      const retailAllocatedQty = retailExposed ? allocated : 0;
      const detailContent = wrapper.querySelector('#regDetailEditor').textContent.trim();
      // 등록 시점의 도매수량을 기준으로 판매상태를 자동 산정한다: 0이면 품절, 0 초과면 판매중(빈 값이 저장될 일이 없다). 이후 수정 화면에서 조건에 따라 자유롭게 전환할 수 있다.
      // 배송방식은 상품 필드가 아니므로 등록 시 별도로 저장하지 않는다 — 항상 WHOLESALE_SETTINGS(도매설정)을 조회해 표시한다.
      PRODUCT_LIST.unshift({
        code, name, cat1: cat1.value, cat2: cat2.value || null,
        scope, price, unit: unit || '-', stock, wholesaleVisible,
        origin, expiry, retailExposed, retailAllocatedQty, detailContent,
        saleStatus: stock === 0 ? 'soldout' : 'active', createdAt: today, updatedAt: today,
      });

      // 내 소매몰 등록을 함께 체크한 경우, 소매상품등록 목록(RETAIL_LISTINGS)에도 동일 시점에 등록해 두 목록 간 정합성을 유지한다.
      if (retailExposed) {
        const retailExposedFlag = wrapper.querySelector('#regRetailExposed').value === 'visible';
        const salesMethod = wrapper.querySelector('input[name="salesMethod"]:checked').value;
        const composition = wrapper.querySelector('#regComposition').value.trim();
        const maxQty = parseInt(wrapper.querySelector('#regMaxQty').value, 10) || null;
        RETAIL_LISTINGS.push({
          id: `RTL${String(retailListingSeq++).padStart(4, '0')}`,
          source: 'own', sourceCode: code,
          name, image: null, detailContent,
          cat1: retailCat1.value, cat2: retailCat2.value || null,
          listPrice: parseInt(listPriceInput.value, 10) || 0,
          salePrice: parseInt(salePriceInput.value, 10) || null,
          salesMethod, composition, maxQty: maxQty || null,
          origin, expiry,
          pickupStartDate: salesMethod !== 'delivery' ? pickupStart : null,
          pickupEndDate: salesMethod !== 'delivery' ? pickupEnd : null,
          availableQty: allocated,
          exposed: retailExposedFlag,
          saleStatus: allocated === 0 ? 'soldout' : 'active',
          chatOrderEnabled, chatOrderName: chatOrderEnabled ? chatOrderName : '',
          registeredAt: today, updatedAt: today,
        });
      }

      currentItem = 'wholesale-product-mylist';
      renderAll();
    });
  }

                </div>
                <div id="cardFeeRateError" class="field-error" hidden></div>
              </div>

              </div>
            </div>
            <div class="form-actions" style="justify-content:flex-start;">
              <button type="button" class="btn-primary" id="saveShippingBtn">저장</button>
            </div>
          </section>
        </div>
      </div>`;
  }

  function renderWholesaleSettingsPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageWholesaleSettingsHTML();

    const cardFeeRateField = wrapper.querySelector('#cardFeeRateField');
    wrapper.querySelectorAll('input[name="cardFeeBearer"]').forEach(radio => {
      radio.addEventListener('change', () => {
        cardFeeRateField.hidden = wrapper.querySelector('input[name="cardFeeBearer"]:checked').value !== 'buyer';
      });
    });

    wrapper.querySelector('#saveFeeBtn').addEventListener('click', () => {
      const bearer = wrapper.querySelector('input[name="cardFeeBearer"]:checked').value;
      const rateRaw = wrapper.querySelector('#cardFeeRateInput').value.trim();
      const rateErr = wrapper.querySelector('#cardFeeRateError');
      const rate = rateRaw === '' ? 0 : Number(rateRaw);
      if (bearer === 'buyer' && (!isFinite(rate) || rate < 0 || rate >= 100)) {
        rateErr.textContent = '수수료율은 0 이상 100 미만의 숫자로 입력해주세요.';
        rateErr.hidden = false;
        return;
      }
      WHOLESALE_SETTINGS.cardFeeBearer = bearer;
      WHOLESALE_SETTINGS.cardFeeRate = bearer === 'buyer' ? rate : WHOLESALE_SETTINGS.cardFeeRate;
      renderWholesaleSettingsPage();
    });

    const shippingFeeFieldRow = wrapper.querySelector('#shippingFeeFieldRow');
    wrapper.querySelectorAll('input[name="shippingMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        shippingFeeFieldRow.hidden = wrapper.querySelector('input[name="shippingMethod"]:checked').value !== 'fixed';
      });
    });

    wrapper.querySelector('#saveShippingBtn').addEventListener('click', () => {
      const method = wrapper.querySelector('input[name="shippingMethod"]:checked').value;
      const feeRaw = wrapper.querySelector('#shippingFeeAmountInput').value.trim();
      const feeErr = wrapper.querySelector('#shippingFeeError');
      const fee = feeRaw === '' ? 0 : Number(feeRaw);
      if (method === 'fixed' && (!Number.isInteger(fee) || fee < 0)) {
        feeErr.textContent = '기본배송비는 0원 이상의 정수로 입력해주세요.';
        feeErr.hidden = false;
        return;
      }
      WHOLESALE_SETTINGS.shippingMethod = method;
      WHOLESALE_SETTINGS.shippingFee = method === 'fixed' ? fee : WHOLESALE_SETTINGS.shippingFee;
      renderWholesaleSettingsPage();
    });
  }

  function sidoOf(addr) { return String(addr || '').trim().slice(0, 2); }

        currentItem = 'wholesale-market-detail';

    const cat2Select = wrapper.querySelector('#marketCat2Filter');
    const sortSelect = wrapper.querySelector('#marketSortSelect');

        ${images.length > 1 ? `
          <button type="button" class="gallery-nav-btn gallery-prev" aria-label="이전 이미지">‹</button>
          <button type="button" class="gallery-nav-btn gallery-next" aria-label="다음 이미지">›</button>
          <div class="gallery-dots">
            ${images.map((_, i) => `<span class="gallery-dot ${i === 0 ? 'active' : ''}" data-slide-dot="${i}"></span>`).join('')}
          </div>` : ''}
      </div>`;

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" data-goto="wholesale-product-list">← 상품목록으로</button>
          <div class="card-head">
            <h2>도매상품 상세</h2>
            <span style="font-size:12px; color:var(--text-secondary);">상품코드 ${p.code}</span>
          </div>

          <div class="market-detail-top">
            ${galleryHTML}
            <div class="market-detail-info">
              <div class="market-detail-breadcrumb">${catLabel(p.cat1, p.cat2)}</div>
              <div class="market-card-badges">
                ${marketScopeTag(p.scope)}
                ${isOwnProduct ? `<span class="tag" style="background:var(--bg); color:var(--text-secondary);">내 상품</span>` : ''}
                ${soldOut ? statusTag('품절') : statusTag('판매중')}
              </div>
              <h1 class="market-detail-name">${escapeHtml(p.name)}</h1>
              <hr class="market-detail-divider">
              <div class="market-detail-specs">
                <div class="market-detail-spec-row"><span class="market-detail-spec-label">공급자</span><span class="market-detail-spec-value">${escapeHtml(p.sellerName)}</span></div>
                <div class="market-detail-spec-row"><span class="market-detail-spec-label">공급가 / 공급단위</span><span class="market-detail-spec-value">${p.price.toLocaleString()}원 / ${escapeHtml(p.unit)}</span></div>
                <div class="market-detail-spec-row"><span class="market-detail-spec-label">배송방식</span><span class="market-detail-spec-value">${shippingMethodLabel(supplierSettings(p.sellerName))}</span></div>
                <div class="market-detail-spec-row"><span class="market-detail-spec-label">원산지</span><span class="market-detail-spec-value">${escapeHtml(p.origin || '-')}</span></div>
                <div class="market-detail-spec-row"><span class="market-detail-spec-label">소비기한</span><span class="market-detail-spec-value">${escapeHtml(p.expiry || '-')}</span></div>
              </div>
              <hr class="market-detail-divider">
            </div>
          </div>

          <section class="form-section">
            <h3 class="form-section-title">상세정보</h3>
            <div class="editor-body">${p.detailContent ? escapeHtml(p.detailContent) : '<span style="color:var(--text-secondary);">등록된 상세 콘텐츠가 없습니다.</span>'}</div>
          </section>
        </div>
      </div>

      <div class="market-buybar">
        ${isOwnProduct ? `<span class="field-hint">본인이 등록한 상품은 구매할 수 없습니다.</span>` : soldOut ? `<span class="tag tag-error">품절된 상품입니다</span>` : `
          <div class="qty-stepper">
            <label style="font-size:12px; color:var(--text-secondary);">주문수량</label>
            <button type="button" class="qty-btn" id="qtyMinusBtn">−</button>
            <input type="number" id="marketQtyInput" value="1" min="1" max="${marketAvailableQty(p)}" readonly>
            <button type="button" class="qty-btn" id="qtyPlusBtn">+</button>
            <span class="buybar-unit-hint">${escapeHtml(p.unit)} 기준, 주문가능수량 ${marketAvailableQty(p)}개</span>
          </div>
          <div class="buybar-actions">
            <span class="inline-confirm" id="cartConfirmMsg" hidden>장바구니에 담았습니다.</span>
            <button type="button" class="btn-secondary" id="addToCartBtn">장바구니 담기</button>
            <button type="button" class="btn-primary" id="buyNowBtn">바로구매</button>
          </div>`}
      </div>`;
  }

  function renderMarketDetailPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageMarketDetailHTML();
    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    const p = findMarketProduct(currentMarketCode);
    if (!p) return;

    // 이미지 슬라이드 (전체 재렌더 없이 라벨 · 점 표시만 갱신)
    const images = (p.images && p.images.length) ? p.images : ['상품 이미지'];
    let gallerySlide = 0;
    const galleryMain = wrapper.querySelector('#galleryMain');
    function updateGallery() {
      galleryMain.textContent = `${images[gallerySlide]} (${gallerySlide + 1}/${images.length})`;
      wrapper.querySelectorAll('[data-slide-dot]').forEach(dot => {
        dot.classList.toggle('active', Number(dot.dataset.slideDot) === gallerySlide);
      });
    }
    const prevBtn = wrapper.querySelector('.gallery-prev');
    const nextBtn = wrapper.querySelector('.gallery-next');
    if (prevBtn) prevBtn.addEventListener('click', () => { gallerySlide = (gallerySlide - 1 + images.length) % images.length; updateGallery(); });
    if (nextBtn) nextBtn.addEventListener('click', () => { gallerySlide = (gallerySlide + 1) % images.length; updateGallery(); });
    wrapper.querySelectorAll('[data-slide-dot]').forEach(dot => {
      dot.addEventListener('click', () => { gallerySlide = Number(dot.dataset.slideDot); updateGallery(); });
    });

    if (marketAvailableQty(p) === 0) return;
    if (p.sellerName === MY_SELLER_NAME) return; // 본인 상품 — 구매 버튼 자체가 렌더링되지 않는다

    const qtyInput = wrapper.querySelector('#marketQtyInput');
    const minusBtn = wrapper.querySelector('#qtyMinusBtn');
    const plusBtn = wrapper.querySelector('#qtyPlusBtn');
    const addBtn = wrapper.querySelector('#addToCartBtn');
    const buyBtn = wrapper.querySelector('#buyNowBtn');
    const confirmMsg = wrapper.querySelector('#cartConfirmMsg');

    function readQty() {
      let qty = parseInt(qtyInput.value, 10) || 1;
      if (qty < 1) qty = 1;
      if (qty > marketAvailableQty(p)) qty = marketAvailableQty(p);
      qtyInput.value = qty;
      return qty;
    }

    minusBtn.addEventListener('click', () => {
      let qty = (parseInt(qtyInput.value, 10) || 1) - 1;
      if (qty < 1) qty = 1;
      qtyInput.value = qty;
    });
    plusBtn.addEventListener('click', () => {
      let qty = (parseInt(qtyInput.value, 10) || 1) + 1;
      if (qty > marketAvailableQty(p)) qty = marketAvailableQty(p);
      qtyInput.value = qty;
    });

    addBtn.addEventListener('click', () => {
      const qty = readQty();
      const existing = CART.find(item => item.code === p.code);
      if (existing) existing.qty = Math.min(existing.qty + qty, marketAvailableQty(p));
      else CART.push({ code: p.code, qty });
      CART_SELECTED.add(p.code);
      confirmMsg.hidden = false;
      setTimeout(() => { confirmMsg.hidden = true; }, 1800);
    });

    buyBtn.addEventListener('click', () => {
      const qty = readQty();
      // 바로구매: 장바구니를 거치지 않고 해당 공급자 1건짜리 주문서로 즉시 이동
      currentOrder = { seller: p.sellerName, items: [{ code: p.code, qty }], fromCart: false };
      orderCompleteInfo = null;
      currentItem = 'wholesale-order-create';
      renderAll();
    });
  }

  // 장바구니 상품을 공급자 단위로 그룹핑 — 결제 · 배송비가 공급자별로 분리되므로 그룹별 소계 · 주문하기를 제공
  function cartGroupsBySupplier() {
    const items = CART.map(item => {
      const p = findMarketProduct(item.code);
      if (!p) return null;
      return { code: item.code, qty: item.qty, product: p, subtotal: p.price * item.qty };
    }).filter(Boolean);

    // 카트에서 사라진 상품 코드는 선택 상태에서도 정리
    Array.from(CART_SELECTED).forEach(code => {
      if (!items.some(i => i.code === code)) CART_SELECTED.delete(code);
    });

    const groupMap = new Map();
    items.forEach(it => {
      const seller = it.product.sellerName;
      if (!groupMap.has(seller)) groupMap.set(seller, []);
      groupMap.get(seller).push(it);
    });

    return Array.from(groupMap.entries()).map(([seller, groupItems]) => {
      const itemsTotal = groupItems.reduce((sum, i) => sum + i.subtotal, 0);
      // 배송비 = 해당 공급자의 배송비 기본설정(무료배송/기본배송비/착불)을 그대로 적용
      const shippingFee = orderGroupShippingFee(seller);
      return { seller, items: groupItems, itemsTotal, shippingFee, groupTotal: itemsTotal + shippingFee };
    });
  }

  // 장바구니 공급자 그룹 금액 요약 — 선택상품금액 | 전체상품금액 | 배송비(방식) | 총 주문금액.
  // 총 주문금액 = 선택상품금액 + 배송비. 선택한 상품이 없으면 주문 대상이 없으므로 배송비를 가산하지 않는다.
  function cartGroupSummaryHTML(group) {
    const selectedItems = group.items.filter(i => CART_SELECTED.has(i.code));
    const selectedTotal = selectedItems.reduce((sum, i) => sum + i.subtotal, 0);
    const settings = supplierSettings(group.seller);
    const shippingLabel = shippingFeeLabel(settings.shippingMethod, group.shippingFee);
    const orderTotal = selectedItems.length ? selectedTotal + group.shippingFee : 0;
    return `<div class="cart-group-summary"><span>선택상품금액 ${selectedTotal.toLocaleString()}원</span><span>전체상품금액 ${group.itemsTotal.toLocaleString()}원</span><span>${escapeHtml(shippingLabel)}</span><span>총 주문금액 <strong style="color:var(--text-body); font-size:16px;">${orderTotal.toLocaleString()}원</strong></span></div>`;
  }

  function cartRowHTML({ code, qty, product, subtotal }) {
    return `
      <tr>
        <td><input type="checkbox" class="cart-row-check" data-cart-select="${code}" ${CART_SELECTED.has(code) ? 'checked' : ''}></td>
        <td><div class="thumb" style="width:48px; height:48px;">IMG</div></td>
        <td>${escapeHtml(product.name)} ${marketAvailableQty(product) === 0 ? statusTag('품절') : ''}</td>
        <td class="num">${product.price.toLocaleString()}원 / ${escapeHtml(product.unit)}</td>
        <td class="num">
          <div class="qty-stepper">
            <button type="button" class="qty-btn" data-qty-minus="${code}">−</button>
            <input type="number" value="${qty}" readonly style="width:44px; height:30px; text-align:center; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text-body);">
            <button type="button" class="qty-btn" data-qty-plus="${code}">+</button>
          </div>
        </td>
        <td class="num">${subtotal.toLocaleString()}원</td>
        <td class="col-actions"><div class="row-actions row-actions-stack"><button type="button" data-cart-remove="${code}">삭제</button></div></td>
      </tr>`;
  }

  function cartGroupCardHTML(group, isLast) {
    const allSelected = group.items.length > 0 && group.items.every(i => CART_SELECTED.has(i.code));
    const rows = group.items.map(cartRowHTML).join('');
    const selectedItems = group.items.filter(i => CART_SELECTED.has(i.code));
    const hasSoldOut = group.items.some(i => marketAvailableQty(i.product) === 0);
    const selectedHasSoldOut = selectedItems.some(i => marketAvailableQty(i.product) === 0);
    return `
      <div class="col-12 card cart-group-card">
        <div class="card-head">
          <h2 style="font-size:16px; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" class="cart-group-check" data-group-select="${escapeHtml(group.seller)}" ${allSelected ? 'checked' : ''}>
            ${escapeHtml(group.seller)}
          </h2>
          ${selCountHTML('cartGroup-' + group.seller, group.items.length, selectedItems.length)}
        </div>
        <div class="table-wrap">
          <table class="tpl-table tpl-line cart-table">
            <thead>
              <tr><th class="col-check"></th><th class="c-img">이미지</th><th class="c-flex">상품명</th><th class="c-l">공급가/단위</th><th class="c-l">수량</th><th class="c-m">소계</th><th class="col-actions">관리</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="cart-group-footer">
          ${cartGroupSummaryHTML(group)}
          ${hasSoldOut ? '<span class="field-error">품절 상품을 삭제한 후 주문해주세요.</span>' : ''}
          <button type="button" class="btn-secondary" data-order-selected="${escapeHtml(group.seller)}" ${selectedItems.length === 0 || selectedHasSoldOut ? 'disabled' : ''}>선택상품주문</button>
          <button type="button" class="btn-primary" data-order-group="${escapeHtml(group.seller)}" ${hasSoldOut ? 'disabled' : ''}>전체주문</button>
        </div>
        ${isLast ? '' : '<div class="cart-group-divider"></div>'}
      </div>`;
  }

  function pageCartHTML() {
    const groups = cartGroupsBySupplier();
    const allCodes = groups.flatMap(g => g.items.map(i => i.code));
    const selectedCount = allCodes.filter(code => CART_SELECTED.has(code)).length;
    const allSelected = allCodes.length > 0 && selectedCount === allCodes.length;

    return `
      <div class="grid12">
        <div class="col-12 card">
          <button type="button" class="back-link" data-goto="wholesale-product-list">← 상품목록으로</button>
          <div class="card-head">
            <h2>장바구니</h2>
          </div>
          <div class="form-error-banner" id="cartErrorBanner" hidden></div>
          ${groups.length ? `
            <div class="table-toolbar">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" id="cartSelectAll" ${allSelected ? 'checked' : ''}>
                ${selCountHTML('cart', allCodes.length, selectedCount)}
              </label>
              <button type="button" class="btn-secondary" id="cartDeleteSelectedBtn" ${selectedCount === 0 ? 'disabled' : ''}>일괄삭제</button>
            </div>
          ` : ''}
        </div>

        ${groups.length
          ? groups.map((g, i) => cartGroupCardHTML(g, i === groups.length - 1)).join('')
          : `<div class="col-12 card"><div class="placeholder">장바구니에 담긴 상품이 없습니다.</div></div>`}
      </div>`;
  }

  function renderCartPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageCartHTML();

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    wrapper.querySelectorAll('[data-cart-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.cartRemove;
        const idx = CART.findIndex(i => i.code === code);
        if (idx > -1) CART.splice(idx, 1);
        CART_SELECTED.delete(code);
        renderCartPage();
      });
    });

    wrapper.querySelectorAll('[data-qty-minus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.qtyMinus;
        const item = CART.find(i => i.code === code);
        if (!item) return;
        item.qty = Math.max(1, item.qty - 1);
        renderCartPage();
      });
    });
    wrapper.querySelectorAll('[data-qty-plus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.qtyPlus;
        const item = CART.find(i => i.code === code);
        const p = findMarketProduct(code);
        if (!item || !p) return;
        item.qty = Math.min(item.qty + 1, marketAvailableQty(p));
        renderCartPage();
      });
    });

    const selectAllBox = wrapper.querySelector('#cartSelectAll');
    if (selectAllBox) {
      selectAllBox.addEventListener('change', () => {
        const groups = cartGroupsBySupplier();
        const allCodes = groups.flatMap(g => g.items.map(i => i.code));
        if (selectAllBox.checked) allCodes.forEach(code => CART_SELECTED.add(code));
        else CART_SELECTED.clear();
        renderCartPage();
      });
    }
    wrapper.querySelectorAll('[data-group-select]').forEach(box => {
      box.addEventListener('change', () => {
        const seller = box.dataset.groupSelect;
        const group = cartGroupsBySupplier().find(g => g.seller === seller);
        if (!group) return;
        group.items.forEach(i => {
          if (box.checked) CART_SELECTED.add(i.code);
          else CART_SELECTED.delete(i.code);
        });
        renderCartPage();
      });
    });
    wrapper.querySelectorAll('[data-cart-select]').forEach(box => {
      box.addEventListener('change', () => {
        const code = box.dataset.cartSelect;
        if (box.checked) CART_SELECTED.add(code);
        else CART_SELECTED.delete(code);
        renderCartPage();
      });
    });

    const deleteSelectedBtn = wrapper.querySelector('#cartDeleteSelectedBtn');
    if (deleteSelectedBtn) {
      deleteSelectedBtn.addEventListener('click', () => {
        Array.from(CART_SELECTED).forEach(code => {
          const idx = CART.findIndex(i => i.code === code);
          if (idx > -1) CART.splice(idx, 1);
        });
        CART_SELECTED.clear();
        renderCartPage();
      });
    }

    // 공급자 단위 주문 — [선택상품주문]은 선택한 상품만, [전체주문]은 해당 공급자의 장바구니 상품 전체를 주문서로 전달한다.
    wrapper.querySelectorAll('[data-order-group], [data-order-selected]').forEach(btn => {
      btn.addEventListener('click', () => {
        const onlySelected = btn.hasAttribute('data-order-selected');
        const seller = onlySelected ? btn.dataset.orderSelected : btn.dataset.orderGroup;
        const group = cartGroupsBySupplier().find(g => g.seller === seller);
        if (!group) return;
        const targetItems = onlySelected ? group.items.filter(i => CART_SELECTED.has(i.code)) : group.items;
        if (!targetItems.length) return;
        if (targetItems.some(i => marketAvailableQty(i.product) === 0)) {
          const cartBanner = wrapper.querySelector('#cartErrorBanner');
          cartBanner.hidden = false;
          cartBanner.textContent = '품절상품이 존재합니다.';
          cartBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        currentOrder = { seller: group.seller, items: targetItems.map(i => ({ code: i.code, qty: i.qty })), fromCart: true };
        orderCompleteInfo = null;
        currentItem = 'wholesale-order-create';
        renderAll();
      });
    });
  }

  // ---- 주문서 작성 (공급자 1건 단위 — 장바구니 그룹 주문하기 / 상품상세 바로구매로 진입) ----
  function orderItemsFromDraft(order) {
    return order.items.map(it => {
      const p = findMarketProduct(it.code);
      if (!p) return null;
      return { code: it.code, qty: it.qty, product: p, subtotal: p.price * it.qty };
    }).filter(Boolean);
  }

  function orderCompleteHTML(o) {
    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>주문 완료</h2>
          </div>
          <div class="notice-banner">주문이 접수되었습니다.</div>

          <section class="form-section">
            <h3 class="form-section-title">주문 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">주문번호</span><span class="detail-value">${o.orderNo}</span></div>
              <div class="detail-item"><span class="detail-label">주문일시</span><span class="detail-value">${o.createdAt}</span></div>
              <div class="detail-item"><span class="detail-label">공급자</span><span class="detail-value">${escapeHtml(o.seller)}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">주문자 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">상호명</span><span class="detail-value">${escapeHtml(wsBuyerCompany(o))}</span></div>
              <div class="detail-item"><span class="detail-label">이름</span><span class="detail-value">${escapeHtml(o.buyerName || '-')}</span></div>
              <div class="detail-item"><span class="detail-label">휴대폰번호</span><span class="detail-value">${escapeHtml(o.buyerPhone || '-')}</span></div>
              <div class="detail-item"><span class="detail-label">이메일</span><span class="detail-value">${escapeHtml(o.buyerEmail || '-')}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">배송 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">처리상태</span><span class="detail-value">${wholesaleProcessStatusHTML(o)}</span></div>
              <div class="detail-item detail-item-wide"><span class="detail-label">배송지</span><span class="detail-value">${escapeHtml(o.deliveryAddress || '-')}</span></div>
              ${o.requestNote ? `<div class="detail-item detail-item-wide"><span class="detail-label">배송 요청사항</span><span class="detail-value">${escapeHtml(o.requestNote)}</span></div>` : ''}
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">결제 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">결제상태</span><span class="detail-value">${paymentStatusDetailHTML(o)}</span></div>
              <div class="detail-item"><span class="detail-label">결제수단</span><span class="detail-value">${o.paymentMethod === 'card' ? '카드결제' : '계좌이체'}</span></div>
              ${o.paymentMethod === 'transfer' ? `<div class="detail-item"><span class="detail-label">입금자명</span><span class="detail-value">${escapeHtml(o.depositorName || '-')}</span></div>` : ''}

              <div class="detail-item"><span class="detail-label">총 결제금액</span><span class="detail-value" style="font-weight:700;">${o.grandTotal.toLocaleString()}원</span></div>

  }

    return `

          <section class="form-section">

              <div class="form-field">

          <section class="form-section">

            <div id="payTransferBlock" style="margin-top:12px;" hidden>

                <div class="detail-item"><span class="detail-label">은행</span><span class="detail-value">${escapeHtml(settings.bank.bankName)}</span></div>
                <div class="detail-item"><span class="detail-label">계좌번호</span><span class="detail-value">${escapeHtml(settings.bank.account)}</span></div>
                <div class="detail-item"><span class="detail-label">예금주</span><span class="detail-value">${escapeHtml(settings.bank.holder)}</span></div>
              </div>
              <div class="form-grid" style="margin-top:12px;">

              <div class="detail-item"><span class="detail-label">배송비</span><span class="detail-value">${escapeHtml(shippingFeeLabel(settings.shippingMethod, shippingFee))}</span></div>
              <div class="detail-item" id="summaryFeeRow" ${showCardFeeToBuyer ? '' : 'hidden'}><span class="detail-label">결제수수료</span><span class="detail-value" id="summaryFeeValue">${cardFeeAmount.toLocaleString()}원</span></div>
              <div class="detail-item"><span class="detail-label">총 결제금액</span><span class="detail-value" id="summaryGrandTotal" style="font-weight:700;">${(itemsTotal + shippingFee + cardFeeAmount).toLocaleString()}원</span></div>
            </div>

          <div class="form-error-banner" id="orderErrorBanner" hidden></div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" data-goto="wholesale-cart">취소</button>
            <button type="button" class="btn-primary" id="orderSubmitBtn">주문하기</button>
          </div>

        </div>
      </div>`;
  }

  function renderOrderPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageOrderHTML();

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    if (orderCompleteInfo) {
      const toCartBtn = wrapper.querySelector('#orderDoneToCart');
      if (toCartBtn) toCartBtn.addEventListener('click', () => { orderCompleteInfo = null; currentItem = 'wholesale-cart'; renderAll(); });
      const toListBtn = wrapper.querySelector('#orderDoneToList');
      if (toListBtn) toListBtn.addEventListener('click', () => { orderCompleteInfo = null; currentItem = 'wholesale-product-list'; renderAll(); });
      return;
    }

    const order = currentOrder;
    const items = order ? orderItemsFromDraft(order) : [];
    if (!order || !items.length) return;

    const seller = order.seller;
    const settings = supplierSettings(seller);
    const itemsTotal = items.reduce((sum, i) => sum + i.subtotal, 0);
    const shippingFee = orderGroupShippingFee(seller);

    const payCardBlock = wrapper.querySelector('#payCardBlock');
    const payTransferBlock = wrapper.querySelector('#payTransferBlock');
    const summaryFeeRow = wrapper.querySelector('#summaryFeeRow');
    const summaryFeeValue = wrapper.querySelector('#summaryFeeValue');
    const summaryGrandTotal = wrapper.querySelector('#summaryGrandTotal');

    function currentCardFeeAmount(method) {
      const applyCardFee = method === 'card' && settings.cardFeeBearer === 'buyer';
      return applyCardFee ? Math.round((itemsTotal + shippingFee) * settings.cardFeeRate / 100) : 0;
    }

    function updateSummary() {
      const method = wrapper.querySelector('input[name="orderPayMethod"]:checked').value;
      const feeAmount = currentCardFeeAmount(method);
      if (summaryFeeRow) summaryFeeRow.hidden = feeAmount === 0;
      if (summaryFeeValue) summaryFeeValue.textContent = `${feeAmount.toLocaleString()}원`;
      if (summaryGrandTotal) summaryGrandTotal.textContent = `${(itemsTotal + shippingFee + feeAmount).toLocaleString()}원`;
    }

    wrapper.querySelectorAll('input[name="orderPayMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const method = wrapper.querySelector('input[name="orderPayMethod"]:checked').value;
        payCardBlock.hidden = method !== 'card';
        payTransferBlock.hidden = method !== 'transfer';
        updateSummary();
      });
    });

    // 배송 정보 — 기본은 가입 시 등록한 사업장 주소, "직접입력" 선택 시에만 우편번호 검색 방식으로 이번 주문 한정 수정 가능
    const addressProfileGroup = wrapper.querySelector('#orderAddressProfileGroup');
    const addressCustomGroup = wrapper.querySelector('#orderAddressCustomGroup');
    wrapper.querySelectorAll('input[name="orderAddressMode"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const mode = wrapper.querySelector('input[name="orderAddressMode"]:checked').value;
        addressProfileGroup.hidden = mode !== 'profile';
        addressCustomGroup.hidden = mode !== 'custom';
      });
    });

    const zipcodeSearchBtn = wrapper.querySelector('#orderZipcodeSearchBtn');
    if (zipcodeSearchBtn) {
      zipcodeSearchBtn.addEventListener('click', () => {
        // 목업 단계 — 실제 우편번호 검색 API 연동 전이므로 예시 주소로 대체
        wrapper.querySelector('#orderZipcode').value = '16490';
        wrapper.querySelector('#orderRoadAddress').value = '경기 수원시 팔달구 매산로 12';
        wrapper.querySelector('#orderDetailAddress').focus();
      });
    }

    wrapper.querySelector('#orderSubmitBtn').addEventListener('click', () => {
      const recipient = wrapper.querySelector('#orderRecipient').value.trim();
      const phone = wrapper.querySelector('#orderPhone').value.trim();
      const email = wrapper.querySelector('#orderEmail').value.trim();
      const addressMode = wrapper.querySelector('input[name="orderAddressMode"]:checked').value;
      const zipcode = wrapper.querySelector('#orderZipcode').value.trim();
      const roadAddress = wrapper.querySelector('#orderRoadAddress').value.trim();
      const detailAddress = wrapper.querySelector('#orderDetailAddress').value.trim();
      const address = addressMode === 'profile'
        ? wrapper.querySelector('#orderAddress').value.trim()
        : (roadAddress ? `${zipcode ? `[${zipcode}] ` : ''}${roadAddress} ${detailAddress}`.trim() : '');
      const requestNote = wrapper.querySelector('#orderMemo').value.trim();
      const method = wrapper.querySelector('input[name="orderPayMethod"]:checked').value;
      const depositor = method === 'transfer' ? wrapper.querySelector('#orderDepositor').value.trim() : '';

      const errors = [];
      // 본인 상품 주문 차단 — 구매 버튼 미노출(UI)만으로는 우회 가능하므로 주문 생성 직전에도 재검증한다.
      // 목업 한계: 실제로는 서버(백엔드)가 주문 생성 API 단에서 동일 조건을 재검증해야 하며, 이 클라이언트 측 체크만으로는 우회를 막을 수 없다 — 개발 확인 필요.
      if (seller === MY_SELLER_NAME) errors.push('본인이 등록한 상품은 주문할 수 없습니다.');
      // 주문 시점 재고 재검증 — 장바구니·주문서 진입 이후 재고가 바뀌었을 수 있으므로 주문 생성 직전에 다시 확인한다.
      if (items.some(i => { const mp = findMarketProduct(i.code); return !mp || marketAvailableQty(mp) === 0; })) errors.push('품절상품이 존재합니다.');
      else if (items.some(i => i.qty > marketAvailableQty(findMarketProduct(i.code)))) errors.push('재고가 부족한 상품이 있습니다.');
      if (!recipient) errors.push('이름을 입력해주세요.');
      if (!phone) errors.push('휴대폰번호를 입력해주세요.');
      else if (!isValidMobilePhone(phone)) errors.push('휴대폰번호 형식이 올바르지 않습니다.');
      if (!email) errors.push('이메일을 입력해주세요.');
      if (addressMode === 'custom' && !roadAddress) errors.push('우편번호 검색으로 주소를 입력해주세요.');
      if (addressMode === 'custom' && roadAddress && !detailAddress) errors.push('상세주소를 입력해주세요.');
      if (!address) errors.push('배송주소를 입력해주세요.');
      if (method === 'transfer' && !depositor) errors.push('입금자명을 입력해주세요.');

      const banner = wrapper.querySelector('#orderErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      const cardFeeAmount = currentCardFeeAmount(method);
      const grandTotal = itemsTotal + shippingFee + cardFeeAmount;
      const paymentStatus = method === 'card' ? '결제완료' : '결제대기';

      // 주문 완료 처리 — 장바구니 경유 주문일 때만 장바구니에서 해당 상품 제거(바로구매는 장바구니를 건드리지 않는다)
      if (currentOrder && currentOrder.fromCart) {
        items.forEach(i => {
          const idx = CART.findIndex(c => c.code === i.code);
          if (idx > -1) CART.splice(idx, 1);
          CART_SELECTED.delete(i.code);
        });
      }

      const orderNo = `WO${Date.now().toString().slice(-8)}`;
      const nowStamp = mockNowStamp();
      // 주문완료 화면과 주문접수관리/주문내역에 동일하게 노출되는 주문 레코드 — 주문상세 페이지와 항목 구성을 맞추기 위해 완료 화면도 이 객체를 그대로 사용
      const newOrder = {
        orderNo, seller, buyerId: MEMBER_ACCOUNT.loginId, buyerCompany: MY_SELLER_NAME, buyerName: recipient, buyerPhone: phone, buyerEmail: email, deliveryAddress: address,
        requestNote: requestNote || null, depositorName: method === 'transfer' ? depositor : null,
        items: items.map(i => ({ code: i.code, name: i.product.name, qty: i.qty, price: i.product.price, unit: i.product.unit })),
        paymentMethod: method, paymentStatus, processStatus: '주문접수', cancelReturnStatus: null,
        shippingMethod: settings.shippingMethod, // 주문 시점 배송방식 스냅샷 — 이후 공급자 설정이 바뀌어도 이 주문의 표기는 유지된다.
        itemsTotal, shippingFee, cardFeeAmount, grandTotal,
        createdAt: nowStamp,
        paidAt: method === 'card' ? nowStamp : null, // 카드결제는 주문 생성 즉시 결제완료
      };
      orderCompleteInfo = newOrder;

      // 주문 데이터 반영 — 공급자가 본인 계정(MY_SELLER_NAME)이면 주문접수관리에, 타 파트너면 주문내역에 나타남
      ORDER_LIST.unshift(newOrder);
      // 재고 차감 시점은 접수처리(주문확인)가 아니라 주문 발생 시점이다 — 주문 생성 직후 즉시 차감한다.
      deductOwnWholesaleStock(newOrder);

      currentOrder = null;
      renderOrderPage();
    });

    updateSummary();
  }

  // ---- 주문접수관리 (공급자용) — 주문 데이터 저장소 ----
  let MY_SELLER_NAME = '우리마켓 본사'; // 현재 로그인한 계정의 공급자명 — 로그인 시 계정의 상호명으로 갱신된다(hydrateSession)

  // 현재 로그인 계정이 가입 신청 시 등록한 정보 — 로그인 시 계정 정보로 갱신된다.
  // 주문서 작성 시 주문자 정보 · 배송지 · 입금자명의 기본값으로 사용한다.
  const MY_PROFILE = {
    managerName: '박도매',
    phone: '010-2222-3333',
    email: 'order@woorimarket.kr',
    address: '경기 수원시 영통구 온마을로 27, 2층 (우리마켓 본사)',
    bankHolder: MY_SELLER_NAME, // 계좌 예금주명 — 도매설정/소매몰 기본정보에 등록된 값이라는 전제
  };

  // ---- 시스템관리 > 회원관리 — 계정(회원) 정보 · 사업자 정보 ----
  // 기본값 출처: 소매몰 목업(scm09-retail-mall-mockup.csb62929.chatgpt.site) 하단 사업자 정보 노출값,
  // 그리고 가맹점 가입신청서(scm09-retail-mall-mockup.../?view=franchise-signup) · 본사 도입신청서
  // (zero-scm-homepage-mockup.../apply)의 "회원정보"·"사업자 정보" 입력 항목 구성을 그대로 따랐다.
  // 상호명은 소매몰 노출값("온마을마켓")이 아니라 현 시스템 전반의 공급자명 기준인 "우리마켓 본사"(MY_SELLER_NAME)로
  // 통일한다 — 소매몰 쪽 노출값과의 불일치는 소매몰 측 확인 필요 항목으로 남는다.
  let MEMBER_ACCOUNT = {

  // 'YY.MM.DD HH:MM' 일시에 n일을 더한 일시(같은 형식) — 자동 배송확정·반품요청 가능일시 계산용.
  function stampAddDays(stamp, n) {
    const [d, t] = stamp.split(' ');
    const [yy, mm, dd] = d.split('.').map(Number);
    const dt = new Date(2000 + yy, mm - 1, dd + n);
    return `${String(dt.getFullYear()).slice(2)}.${String(dt.getMonth() + 1).padStart(2, '0')}.${String(dt.getDate()).padStart(2, '0')} ${t || '00:00'}`;
  }
  // 반품요청 가능일시·자동 배송확정 기준 일수 — 도매(배송중 전환 후)·소매(픽업완료·배달완료 후) 공통 7일.
  const RETURN_WINDOW_DAYS = 7;

  // 처리시점 — 처리상태가 가장 최근에 전환된 일시. 전환·되돌리기·반려 복귀 때마다 갱신한다.
  // 처리 전환 이력이 없는 시드 건은 상태별 기준 일시(배송중 전환·배송확정·완료)나 주문일시로 대체한다.
  function orderProcessedAt(o) {
    if (!o.processStatus) return null;
    if (o.processedAt) return o.processedAt;
    if (o.processStatus === '배송중') return o.shippedAt || o.createdAt;
    if (o.processStatus === '배송확정') return o.deliveryConfirmedAt || o.shippedAt || o.createdAt;
    if (o.processStatus === '픽업완료' || o.processStatus === '배달완료') return o.completedAt || o.createdAt;
    return o.createdAt;
  }
  // 상태 뱃지 + 일시(+ 보조 문구) 한 줄 표기
  function stateStampHTML(badgeHTML, at, note) {
    return `<span class="state-stamp">${badgeHTML}${at ? `<span>${at}</span>` : ''}${note ? `<span class="state-stamp-note">${note}</span>` : ''}</span>`;
  }
  // 소매 처리상태 — [상태] 처리시점 한 줄 표기. 완료(픽업완료·배달완료) 건 중 취소·반품 이력이 없는 건에는 반품요청 가능 기한을 함께 표기한다.
  function retailProcessStatusHTML(o, isNoShow) {
    if (!o.processStatus) return '-';
    const at = orderProcessedAt(o);
    const done = o.processStatus === '픽업완료' || o.processStatus === '배달완료';
    const note = done && !o.cancelReturnStatus ? `(${stampAddDays(at, RETURN_WINDOW_DAYS)} 까지 반품요청 가능)` : '';
    const stamp = stateStampHTML(statusTag(o.processStatus), at, note);
    return isNoShow ? `<div class="status-stack">${stamp}<span class="tag noshow-warn-text">노쇼후보</span></div>` : stamp;
  }
  // 취소·반품 상태의 최근 처리 일시 — 요청 단계에서는 요청일시, 승인·반려 후에는 처리일시.
  function cancelReturnLatestAt(o) {
    return o.cancelReturnResolvedAt || o.cancelReturnRequestedAt || null;
  }
  // 결제상태 + 결제취소 일시 — 결제취소 건에만 취소·반품 승인 일시를 함께 표기한다(결제완료 일시는 별도 "결제일시"에 보존).
  function paymentStatusDetailHTML(o) {
    const badge = statusTag(o.paymentStatus);
    if (o.paymentStatus === '결제완료') return stateStampHTML(badge, o.paidAt || '');
    if (o.paymentStatus !== '결제취소') return badge;
    const sub = o.refundType ? `<span class="tag refund-sub-text">${o.refundType === 'full' ? '전체환불' : '부분환불'}</span>` : '';
    return stateStampHTML(badge + sub, o.cancelReturnResolvedAt || '', o.paidAt ? `(${o.paidAt} 결제완료)` : '');
  }

  // 도매 자동 배송확정 기준일 — 배송중 전환일시. 반품반려로 배송중에 복귀한 건은 반려 일시와 비교해 더 늦은 일시를 기준으로 다시 센다.
  function wholesaleAutoConfirmBaseAt(o) {
    const base = o.processStatus === '배송중' ? orderProcessedAt(o) : (o.shippedAt || null);
    if (o.cancelReturnStatus === '반품반려' && o.cancelReturnResolvedAt && (!base || o.cancelReturnResolvedAt > base)) return o.cancelReturnResolvedAt;
    return base;
  }
  // 도매 자동 배송확정 — 기준일로부터 7일이 지난 배송중 주문은 자동으로 배송확정한다(이후 반품요청 불가).
  // 목업에서는 화면을 그릴 때마다 목업 기준일로 판정해 상태를 전환한다(실제 서비스는 서버 배치로 처리).
  function applyWholesaleAutoDeliveryConfirm() {
    const today = mockNowStamp();
    ORDER_LIST.forEach(o => {
      const baseAt = wholesaleAutoConfirmBaseAt(o);
      if (o.processStatus !== '배송중' || !baseAt) return;
      const due = stampAddDays(baseAt, RETURN_WINDOW_DAYS);
      if (due > today) return;
      o.processStatus = '배송확정';
      o.deliveryConfirmedAt = due;
      o.processedAt = due;
      o.deliveryConfirmedBy = 'auto';
      if (o.paymentStatus === '결제대기') { o.paymentStatus = '결제완료'; o.paidAt = due; }
    });
  }

  // 주문 시점 배송방식 스냅샷 표기 — 취소·반품 팝업과 주문상세에서 공통으로 사용한다.
  function shippingFeeLabel(method, fee) {
    if (method === 'free') return '무료배송(0원)';
    if (method === 'cod') return '착불(별도부과)';

  // <input type="date"> 값 'YYYY-MM-DD' → 목업 createdAt과 동일한 'YY.MM.DD' 형식으로 변환
  function inputDateToOrderDate(v) { return v ? v.slice(2).replace(/-/g, '.') : ''; }
  // 오늘 기준 n개월 전 날짜를 'YY.MM.DD' 형식으로 반환 — 1개월/3개월/6개월 기간 칩 계산용
  function monthsAgoOrderDate(n) {
    const d = new Date(RETAIL_MOCK_TODAY);
    d.setUTCMonth(d.getUTCMonth() - n);
    return d.toISOString().slice(2, 10).replace(/-/g, '.');

  const REVERT_ICON_HTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>';
  let retailOrderChecked = new Set();

  function closeBulkAlert() {
    const root = document.getElementById('bulkAlertRoot');
    if (root) root.remove();
  }
  function openBulkAlert({ message, note, confirmLabel, onConfirm, danger }) {
    closeBulkAlert();

    root.id = 'bulkAlertRoot';
    root.innerHTML = `
      <div class="modal-scrim" id="bulkAlertScrim">
        <div class="modal-box">
          <div style="font-size:14px; line-height:1.6; white-space:pre-line;">${escapeHtml(message)}</div>
          ${note ? `<div class="field-hint" style="margin-top:8px;">${escapeHtml(note)}</div>` : ''}
          <div class="modal-actions">
            ${onConfirm ? `<button type="button" class="btn-secondary" id="bulkAlertCancelBtn">취소</button>` : ''}
            <button type="button" class="${danger ? 'btn-danger' : 'btn-primary'}" id="bulkAlertConfirmBtn">${confirmLabel || '확인'}</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(root);
    const cancelBtn = root.querySelector('#bulkAlertCancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', closeBulkAlert);
    root.querySelector('#bulkAlertScrim').addEventListener('click', e => {

  function showBulkToast(message) {

  // ---- 삭제 공통 — 확인 창의 마지막 문장은 항상 "삭제한 데이터는 복구할 수 없습니다. 신중하게 삭제해 주세요."로 통일한다. ----
  const DELETE_IRREVERSIBLE_TEXT = '삭제한 데이터는 복구할 수 없습니다. 신중하게 삭제해 주세요.';
  function deleteConfirmMessage(kind, opts) {
    const o = opts || {};
    const bulk = typeof o.count === 'number';
    if (kind === 'product') {
      const lines = [bulk ? `선택한 ${o.count}건을 삭제하시겠습니까?` : '상품을 삭제하시겠습니까?'];
      if (o.linked) lines.push(bulk ? '소매정보가 연동된 상품이 포함되어 있습니다.' : '소매정보가 연동된 상품입니다.');

      lines.push(DELETE_IRREVERSIBLE_TEXT);

  // 일괄변경 공통 흐름 — 선택 건 중 반영 가능한 건만 처리한다.
  function runBulkChange({ rows, checked, label, note, canApply, apply, onDone }) {
    if (!checked.size || !rows.some(o => checked.has(o.orderNo))) {
      openBulkAlert({ message: '일괄 변경할 주문을 선택해주세요.' });
      return;
    }
    if (!label) {
      openBulkAlert({ message: '변경할 처리 상태를 선택해주세요.' });
      return;
    }
    const targets = rows.filter(o => checked.has(o.orderNo));
    const ok = targets.filter(canApply);
    const n = targets.length;
    const m = ok.length;
    if (m === 0) {
      openBulkAlert({ message: `선택한 주문은 [${label}] 처리할 수 없습니다.` });
      return;
    }
    const message = m === n
      ? `선택한 ${n}건을 [${label}] 처리합니다.\n진행하시겠습니까?`
      : `선택한 ${n}건 중 ${m}건만 [${label}] 처리됩니다.\n진행하시겠습니까?`;
    openBulkAlert({
      message, note, confirmLabel: '진행',
      onConfirm: () => {
        ok.forEach(apply);
        checked.clear();
        onDone();
        showBulkToast(`${m}건이 [${label}] 처리되었습니다.`);

  // 도매주문상품 원본 — 배송확정(수령완료)된 건만 대상이며, 주문 단위가 아니라 상품코드 단위로 집계한다.
  // 같은 상품을 여러 번 구매(배송확정)하면 보유수량이 누적되고, 상품정보 초기값은 가장 최근 배송확정 구매분을 사용한다.
  function retailPurchaseSourceRows() {
    const byCode = new Map();
    myPurchases().filter(o => o.processStatus === '배송확정')
      .sort((a, b) => (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0))
      .forEach(o => {
        o.items.forEach(item => {
          const key = item.code || item.name;
          const mp = item.code ? findMarketProduct(item.code) : null;
          const prev = byCode.get(key);
          byCode.set(key, {
            source: 'purchase',
            sourceCode: key,
            name: item.name,
            supplierName: o.seller,
            origin: mp ? mp.origin : '',
            expiry: mp ? mp.expiry : '',
            detailContent: mp ? mp.detailContent : '',
            purchasedAt: orderDatePart(o),
            // 보유수량 — 목업 범위에서는 소매 판매로 인한 실시간 차감 시뮬레이션 없이 배송확정 구매수량을 누적한다
            holdingQty: (prev ? prev.holdingQty : 0) + item.qty,
          });
        });
      });
    return Array.from(byCode.values());
  }

  // 내도매상품 원본 — PRODUCT_LIST 전체(본인이 등록한 도매상품)
  function retailOwnSourceRows() {
    return PRODUCT_LIST.map(p => ({
      source: 'own',
      sourceCode: p.code,
      name: p.name,
      cat1: p.cat1,
      cat2: p.cat2,
      supplierName: MY_SELLER_NAME,
      origin: p.origin,
      expiry: p.expiry,
      detailContent: p.detailContent,
      purchasedAt: p.createdAt,
      holdingQty: p.stock,
