              ${c.warn ? `<div class="field-hint" style="margin-top:6px; color:var(--warning);">${escapeHtml(c.warn)}</div>` : ''}
            </div>`).join('')}
        </div>` : ''}
      </section>`;
    }).join('') : '';

    return `
      <section class="form-section">
        <h3 class="form-section-title">웹푸시 안내</h3>
        <div class="chat-guide-box">
          <div class="field-hint" style="font-size:12px; color:var(--text-body);">
            이 탭의 알림은 무료 웹푸시와 알림센터(상단 벨 아이콘)에 동일하게 반영됩니다. 실시간으로 받으려면 사용 중인 브라우저에서 알림을 허용해 주세요.<br>
            - 안드로이드 : Chrome 또는 삼성 인터넷에서 알림 허용<br>
            - 아이폰 : Safari에서 홈 화면에 추가 후 알림 허용<br>
            ※ 아이폰은 홈 화면에 웹앱으로 추가해야 웹푸시 알림을 받을 수 있습니다.
          </div>
        </div>
      </section>

      <section class="form-section">
        <h3 class="form-section-title">브라우저 알림 상태</h3>
        <div class="field-hint" style="margin-bottom:8px;">이 기기·이 브라우저 기준입니다. 다른 기기·브라우저에서는 별도로 허용해야 합니다.</div>
        <div class="switch-row">
          <span class="tag ${permissionMeta.tagClass}">${permissionMeta.label}</span>
          <button type="button" class="btn-secondary" id="wholesalePushGuideBtn">허용 방법 보기</button>
        </div>
      </section>

      <section class="form-section">
        <div class="switch-row">
          <span class="switch-label">전체 알림 받기</span>
          <label class="switch">
            <input type="checkbox" id="notiSystemMasterToggle" ${notificationMasterOn ? 'checked' : ''}>
            <span class="switch-track"></span>
            <span class="switch-thumb"></span>
          </label>
        </div>
      </section>

      ${categoriesHTML}

      ${notificationMasterOn ? `
      <section class="form-section">
        <div class="switch-row">
          <span class="switch-label">도매상품 알림 (가맹점 대상)</span>
          <label class="switch">
            <input type="checkbox" id="wholesaleProductNotiToggle" ${wholesaleProductNotificationOn ? 'checked' : ''}>
            <span class="switch-track"></span>
            <span class="switch-thumb"></span>
          </label>
        </div>
        <div class="field-hint" style="margin-top:6px;">우리 본사가 새로 등록하는 도매상품을 알려드립니다.</div>
      </section>` : ''}`;
  }

  // 웹푸시 허용 방법 안내 팝업 — 권한 상태(허용/차단/설정 안 함)에 따라 안내 문구가 달라진다.
  // 차단 상태에서는 브라우저가 화면에서의 재요청 자체를 막기 때문에, 이 경우엔 브라우저 자체 설정
  // 변경 방법만 안내하고 '지금 허용하기' 버튼은 노출하지 않는다.
  function wholesalePushGuideModalHTML() {
    const isDefault = wholesalePushPermission === 'default';
    const isDenied = wholesalePushPermission === 'denied';
    const statusHintHTML = isDefault
      ? `<div class="field-hint" style="margin-bottom:12px;">아직 알림 허용 여부를 설정하지 않았습니다. 아래 [지금 허용하기]를 누르면 브라우저의 알림 허용 팝업이 나타납니다.</div>`
      : isDenied
        ? `<div class="field-hint" style="margin-bottom:12px;">이미 알림이 차단된 상태에서는 화면에서 다시 요청할 수 없습니다. 브라우저 자체 설정에서 직접 허용으로 변경해주세요.</div>`
        : `<div class="field-hint" style="margin-bottom:12px;">이미 알림이 허용된 상태입니다.</div>`;

    return `
      <div class="modal-scrim" id="wholesalePushGuideModalScrim">
        <div class="modal-box">
          <h3>웹푸시 허용 방법</h3>
          ${statusHintHTML}
          <div class="detail-grid">
            <div class="detail-item detail-item-wide"><span class="detail-label">안드로이드</span><span class="detail-value">Chrome 또는 삼성 인터넷 주소창의 자물쇠(사이트 정보) 아이콘 → 권한 → 알림 → 허용으로 변경</span></div>
            <div class="detail-item detail-item-wide"><span class="detail-label">아이폰</span><span class="detail-value">Safari 공유 버튼 → 홈 화면에 추가로 먼저 설치한 뒤, 기기 설정 앱 &gt; 알림에서 허용으로 변경</span></div>
          </div>
          <div class="modal-actions">
            ${isDefault ? `<button type="button" class="btn-primary" id="wholesalePushRequestBtn">지금 허용하기</button>` : ''}
            <button type="button" class="btn-secondary" id="wholesalePushGuideCloseBtn">닫기</button>
          </div>
        </div>
      </div>`;
  }

  function closeWholesalePushGuideModal() {
    const root = document.getElementById('wholesalePushGuideModalRoot');
    if (root) root.remove();
  }

  function openWholesalePushGuideModal() {
    closeWholesalePushGuideModal();
    const root = document.createElement('div');
    root.id = 'wholesalePushGuideModalRoot';
    root.innerHTML = wholesalePushGuideModalHTML();
    document.body.appendChild(root);

    root.querySelector('#wholesalePushGuideCloseBtn').addEventListener('click', closeWholesalePushGuideModal);
    root.querySelector('#wholesalePushGuideModalScrim').addEventListener('click', e => {
      if (e.target.id === 'wholesalePushGuideModalScrim') closeWholesalePushGuideModal();
    });
    const requestBtn = root.querySelector('#wholesalePushRequestBtn');
    if (requestBtn) {
      requestBtn.addEventListener('click', () => {
        wholesalePushPermission = 'granted';
        closeWholesalePushGuideModal();
        renderSystemNotificationPage();
      });
    }
  }

  function renderSystemNotificationPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageSystemNotificationHTML();

    wrapper.querySelectorAll('[data-noti-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        notificationTab = btn.dataset.notiTab;
        renderSystemNotificationPage();
      });
    });

    if (notificationTab === 'wholesale') {
      const masterToggle = wrapper.querySelector('#notiSystemMasterToggle');
      if (masterToggle) {
        masterToggle.addEventListener('change', () => {
          notificationMasterOn = masterToggle.checked;
          renderSystemNotificationPage();
          updateNotificationCenterBadge();
        });
      }
      wrapper.querySelectorAll('[data-noti-category-toggle]').forEach(chk => {
        chk.addEventListener('change', () => {
          notificationCategoryOn[chk.dataset.notiCategoryToggle] = chk.checked;
          renderSystemNotificationPage();
          updateNotificationCenterBadge();
        });
      });
      wrapper.querySelectorAll('[data-noti-case-toggle]').forEach(chk => {
        chk.addEventListener('change', () => {
          const nc = NOTIFICATION_CASES.find(c => c.id === chk.dataset.notiCaseToggle);
          if (nc) nc.enabled = chk.checked;
          updateNotificationCenterBadge();
        });
      });
      const productToggle = wrapper.querySelector('#wholesaleProductNotiToggle');
      if (productToggle) {
        productToggle.addEventListener('change', () => {
          wholesaleProductNotificationOn = productToggle.checked;
          updateNotificationCenterBadge();
        });
      }
      const guideBtn = wrapper.querySelector('#wholesalePushGuideBtn');
      if (guideBtn) guideBtn.addEventListener('click', openWholesalePushGuideModal);
      return;
    }

    if (notificationTab !== 'retail') return;

    const masterToggle = wrapper.querySelector('#notiMasterToggle');
    if (masterToggle) {
      masterToggle.addEventListener('change', () => {
        notiToggleError = '';
        if (masterToggle.checked && RETAIL_NOTIFICATION_BALANCE.remaining < NOTI_MIN_BALANCE) {
          notiToggleError = '잔여 알림톡이 5건 미만이라 사용할 수 없습니다. 충전 후 설정해 주세요.';
          retailNotificationOn = false;
        } else {
          retailNotificationOn = masterToggle.checked;
        }
        renderSystemNotificationPage();
      });
    }

    wrapper.querySelectorAll('[data-noti-template]').forEach(chk => {
      chk.addEventListener('change', () => {
        const tpl = RETAIL_NOTIFICATION_TEMPLATES.find(t => t.id === chk.dataset.notiTemplate);
        if (tpl) tpl.enabled = chk.checked;
      });
    });

    const chargeBtn = wrapper.querySelector('#notiChargeBtn');
    if (chargeBtn) chargeBtn.addEventListener('click', openNotificationChargeModal);

    // 발송내역 필터 — 기간칩/커스텀 날짜/수신자 검색
    wrapper.querySelectorAll('[data-noti-history-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        notiHistoryPeriod = btn.dataset.notiHistoryPeriod;
        if (notiHistoryPeriod !== 'custom') { notiHistoryDateFrom = ''; notiHistoryDateTo = ''; }
        renderSystemNotificationPage();
      });
    });
    const historyDateFromEl = wrapper.querySelector('#notiHistoryDateFrom');
    if (historyDateFromEl) {
      historyDateFromEl.addEventListener('change', e => {
        notiHistoryDateFrom = e.target.value;
        renderSystemNotificationPage();
      });
    }
    const historyDateToEl = wrapper.querySelector('#notiHistoryDateTo');
    if (historyDateToEl) {
      historyDateToEl.addEventListener('change', e => {
        notiHistoryDateTo = e.target.value;
        renderSystemNotificationPage();
      });
    }
    const historyMsgSel = wrapper.querySelector('#notiHistoryMessageSelect');
    if (historyMsgSel) historyMsgSel.addEventListener('change', e => { notiHistoryMessage = e.target.value; renderSystemNotificationPage(); });
    const historyChSel = wrapper.querySelector('#notiHistoryChannelSelect');
    if (historyChSel) historyChSel.addEventListener('change', e => { notiHistoryChannel = e.target.value; renderSystemNotificationPage(); });
    const historySearchInput = wrapper.querySelector('#notiHistorySearchInput');
    const historySearchBtn = wrapper.querySelector('#notiHistorySearchBtn');
    if (historySearchInput && historySearchBtn) {
      const runHistorySearch = () => {
        notiHistorySearch = historySearchInput.value.trim();
        renderSystemNotificationPage();
      };
      historySearchBtn.addEventListener('click', runHistorySearch);
      historySearchInput.addEventListener('keydown', e => { if (e.key === 'Enter') runHistorySearch(); });
    }
  }

  // ---- 알림톡 충전 팝업(모달) ----
  // 금액 구간(10,000/50,000/100,000/500,000원)과 제공건수는 BlogPay 화면 참고값 — 09SCM 실제 단가는 확인 필요.
  const NOTIFICATION_CHARGE_TIERS = [
    { amount: 10000, credits: 1250 },
    { amount: 50000, credits: 6250 },
    { amount: 100000, credits: 12500 },
    { amount: 500000, credits: 62500 },
  ];
  const NOTIFICATION_TERMS_TEXT = '제1조(목적)\n본 약관은 알림톡·SMS 발송 서비스(이하 "서비스")의 이용조건 및 절차에 관한 사항을 규정함을 목적으로 합니다.';

  function notificationChargeModalHTML() {
    const rowsHTML = NOTIFICATION_CHARGE_TIERS.map((t, i) => `
      <tr>
        <td><input type="radio" name="notiChargeTier" value="${t.amount}" ${i === 0 ? 'checked' : ''}></td>
        <td>${t.amount.toLocaleString()}원</td>
        <td class="num">${t.credits.toLocaleString()}건</td>
      </tr>`).join('');
    const initialTotal = Math.round(NOTIFICATION_CHARGE_TIERS[0].amount * 1.1);

    return `
      <div class="modal-scrim" id="notiChargeModalScrim">
        <div class="modal-box" style="max-width:480px;">
          <h3>알림톡 충전</h3>

          <div class="field-hint" style="margin-bottom:16px;">
            적용건수 : 알림톡 1건 / LMS 4건<br>(알림톡 발송 불가 시 LMS로 발송됩니다.)
          </div>

          <div class="table-wrap">
            <table class="tpl-table" data-card-head="충전금액(VAT별도)" data-card-inline="제공건수">
              <thead><tr><th class="col-check">선택</th><th class="c-flex">충전금액(VAT별도)</th><th class="c-s">제공건수</th></tr></thead>
              <tbody id="notiChargeTierRows">${rowsHTML}</tbody>
            </table>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:16px;">
            <span style="font-size:14px; font-weight:700;">실결제금액</span>
            <span style="font-size:20px; font-weight:700;" id="notiChargeTotal">${initialTotal.toLocaleString()}원</span>
          </div>

          <div class="form-field" style="margin-bottom:12px;">
            <label>결제수단</label>
            <div class="field-hint">페이앱 (신용카드/핸드폰)</div>
          </div>

          <div class="form-field form-field-wide">
            <label>이용약관</label>
            <textarea class="form-input" rows="4" readonly>${NOTIFICATION_TERMS_TEXT}</textarea>
          </div>
          <label class="retail-toggle-row" style="padding:8px 0 0;">
            <input type="checkbox" id="notiChargeAgree">
            SMS 이용약관에 동의합니다
          </label>

          <div class="form-error-banner" id="notiChargeError" style="margin-top:12px;" hidden></div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="notiChargeCancelBtn">취소</button>
            <button type="button" class="btn-primary" id="notiChargeSubmitBtn">충전하기</button>
          </div>
        </div>
      </div>`;
  }

  function closeNotificationChargeModal() {
    const root = document.getElementById('notiChargeModalRoot');
    if (root) root.remove();
  }

  function openNotificationChargeModal() {
    closeNotificationChargeModal();
    const root = document.createElement('div');
    root.id = 'notiChargeModalRoot';
    root.innerHTML = notificationChargeModalHTML();
    document.body.appendChild(root);
    bindNotificationChargeModal();
  }

  function bindNotificationChargeModal() {
    const root = document.getElementById('notiChargeModalRoot');
    if (!root) return;

    root.querySelector('#notiChargeCancelBtn').addEventListener('click', closeNotificationChargeModal);
    root.querySelector('#notiChargeModalScrim').addEventListener('click', e => {
      if (e.target.id === 'notiChargeModalScrim') closeNotificationChargeModal();
    });

    root.querySelectorAll('input[name="notiChargeTier"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const tier = NOTIFICATION_CHARGE_TIERS.find(t => t.amount === Number(radio.value));
        if (tier) root.querySelector('#notiChargeTotal').textContent = `${Math.round(tier.amount * 1.1).toLocaleString()}원`;
      });
    });

    root.querySelector('#notiChargeSubmitBtn').addEventListener('click', () => {
      const agreed = root.querySelector('#notiChargeAgree').checked;
      const errorBox = root.querySelector('#notiChargeError');
      if (!agreed) {
        errorBox.hidden = false;
        errorBox.textContent = 'SMS 이용약관에 동의해주세요.';
        return;
      }
      const checkedRadio = root.querySelector('input[name="notiChargeTier"]:checked');
      const tier = NOTIFICATION_CHARGE_TIERS.find(t => t.amount === Number(checkedRadio.value));
      // 실제 구현에서는 여기서 페이앱 결제창을 호출하고 결과만 09SCM 서버로 전달받는다(이용료관리 카드등록과 동일 방식).
      // 이 목업에서는 팝업 호출 없이 충전 완료 상태로 바로 전환한다.
      if (tier) RETAIL_NOTIFICATION_BALANCE.remaining += tier.credits;
      closeNotificationChargeModal();
      if (currentItem === 'system-notification') renderSystemNotificationPage();
    });
  }

  // ---- 알림센터(상단 벨 아이콘) ----
  // 확인(클릭)한 알림은 목록에서 즉시 삭제한다(삭제해도 원 상태는 각 도메인 화면(주문내역, 발송내역 등)에
  // 그대로 남아 있다). 카테고리는 대괄호 라벨로 구분 표기한다.
  let NOTIFICATION_CENTER_ITEMS = [
    { id: 8, caseId: 'ws-cancel-return', at: mockStampAgo(0), body: '365청과 수원점 님이 주문(#WO20260920005)을 취소했습니다. 재고가 자동 복원되었습니다.' },
    { id: 7, caseId: 'rt-cancel-return', at: mockStampAgo(3), body: '김민수 님이 주문(#RO20260920004)을 취소했습니다. 재고가 자동 복원되었습니다.' },
    { id: 6, caseId: 'ws-new-paid', at: mockStampAgo(0), body: '365청과 수원점 님이 주문(#WO20260920004)을 접수했습니다(결제완료). 못난이사과 외 2건 · 84,000원' },
    { id: 5, caseId: 'wb-payment-confirm', at: mockStampAgo(12), body: '횡성한우 님이 주문(#WO20260920003)을 결제확인 처리했습니다' },
    { id: 4, caseId: 'rt-new-paid', at: mockStampAgo(28), body: '김민수 님이 주문(#RO20260920003)을 접수했습니다(결제완료). 햇사과 외 1건 · 32,000원' },
    { id: 3, caseId: 'rt-noshow', at: mockStampAgo(40), body: '박민수 님의 주문(#RO20260918003)이 픽업기간을 지나 노쇼후보로 분류되었습니다' },
    { id: 2, caseId: 'rt-chat-fail', at: mockStampAgo(55), body: '채팅주문 메시지가 회원매칭실패로 대기 중입니다. 채팅주문설정에서 확인해주세요' },
    { id: 1, caseId: 'sys-franchise-fail', at: mockStampAgo(60), body: '365청과 수원점 가맹점의 이용료 결제가 실패했습니다' },
    { id: 9, caseId: 'ws-new-paid', at: mockStampAgo(135), body: '365청과 수원점 님이 주문(#WO20260920001)을 접수했습니다(결제완료). 햇양파 10kg 외 1건 · 78,000원' },
    { id: 10, caseId: 'rt-new-paid', at: mockStampAgo(310), body: '이영희 님이 주문(#RO20260920001)을 접수했습니다(결제완료). 레몬 외 2건 · 21,500원' },
    { id: 11, caseId: 'wb-payment-confirm', at: mockStampAgo(1420), body: '횡성한우 님이 주문(#WO20260919002)을 결제확인 처리했습니다' },
    { id: 12, caseId: 'rt-cancel-return', at: mockStampAgo(1560), body: '박지훈 님이 주문(#RO20260919001)을 취소했습니다. 재고가 자동 복원되었습니다.' },
    { id: 13, caseId: 'sys-franchise-fail', at: mockStampAgo(4400), body: '행복마트 화정점 가맹점의 이용료 결제가 실패했습니다' },
  ];

  function notificationCenterCategoryLabel(caseId) {
    if (caseId === 'new-product-hq') return '도매상품';
    const nc = NOTIFICATION_CASES.find(c => c.id === caseId);
    if (!nc) return '';
    const cat = NOTIFICATION_CATEGORIES.find(c => c.id === nc.category);
    return cat ? cat.label : '';
  }

  // 알림 설정(마스터/카테고리/케이스)이 꺼져 있는 동안 발생한 알림은 알림센터에 쌓이지 않는다(재활성해도 표시되지 않음).
  // 끄기 이전에 쌓인 알림은 이력으로 계속 표시한다. 도매상품 알림(new-product-hq)은 4개 카테고리 밖의 별도
  // 토글이므로 전체 알림 받기 + 도매상품 알림 토글만 본다.
  function isNotificationCaseActive(caseId) {
    if (!notificationMasterOn) return false;
    if (caseId === 'new-product-hq') return wholesaleProductNotificationOn;
    const nc = NOTIFICATION_CASES.find(c => c.id === caseId);
    if (!nc) return true;
    if (!notificationCategoryOn[nc.category]) return false;
    return !!nc.enabled;
  }
  function pushCenterNotification(item) {
    if (!isNotificationCaseActive(item.caseId)) return;
    NOTIFICATION_CENTER_ITEMS.unshift(Object.assign({ id: NOTIFICATION_CENTER_ITEMS.reduce((m, i) => Math.max(m, i.id), 0) + 1 }, item));
  }

  function updateNotificationCenterBadge() {
    const dot = document.getElementById('notificationCenterDot');
    if (dot) dot.style.display = NOTIFICATION_CENTER_ITEMS.length ? '' : 'none';
  }

  function notificationCenterModalHTML() {
    const visibleItems = NOTIFICATION_CENTER_ITEMS
      .slice().sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : b.id - a.id));
    const rowsHTML = visibleItems.length ? visibleItems.map(item => `
      <div class="noti-center-row" data-noti-center-item="${item.id}" style="padding:12px 20px; border-bottom:1px solid var(--border); cursor:pointer;">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
          <span class="tag tag-key">[${escapeHtml(notificationCenterCategoryLabel(item.caseId))}]</span>

      seen.add(o);
      Object.keys(o).forEach(k => {
        const v = o[k];

  function fmtPhoneTel(raw) {
    let d = raw.replace(/\D/g, '');
    if (/^1[5-8]/.test(d)) {
      d = d.slice(0, 8);
      return d.length <= 4 ? d : d.slice(0, 4) + '-' + d.slice(4);
    }
    d = d.slice(0, 11);
    if (d.startsWith('02')) {
      d = d.slice(0, 10);
      if (d.length <= 2) return d;
      const rest = d.slice(2);
      if (rest.length <= 3) return '02-' + rest;
      if (rest.length <= 7) return '02-' + rest.slice(0, 3) + '-' + rest.slice(3);
      return '02-' + rest.slice(0, 4) + '-' + rest.slice(4);
    }
    return fmtPhoneMobile(d);
  }
  function fmtBizRegNo(raw) {
    const d = raw.replace(/\D/g, '').slice(0, 10);
    if (d.length <= 3) return d;
    if (d.length <= 5) return d.slice(0, 3) + '-' + d.slice(3);
    return d.slice(0, 3) + '-' + d.slice(3, 5) + '-' + d.slice(5);
  }
  function fmtCorpRegNo(raw) {
    const d = raw.replace(/\D/g, '').slice(0, 13);
    return d.length <= 6 ? d : d.slice(0, 6) + '-' + d.slice(6);
  }
  function isValidMobilePhone(v) { return /^01\d-\d{3,4}-\d{4}$/.test(v); }
  function isValidTelNo(v) { return /^(0\d{1,2}-\d{3,4}-\d{4}|1[5-8]\d{2}-\d{4}|01\d-\d{3,4}-\d{4})$/.test(v); }
  const INPUT_FMT = {
    phone: fmtPhoneMobile,
    tel: fmtPhoneTel,
    biz: fmtBizRegNo,
    corp: fmtCorpRegNo,
    code6: v => v.replace(/\D/g, '').slice(0, 6),
    account: v => v.replace(/\D/g, '').slice(0, 20)
  };
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el || !el.dataset || !el.dataset.fmt) return;
    const fn = INPUT_FMT[el.dataset.fmt];
    if (!fn) return;
    const before = el.value;
    const after = fn(before);
    if (before === after) return;
    let pos = null;
    try { pos = el.selectionStart; } catch (err) { pos = null; }
    el.value = after;
    if (pos !== null) {
      const digitsBefore = before.slice(0, pos).replace(/\D/g, '').length;
      let n = 0, i = 0;
      for (; i < after.length && n < digitsBefore; i++) { if (/\d/.test(after[i])) n++; }
      try { el.setSelectionRange(i, i); } catch (err) { /* ignore */ }
    }
  });

  // ===== 이미지 업로드 =====
  const IMG_UPLOAD_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  const IMG_UPLOAD_MAX_BYTES = 5 * 1024 * 1024;
  function imageUploaderHTML(opts) {
    const o = Object.assign({ existing: 0, min: 2, max: 10 }, opts || {});
    let html = '';
    for (let i = 0; i < o.existing; i++) {
      html += '<div class="img-thumb" data-existing="1">IMG<button type="button" class="img-remove" aria-label="이미지 삭제">×</button></div>';
    }
    const slots = o.existing >= o.max ? 0 : Math.max(1, o.min - o.existing);
    for (let i = 0; i < slots; i++) html += '<div class="image-slot">+ 이미지 추가</div>';
    return `<div class="image-upload-row" data-img-uploader data-min="${o.min}" data-max="${o.max}">${html}</div>`;
  }
  function imageUploaderCount(root) {
    return root ? root.querySelectorAll('.img-thumb').length : 0;
  }
  function imageUploaderNormalize(root) {
    const min = parseInt(root.dataset.min, 10) || 1;
    const max = parseInt(root.dataset.max, 10) || 1;
    root.querySelectorAll('.image-slot').forEach(s => s.remove());
    const t = imageUploaderCount(root);
    const want = t >= max ? 0 : Math.max(1, min - t);
    for (let i = 0; i < want; i++) {
      const s = document.createElement('div');
      s.className = 'image-slot';
      s.textContent = '+ 이미지 추가';
      root.appendChild(s);
    }
  }
  function imageUploaderError(root, msg) {
    let box = root.nextElementSibling;
    if (!box || !box.classList.contains('img-error')) {
      box = document.createElement('div');
      box.className = 'field-error img-error';
      root.parentNode.insertBefore(box, root.nextSibling);
    }
    box.textContent = msg || '';
    box.hidden = !msg;
  }
  document.addEventListener('click', e => {
    const rm = e.target.closest && e.target.closest('.img-remove');
    if (rm) {
      const root = rm.closest('[data-img-uploader]');
      if (!root) return;
      rm.closest('.img-thumb').remove();
      imageUploaderError(root, '');
      imageUploaderNormalize(root);
      return;
    }
    const slot = e.target.closest && e.target.closest('.image-slot');
    if (!slot) return;
    const root = slot.closest('[data-img-uploader]');
    if (!root) return;
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/jpeg,image/png,image/webp';
    input.multiple = parseInt(root.dataset.max, 10) > 1;
    input.addEventListener('change', () => {
      const max = parseInt(root.dataset.max, 10) || 1;
      const files = Array.from(input.files || []);
      let msg = '';
      files.forEach(file => {
        if (imageUploaderCount(root) >= max) { msg = '이미지는 최대 ' + max + '장까지 등록할 수 있습니다.'; return; }
        if (!IMG_UPLOAD_TYPES.includes(file.type)) { msg = 'JPG, PNG, WEBP 이미지 파일만 등록할 수 있습니다.'; return; }
        if (file.size > IMG_UPLOAD_MAX_BYTES) { msg = '이미지는 파일당 5MB 이하만 등록할 수 있습니다.'; return; }
        const thumb = document.createElement('div');
        thumb.className = 'img-thumb';
        const img = document.createElement('img');
        img.alt = '';
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.readAsDataURL(file);
        thumb.appendChild(img);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'img-remove';
        btn.setAttribute('aria-label', '이미지 삭제');
        btn.textContent = '×';
        thumb.appendChild(btn);
        const firstSlot = root.querySelector('.image-slot');
        root.insertBefore(thumb, firstSlot);
      });
      imageUploaderError(root, msg);
      imageUploaderNormalize(root);
    });
    input.click();
  });

  // ===== 상품 입력 검증 공통 =====
  function rawIsInt(raw, min) {
    const t = String(raw == null ? '' : raw).trim();
    return /^\d+$/.test(t) && parseInt(t, 10) >= min;
  }
  function imageCountErrors(root) {
    return imageUploaderCount(root) < 2 ? ['상품이미지를 2장 이상 등록해주세요.'] : [];
  }
  function priceErrors(raw, label) {
    const t = String(raw == null ? '' : raw).trim();
    if (t === '') return [label + '를 입력해주세요.'];
    return rawIsInt(t, 1) ? [] : [label + '는 1원 이상의 정수로 입력해주세요.'];
  }
  function discountErrors(raw, listPrice) {
    const t = String(raw == null ? '' : raw).trim();
    if (t === '') return [];
    if (!rawIsInt(t, 1)) return ['할인가는 1원 이상의 정수로 입력해주세요.'];
    return listPrice > 0 && parseInt(t, 10) > listPrice ? ['할인가는 소비자가를 초과할 수 없습니다.'] : [];
  }
  function qtyErrors(raw, label) {
    const t = String(raw == null ? '' : raw).trim();
    if (t === '') return [label + '을 입력해주세요.'];
    return rawIsInt(t, 0) ? [] : [label + '은 0 이상의 정수로 입력해주세요.'];
  }
  function pickupErrors(start, end, checkEnd) {
    if (!start || !end) return ['픽업가능 시작일·종료일을 입력해주세요.'];
    if (end < start) return ['픽업가능 종료일은 시작일보다 빠를 수 없습니다.'];
    if (checkEnd && end < RETAIL_MOCK_TODAY) return ['픽업가능 종료일은 오늘 이후로 입력해주세요.'];
    return [];
  }

  showLogin();

  (function initTabDrag() {
    let el = null, startX = 0, startLeft = 0, moved = false;
    document.addEventListener('mousedown', e => {
      const row = e.target.closest && e.target.closest('.tab-row');
      if (!row || row.scrollWidth <= row.clientWidth) return;
      el = row; startX = e.clientX; startLeft = row.scrollLeft; moved = false;
    });
    document.addEventListener('mousemove', e => {
      if (!el) return;
      const dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 5) { moved = true; el.classList.add('dragging'); }
      if (moved) el.scrollLeft = startLeft - dx;
    });
    document.addEventListener('mouseup', () => {
      if (el) el.classList.remove('dragging');
      el = null;
    });
    document.addEventListener('click', e => {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  })();
</script>
