  function renderChatOrderSettingsPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageChatOrderSettingsHTML();
    wrapper.querySelector('#chatOrderLinkSaveBtn').addEventListener('click', () => {
      const val = wrapper.querySelector('#chatOrderLinkInput').value.trim();
      RETAIL_CHAT_ORDER_LINK.link = val;
      RETAIL_CHAT_ORDER_LINK.linked = !!val;
      renderChatOrderSettingsPage();
    });

    wrapper.querySelectorAll('[data-chat-match]').forEach(btn => {
      btn.addEventListener('click', () => openChatMatchModal(btn.dataset.chatMatch));
    });
    const chatCheckAll = wrapper.querySelector('#chatUnmatchedCheckAll');
    const chatVisibleIds = Array.from(wrapper.querySelectorAll('[data-chat-check]')).map(c => c.dataset.chatCheck);
    const syncChatCheckAll = () => { chatCheckAll.checked = chatVisibleIds.length > 0 && chatVisibleIds.every(id => chatUnmatchedChecked.has(id)); };
    wrapper.querySelectorAll('[data-chat-check]').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) chatUnmatchedChecked.add(chk.dataset.chatCheck); else chatUnmatchedChecked.delete(chk.dataset.chatCheck);
        syncChatCheckAll();
      });
    });
    syncChatCheckAll();
    chatCheckAll.addEventListener('change', () => {
      chatVisibleIds.forEach(id => { if (chatCheckAll.checked) chatUnmatchedChecked.add(id); else chatUnmatchedChecked.delete(id); });
      wrapper.querySelectorAll('[data-chat-check]').forEach(chk => { chk.checked = chatCheckAll.checked; });
    });
    wrapper.querySelector('#chatUnmatchedBulkDeleteBtn').addEventListener('click', () => {
      const ids = chatVisibleIds.filter(id => chatUnmatchedChecked.has(id));
      if (!ids.length) { openBulkAlert({ message: '삭제할 매칭 실패 건을 선택해주세요.' }); return; }
      openDeleteConfirm('chatFail', { count: ids.length }, () => {
        ids.forEach(id => {
          const idx = RETAIL_CHAT_UNMATCHED.findIndex(x => x.id === id);
          if (idx !== -1) RETAIL_CHAT_UNMATCHED.splice(idx, 1);
          chatUnmatchedChecked.delete(id);
        });
        renderChatOrderSettingsPage();
        showBulkToast(`${ids.length}건이 삭제되었습니다.`);
      });
    });
    wrapper.querySelectorAll('[data-chat-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.chatDelete;
        openDeleteConfirm('chatFail', null, () => {
          const idx = RETAIL_CHAT_UNMATCHED.findIndex(x => x.id === id);
          if (idx !== -1) RETAIL_CHAT_UNMATCHED.splice(idx, 1);
          chatUnmatchedChecked.delete(id);
          renderChatOrderSettingsPage();
          showBulkToast('삭제되었습니다.');
        });
      });
    });

    const dateFromEl = wrapper.querySelector('#chatUnmatchedDateFrom');
    if (dateFromEl) {
      dateFromEl.addEventListener('change', () => {
        chatUnmatchedDateFrom = dateFromEl.value;
        renderChatOrderSettingsPage();
      });
    }
    const dateToEl = wrapper.querySelector('#chatUnmatchedDateTo');
    if (dateToEl) {
      dateToEl.addEventListener('change', () => {
        chatUnmatchedDateTo = dateToEl.value;
        renderChatOrderSettingsPage();
      });
    }
    const searchInputEl = wrapper.querySelector('#chatUnmatchedSearchInput');
    const searchBtnEl = wrapper.querySelector('#chatUnmatchedSearchBtn');
    if (searchInputEl && searchBtnEl) {
      const runSearch = () => {
        chatUnmatchedSearch = searchInputEl.value;
        renderChatOrderSettingsPage();
      };
      searchBtnEl.addEventListener('click', runSearch);
      searchInputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') runSearch();
      });
    }
  }

  // ---- 채팅주문 수동 매칭 팝업(모달) ----
  // 매칭 실패 큐(RETAIL_CHAT_UNMATCHED)의 한 건을 회원과 수동으로 연결해 주문접수 건을 생성한다.
  // 상품·수량은 이미 파싱된 값을 그대로 쓰며 이 화면에서 조정하지 않는다.
  // 채팅주문은 항상 픽업 + 현장결제로 생성된다(정책 원문: 결제수단·판매방식 조합 규칙 참고).
  // 회원 조회 결과 카드 — 이름·연락처·등록된 채팅주문 닉네임·이용상태를 보여준다. 관리자가 이 화면의
  // 수신 닉네임(리스트)과 여기 표시되는 등록 닉네임을 직접 비교해 도용 의심 여부를 판단한다.
  // 이용제한 회원이면 경고 문구를 덧붙여 매칭 적용 전에 인지할 수 있게 한다(실제 차단은 제출 시 검증에서 처리).
  function chatMemberResultHTML(member) {
    const warn = member.usageStatus === '이용제한' ? `<span class="field-hint-inline" style="color:var(--error);">이용제한 회원 — 매칭 적용 시 주문접수가 제한됩니다</span>` : '';
    return `${escapeHtml(member.name)} (${escapeHtml(member.phone)}) · 채팅주문 닉네임 ${escapeHtml(member.chatNickname || '-')} · 이용상태 ${statusTag(member.usageStatus)} ${warn}`;
  }

  function chatMatchModalHTML(id) {
    const u = RETAIL_CHAT_UNMATCHED.find(x => x.id === id);
    if (!u) return '';
    const activeMembers = RETAIL_MEMBERS.filter(m => m.status !== 'withdrawn');
    const preselectMember = activeMembers.find(m => m.nicknameCode === u.chatCode);
    const itemsText = u.items.map(it => `${it.name} ${it.qty}개`).join(', ');
    return `
      <div class="modal-scrim" id="chatMatchModalScrim">
        <div class="modal-box">
          <h3>채팅주문 매칭</h3>
          <div class="detail-grid" style="margin-bottom:12px;">
            <div class="detail-item detail-item-wide"><span class="detail-label">원문 메시지</span><span class="detail-value">${escapeHtml(u.rawMessage)}</span></div>
            <div class="detail-item detail-item-wide"><span class="detail-label">상품 파싱값</span><span class="detail-value">${escapeHtml(itemsText)}</span></div>
            <div class="detail-item"><span class="detail-label">수신 닉네임</span><span class="detail-value">${escapeHtml(u.chatNickname)}</span></div>
            <div class="detail-item"><span class="detail-label">수신 코드</span><span class="detail-value">${escapeHtml(u.chatCode)}</span></div>
          </div>
          <div class="form-grid">
            <div class="form-field form-field-wide">
              <label>회원 <span class="field-hint-inline">회원주문 코드 4자리로 조회</span></label>
              <div class="input-pair">
                <input type="text" class="form-input" id="chatMatchMemberCode" value="${escapeHtml(u.chatCode || '')}" maxlength="4" placeholder="회원주문 코드 4자리">
                <button type="button" class="btn-secondary" id="chatMatchMemberCheckBtn">회원 확인</button>
              </div>
              <div id="chatMatchMemberResult" class="field-hint" style="${preselectMember ? '' : 'display:none;'}">${preselectMember ? chatMemberResultHTML(preselectMember) : ''}</div>
            </div>
          </div>
          <div class="form-error-banner" id="chatMatchModalError" style="margin-top:12px;" hidden></div>
          <div class="field-hint" style="margin-top:8px;">매칭 적용 시 위 상품 파싱값 그대로 상품마다 채팅주문(픽업·현장결제) 주문접수 건이 생성됩니다.</div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="chatMatchModalCancelBtn">닫기</button>
            <button type="button" class="btn-primary" id="chatMatchModalSubmitBtn">매칭 적용</button>
          </div>
        </div>
      </div>`;
  }

  function closeChatMatchModal() {
    const root = document.getElementById('chatMatchModalRoot');
    if (root) root.remove();
  }

  function openChatMatchModal(id) {
    closeChatMatchModal();
    const root = document.createElement('div');
    root.id = 'chatMatchModalRoot';
    root.innerHTML = chatMatchModalHTML(id);
    document.body.appendChild(root);
    bindChatMatchModal(id);
  }

  function bindChatMatchModal(id) {
    const root = document.getElementById('chatMatchModalRoot');
    if (!root) return;

    // 회원 확인(회원주문 코드 조회) 결과로 확정된 회원 id — 조회 버튼 클릭으로만 채워진다.
    const u0 = RETAIL_CHAT_UNMATCHED.find(x => x.id === id);
    const activeMembers = RETAIL_MEMBERS.filter(m => m.status !== 'withdrawn');
    let chatMatchedMemberId = u0 ? (activeMembers.find(m => m.nicknameCode === u0.chatCode) || {}).id || null : null;

    root.querySelector('#chatMatchModalCancelBtn').addEventListener('click', closeChatMatchModal);
    root.querySelector('#chatMatchModalScrim').addEventListener('click', e => {
      if (e.target.id === 'chatMatchModalScrim') closeChatMatchModal();
    });

    root.querySelector('#chatMatchMemberCode').addEventListener('input', () => {
      chatMatchedMemberId = null;
      const resultEl = root.querySelector('#chatMatchMemberResult');
      resultEl.style.display = 'none';
      resultEl.textContent = '';
    });

    root.querySelector('#chatMatchMemberCheckBtn').addEventListener('click', () => {
      const resultEl = root.querySelector('#chatMatchMemberResult');
      const code = root.querySelector('#chatMatchMemberCode').value.trim();
      resultEl.style.display = '';
      if (!code) {
        resultEl.textContent = '회원주문 코드를 입력해주세요.';
        chatMatchedMemberId = null;
        return;
      }
      if (!/^\d{4}$/.test(code)) {
        resultEl.textContent = '회원주문 코드는 숫자 4자리로 입력해주세요.';
        chatMatchedMemberId = null;
        return;
      }
      const found = activeMembers.find(m => m.nicknameCode === code);
      if (!found) {
        resultEl.textContent = '일치하는 회원이 없습니다.';
        chatMatchedMemberId = null;
      } else {
        resultEl.innerHTML = chatMemberResultHTML(found);
        chatMatchedMemberId = found.id;
      }
    });

    root.querySelector('#chatMatchModalSubmitBtn').addEventListener('click', () => {
      const u = RETAIL_CHAT_UNMATCHED.find(x => x.id === id);
      if (!u) { closeChatMatchModal(); return; }

      const errorEl = root.querySelector('#chatMatchModalError');
      const member = RETAIL_MEMBERS.find(m => m.id === chatMatchedMemberId);

      const errors = [];
      if (!member) errors.push('회원주문 코드로 회원을 먼저 확인해주세요.');
      if (member && member.usageStatus === '이용제한') errors.push('이용제한 회원에게는 주문접수를 생성할 수 없습니다.');
      if (errors.length) {
        errorEl.hidden = false;
        errorEl.textContent = errors.join(' ');
        return;
      }

      // 상품·수량은 파싱값을 그대로 쓴다(이 모달은 회원 확인만 담당). 다만 파싱된 상품명이 현재 판매중이고
      // 노출 중인 채팅주문 허용 상품(retailActiveChatListing)과 하나라도 일치하지 않으면 접수 자체를 막는다 —
      // 카탈로그에 없는 상품명으로 임의 가격(0원 등)을 대체해 주문을 생성하지 않는다.
      const matchedListings = u.items.map(it => retailActiveChatListing(it.name));
      const unmatchedNames = u.items.filter((it, idx) => !matchedListings[idx]).map(it => it.name);
      if (unmatchedNames.length) {
        errors.push(`채팅주문상품명과 일치하지 않습니다: ${unmatchedNames.join(', ')}`);
      }
      // 카탈로그가 모두 일치하면 상품별(같은 상품은 수량 합산) 판매가능수량·1회 최대구매수량도 검증한다. 하나라도 걸리면 전체 차단.
      if (!unmatchedNames.length) {
        const qtyByName = {};
        u.items.forEach(it => { qtyByName[it.name] = (qtyByName[it.name] || 0) + it.qty; });
        const shortNames = [], overNames = [];
        Object.keys(qtyByName).forEach(name => {
          const listing = retailActiveChatListing(name);
          if (listing.availableQty < qtyByName[name]) shortNames.push(`${name} 현재 ${listing.availableQty}개`);
          else if (listing.maxQty && qtyByName[name] > listing.maxQty) overNames.push(`${name} 최대 ${listing.maxQty}개`);
        });
        if (shortNames.length) errors.push(`판매가능수량이 부족합니다: ${shortNames.join(', ')}`);
        if (overNames.length) errors.push(`1회 최대구매수량을 초과했습니다: ${overNames.join(', ')}`);
      }
      if (errors.length) {
        errorEl.hidden = false;
        errorEl.textContent = errors.join(' ');
        return;
      }

      // 같은 상품이 여러 번 나열되면 수량을 합쳐 1건으로 만들고, 상품마다 개별 주문(개별 주문번호)으로 생성한다.
      const mergedItems = [];
      u.items.forEach((it, idx) => {
        const exist = mergedItems.find(m => m.name === it.name);
        if (exist) exist.qty += it.qty;
        else mergedItems.push({ name: it.name, qty: it.qty, listing: matchedListings[idx] });
      });
      mergedItems.forEach(it => {
        const price = it.listing.salePrice || it.listing.listPrice;
        const orderNo = `RO${RETAIL_MOCK_TODAY.replace(/-/g, '')}${String(retailChatUnmatchedSeq).padStart(3, '0')}`;
        retailChatUnmatchedSeq++;
        const newOrder = {
          orderNo, memberId: member.id, buyerPhone: member.phone, buyerChatNick: member.chatNickname || '', buyerName: member.name,
          items: [{ listingId: it.listing.id, name: it.name, qty: it.qty, price, pickupStartDate: it.listing.pickupStartDate, pickupEndDate: it.listing.pickupEndDate }], grandTotal: price * it.qty,
          salesMethod: 'pickup', orderChannel: 'chat', paymentMethod: 'onsite',
          paymentStatus: '결제대기', processStatus: '주문접수', cancelReturnStatus: null, paidAt: null,
          pickupStartDate: it.listing.pickupStartDate, pickupEndDate: it.listing.pickupEndDate,
          createdAt: mockNowStamp(), // 주문일시는 매칭 적용(주문접수 건 생성) 시각으로 기록한다.
        };
        RETAIL_ORDER_LIST.push(newOrder);
        // 판매가능수량 차감 — 주문접수 건이 생성되는 즉시(채팅주문은 매칭 적용 시점) 차감한다.
        deductRetailAvailableQty(newOrder);
      });

      // 매칭 완료 건은 상태 표시 없이 큐에서 완전히 삭제한다 — 결과는 주문목록에서 확인한다.
      const idx = RETAIL_CHAT_UNMATCHED.findIndex(x => x.id === id);
      if (idx !== -1) RETAIL_CHAT_UNMATCHED.splice(idx, 1);
      closeChatMatchModal();
      renderChatOrderSettingsPage();
    });
  }

  // ==================================================================
  // 소매관리 > 소매매출조회 · 도매관리 > 도매매출조회
  // ==================================================================

  // 기간 필터 — 오늘/이번주/이번달/기간(직접 선택) 4가지만 제공한다(개월수 프리셋 없음).
  const SALES_PERIOD_DEFS = [
    { id: 'today', label: '오늘' },
    { id: 'week', label: '이번주' },
    { id: 'month', label: '이번달' },
    { id: 'custom', label: '기간' },
  ];

  // 반환값은 주문 createdAt의 'YY.MM.DD' prefix(orderDatePart)와 직접 비교 가능한 문자열 범위다.
  // 앱 전체가 공유하는 목업 기준일(RETAIL_MOCK_TODAY)을 "오늘"로 삼는다.
  function salesPeriodRange(period, customFrom, customTo) {
    const today = new Date(RETAIL_MOCK_TODAY);
    const toDateStr = d => d.toISOString().slice(2, 10).replace(/-/g, '.');
    if (period === 'today') {
      const t = toDateStr(today);
      return { from: t, to: t };
    }
    if (period === 'week') {
      const day = today.getUTCDay(); // 0(일)~6(토)
      const mondayOffset = day === 0 ? 6 : day - 1;
      const monday = new Date(today); monday.setUTCDate(today.getUTCDate() - mondayOffset);
      const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() + 6);
      return { from: toDateStr(monday), to: toDateStr(sunday) };
    }
    if (period === 'month') {
      const first = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
      const last = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth() + 1, 0));
      return { from: toDateStr(first), to: toDateStr(last) };
    }
    return {
      from: customFrom ? inputDateToOrderDate(customFrom) : '',
      to: customTo ? inputDateToOrderDate(customTo) : '',
    };
  }

  // 매출조회(소매/도매)·매입지출(소매) 공통 집계.
  // - 결제총액: 결제완료 일시(paidAt)가 기간 내인 주문의 실제 결제금액(grandTotal) 합계 — 배송비·배달비·구매자부담
  //   카드수수료가 모두 포함된 금액이다. 결제대기 상태로 종료된 주문은 paidAt이 없어 집계되지 않는다.
  // - 취소·환불액: 상태가 취소승인·반품승인이고 취소·반품 승인 일시(cancelReturnResolvedAt)가 기간 내인 주문의 총환불금액 합계.
  // - 매출액: 결제총액 − 취소·환불액. 결제월과 취소월이 다르면 기간에 따라 음수가 될 수 있다.
  function stampDatePart(stamp) { return stamp ? stamp.slice(0, 8) : ''; }
  function salesAggregate(orders, from, to) {
    orders = orders.filter(o => !o.demo);
    const inRange = d => d && d >= from && d <= to;
    const paid = orders.filter(o => o.paidAt && inRange(stampDatePart(o.paidAt)));
    const refunded = orders.filter(o => (o.cancelReturnStatus === '취소승인' || o.cancelReturnStatus === '반품승인')
      && o.totalRefundAmount > 0 && inRange(stampDatePart(o.cancelReturnResolvedAt)));
    const received = orders.filter(o => o.createdAt && inRange(stampDatePart(o.createdAt)));
    const paidTotal = paid.reduce((sum, o) => sum + o.grandTotal, 0);
    const refundTotal = refunded.reduce((sum, o) => sum + o.totalRefundAmount, 0);
    return { orderCount: received.length, paidCount: paid.length, paidTotal, refundCount: refunded.length, refundTotal, sales: paidTotal - refundTotal };
  }

  // 매출 추이용 집계 — 기본 집계에 결제수단별(카드 / 현장결제·계좌이체) 주문건수·결제액을 더한다. 소매·도매·통합매출조회 추이 표가 공유한다.
  function salesTrendAggregate(orders, from, to) {
    orders = orders.filter(o => !o.demo);
    const base = salesAggregate(orders, from, to);
    const card = salesAggregate(orders.filter(o => o.paymentMethod === 'card'), from, to);
    const other = salesAggregate(orders.filter(o => o.paymentMethod !== 'card'), from, to);
    return { ...base, cardCount: card.orderCount, cardTotal: card.paidTotal, otherCount: other.orderCount, otherTotal: other.paidTotal };
  }

  // 매출 추이 — 매출 추이 표는 페이지당 10건을 노출한다(목록 공통 20건과 별개).
  const SALES_TREND_PAGE_SIZE = 10;       // 매출 추이 표 페이지당 노출 건수
  const SALES_MAX_MONTHS = 6;             // 매출 조회 기간 최대 개월 수(시작일 기준)

  function salesYmdToDate(str) {
    const [yy, mm, dd] = str.split('.').map(Number);
    return new Date(Date.UTC(2000 + yy, mm - 1, dd));
  }
  function salesDateToYmd(d) { return d.toISOString().slice(2, 10).replace(/-/g, '.'); }

  // 매출 추이는 상단 기간 필터 범위를 그대로 따른다. 일별은 범위 내 일자별, 월별은 범위 내 월별(첫 달·마지막 달은 범위 내 일자만 집계)이며
  // 목업 기준일 이후의 미래 일자는 제외한다.
  function salesTrendPoints(aggregateFn, orders, mode, range) {
    const points = [];
    if (!range || !range.from || !range.to) return points;
    const today = new Date(RETAIL_MOCK_TODAY);
    const start = salesYmdToDate(range.from);
    const end = salesYmdToDate(range.to);
    const last = end < today ? end : today;
    if (start > last) return points;
    if (mode === 'monthly') {
      let cur = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1));
      while (cur <= last) {
        const monthEnd = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + 1, 0));
        const from = cur < start ? start : cur;
        const to = monthEnd > end ? end : monthEnd;
        const agg = aggregateFn(orders, salesDateToYmd(from), salesDateToYmd(to));
        const label = salesDateToYmd(cur).slice(0, 5);
        points.push({ label, dateLabel: label, ...agg });
        cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + 1, 1));
      }
    } else {
      for (let d = new Date(start); d <= last; d.setUTCDate(d.getUTCDate() + 1)) {
        const ds = salesDateToYmd(d);
        points.push({ label: ds.slice(3), dateLabel: ds, ...aggregateFn(orders, ds, ds) });
      }
    }
    return points;
  }

  // 직접 선택 기간의 종료일 상한 — 시작일 + 6개월 이내.
  function salesMaxToInput(fromInput) {
    if (!fromInput) return '';
    const [y, m, d] = fromInput.split('-').map(Number);
    const base = new Date(Date.UTC(y, m - 1 + SALES_MAX_MONTHS, 1));
    const dim = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + 1, 0)).getUTCDate();
    const target = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), Math.min(d, dim)));
    return target.toISOString().slice(0, 10);
  }
  function salesClampTo(from, to) {
    if (!from || !to) return to;
    return (to < from || to > salesMaxToInput(from)) ? '' : to;
  }
  function salesCustomRangeHTML(idPrefix, from, to) {
    const max = salesMaxToInput(from);
    return `
      <span style="display:flex; align-items:center; gap:6px; margin-left:4px; flex-wrap:wrap;">
        <input class="filter-select" type="date" id="${idPrefix}DateFrom" value="${from}">
        <span style="color:var(--text-secondary);">~</span>
        <input class="filter-select" type="date" id="${idPrefix}DateTo" value="${to}" ${from ? `min="${from}" max="${max}"` : ''}>
        <span class="field-hint">매출 조회 기간은 최대 6개월까지 선택할 수 있습니다.</span>
      </span>`;
  }

  // 외부 차트 라이브러리 없이 매출액 기준 간단한 막대그래프를 그린다(레이블은 양끝만 표기해 겹침을 피한다).
  function salesTrendChartSVG(points) {
    // 날짜 라벨은 SVG 밖(일반 HTML)에 별도로 그린다 — width:100%(preserveAspectRatio="none")로
    // viewBox 좌표계가 가로로만 비균일하게 늘어나면 SVG <text>도 같이 가로로 늘어나 글자가
    // 찌부러져 보이므로, 텍스트는 스케일이 걸리지 않는 일반 HTML 요소로 분리한다.
    const w = 720, h = 140, padTop = 10, padBottom = 6, gap = 4;
    const maxVal = Math.max(1, ...points.map(p => Math.max(0, p.sales)));
    const barW = points.length ? (w - gap * (points.length + 1)) / points.length : 0;
    const bars = points.map((p, i) => {
      const val = Math.max(0, p.sales);
      const barH = Math.round((val / maxVal) * (h - padTop - padBottom));
      const x = gap + i * (barW + gap);
      const y = h - padBottom - barH;
      return `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${barH}" rx="2" fill="var(--key)"></rect>`;
    }).join('');
    const firstLabel = points.length ? escapeHtml(points[0].label) : '';
    const lastLabel = points.length ? escapeHtml(points[points.length - 1].label) : '';
    return `
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible; display:block;">
        ${bars}
      </svg>

  // 매출 추이 차트 + 상세 표(페이지네이션 포함). 표는 최신순으로 보여주되 차트는 시간순(왼쪽이 과거)을 유지한다.
  function salesTrendSectionHTML(idPrefix, points, page) {
    const totalPages = Math.max(1, Math.ceil(points.length / SALES_TREND_PAGE_SIZE));
    const curPage = Math.min(Math.max(1, page), totalPages);
    const startIdx = (curPage - 1) * SALES_TREND_PAGE_SIZE;
    const pageRows = points.slice().reverse().slice(startIdx, startIdx + SALES_TREND_PAGE_SIZE);
    const tableRows = pageRows.map(p => `
      <tr>
        <td>${escapeHtml(p.dateLabel)}</td><td class="num fs-key-col">${p.orderCount}건</td><td class="num fs-key-col">${p.paidTotal.toLocaleString()}원</td>
        <td class="num">${p.cardCount}건</td><td class="num">${p.cardTotal.toLocaleString()}원</td>
        <td class="num">${p.otherCount}건</td><td class="num">${p.otherTotal.toLocaleString()}원</td>
        <td class="num">${p.refundCount}건</td><td class="num">${p.refundTotal.toLocaleString()}원</td><td class="num fs-key-col">${p.sales.toLocaleString()}원</td>
      </tr>`).join('');
    const winStart = Math.max(1, Math.min(curPage - 2, totalPages - 4));
    const winEnd = Math.min(totalPages, winStart + 4);
    const pagesHTML = Array.from({ length: winEnd - winStart + 1 }, (_, i) => winStart + i).map(n => `
      <span class="${n === curPage ? 'current' : ''}" data-${idPrefix}-trend-page="${n}">${n}</span>`).join('');

    return `
      <div style="margin:16px 0;">${salesTrendChartSVG(points)}</div>
      <div class="field-hint" style="margin-bottom:8px;">주문건수는 주문접수일, 결제액은 결제완료일, 취소·환불은 승인일 기준으로 집계합니다.</div>
      <div class="table-wrap">
        <table class="tpl-table tpl-sticky-first">
          <thead><tr><th class="c-s">기간</th><th class="c-s fs-key-col">총주문건수</th><th class="c-l fs-key-col">총결제액</th><th class="c-s">카드결제 주문건수</th><th class="c-l">카드결제액</th><th class="c-m">현장결제·계좌이체 주문건수</th><th class="c-l">현장결제·계좌이체 결제액</th><th class="c-s">취소환불건수</th><th class="c-l">취소환불액</th><th class="c-l fs-key-col">매출액</th></tr></thead>
          <tbody>${tableRows || `<tr><td colspan="10" style="text-align:center; color:var(--text-secondary); padding:32px 0;">데이터가 없습니다.</td></tr>`}</tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="${curPage <= 1 ? 'disabled' : ''}" data-${idPrefix}-trend-page="${Math.max(1, curPage - 1)}">◀</span>
        ${pagesHTML}
        <span class="${curPage >= totalPages ? 'disabled' : ''}" data-${idPrefix}-trend-page="${Math.min(totalPages, curPage + 1)}">▶</span>

  // 파일 저장 — 게시된 목업에서는 뷰어의 downloads 기능으로 저장 확인 창을 띄우고, 로컬 파일로 열었을 때만 브라우저 다운로드로 대체한다.
  async function saveSalesFile(filename, data) {
    const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : undefined;
    if (downloads) {
      try { await downloads.save({ filename, data }); } catch (e) { /* 뷰어가 저장을 취소한 경우 등 — 별도 처리 없음 */ }
      return;
    }
    if (downloads === null) return;
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    } catch (e) { /* 다운로드를 지원하지 않는 환경 */ }
  }

  // 매출조회 엑셀 다운로드 — 현재 화면의 조회 기간 기준 매출 요약(결제총액/취소·환불액/매출액)과 현재 선택된 매출 추이
  // (일별/월별) 표 전체를 엑셀에서 열 수 있는 CSV(UTF-8 BOM)로 내려받는다. 목업에서는 브라우저 다운로드로 재현한다.
  function downloadSalesExcel(kind) {
    const isRetail = kind === 'retail';
    const title = isRetail ? '소매매출조회' : '도매매출조회';
    const orders = isRetail ? RETAIL_ORDER_LIST : myOrders();
    const range = isRetail
      ? salesPeriodRange(retailSalesPeriod, retailSalesDateFrom, retailSalesDateTo)
      : salesPeriodRange(wholesaleSalesPeriod, wholesaleSalesDateFrom, wholesaleSalesDateTo);
    const mode = isRetail ? retailSalesTrendMode : wholesaleSalesTrendMode;
    const agg = salesAggregate(orders, range.from, range.to);
    const points = salesTrendPoints(salesTrendAggregate, orders, mode, range).slice().reverse();
    const rows = [
      [title],
      ['조회기간', `${range.from || '-'} ~ ${range.to || '-'}`],
      [],
      ['결제총액', '취소·환불액', '매출액'],
      [agg.paidTotal, agg.refundTotal, agg.sales],
      [],
      [`매출 추이(${mode === 'monthly' ? '월별' : '일별'})`],
      ['기간', '총주문건수', '총결제액', '카드결제 주문건수', '카드결제액', '현장결제·계좌이체 주문건수', '현장결제·계좌이체 결제액', '취소환불건수', '취소환불액', '매출액'],
      ...points.map(pt => [pt.dateLabel, pt.orderCount, pt.paidTotal, pt.cardCount, pt.cardTotal, pt.otherCount, pt.otherTotal, pt.refundCount, pt.refundTotal, pt.sales]),
    ];
    const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const filename = `${title}_${(range.from || '').replace(/\./g, '')}-${(range.to || '').replace(/\./g, '')}.csv`;
    saveSalesFile(filename, csv);
    return csv;
  }

  function catCount(cat) {

    const isEditing = categoryEditTarget && categoryEditTarget.level === 'primary' && categoryEditTarget.id === cat.id;

    if (isEditing) {
      return `
        <div class="cat-card editing">
          <span class="cat-drag">⠿</span>
          <div class="cat-card-body">
            <input class="cat-edit-input" type="text" value="${escapeHtml(cat.name)}" data-edit-input="primary:${cat.id}">
          </div>
          <div class="cat-card-actions">
            <button type="button" data-save-primary="${cat.id}">저장</button>
            <button type="button" data-cancel-edit="1">취소</button>
          </div>
        </div>`;
    }
    return `
      <div class="cat-card ${cat.id === categorySelectedId ? 'selected' : ''}" data-cat-id="${cat.id}" draggable="true">
        <span class="cat-drag" title="드래그로 순서 변경">⠿</span>
        <div class="cat-card-body">
          <div class="cat-name">${escapeHtml(cat.name)}</div>
          <div class="cat-count">연동상품 ${count}</div>
        </div>
        <div class="cat-card-actions">
          <button type="button" data-edit-primary-btn="${cat.id}">수정</button>
          <button type="button"
            ${disabledDelete ? 'disabled title="연동상품이 있어 삭제할 수 없습니다"' : `data-delete-primary="${cat.id}"`}>삭제</button>
        </div>
      </div>`;
  }

  function secondaryRowHTML(sub, parentId) {
    const subCount = catSubCount(parentId, sub.id);
    const disabledDelete = subCount > 0;
    const isEditing = categoryEditTarget && categoryEditTarget.level === 'secondary' && categoryEditTarget.id === sub.id && categoryEditTarget.parentId === parentId;

    if (isEditing) {
      return `
        <div class="cat-card editing">
          <span class="cat-drag">⠿</span>
          <div class="cat-card-body">
            <input class="cat-edit-input" type="text" value="${escapeHtml(sub.name)}" data-edit-input="secondary:${parentId}::${sub.id}">
          </div>
          <div class="cat-card-actions">
            <button type="button" data-save-secondary="${parentId}::${sub.id}">저장</button>
            <button type="button" data-cancel-edit="1">취소</button>
          </div>
        </div>`;
    }
    return `
      <div class="cat-card" data-sub-id="${sub.id}" data-parent-id="${parentId}" draggable="true">
        <span class="cat-drag" title="드래그로 순서 변경">⠿</span>
        <div class="cat-card-body">
          <div class="cat-name">${escapeHtml(sub.name)}</div>
          <div class="cat-count">연동상품 ${subCount}</div>
        </div>
        <div class="cat-card-actions">
          <button type="button" data-edit-secondary-btn="${parentId}::${sub.id}">수정</button>
          <button type="button"
            ${disabledDelete ? 'disabled title="연동상품이 있어 삭제할 수 없습니다"' : `data-delete-secondary="${parentId}::${sub.id}"`}>삭제</button>
        </div>
      </div>`;

  function addDraftRowHTML(level) {
    return `
      <div class="cat-card editing">
        <span class="cat-drag" style="visibility:${level === 'primary' ? 'visible' : 'hidden'};">⠿</span>
        <div class="cat-card-body">
          <input class="cat-edit-input" type="text" placeholder="카테고리명 입력" data-new-input="${level}">
        </div>
        <div class="cat-card-actions">
          <button type="button" data-save-new="${level}">저장</button>
          <button type="button" data-cancel-add="1">취소</button>
        </div>
      </div>`;
  }

  function wholesaleCategoryHTML() {
    const selected = RETAIL_CATEGORY_TREE.find(c => c.id === categorySelectedId) || RETAIL_CATEGORY_TREE[0] || null;

    const primaryRows =
      (categoryAdding === 'primary' ? addDraftRowHTML('primary') : '') +
      RETAIL_CATEGORY_TREE.map(primaryRowHTML).join('');

    const secondaryList = selected
      ? (categoryAdding === 'secondary' ? addDraftRowHTML('secondary') : '') +
        selected.children.map(sub => secondaryRowHTML(sub, selected.id)).join('')
      : '';
    const secondaryRows = secondaryList || `<div class="placeholder" style="min-height:120px;">${selected ? '등록된 2차 카테고리가 없습니다.' : '1차 카테고리를 먼저 등록해주세요.'}</div>`;

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>상품카테고리</h2>
          </div>
          <div class="grid12" style="gap:16px;">
            <div class="col-6 card" style="box-shadow:none; border:1px solid var(--border);">
              <div class="cat-panel-head">
                <span class="cat-panel-title">1차 카테고리</span>
                <button class="btn-primary" type="button" data-add-btn="primary">+ 추가</button>
              </div>
              <div class="cat-list" id="catPrimaryList">${primaryRows}</div>
            </div>
            <div class="col-6 card" style="box-shadow:none; border:1px solid var(--border);">
              <div class="cat-panel-head">
                <span class="cat-panel-title">2차 카테고리</span>
                <button class="btn-primary" type="button" data-add-btn="secondary" ${selected ? '' : 'disabled'}>+ 추가</button>
              </div>
              <div class="cat-list" id="catSecondaryList">${secondaryRows}</div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function renderWholesaleCategoryPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = wholesaleCategoryHTML();

    // 1차 카드 드래그 정렬 (메인상품진열과 동일하게 dragover 시 즉시 순서 반영)
    const primaryList = wrapper.querySelector('#catPrimaryList');
    let dragCatId = null;
    if (primaryList) {
      primaryList.querySelectorAll('.cat-card[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', () => { dragCatId = card.dataset.catId; card.classList.add('dragging'); });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!dragCatId || dragCatId === card.dataset.catId) return;
          const fromIdx = RETAIL_CATEGORY_TREE.findIndex(c => c.id === dragCatId);
          const toIdx = RETAIL_CATEGORY_TREE.findIndex(c => c.id === card.dataset.catId);
          if (fromIdx === -1 || toIdx === -1) return;
          const [moved] = RETAIL_CATEGORY_TREE.splice(fromIdx, 1);
          RETAIL_CATEGORY_TREE.splice(toIdx, 0, moved);
          renderWholesaleCategoryPage();
        });
      });
    }

    // 2차 카드 드래그 정렬 (동일 방식)
    const secondaryList = wrapper.querySelector('#catSecondaryList');
    let dragSubId = null;
    if (secondaryList) {
      secondaryList.querySelectorAll('.cat-card[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', () => { dragSubId = card.dataset.subId; card.classList.add('dragging'); });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!dragSubId || dragSubId === card.dataset.subId) return;
          const parentId = card.dataset.parentId;
          const parent = RETAIL_CATEGORY_TREE.find(c => c.id === parentId);
          if (!parent) return;
          const fromIdx = parent.children.findIndex(s => s.id === dragSubId);
          const toIdx = parent.children.findIndex(s => s.id === card.dataset.subId);
          if (fromIdx === -1 || toIdx === -1) return;
          const [moved] = parent.children.splice(fromIdx, 1);
          parent.children.splice(toIdx, 0, moved);
          renderWholesaleCategoryPage();
        });
      });
    }
  }

  function handleCategoryClick(e) {
    if (currentItem !== 'wholesale-product-category') return;
    const wrapper = e.currentTarget;

    const addBtn = e.target.closest('[data-add-btn]');
    if (addBtn) {
      categoryEditTarget = null;
      categoryAdding = addBtn.dataset.addBtn;
      renderWholesaleCategoryPage();
      return;
    }

    const cancelAdd = e.target.closest('[data-cancel-add]');
    if (cancelAdd) {
      categoryAdding = null;
      renderWholesaleCategoryPage();
      return;
    }

    const saveNew = e.target.closest('[data-save-new]');
    if (saveNew) {
      const level = saveNew.dataset.saveNew;
      const input = wrapper.querySelector(`[data-new-input="${level}"]`);
      const name = (input && input.value || '').trim();
      if (!name) { return; }
      if (level === 'primary') {
        const id = `cat-${categoryIdSeq++}`;
        RETAIL_CATEGORY_TREE.push({ id, name, children: [] });
        categorySelectedId = id;
      } else {
        const parent = RETAIL_CATEGORY_TREE.find(c => c.id === categorySelectedId);
        if (parent) parent.children.push({ id: `sub-${categoryIdSeq++}`, name });
      }
      categoryAdding = null;
      renderWholesaleCategoryPage();
      return;
    }

    const editPrimaryBtn = e.target.closest('[data-edit-primary-btn]');
    if (editPrimaryBtn) {
      categoryAdding = null;
      categoryEditTarget = { level: 'primary', id: editPrimaryBtn.dataset.editPrimaryBtn };
      renderWholesaleCategoryPage();
      return;
    }

    const editSecondaryBtn = e.target.closest('[data-edit-secondary-btn]');
    if (editSecondaryBtn) {
      const [parentId, subId] = editSecondaryBtn.dataset.editSecondaryBtn.split('::');
      categoryAdding = null;
      categoryEditTarget = { level: 'secondary', id: subId, parentId };
      renderWholesaleCategoryPage();
      return;
    }

    const cancelEdit = e.target.closest('[data-cancel-edit]');
    if (cancelEdit) {
      categoryEditTarget = null;
      renderWholesaleCategoryPage();
      return;
    }

    const savePrimary = e.target.closest('[data-save-primary]');
    if (savePrimary) {
      const id = savePrimary.dataset.savePrimary;
      const input = wrapper.querySelector(`[data-edit-input="primary:${id}"]`);
      const name = (input && input.value || '').trim();
      const cat = RETAIL_CATEGORY_TREE.find(c => c.id === id);
      if (cat && name) cat.name = name;
      categoryEditTarget = null;
      renderWholesaleCategoryPage();
      return;
    }

    const saveSecondary = e.target.closest('[data-save-secondary]');
    if (saveSecondary) {
      const [parentId, subId] = saveSecondary.dataset.saveSecondary.split('::');
      const input = wrapper.querySelector(`[data-edit-input="secondary:${parentId}::${subId}"]`);
      const name = (input && input.value || '').trim();
      const parent = RETAIL_CATEGORY_TREE.find(c => c.id === parentId);
      const sub = parent && parent.children.find(s => s.id === subId);
      if (sub && name) sub.name = name;
      categoryEditTarget = null;
      renderWholesaleCategoryPage();
      return;
    }

    const deletePrimaryBtn = e.target.closest('[data-delete-primary]');
    if (deletePrimaryBtn) {
      const id = deletePrimaryBtn.dataset.deletePrimary;
      const cat = RETAIL_CATEGORY_TREE.find(c => c.id === id);
      openDeleteConfirm('category', { note: cat && cat.children.length ? '하위 2차 카테고리도 함께 삭제됩니다.' : '' }, () => {
        const idx = RETAIL_CATEGORY_TREE.findIndex(c => c.id === id);
        if (idx !== -1) RETAIL_CATEGORY_TREE.splice(idx, 1);
        if (categorySelectedId === id) {
          categorySelectedId = (RETAIL_CATEGORY_TREE[0] && RETAIL_CATEGORY_TREE[0].id) || null;
        }
        renderWholesaleCategoryPage();
      });
      return;
    }

    const deleteSecondaryBtn = e.target.closest('[data-delete-secondary]');
    if (deleteSecondaryBtn) {
      const [parentId, subId] = deleteSecondaryBtn.dataset.deleteSecondary.split('::');
      openDeleteConfirm('category', {}, () => {
        const parent = RETAIL_CATEGORY_TREE.find(c => c.id === parentId);
        if (parent) {
          const idx = parent.children.findIndex(s => s.id === subId);
          if (idx !== -1) parent.children.splice(idx, 1);
        }
        renderWholesaleCategoryPage();
      });
      return;
    }

    const card = e.target.closest('.cat-card[data-cat-id]');
    if (card && !e.target.closest('button') && !e.target.closest('input')) {
      categorySelectedId = card.dataset.catId;
      categoryEditTarget = null;
      categoryAdding = null;
      renderWholesaleCategoryPage();
    }
  }

  // 결제상태 셀 — 결제취소 건은 상태 태그 아래에 환불 구분(전체환불/부분환불)을 보조 텍스트로 표시한다.
  // 결제대기 상태에서 취소된 건은 환불이 없어(refundType 없음) 보조 텍스트를 표시하지 않는다.
  function paymentStatusHTML(o) {
    const sub = o.paymentStatus === '결제취소' && o.refundType
      ? `<span class="tag refund-sub-text">${o.refundType === 'full' ? '전체환불' : '부분환불'}</span>` : '';
    return sub ? `<div class="status-stack">${statusTag(o.paymentStatus)}${sub}</div>` : statusTag(o.paymentStatus);
  }
  function statusTag(v) {
    const map = {
      '픽업대기': 'tag-key', '배달중': 'tag-key', '결제대기': 'tag-warning',
      '픽업완료': 'tag-success', '배달완료': 'tag-success', '정상': 'tag-success', '경고': 'tag-error',
      '판매중': 'tag-success', '품절': 'tag-error',
      '결제대기': 'tag-warning', '결제완료': 'tag-success', '결제취소': 'tag-error',
      '주문접수': 'tag-key', '배송대기': 'tag-warning', '배송중': 'tag-key', '배송확정': 'tag-success',
      '자동결제 실패': 'tag-error', '결제 대기': 'tag-warning', '결제실패': 'tag-error',
      '이용대기': 'tag-key', '이용승인': 'tag-success', '이용제한': 'tag-warning', '이용불가': 'tag-error',
      '수기완납': 'tag-key', '노쇼후보': 'tag-warning',
      '상품매칭실패': 'tag-error', '회원매칭실패': 'tag-error', '상품·회원매칭실패': 'tag-error',
      '매칭대기': 'tag-warning', '매칭완료': 'tag-success',
    };
    return `<span class="tag ${map[v] || 'tag-key'}">${v}</span>`;
  }

  function exposureTag(visible) {
    return visible
      ? `<span class="tag tag-key">노출</span>`
      : `<span class="tag" style="background:var(--bg); color:var(--text-secondary);">미노출</span>`;
  }

  // 소매정보여부 — 내도매상품에 소매정보가 등록되었는지, 등록되었다면 소매몰 노출 여부까지 별도 뱃지로 세로 배치해 표시한다.
  // ([등록][노출] / [등록][미노출] / [미등록])
  // 도매상품 1건의 소매정보가 현재 소매몰에 실제로 노출 중인지(노출 실효값 기준).
  function productRetailExposedNow(p) {
    const listing = findRetailListing('own', p.code);
    return !!listing && retailEffectiveExposed(listing);
  }

  function retailInfoStatusHTML(p) {
    const listing = findRetailListing('own', p.code);
    if (!listing) return `<div class="status-stack"><span class="tag" style="background:var(--bg); color:var(--text-secondary);">미등록</span></div>`;
    return `<div class="status-stack"><span class="tag tag-success">등록</span>${exposureTag(retailEffectiveExposed(listing))}</div>`;
  }

  // ---- Render ----
  let currentCat = 'dashboard';
  let currentItem = 'ops';
  const openGroups = new Set();

  function findActiveChain(cat) {
    for (const item of NAV[cat].items) {
      if (item.children) {
        for (const c of item.children) if (c.id === currentItem) return item.id;
      }
    }
    return null;
  }

  function renderToggle() {
    const el = document.getElementById('toggle');
    el.innerHTML = Object.entries(NAV).filter(([key, v]) => !v.hiddenFromToggle && navCatAllowed(key)).map(([key, v]) =>
      `<button class="toggle-btn ${key === currentCat ? 'active' : ''}" data-cat="${key}">${v.label}</button>`
    ).join('');
    el.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCat = btn.dataset.cat;
        const firstItem = NAV[currentCat].items.find(i => i.active) || NAV[currentCat].items[0];
        currentItem = firstItem.children ? firstItem.children[0].id : firstItem.id;
        openGroups.clear();
        renderAll();
      });
    });
  }

  function renderMenu() {
    document.getElementById('groupTitle').textContent = NAV[currentCat].groupTitle;
    const el = document.getElementById('menu');
    el.innerHTML = NAV[currentCat].items.filter(item => item.type === 'divider' ? canSupply() : navItemAllowed(currentCat, item.id)).map(item => {
      if (item.type === 'divider') {
        return `<div class="menu-divider"></div>`;
      }
      if (item.children) {
        const isOpen = openGroups.has(item.id) || findActiveChain(currentCat) === item.id;
        const subItems = item.children.map(c => `
          <button class="menu-item ${c.id === currentItem ? 'active' : ''}" data-id="${c.id}">${c.label}</button>
        `).join('');
        return `
          <div class="menu-group ${isOpen ? 'open' : ''}" data-group="${item.id}">
            <button class="menu-item" data-toggle="${item.id}">
              <span>${item.label}</span><span class="chev">▸</span>
            </button>
            <div class="submenu">${subItems}</div>
          </div>`;
      }
      const cls = [item.id === currentItem ? 'active' : '', item.featured ? 'menu-item-featured' : ''].filter(Boolean).join(' ');
      return `<button class="menu-item ${cls}" data-id="${item.id}">${item.label}</button>`;
    }).join('');

    el.querySelectorAll('[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.id;
        renderAll();
        closeNavOnMobile();
      });
    });
    el.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
        renderMenu();
      });
    });
  }

  // LNB 메뉴에는 없지만 버튼 등으로 진입하는 개별 페이지의 제목
  const PAGE_TITLES = {
    'wholesale-product-register': '도매상품등록',
    'wholesale-product-detail': '도매상품 상세',
    'wholesale-product-edit': '도매상품 수정',
    'wholesale-market-detail': '도매상품 상세',
    'wholesale-cart': '장바구니',
    'wholesale-order-create': '주문서 작성',
    'wholesale-order-detail': '주문 상세',
    'wholesale-retail-listing-detail': '소매정보 상세',
    'wholesale-retail-listing-edit': '소매정보 등록·수정',
    'retail-product-register': '소매상품등록',
    'wholesale-product-convert': '도매상품전환',
    'franchise-notice-form': '공지사항 등록·수정',
    'franchise-notice-detail': '공지사항 상세',
    'notice-detail': '공지사항',
  };

  function currentLabel() {
    if (PAGE_TITLES[currentItem]) return PAGE_TITLES[currentItem];
    for (const item of NAV[currentCat].items) {
      if (item.id === currentItem) return item.label;
      if (item.children) {
        const c = item.children.find(c => c.id === currentItem);
        if (c) return c.label;
      }
    }

  function renderTopbar() {
    // 헤더 타이틀은 대시보드/소매관리/도매관리/가맹점관리/시스템관리 등 상위 대메뉴명으로 고정한다.
    // 개별 하위 메뉴명(예: 상품관리, 도매 상품 목록)은 각 화면 상단(card-head h2)에서 별도로 노출되므로
    // 헤더에서 하위 메뉴 클릭마다 바뀌지 않는다.
    document.getElementById('pageTitle').textContent = NAV[currentCat].label;
    document.getElementById('sysManageBtn').classList.toggle('active', currentCat === 'system');
    // 상단 공통 영역(GNB)의 계정정보는 화면 전환과 무관하게 항상 노출한다 — 회원유형 배지 / 상호명 / 아이디 순.
    document.getElementById('topbarRoleBadge').textContent = MEMBER_ACCOUNT.accountType;
    document.getElementById('topbarAccountName').textContent = MEMBER_BUSINESS.companyName;
    document.getElementById('topbarAccountId').textContent = MEMBER_ACCOUNT.loginId;
    const restricted = restrictedNow();
    document.getElementById('restrictBanner').hidden = !restricted;
    document.body.classList.toggle('has-restrict-banner', restricted);
  }

  // 표 템플릿 — 컬럼 폭 클래스 합계로 표 최소 폭을 지정한다(고정 레이아웃에서 컬럼이 좁아지지 않고 .table-wrap 안에서 가로 스크롤).
  const TPL_COL_W = { 'col-check': 40, 'c-img': 64, 'c-s': 96, 'c-m': 128, 'c-l': 152, 'c-flex': 160, 'col-actions': 120 };
  function applyTableTemplates() {
    document.querySelectorAll('table.tpl-table').forEach(t => {
      let sum = 0;
      t.querySelectorAll('thead th').forEach(th => {
        const k = Object.keys(TPL_COL_W).find(c => th.classList.contains(c));
        sum += k ? TPL_COL_W[k] : 96;
      });
      const v = sum + 'px';
      if (t.style.minWidth !== v) t.style.minWidth = v;
    });
  }
  const TPL_BADGE_HEADS = ['이용상태', '처리상태', '노출여부', '납부상태', '작성자', '발송채널'];
  const TPL_PRICE_HEADS = ['공급가/단위', '구매가'];
  function applyTableCards() {
    document.querySelectorAll('table.tpl-table:not(.tpl-sticky-first)').forEach(t => {
      const ths = [...t.querySelectorAll('thead th')];
      if (!ths.length) return;
      const labelOf = th => {
        const sub = th.querySelector('.th-sub');
        return sub ? th.firstChild.textContent.trim() + '\n' + sub.textContent.trim() : th.textContent.trim();
      };
      const isLine = t.classList.contains('tpl-line'), isCart = t.classList.contains('cart-table');
      const headName = t.dataset.cardHead, belowName = t.dataset.cardBelow, inlineName = t.dataset.cardInline, noLabels = (t.dataset.cardNolabel || '').split(',');
      t.querySelectorAll('tbody tr').forEach(tr => {
        if (tr.dataset.cardDone === String(ths.length)) return;
        const tds = [...tr.children];
        if (tds.length === 1 && tds[0].colSpan > 1) { tds[0].classList.add('tc-empty'); tr.dataset.cardDone = String(ths.length); return; }
        tds.forEach((td, i) => {
          const th = ths[i]; if (!th) return;
          const name = th.textContent.trim();
          const label = labelOf(th);
          if (label) td.setAttribute('data-label', label);
          const c = th.classList;
          let cls = null, nolabel = true;
          if (c.contains('col-check')) cls = 'tc-check';
          else if (c.contains('c-img')) cls = 'tc-img';
          else if (c.contains('col-actions')) cls = 'tc-actions';
          else if (name === '순위' || name === '선택') cls = name === '선택' ? 'tc-check' : 'tc-lead';
          else if (name === '번호' && t.classList.contains('tpl-hide-no')) cls = 'tc-hide';
          else if (TPL_BADGE_HEADS.includes(name)) cls = 'tc-badge';
          else if (inlineName && name === inlineName) cls = 'tc-badge';
          else if (headName ? name === headName : c.contains('c-flex')) cls = 'tc-head';
          else if (belowName && name === belowName) cls = 'tc-price';
          else if (name === '카테고리' && ths.some(h => h.classList.contains('c-flex'))) cls = 'tc-sub';
          else if (isLine && TPL_PRICE_HEADS.includes(name)) cls = 'tc-price';
          else {
            nolabel = noLabels.includes(name);
            if (t.classList.contains('tpl-dates-bottom') && /일시$|일$/.test(name)) td.classList.add('tc-date');
            const wrap = document.createElement('span'); wrap.className = 'tc-val';
            while (td.firstChild) wrap.appendChild(td.firstChild);
            td.appendChild(wrap);
          }
          if (cls) td.classList.add(cls);
          if (nolabel) td.classList.add('tc-nolabel');
        });
        tr.dataset.cardDone = String(ths.length);
      });
      t.querySelectorAll('td.tc-actions .row-actions').forEach(ra => {
        if (ra.dataset.cols) return;
        const bs = [...ra.querySelectorAll('button')]; if (!bs.length) return;
        const maxLen = Math.max(...bs.map(b => b.textContent.trim().length));
        const cols = bs.length === 1 ? 1 : (bs.length === 3 && maxLen <= 5) ? 3 : 2;
        ra.dataset.cols = String(cols); ra.style.setProperty('--act-cols', cols);
      });
      const all = t.querySelector('thead th.col-check input[type="checkbox"]');
      const wrap = t.closest('.table-wrap');
      if (all && wrap && !wrap.querySelector(':scope > .card-checkall')) {
        const lb = document.createElement('label'); lb.className = 'card-checkall';
        lb.innerHTML = '<input type="checkbox"> 전체선택';
        const px = lb.firstElementChild; px.checked = all.checked;
        px.addEventListener('change', () => { all.checked = px.checked; all.dispatchEvent(new Event('change', { bubbles: true })); });
        wrap.insertBefore(lb, wrap.firstChild);
      }
    });
  }
  document.addEventListener('change', () => setTimeout(() => {
    document.querySelectorAll('.card-checkall').forEach(lb => {
      const all = lb.parentElement.querySelector('thead th.col-check input[type="checkbox"]');
      if (all) lb.firstElementChild.checked = all.checked;
    });
  }, 0));

    document.querySelectorAll('.filter-bar').forEach(bar => {

  // 대시보드(운영현황) · 공지사항
  // ==================================================================
  const DASH_PERIOD_DEFS = [{ id: 'week', label: '이번주' }, { id: 'month', label: '이번달' }];
  let dashSalesTab = 'retail';   // 'retail' | 'wholesale'
  let dashSalesPeriod = 'week';  // 'week'(일별 차트) | 'month'(주별 차트)
  let dashRankTab = 'retail';    // 'retail' | 'wholesale'

  function dashDateStr(d) { return d.toISOString().slice(2, 10).replace(/-/g, '.'); }
  function dashAddDays(d, n) { const r = new Date(d.getTime()); r.setUTCDate(r.getUTCDate() + n); return r; }
  function dashWeekRange() {
    const t = new Date(RETAIL_MOCK_TODAY);
    const day = t.getUTCDay();
    const mon = dashAddDays(t, day === 0 ? -6 : 1 - day);
    return { mon, sun: dashAddDays(mon, 6) };
  }
  function dashMonthRange() {
    const t = new Date(RETAIL_MOCK_TODAY);
    return { first: new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1)), last: new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)) };
  }
  // 이번주는 월~일 일별 7개, 이번달은 월~일 달력주 단위(첫째·마지막 주는 부분 주) 주별 포인트를 만든다. 기간 정의는 매출조회와 같다.
  function dashSalesPoints(orders, period) {
    const pts = [];
    if (period === 'week') {
      const names = ['월', '화', '수', '목', '금', '토', '일'];
      const { mon } = dashWeekRange();
      for (let i = 0; i < 7; i++) {
        const s = dashDateStr(dashAddDays(mon, i));
        const agg = salesAggregate(orders, s, s);
        pts.push({ label: names[i], tip: s, sales: agg.sales, count: agg.paidCount });
      }
      return pts;
    }
    const { first, last } = dashMonthRange();
    let cur = first;
    let n = 1;
    while (cur.getTime() <= last.getTime()) {
      const day = cur.getUTCDay();
      let end = dashAddDays(cur, day === 0 ? 0 : 7 - day);
      if (end.getTime() > last.getTime()) end = last;
      const from = dashDateStr(cur), to = dashDateStr(end);
      const agg = salesAggregate(orders, from, to);
      pts.push({ label: `${n}주`, tip: `${from} ~ ${to}`, sales: agg.sales, count: agg.paidCount });
      cur = dashAddDays(end, 1);
      n++;
    }
    return pts;
  }
  // 좁은 화면(860px 이하) 막대 값 표기 — 1만 미만은 원 단위 그대로, 1만 이상은 만 단위(소수 1자리, 끝자리 0은 생략)
  function dashShortWon(v) {
    if (v < 10000) return v.toLocaleString();
    return `${(Math.round(v / 1000) / 10).toLocaleString()}만`;
  }
  function dashBarChartHTML(points) {
    const max = Math.max(1, ...points.map(p => Math.max(0, p.sales)));
    const cols = points.map(p => {
      const v = Math.max(0, p.sales);
      const h = v > 0 ? Math.max(2, Math.round((v / max) * 140)) : 0;
      return `
        <div class="dash-bar-col" title="${escapeHtml(p.tip)} · 매출액 ${p.sales.toLocaleString()}원 · 결제 ${p.count}건">
          <div class="dash-bar-val">${v > 0 ? `<span class="v-full">${v.toLocaleString()}</span><span class="v-short">${dashShortWon(v)}</span>` : ''}</div>
          <div class="dash-bar" style="height:${h}px;"></div>
          <div class="dash-bar-label">${escapeHtml(p.label)}</div>
        </div>`;
    }).join('');
    return `<div class="dash-bars">${cols}</div>`;
  }

  // 판매현황 — 이번주(월~일) 결제완료 일시 기준 주문을 상품별로 합산한다. 취소·반품승인 건과 시연용 더미는 제외한다.
  function dashTopProducts(orders) {
    const { mon, sun } = dashWeekRange();
    const from = dashDateStr(mon), to = dashDateStr(sun);
    const map = {};
    orders.filter(o => !o.demo && o.paidAt && stampDatePart(o.paidAt) >= from && stampDatePart(o.paidAt) <= to
      && o.cancelReturnStatus !== '취소승인' && o.cancelReturnStatus !== '반품승인').forEach(o => {
      o.items.forEach(it => {
        const r = map[it.name] || (map[it.name] = { name: it.name, orders: new Set(), amount: 0 });
        r.orders.add(o.orderNo);
        r.amount += it.qty * it.price;
      });
    });
    return Object.values(map).map(r => ({ name: r.name, orderCount: r.orders.size, amount: r.amount }))
      .sort((a, b) => b.amount - a.amount).slice(0, 5);
  }

    const tab = dashSupplyOn() ? dashRankTab : 'retail';

    const tr = top.map((r, i) => `
      <tr><td>${i + 1}</td><td>${escapeHtml(r.name)}</td><td class="num">${r.orderCount}건</td><td class="num">${r.amount.toLocaleString()}원</td></tr>`).join('');
    return `

        <div class="card-head">
          <h2>이번주 판매현황</h2>
          <span class="dash-caption">${dashDateStr(mon)} ~ ${dashDateStr(sun)}</span>

        ${dashTabsHTML('data-dash-rank-tab', tab)}
        <div class="table-wrap">

      openDeleteConfirm('notice', { count: targets.length }, () => {
        const ids = new Set(targets.map(n => n.id));
        NOTICES = NOTICES.filter(n => !ids.has(n.id));
        ids.forEach(id => noticeChecked.delete(id));
        renderFranchiseNoticePage();
        showBulkToast(`${targets.length}건이 삭제되었습니다.`);
      });
    });
  }

  // 가맹점관리 > 공지사항 상세
  function pageFranchiseNoticeDetailHTML() {
    const n = NOTICES.find(x => x.id === noticeDetailId && x.author === 'hq');
    if (!n) return pagePlaceholder('공지사항 상세', '공지사항을 찾을 수 없습니다.', { hideBadge: true });
    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" id="fnoticeDetailBackBtn">← 공지사항으로</button>

          <div class="detail-grid" style="margin-bottom:24px;">

            <div class="detail-item"><span class="detail-label">노출여부</span><span class="detail-value">${noticeExposeTagHTML(n)}</span></div>
            <div class="detail-item"><span class="detail-label">등록일</span><span class="detail-value">${escapeHtml(n.createdAt)}</span></div>

          </section>
        </div>
      </div>
      <div class="market-buybar">
        <span></span>
        <div class="buybar-actions">
          <button type="button" class="btn-secondary" id="fnoticeDetailDeleteBtn">삭제</button>
          <button type="button" class="btn-secondary" id="fnoticeDetailEditBtn">수정</button>
        </div>
      </div>`;
  }
  function renderFranchiseNoticeDetailPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageFranchiseNoticeDetailHTML();
    const toList = () => { currentItem = 'franchise-notice'; renderAll(); };
    const back = wrapper.querySelector('#fnoticeDetailBackBtn');
    if (!back) return;
    back.addEventListener('click', toList);
    wrapper.querySelectorAll('[data-notice-dl]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
    wrapper.querySelector('#fnoticeDetailEditBtn').addEventListener('click', () => startNoticeForm(noticeDetailId));
    wrapper.querySelector('#fnoticeDetailDeleteBtn').addEventListener('click', () => {
      const id = noticeDetailId;
      openDeleteConfirm('notice', {}, () => {
        NOTICES = NOTICES.filter(n => n.id !== id);
        noticeChecked.delete(id);
        toList();
        showBulkToast('삭제되었습니다.');
      });
    });
  }

  // 가맹점관리 > 공지사항등록 / 공지사항수정 (동일 폼)
  function noticeDraftSnapshot() {
    return JSON.stringify({ e: noticeDraft.exposed, d: noticeDraft.date, t: noticeDraft.title, b: noticeDraft.body, f: noticeDraft.files.map(f => f.name) });
  }
  function startNoticeForm(id) {
    noticeEditId = id || null;
    const n = id ? NOTICES.find(x => x.id === id && x.author === 'hq') : null;
    noticeDraft = n
      ? { exposed: n.exposed ? 'visible' : 'hidden', date: noticeIsoFromStamp(n.createdAt), title: n.title, body: n.body, files: n.files.map(f => ({ ...f })) }
      : { exposed: '', date: RETAIL_MOCK_TODAY, title: '', body: '', files: [] };
    noticeDraftInit = noticeDraftSnapshot();
    currentItem = 'franchise-notice-form';
    renderAll();
  }
  function noticeFormFilesHTML() {
    return noticeDraft.files.map((f, i) => `<div class="notice-attach-item"><span>${escapeHtml(f.name)}<span class="notice-attach-size">${noticeFmtSize(f.size)}</span></span><button type="button" class="btn-secondary" data-fnotice-rmfile="${i}">삭제</button></div>`).join('');
  }
  function pageFranchiseNoticeFormHTML() {
    const d = noticeDraft;
    const edit = !!noticeEditId;
    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" id="fnoticeBackBtn">← 공지사항으로</button>
          <div class="card-head"><h2>${edit ? '공지사항수정' : '공지사항등록'}</h2></div>
          <section class="form-section">
            <div class="form-grid">
              <div class="form-field form-field-wide">
                <label>노출여부<span class="req">*</span></label>
                <div class="radio-row">
                  <label><input type="radio" name="fnoticeExposed" value="visible" ${d.exposed === 'visible' ? 'checked' : ''}> 노출</label>
                  <label><input type="radio" name="fnoticeExposed" value="hidden" ${d.exposed === 'hidden' ? 'checked' : ''}> 미노출</label>
                </div>
                <div class="field-error" id="fnoticeExposedError" hidden></div>
              </div>
              <div class="form-field">
                <label for="fnoticeDate">등록일<span class="req">*</span></label>
                <input class="form-input" type="date" id="fnoticeDate" value="${d.date}">
                <div class="field-error" id="fnoticeDateError" hidden></div>
              </div>
              <div class="form-field" aria-hidden="true"></div>
              <div class="form-field form-field-wide">
                <label for="fnoticeTitle">제목<span class="req">*</span></label>
                <input class="form-input" type="text" id="fnoticeTitle" maxlength="100" placeholder="제목을 입력해주세요." value="${escapeHtml(d.title)}">
                <div class="field-error" id="fnoticeTitleError" hidden></div>
              </div>
              <div class="form-field form-field-wide">
                <label>내용<span class="req">*</span></label>
                <div>
                  <div class="editor-toolbar">
                    <button type="button">B</button><button type="button">I</button><button type="button">U</button>
                    <button type="button">이미지 삽입</button><button type="button">링크</button>
                  </div>
                  <div class="editor-body" contenteditable="true" id="fnoticeBody" style="white-space:pre-wrap;" data-placeholder="기본 에디터 적용">${escapeHtml(d.body)}</div>
                </div>
                <div class="field-error" id="fnoticeBodyError" hidden></div>
              </div>
              <div class="form-field form-field-wide">
                <label>첨부파일 <span class="field-hint-inline">최대 ${NOTICE_MAX_FILES}개, 파일당 10MB 이내 (문서·이미지·압축 파일, 실행 파일 불가)</span></label>
                <div class="notice-attach">
                  <div><button type="button" class="btn-secondary" id="fnoticeAddFileBtn">파일 추가</button><input type="file" id="fnoticeFileInput" multiple hidden></div>
                  <div id="fnoticeFileList" class="notice-attach-list">${noticeFormFilesHTML()}</div>
                </div>
                <div class="field-error" id="fnoticeFileError" hidden></div>
              </div>
            </div>
          </section>
        </div>
      </div>
      <div class="market-buybar" style="justify-content:flex-end;">
        <div class="buybar-actions">
          <button type="button" class="btn-secondary" id="fnoticeCancelBtn">취소</button>
          <button type="button" class="btn-primary" id="fnoticeSaveBtn">저장</button>
        </div>
      </div>`;
  }
  function renderFranchiseNoticeFormPage() {
    const wrapper = document.getElementById('contentWrapper');
    if (!noticeDraft) { currentItem = 'franchise-notice'; renderFranchiseNoticePage(); return; }
    wrapper.innerHTML = pageFranchiseNoticeFormHTML();
    const d = noticeDraft;
    const $ = sel => wrapper.querySelector(sel);
    const setErr = (id, msg) => { const el = $('#' + id); el.hidden = !msg; el.textContent = msg || ''; };
    wrapper.querySelectorAll('input[name="fnoticeExposed"]').forEach(r => r.addEventListener('change', e => { d.exposed = e.target.value; setErr('fnoticeExposedError', ''); }));
    $('#fnoticeDate').addEventListener('input', e => { d.date = e.target.value; setErr('fnoticeDateError', ''); });
    $('#fnoticeTitle').addEventListener('input', e => { d.title = e.target.value; setErr('fnoticeTitleError', ''); });
    $('#fnoticeBody').addEventListener('input', e => { d.body = noticeEditorText(e.target); setErr('fnoticeBodyError', ''); });
    const refreshFiles = () => {
      $('#fnoticeFileList').innerHTML = noticeFormFilesHTML();
      $('#fnoticeFileList').querySelectorAll('[data-fnotice-rmfile]').forEach(b => b.addEventListener('click', () => { d.files.splice(Number(b.dataset.fnoticeRmfile), 1); setErr('fnoticeFileError', ''); refreshFiles(); }));
    };
    refreshFiles();
    $('#fnoticeAddFileBtn').addEventListener('click', () => $('#fnoticeFileInput').click());
    $('#fnoticeFileInput').addEventListener('change', e => {
      let msg = '';
      for (const file of Array.from(e.target.files)) {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (d.files.length >= NOTICE_MAX_FILES) { msg = `첨부파일은 최대 ${NOTICE_MAX_FILES}개까지 추가할 수 있습니다.`; break; }
        if (NOTICE_BLOCKED_EXT.includes(ext)) { msg = `${file.name}: 허용되지 않는 형식입니다.`; continue; }
        if (file.size > NOTICE_MAX_SIZE) { msg = `${file.name}: 파일당 10MB 이내만 추가할 수 있습니다.`; continue; }
        d.files.push({ name: file.name, size: file.size });
      }
      e.target.value = '';
      setErr('fnoticeFileError', msg);
      refreshFiles();
    });
    const leave = () => {
      if (noticeEditId) { currentItem = 'franchise-notice-detail'; noticeDetailId = noticeEditId; currentCat = 'franchise'; noticeDetailBack = { cat: 'franchise', item: 'franchise-notice' }; }
      else currentItem = 'franchise-notice';
      noticeEditId = null; noticeDraft = null;
      renderAll();
    };
    const cancel = () => {
      if (noticeDraftSnapshot() === noticeDraftInit) { leave(); return; }
      openBulkAlert({ message: '작성 중인 내용을 버리고 돌아가시겠습니까?\n입력한 내용은 저장되지 않습니다.', confirmLabel: '나가기', onConfirm: leave });
    };
    $('#fnoticeBackBtn').addEventListener('click', cancel);
    $('#fnoticeCancelBtn').addEventListener('click', cancel);
    $('#fnoticeSaveBtn').addEventListener('click', () => {
      d.title = $('#fnoticeTitle').value;
      d.body = noticeEditorText($('#fnoticeBody'));
      const title = d.title.trim();
      setErr('fnoticeExposedError', d.exposed ? '' : '노출여부를 선택해주세요.');
      setErr('fnoticeDateError', d.date ? '' : '등록일을 선택해주세요.');
      setErr('fnoticeTitleError', title ? '' : '제목을 입력해주세요.');
      setErr('fnoticeBodyError', d.body ? '' : '내용을 입력해주세요.');
      if (!d.exposed || !d.date || !title || !d.body) return;
      const exposed = d.exposed === 'visible';
      const createdAt = noticeStampFromIso(d.date);
      if (noticeEditId) {
        const n = NOTICES.find(x => x.id === noticeEditId);
        Object.assign(n, { exposed, createdAt, title, body: d.body, files: d.files.map(f => ({ ...f })) });
        const id = noticeEditId;
        noticeEditId = null; noticeDraft = null;
        noticeDetailId = id; noticeDetailBack = { cat: 'franchise', item: 'franchise-notice' };
        currentCat = 'franchise'; currentItem = 'franchise-notice-detail';
        renderAll();
        showBulkToast('저장되었습니다.');
      } else {
        NOTICES.push({ id: noticeNextId++, author: 'hq', target: null, exposed, views: 0, files: d.files.map(f => ({ ...f })), title, body: d.body, createdAt });
        noticeDraft = null;
        if (pgState.franchiseNotice) pgState.franchiseNotice.page = 1;
        currentItem = 'franchise-notice';
        renderAll();
        showBulkToast('등록되었습니다.');
      }
    });
  }

  // ---- 가맹점관리 > 통합매출조회 ----
  // 본사 통합 매출(본사 계정의 소매·도매 매출 + 가맹점 이용료 수납액)과 가맹점 합산 매출을 별도 보기로 분리해 보여준다. 가맹점 매출은
  // 본사 매출이 아니므로 둘을 합산한 값은 만들지 않는다. 산식·기준일은 소매·도매매출조회와 동일하다(결제총액 = 결제완료 일시 기준,
  // 취소·환불액 = 취소·반품 승인 일시 기준). 이용료 수납액은 매출액에 포함하지 않는다.
  let fsTab = 'all';            // 'all' | 'byFranchise'
  let fsScope = 'hq';           // 'hq'(본사) | 'franchise'(가맹점) — 전체 현황 필터 뱃지
  let fsPeriod = 'month';
  let fsDateFrom = '';
  let fsDateTo = '';
  let fsTradeType = 'all';      // 'all' | 'retail' | 'wholesale'
  let fsTrendMode = 'daily';
  let fsTrendPage = 1;
  let fsSearch = '';
  let fsStatusFilter = 'all';
  let fsSort = 'sales';         // 'sales' | 'orders' | 'name'
  let fsViewId = null;          // 가맹점 1곳 조회 대상 아이디
  const FS_TRADE_DEFS = [{ id: 'all', label: '전체' }, { id: 'retail', label: '소매매출' }, { id: 'wholesale', label: '도매매출' }];

  function fsOwnOrders() {
    const own = RETAIL_ORDER_LIST.map(o => ({ ...o, tradeType: 'retail' }))
      .concat(myOrders().map(o => ({ ...o, tradeType: 'wholesale' })));
    return own.filter(o => fsTradeType === 'all' || o.tradeType === fsTradeType);
  }
  function fsFranchiseOrders(ids) {
    return FRANCHISE_SALES_ORDERS.filter(o => (!ids || ids.includes(o.franchiseId)) && (fsTradeType === 'all' || o.tradeType === fsTradeType));
  }
  function fsFeeCollected(ids, from, to) {
    if (fsTradeType !== 'all') return null; // 이용료는 거래유형과 무관하므로 소매·도매매출 필터에서는 표시하지 않는다.
    return FEE_PAYMENT_HISTORY.filter(h => !h.demo && (!ids || ids.includes(h.franchiseId)) && (h.status === '결제완료' || h.status === '수기완납'))
      .filter(h => { const d = (h.processedAt || h.paidAt).slice(0, 8); return d >= from && d <= to; })
      .reduce((sum, h) => sum + h.amount, 0);
  }
  function fsAggregate(orders, from, to, ids, withFee) {
    return { ...salesTrendAggregate(orders, from, to),
      fee: withFee ? fsFeeCollected(ids, from, to) : undefined };
  }
  const fsWon = v => (v === null || v === undefined ? '-' : `${v.toLocaleString()}원`);

  function fsCardsHTML(agg, withFee) {
    const c = (label, val) => `<div class="card" style="background:var(--bg);"><div class="stat-label">${label}</div><div class="stat-value">${fsWon(val)}</div></div>`;
    return `<div class="fs-cards" style="--fs-cols:${withFee ? 4 : 3};">
      ${c('결제총액', agg.paidTotal)}${c('취소·환불액', agg.refundTotal)}${c('매출액', agg.sales)}${withFee ? c('이용료 수납액', agg.fee) : ''}
    </div>`;
  }

  function fsTrendTableHTML(points, page) { return salesTrendSectionHTML('fs', points, page); }

  function fsTrendSectionHTML(orders, ids) {
    const points = salesTrendPoints((o, f, t) => fsAggregate(o, f, t, ids, false), orders, fsTrendMode, salesPeriodRange(fsPeriod, fsDateFrom, fsDateTo));
    return `
      <section class="form-section">
        <h3 class="form-section-title">매출 추이</h3>
        <div class="tab-row">
          <button type="button" class="tab-btn ${fsTrendMode === 'daily' ? 'active' : ''}" data-fs-trend-mode="daily">일별</button>
          <button type="button" class="tab-btn ${fsTrendMode === 'monthly' ? 'active' : ''}" data-fs-trend-mode="monthly">월별</button>
        </div>
        ${fsTrendTableHTML(points, fsTrendPage)}
      </section>`;
  }

  function fsFilterHTML() {
    const chips = SALES_PERIOD_DEFS.map(p => `<button type="button" class="tab-btn-sub ${fsPeriod === p.id ? 'active' : ''}" data-fs-period="${p.id}">${p.label}</button>`).join('');
    const custom = fsPeriod === 'custom' ? salesCustomRangeHTML('fs', fsDateFrom, fsDateTo) : '';
    const trade = FS_TRADE_DEFS.map(t => `<button type="button" class="tab-btn-sub ${fsTradeType === t.id ? 'active' : ''}" data-fs-trade="${t.id}">${t.label}</button>`).join('');
    return `
      <div class="tab-row-sub" style="align-items:center;">${chips}${custom}</div>
      <div class="tab-row-sub" style="align-items:center;">${trade}</div>`;
  }

  // 가맹점별 현황 — 화면의 이용상태 필터·검색어·정렬을 반영한 행(화면 목록과 엑셀 다운로드가 공유).
  function fsByFranchiseRows(range) {
    let rows = FRANCHISE_LIST.map(f => ({ f, agg: fsAggregate(fsFranchiseOrders([f.id]), range.from, range.to, [f.id], false) }));
    if (fsStatusFilter !== 'all') rows = rows.filter(r => r.f.status === fsStatusFilter);
    if (fsSearch.trim()) rows = rows.filter(r => searchMatch(fsSearch, r.f.id, r.f.companyName));
    if (fsSort === 'orders') rows.sort((a, b) => b.agg.orderCount - a.agg.orderCount);
    else if (fsSort === 'name') rows.sort((a, b) => a.f.companyName.localeCompare(b.f.companyName));
    else rows.sort((a, b) => b.agg.sales - a.agg.sales);
    return rows;
  }

  function fsPageBody(range) {
    const tabs = `<div class="tab-row">
      <button type="button" class="tab-btn ${fsTab === 'all' ? 'active' : ''}" data-fs-tab="all">전체 현황</button>
      <button type="button" class="tab-btn ${fsTab === 'byFranchise' ? 'active' : ''}" data-fs-tab="byFranchise">가맹점별 현황</button></div>`;
    if (fsTab === 'all') {
      const scopeBadges = `<div class="tab-row-sub" style="align-items:center;">
        <button type="button" class="tab-btn-sub ${fsScope === 'hq' ? 'active' : ''}" data-fs-scope="hq">본사</button>
        <button type="button" class="tab-btn-sub ${fsScope === 'franchise' ? 'active' : ''}" data-fs-scope="franchise">가맹점</button></div>`;
      const isHq = fsScope === 'hq';
      const orders = isHq ? fsOwnOrders() : fsFranchiseOrders(null);
      const agg = fsAggregate(orders, range.from, range.to, null, isHq);
      return `${tabs}${scopeBadges}
        <section class="form-section"><h3 class="form-section-title">${isHq ? '본사 통합 매출' : '가맹점 합산 매출'}</h3>${fsCardsHTML(agg, isHq)}</section>
        ${fsTrendSectionHTML(orders, null)}`;
    }
    const rows = fsByFranchiseRows(range);
    const pgFs = pgSlice('fsList', JSON.stringify([fsPeriod, fsDateFrom, fsDateTo, fsTradeType, fsStatusFilter, fsSearch, fsSort]), rows);
    const tr = pgFs.rows.map(({ f, agg }) => `
      <tr>
        <td>${escapeHtml(f.id)}</td><td>${escapeHtml(f.companyName)}</td>
        <td>${(f.feeCustomApplied ? f.feeCustomAmount : FRANCHISE_FEE_DEFAULT).toLocaleString()}원</td>
        <td class="num">${agg.orderCount}건</td><td class="num">${agg.sales.toLocaleString()}원</td>
        <td>${statusTag(f.status)}</td>
        <td class="col-actions"><div class="row-actions row-actions-stack"><button type="button" data-fs-view="${f.id}">보기</button></div></td>
      </tr>`).join('');
    return `${tabs}
      <div class="filter-bar" style="margin-top:12px;">
        <select class="filter-select" id="fsStatusSelect">${[['all', '이용상태 전체'], ['이용대기', '이용대기'], ['이용승인', '이용승인'], ['이용제한', '이용제한'], ['이용불가', '이용불가']].map(([v, l]) => `<option value="${v}" ${fsStatusFilter === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span class="fb-group fb-search"><input class="search-input" type="text" id="fsSearchInput" placeholder="아이디, 상호명 검색" value="${escapeHtml(fsSearch)}">
        <button type="button" class="btn-secondary" id="fsSearchBtn">검색</button></span>
      </div>
      <div class="table-toolbar"><span class="table-count">전체 ${rows.length}건</span>
        <select class="filter-select sort-select" id="fsSortSelect">
          <option value="sales" ${fsSort === 'sales' ? 'selected' : ''}>매출액순</option>
          <option value="orders" ${fsSort === 'orders' ? 'selected' : ''}>주문순</option>
          <option value="name" ${fsSort === 'name' ? 'selected' : ''}>상호명순</option>
        </select></div>
      <div class="table-wrap"><table class="tpl-table">
        <thead><tr><th class="c-s">아이디</th><th class="c-flex">상호명</th><th class="c-m">적용 이용료</th><th class="c-s">주문건수<span class="th-sub">(접수일 기준)</span></th><th class="c-m">매출액<span class="th-sub">(결제일 기준)</span></th><th class="c-s">이용상태</th><th class="col-actions">관리</th></tr></thead>
        <tbody>${tr || `<tr><td colspan="7" style="text-align:center; color:var(--text-secondary); padding:32px 0;">조회된 가맹점이 없습니다.</td></tr>`}</tbody>
      </table></div>
      ${pgFs.html}`;
  }

  function pageFranchiseSalesHTML() {
    const range = salesPeriodRange(fsPeriod, fsDateFrom, fsDateTo);
    const f = fsViewId ? FRANCHISE_LIST.find(x => x.id === fsViewId) : null;
    if (fsViewId && !f) fsViewId = null;

  function downloadFranchiseSalesExcel() {
    const range = salesPeriodRange(fsPeriod, fsDateFrom, fsDateTo);
    const tradeLabel = FS_TRADE_DEFS.find(t => t.id === fsTradeType).label;
    const meta = ['조회기간', `${range.from || '-'} ~ ${range.to || '-'}`, '거래유형', tradeLabel];
    const fee = v => (v === undefined || v === null ? '-' : v);
    let rows;
    if (fsViewId || (fsTab === 'all')) {
      const isHq = !fsViewId && fsScope === 'hq';
      const ids = fsViewId ? [fsViewId] : null;
      const orders = fsViewId ? fsFranchiseOrders(ids) : (isHq ? fsOwnOrders() : fsFranchiseOrders(null));
      const withFee = !fsViewId && isHq;
      const a = fsAggregate(orders, range.from, range.to, ids, withFee);
      const title = fsViewId ? `가맹점 매출(${(FRANCHISE_LIST.find(x => x.id === fsViewId) || {}).companyName || fsViewId})` : (isHq ? '본사 통합 매출' : '가맹점 합산 매출');
      const pts = salesTrendPoints((o, f, t) => fsAggregate(o, f, t, ids, false), orders, fsTrendMode, range).slice().reverse();
      rows = [['통합매출조회'], meta, [], [title],
        withFee ? ['결제총액', '취소·환불액', '매출액', '이용료 수납액'] : ['결제총액', '취소·환불액', '매출액'],
        withFee ? [a.paidTotal, a.refundTotal, a.sales, fee(a.fee)] : [a.paidTotal, a.refundTotal, a.sales], [],
        [`매출 추이(${fsTrendMode === 'monthly' ? '월별' : '일별'})`],
        ['기간', '총주문건수', '총결제액', '카드결제 주문건수', '카드결제액', '현장결제·계좌이체 주문건수', '현장결제·계좌이체 결제액', '취소환불건수', '취소환불액', '매출액'],
        ...pts.map(p => [p.dateLabel, p.orderCount, p.paidTotal, p.cardCount, p.cardTotal, p.otherCount, p.otherTotal, p.refundCount, p.refundTotal, p.sales])];
    } else {
      rows = [['통합매출조회'], meta, [], ['아이디', '상호명', '적용 이용료', '주문건수(접수일 기준)', '매출액(결제일 기준)', '이용상태'],
        ...fsByFranchiseRows(range)
          .map(({ f, agg }) => [f.id, f.companyName, f.feeCustomApplied ? f.feeCustomAmount : FRANCHISE_FEE_DEFAULT, agg.orderCount, agg.sales, f.status])];
    }
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    saveSalesFile(`통합매출조회_${(range.from || '').replace(/\./g, '')}-${(range.to || '').replace(/\./g, '')}.csv`, csv);
    return csv;
  }

    w.querySelectorAll('[data-fs-tab]').forEach(b => b.addEventListener('click', () => { fsTab = b.dataset.fsTab; fsTrendPage = 1; rerender(); }));
    w.querySelectorAll('[data-fs-scope]').forEach(b => b.addEventListener('click', () => { fsScope = b.dataset.fsScope; fsTrendPage = 1; rerender(); }));
    w.querySelectorAll('[data-fs-period]').forEach(b => b.addEventListener('click', () => {
      fsPeriod = b.dataset.fsPeriod; if (fsPeriod !== 'custom') { fsDateFrom = ''; fsDateTo = ''; } rerender();

    const dt = w.querySelector('#fsDateTo'); if (dt) dt.addEventListener('change', e => { fsDateTo = salesClampTo(fsDateFrom, e.target.value); rerender(); });

    w.querySelectorAll('[data-fs-trend-mode]').forEach(b => b.addEventListener('click', () => { fsTrendMode = b.dataset.fsTrendMode; fsTrendPage = 1; rerender(); }));
    w.querySelectorAll('[data-fs-trend-page]').forEach(b => b.addEventListener('click', () => { fsTrendPage = Number(b.dataset.fsTrendPage); rerender(); }));
    w.querySelectorAll('[data-fs-view]').forEach(b => b.addEventListener('click', () => { fsViewId = b.dataset.fsView; fsTrendPage = 1; rerender(); }));
    const back = w.querySelector('[data-fs-back]'); if (back) back.addEventListener('click', () => { fsViewId = null; fsTab = 'byFranchise'; fsTrendPage = 1; rerender(); });
    w.querySelector('[data-fs-excel]').addEventListener('click', downloadFranchiseSalesExcel);

    const so = w.querySelector('#fsSortSelect'); if (so) so.addEventListener('change', e => { fsSort = e.target.value; rerender(); });
    const si = w.querySelector('#fsSearchInput');
    if (si) {

      si.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

    if (!str || str.length <= 6) return str;
    return str.slice(0, 4) + '*'.repeat(str.length - 6) + str.slice(-2);
  }

  function computeNextFeeBillingDate(baseStamp, billingDay) {
    const base = new Date(stampDateISO(baseStamp));
    const next = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + 1, billingDay));
    return isoToYYDate(next.toISOString().slice(0, 10));
  }

  function retailNotificationHistoryRows() {
    let rows = RETAIL_NOTIFICATION_HISTORY.slice();
    const rowISODate = h => stampDateISO(h.date);
    if (notiHistoryPeriod === 'custom') {
      if (notiHistoryDateFrom) rows = rows.filter(h => rowISODate(h) >= notiHistoryDateFrom);
      if (notiHistoryDateTo) rows = rows.filter(h => rowISODate(h) <= notiHistoryDateTo);
    } else if (notiHistoryPeriod !== 'all') {
      const months = { '1m': 1, '3m': 3, '6m': 6 }[notiHistoryPeriod];
      rows = rows.filter(h => rowISODate(h) >= monthsAgoISODate(months));
    }
    if (notiHistorySearch.trim()) {
      rows = rows.filter(h => searchMatch(notiHistorySearch, h.recipient));
    }
    if (notiHistoryMessage !== 'all') rows = rows.filter(h => h.message === notiHistoryMessage);
    if (notiHistoryChannel !== 'all') rows = rows.filter(h => h.channel === notiHistoryChannel);
    return rows;
  }
