              </div>
              <div class="form-field" aria-hidden="true"></div>
              <div class="form-field">
                <label>수령방식</label>
                <div class="radio-row">
                  <label><input type="radio" name="rpSalesMethod" value="pickup" ${retailDefaultSalesMethod() === 'pickup' ? 'checked' : ''}> 픽업</label>
                  <label><input type="radio" name="rpSalesMethod" value="delivery" ${retailDefaultSalesMethod() === 'delivery' ? 'checked' : ''}> 배달</label>
                  <label><input type="radio" name="rpSalesMethod" value="both" ${retailDefaultSalesMethod() === 'both' ? 'checked' : ''}> 픽업+배달</label>
                </div>
              </div>
              <div class="form-field" id="rpChatOrderBlock">
                <label><input type="checkbox" id="rpChatOrderEnabled"> 채팅주문 허용</label>
                <div class="field-hint">채팅주문으로 접수되면 항상 픽업·현장결제로 생성되며, 상품마다 개별 주문으로 접수됩니다.</div>

                <div id="rpChatOrderDupResult" class="field-hint" style="display:none;"></div>
                <div class="field-hint">몰에 노출되는 상품명과 별개로, 채팅 파싱에 사용할 짧은 이름입니다.</div>

                <input type="number" class="form-input" id="rpMaxQty" placeholder="제한 없음" min="0">

              </div>

                <label>소비기한</label>
                <input type="text" class="form-input" id="rpExpiry" placeholder="예: 수령 즉시, 당일 섭취, 수령 후 7일">

          <button type="button" class="btn-secondary" data-goto="retail-product">취소</button>
          <button type="button" class="btn-primary" id="rpSaveBtn">저장</button>

  }

  function renderRetailProductRegisterPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = retailProductRegisterHTML();

    const cat1 = wrapper.querySelector('#rpCat1');
    const cat2 = wrapper.querySelector('#rpCat2');
    cat1.addEventListener('change', () => {
      cat2.innerHTML = cat2FormOptionsHTML(cat1.value, '', 'r');
    });

    const listPriceInput = wrapper.querySelector('#rpListPrice');
    const salePriceInput = wrapper.querySelector('#rpSalePrice');
    const discountRateInput = wrapper.querySelector('#rpDiscountRate');
    function updateDiscountRate() {
      const listPrice = parseFloat(listPriceInput.value) || 0;
      const salePrice = parseFloat(salePriceInput.value) || 0;
      discountRateInput.value = (listPrice > 0 && salePrice > 0 && salePrice <= listPrice)
        ? `${Math.round((1 - salePrice / listPrice) * 100)}%` : '0%';
    }
    listPriceInput.addEventListener('input', updateDiscountRate);
    salePriceInput.addEventListener('input', updateDiscountRate);

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });

    // 채팅주문 허용 — 수령방식이 배달이면 블록을 숨기고 허용 상태를 해제한다(채팅주문은 픽업 건만 지원).
    let chatNameChecked = false;
    let chatNameCheckedValue = null;
    const chatOrderBlock = wrapper.querySelector('#rpChatOrderBlock');
    const chatOrderToggle = wrapper.querySelector('#rpChatOrderEnabled');
    const chatOrderNameField = wrapper.querySelector('#rpChatOrderNameField');
    const chatOrderNameInput = wrapper.querySelector('#rpChatOrderName');
    const chatOrderDupResult = wrapper.querySelector('#rpChatOrderDupResult');
    const pickupStartField = wrapper.querySelector('#rpPickupStartField');
    const pickupEndField = wrapper.querySelector('#rpPickupEndField');
    wrapper.querySelectorAll('input[name="rpSalesMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        // 채팅주문은 픽업 건만 지원하므로, 배달 선택 시 체크박스를 숨기지 않고 영역만 비운다(레이아웃 유지).
        chatOrderBlock.style.visibility = radio.value === 'delivery' ? 'hidden' : 'visible';
        if (radio.value === 'delivery') {
          chatOrderToggle.checked = false;
          chatOrderNameField.style.display = 'none';
        }
        // 픽업가능기간도 배달 단독 수령방식에는 해당하지 않으므로 필드 자체를 접어 아래 항목이 밀려 올라오게 한다.
        pickupStartField.style.display = radio.value === 'delivery' ? 'none' : '';
        pickupEndField.style.display = radio.value === 'delivery' ? 'none' : '';
      });
    });
    wrapper.querySelector('input[name="rpSalesMethod"]:checked').dispatchEvent(new Event('change'));
    chatOrderToggle.addEventListener('change', () => {
      chatOrderNameField.style.display = chatOrderToggle.checked ? '' : 'none';
    });
    wrapper.querySelector('#rpChatOrderDupCheckBtn').addEventListener('click', () => {
      const val = chatOrderNameInput.value.trim();
      chatOrderDupResult.style.display = 'block';
      if (!val) {
        chatOrderDupResult.textContent = '채팅주문상품명을 입력해주세요.';
        chatNameChecked = false;
        return;
      }
      const dup = retailActiveChatListing(val);
      if (dup) {
        chatOrderDupResult.textContent = '이미 등록된 채팅주문상품명입니다.';
        chatNameChecked = false;
      } else {
        chatOrderDupResult.textContent = '사용 가능한 채팅주문상품명입니다.';
        chatNameChecked = true;
        chatNameCheckedValue = val;
      }
    });

    wrapper.querySelector('#rpSaveBtn').addEventListener('click', () => {
      const name = wrapper.querySelector('#rpName').value.trim();
      const listPrice = parseInt(listPriceInput.value, 10) || 0;
      const salePrice = parseInt(salePriceInput.value, 10) || null;
      const stockInput = wrapper.querySelector('#rpStock');
      const stock = parseInt(stockInput.value, 10) || 0;
      const salesMethod = wrapper.querySelector('input[name="rpSalesMethod"]:checked').value;
      const composition = wrapper.querySelector('#rpComposition').value.trim();
      const maxQty = parseInt(wrapper.querySelector('#rpMaxQty').value, 10) || null;
      const origin = wrapper.querySelector('#rpOrigin').value.trim();
      const expiry = wrapper.querySelector('#rpExpiry').value.trim();
      const exposed = wrapper.querySelector('#rpExposed').value === 'exposed';
      const detailContent = wrapper.querySelector('#rpDetailEditor').textContent.trim();
      const chatOrderEnabled = salesMethod !== 'delivery' && chatOrderToggle.checked;
      const chatOrderName = chatOrderNameInput.value.trim();
      const pickupStart = wrapper.querySelector('#rpPickupStart').value.trim();
      const pickupEnd = wrapper.querySelector('#rpPickupEnd').value.trim();

      const errors = [...imageCountErrors(wrapper.querySelector('[data-img-uploader]'))];
      if (!name) errors.push('상품명을 입력해주세요.');
      if (!cat1.value) errors.push('카테고리 1차를 선택해주세요.');
      errors.push(...priceErrors(listPriceInput.value, '소비자가'));
      errors.push(...discountErrors(salePriceInput.value, parseInt(listPriceInput.value, 10) || 0));
      errors.push(...qtyErrors(stockInput.value, '보유수량'));
      if (chatOrderEnabled) {
        if (!chatOrderName) errors.push('채팅주문상품명을 입력해주세요.');
        else if (!chatNameChecked || chatNameCheckedValue !== chatOrderName) errors.push('채팅주문상품명 중복확인을 먼저 완료해주세요.');
      }
      if (salesMethod !== 'delivery') {
        errors.push(...pickupErrors(pickupStart, pickupEnd, true));
      }

      const banner = wrapper.querySelector('#rpFormErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      const code = `P${String(productCodeSeq++).padStart(4, '0')}`;
      const today = mockNowStamp();
      RETAIL_LISTINGS.push({
        id: `RTL${String(retailListingSeq++).padStart(4, '0')}`,
        source: 'retail', sourceCode: code,
        name, image: null, detailContent,
        cat1: cat1.value, cat2: cat2.value || null,
        listPrice, salePrice, salesMethod, composition, maxQty: maxQty || null,
        origin, expiry,
        pickupStartDate: salesMethod !== 'delivery' ? pickupStart : null,
        pickupEndDate: salesMethod !== 'delivery' ? pickupEnd : null,
        stock, availableQty: stock,
        exposed, saleStatus: stock === 0 ? 'soldout' : 'active',
        chatOrderEnabled, chatOrderName: chatOrderEnabled ? chatOrderName : '',
        registeredAt: today, updatedAt: today,
      });

      currentItem = 'retail-product';
      renderAll();
    });
  }

  // ---- 도매전환(내소매상품 → 내도매상품) — 소매관리 상품목록의 [도매전환] 버튼으로 진입한다. ----
  // 도매정보를 새로 입력하고, 기존 소매정보(소매카테고리·소비자가·수령방식 등)는 변경 없이 그대로 유지(상속)한다.
  // 전환 후에는 내소매상품으로 되돌릴 수 없다 — 별도 확인 체크박스 없이 안내 문구로만 고지한다.
  let currentConvertRef = null;

  function productConvertHTML() {
    const ref = currentConvertRef;
    const listing = ref && RETAIL_LISTINGS.find(r => r.source === 'retail' && r.sourceCode === ref.sourceCode);
    if (!listing) return pagePlaceholder('도매상품전환', '전환할 상품 정보를 찾을 수 없습니다.');

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" data-goto="retail-product">← 상품목록으로</button>
          <div class="card-head">
            <h2>도매상품전환</h2>
          </div>

          <div class="notice-banner">내소매상품을 도매상품으로 전환합니다. 전환 후에는 내소매상품으로 되돌릴 수 없습니다.</div>
          <div class="form-error-banner" id="cvFormErrorBanner" hidden></div>

          <section class="form-section">
            <h3 class="form-section-title">기본정보</h3>
            <div class="form-grid">
              <div class="form-field form-field-wide">
                <label>상품이미지<span class="req">*</span> <span class="field-hint-inline">2장 이상 등록 · 첫번째 이미지가 대표이미지로 노출됩니다</span></label>
                ${imageUploaderHTML({ existing: 2 })}
              </div>
              <div class="form-field">
                <label>도매카테고리 1차<span class="req">*</span></label>
                <select class="form-select" id="cvCat1">${cat1FormOptionsHTML('')}</select>
              </div>
              <div class="form-field">
                <label>도매카테고리 2차</label>
                <select class="form-select" id="cvCat2">${cat2FormOptionsHTML('', '')}</select>
              </div>
              <div class="form-field form-field-wide">
                <label>도매상품명<span class="req">*</span></label>
                <input type="text" class="form-input" id="cvName" value="${escapeHtml(listing.name)}">
              </div>
              <div class="form-field">
                <label>공급범위</label>
                <select class="form-select" id="cvScope">
                  <option value="전국">전국</option>
                  <option value="우리지역">우리지역</option>
                  <option value="우리본사">우리본사</option>
                </select>
              </div>
              <div class="form-field">
                <label>공급가<span class="req">*</span> / 공급단위</label>
                <div class="input-pair">
                  <input type="number" class="form-input" id="cvPrice" value="${listing.listPrice || 0}" min="0"> 원 /
                  <input type="text" class="form-input" id="cvUnit" value="${escapeHtml(listing.composition || '')}" placeholder="예: box(10kg)">
                </div>
                <div class="field-hint">기존 소비자가를 참고값으로 채워두었습니다. 실제 공급가에 맞게 수정해주세요.</div>
              </div>
              <div class="form-field form-field-wide">
                <label>도매노출여부</label>
                <select class="form-select" id="cvWholesaleVisible">
                  <option value="visible" selected>노출</option>
                  <option value="hidden">미노출</option>
                </select>
              </div>
              <div class="form-field">
                <label>보유수량<span class="req">*</span></label>
                <input type="number" class="form-input" id="cvStock" value="${listing.stock}" min="0">
              </div>
              <div class="form-field">
                <label>판매가능수량<span class="req">*</span></label>
                <input type="number" class="form-input" id="cvAvailableQty" value="${listing.availableQty}" min="0">
                <div class="field-hint">보유수량을 초과할 수 없습니다.</div>
                <div class="field-error" id="cvAvailableQtyError" hidden></div>
              </div>
              <div class="form-field">
                <label>배송방식</label>
                <input type="text" class="form-input" value="${shippingMethodLabel(WHOLESALE_SETTINGS)}" disabled>
              </div>
              <div class="form-field" aria-hidden="true"></div>
              <div class="form-field">
                <label>원산지</label>
                <input type="text" class="form-input" id="cvOrigin" value="${escapeHtml(listing.origin || '')}">
              </div>
              <div class="form-field">
                <label>소비기한</label>
                <input type="text" class="form-input" id="cvExpiry" value="${escapeHtml(listing.expiry || '')}" placeholder="예: 수령 즉시, 당일 섭취, 수령 후 7일">
              </div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">상세정보</h3>
            <div class="editor-toolbar">
              <button type="button">B</button><button type="button">I</button><button type="button">U</button>
              <button type="button">이미지 삽입</button><button type="button">링크</button>
            </div>
            <div class="editor-body" contenteditable="true" id="cvDetailEditor" data-placeholder="기본 에디터 적용">${escapeHtml(listing.detailContent || '')}</div>
          </section>
        </div>
      </div>

      <div class="market-buybar" style="justify-content:flex-end;">
        <div class="buybar-actions">
          <button type="button" class="btn-secondary" data-goto="retail-product">취소</button>
          <button type="button" class="btn-primary" id="cvSaveBtn">전환하기</button>
        </div>
      </div>`;
  }

  function renderProductConvertPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = productConvertHTML();

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });

    const ref = currentConvertRef;
    const listing = ref && RETAIL_LISTINGS.find(r => r.source === 'retail' && r.sourceCode === ref.sourceCode);
    const cat1 = wrapper.querySelector('#cvCat1');
    if (!listing || !cat1) return; // 전환 대상을 찾지 못해 placeholder만 렌더된 경우

    const cat2 = wrapper.querySelector('#cvCat2');
    cat1.addEventListener('change', () => {
      cat2.innerHTML = cat2FormOptionsHTML(cat1.value, '');
    });

    const stockInput = wrapper.querySelector('#cvStock');
    const availableQtyInput = wrapper.querySelector('#cvAvailableQty');
    const availableQtyError = wrapper.querySelector('#cvAvailableQtyError');
    function validateAvailableQty() {
      const stock = parseInt(stockInput.value, 10) || 0;
      const allocated = parseInt(availableQtyInput.value, 10) || 0;
      availableQtyError.hidden = allocated <= stock;
    }
    stockInput.addEventListener('input', validateAvailableQty);
    availableQtyInput.addEventListener('input', validateAvailableQty);

    wrapper.querySelector('#cvSaveBtn').addEventListener('click', () => {
      const name = wrapper.querySelector('#cvName').value.trim();
      const scope = wrapper.querySelector('#cvScope').value;
      const price = parseInt(wrapper.querySelector('#cvPrice').value, 10) || 0;
      const unit = wrapper.querySelector('#cvUnit').value.trim();
      const stock = parseInt(stockInput.value, 10) || 0;
      const availableQty = parseInt(availableQtyInput.value, 10) || 0;
      const wholesaleVisible = wrapper.querySelector('#cvWholesaleVisible').value === 'visible';
      const origin = wrapper.querySelector('#cvOrigin').value.trim();
      const expiry = wrapper.querySelector('#cvExpiry').value.trim();
      const detailContent = wrapper.querySelector('#cvDetailEditor').textContent.trim();

      const errors = [...imageCountErrors(wrapper.querySelector('[data-img-uploader]'))];
      if (!name) errors.push('상품명을 입력해주세요.');
      if (!cat1.value) errors.push('카테고리 1차를 선택해주세요.');
      errors.push(...priceErrors(wrapper.querySelector('#cvPrice').value, '공급가'));
      errors.push(...qtyErrors(stockInput.value, '보유수량'));
      errors.push(...qtyErrors(availableQtyInput.value, '판매가능수량'));
      if (availableQty > stock) errors.push('판매가능수량은 보유수량을 초과할 수 없습니다.');

      const banner = wrapper.querySelector('#cvFormErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      const code = listing.sourceCode; // 전환해도 상품코드는 유지한다(상품출처만 내소매상품 → 내도매상품으로 변경).
      const today = mockNowStamp();

      // 도매정보는 새로 입력하고, 기존 소매정보(카테고리·가격·수령방식 등)는 그대로 유지(상속)한다.
      PRODUCT_LIST.unshift({
        code, name, cat1: cat1.value, cat2: cat2.value || null,
        scope, price, unit: unit || '-', stock, wholesaleVisible,
        origin, expiry, retailExposed: listing.exposed, retailAllocatedQty: availableQty,
        detailContent, saleStatus: stock === 0 ? 'soldout' : 'active',
        createdAt: today, updatedAt: today,
      });

      Object.assign(listing, {
        source: 'own', sourceCode: code,
        origin, expiry, detailContent, availableQty, updatedAt: today,
      });
      delete listing.stock; // 전환 후 보유수량은 PRODUCT_LIST(도매)가 기준이 되며, listing 자체 보유수량 필드는 더 이상 사용하지 않는다.

      currentConvertRef = null;
      currentItem = 'wholesale-product-mylist';
      renderAll();
    });
  }

  function orderReceiveCounts() {
    const mine = myOrders();
    const counts = { all: mine.length };
    ORDER_TAB1_DEFS.forEach(t => { if (t.id !== 'all') counts[t.id] = mine.filter(o => orderTabGroup(o) === t.id).length; });
    return counts;
  }

  function orderReceiveRows() {
    let rows = myOrders();
    if (orderReceiveSearch) {
      rows = rows.filter(o => searchMatch(orderReceiveSearch, o.orderNo, wsBuyerCompany(o), ...(o.items || []).map(i => i.name)));
    }
    if (orderReceiveDateFrom) {
      const from = inputDateToOrderDate(orderReceiveDateFrom);
      rows = rows.filter(o => orderDatePart(o) >= from);
    }
    if (orderReceiveDateTo) {
      const to = inputDateToOrderDate(orderReceiveDateTo);
      rows = rows.filter(o => orderDatePart(o) <= to);
    }
    if (orderReceivePayMethod !== 'all') {
      rows = rows.filter(o => o.paymentMethod === orderReceivePayMethod);
    }
    if (orderReceiveTab1 !== 'all') {
      rows = rows.filter(o => orderTabGroup(o) === orderReceiveTab1);
    }
    if (orderReceiveTab2 !== 'all') {
      if (orderReceiveTab2 === '반려') {
        // 반려(취소반려/반품반려)는 처리상태가 원래 트랙으로 복귀해 있어 탭1 어디에도 몰려있지 않으므로, 반려 건만 모아보는 용도의 2차 필터값
        rows = rows.filter(o => o.cancelReturnStatus === '취소반려' || o.cancelReturnStatus === '반품반려');
      } else {
        rows = rows.filter(o => o.paymentStatus === orderReceiveTab2);
      }
    }
    return rows.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
  }

  // 도매 처리 단계 — 주문접수 → 배송대기 → 배송중 → 배송확정. 배송확정은 확인 팝업을 거치며 되돌릴 수 없다.
  const WS_STAGE_SEQ = ['주문접수', '배송대기', '배송중', '배송확정'];
  function wsOrderIsActive(o) {
    const g = orderTabGroup(o);
    return g !== 'cr-req' && g !== 'cr-approved' && g !== '배송확정';
  }
  function wsStageNext(o) {
    const i = WS_STAGE_SEQ.indexOf(o.processStatus);
    return i >= 0 && i < WS_STAGE_SEQ.length - 1 ? WS_STAGE_SEQ[i + 1] : null;
  }
  function wsStagePrev(o) {
    const i = WS_STAGE_SEQ.indexOf(o.processStatus);
    return i > 0 && i < WS_STAGE_SEQ.length - 1 ? WS_STAGE_SEQ[i - 1] : null;
  }
  function wsNextButtonHTML(o) {
    if (!wsOrderIsActive(o)) return '';
    const next = wsStageNext(o);
    if (!next) return '';
    if (next === '배송확정') {
      const label = o.paymentStatus === '결제대기' ? '결제·배송확정' : '배송확정';
      return `<button type="button" class="btn-primary" data-supplier-delivery-confirm="${o.orderNo}">${label}</button>`;
    }
    return `<button type="button" class="btn-primary" data-ws-next-stage="${o.orderNo}" data-stage="${next}">${next}</button>`;
  }
  function wsRevertButtonHTML(o) {
    if (!wsOrderIsActive(o) || !wsStagePrev(o)) return '';
    return `<button type="button" class="btn-revert" data-ws-revert="${o.orderNo}">${REVERT_ICON_HTML}되돌리기</button>`;
  }
  function wsPaymentButtonHTML(o, inList) {
    const g = orderTabGroup(o);
    // 취소·반품 요청·승인 건은 취소·반품 처리가 진행 중이거나 종결된 상태이므로 결제확인 버튼을 노출하지 않는다.
    if (g === 'cr-req' || g === 'cr-approved') return '';
    // 목록에서는 주문접수·배송대기 단계에만 노출한다. 배송중은 [결제·배송확정]으로 통합되어 있어 상세에서만 결제확인한다.
    if (inList && o.processStatus !== '주문접수' && o.processStatus !== '배송대기') return '';
    return paymentConfirmButtonHTML(o, inList);
  }
  // 취소·반품처리 — 요청 건은 조정 모드, 배송중은 반품처리, 주문접수·배송대기는 취소처리. 배송확정 후에는 없다.
  function wsCancelButtonHTML(o) {
    const g = orderTabGroup(o);
    if (g === 'cr-req') {
      const crType = orderCrType(o);
      return `<button type="button" class="btn-primary" data-supplier-cr-open="${o.orderNo}" data-cr-type="${crType}">${crType}처리</button>`;
    }
    if (g === 'cr-approved' || g === '배송확정') return '';
    return o.processStatus === '배송중'
      ? `<button type="button" class="btn-danger" data-supplier-cr-open="${o.orderNo}" data-cr-type="반품">반품처리</button>`
      : `<button type="button" class="btn-danger" data-supplier-cr-open="${o.orderNo}" data-cr-type="취소">취소처리</button>`;
  }

  // 관리 컬럼(목록) — 버튼은 한 줄로 배치하며 순서는 다음단계 | 결제확인 | 취소·반품처리 | 상세보기 | 되돌리기(회색 텍스트)다.
  function orderRowActionsHTML(o) {
    return `
      <div class="row-actions row-actions-stack">
        ${wsNextButtonHTML(o)}
        ${wsPaymentButtonHTML(o, true)}
        ${wsCancelButtonHTML(o)}
        <button type="button" data-order-detail="${o.orderNo}">상세보기</button>
        ${wsRevertButtonHTML(o)}
      </div>`;
  }

  // 일괄변경 — 반영 가능 조건(선택 건 중 조건에 맞는 건만 반영)
  const WS_BULK_OPTIONS = ['배송대기', '배송중'];
  function wsBulkCanApply(o, label) {
    const g = orderTabGroup(o);
    if (g === 'cr-req' || g === 'cr-approved') return false;
    if (label === '배송대기') return o.processStatus === '주문접수';
    if (label === '배송중') return o.processStatus === '배송대기';
    return false;
  }
  function wsBulkApply(o, label) {
    o.processedAt = mockNowStamp(); // 처리시점 — 배송중이면 자동 배송확정 기준일
    o.processStatus = label;
  }
  function bindWsStageButtons(wrapper, rerender, includeCr) {
    wrapper.querySelectorAll('[data-ws-next-stage]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = ORDER_LIST.find(x => x.orderNo === btn.dataset.wsNextStage);
        if (!o) return;
        o.processedAt = mockNowStamp(); // 처리시점 — 배송중이면 자동 배송확정 기준일
        o.processStatus = btn.dataset.stage;
        rerender();
      });
    });
    wrapper.querySelectorAll('[data-ws-revert]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = ORDER_LIST.find(x => x.orderNo === btn.dataset.wsRevert);
        const prev = o && wsStagePrev(o);
        if (!prev) return;
        o.processedAt = mockNowStamp(); // 되돌리면 처리시점이 되돌린 시점으로 갱신된다(배송중 해제 시 자동 배송확정 기준일 초기화)
        o.processStatus = prev;
        rerender();
      });
    });
    if (includeCr) {
      wrapper.querySelectorAll('[data-supplier-cr-open]').forEach(btn => {
        btn.addEventListener('click', () => openSupplierCrModal(btn.dataset.supplierCrOpen, btn.dataset.crType));
      });
    }
  }

  function pageOrderReceiveHTML() {
    const counts = orderReceiveCounts();
    const rows = orderReceiveRows();
    const pgOr = pgSlice('orderReceive', JSON.stringify([orderReceiveSearch, orderReceiveDateFrom, orderReceiveDateTo, orderReceivePayMethod, orderReceiveTab1, orderReceiveTab2]), rows, { onMove: () => wsOrderChecked.clear() });
    selCountReg.orderReceive = () => pgOr.rows.filter(o => wsOrderChecked.has(o.orderNo)).length;

    const tab1HTML = ORDER_TAB1_DEFS.map(t => `
      <button type="button" class="tab-btn ${orderReceiveTab1 === t.id ? 'active' : ''}" data-order-tab1="${t.id}">
        ${t.label}<span class="tab-count">${t.id === 'all' ? counts.all : counts[t.id]}</span>
      </button>`).join('');

    const tab2Defs = [{ id: 'all', label: '전체' }, { id: '결제대기', label: '결제대기' }, { id: '결제완료', label: '결제완료' }, { id: '결제취소', label: '결제취소' }, { id: '반려', label: '반려' }];
    const tab2HTML = tab2Defs.map(t => `
      <button type="button" class="tab-btn-sub ${orderReceiveTab2 === t.id ? 'active' : ''}" data-order-tab2="${t.id}">${t.label}</button>`).join('');

    const tr = pgOr.rows.map(o => {
      const itemsLabel = o.items.length > 1 ? `${escapeHtml(o.items[0].name)} 외 ${o.items.length - 1}건` : escapeHtml(o.items[0].name);
      return `
        <tr>
          <td class="col-check"><input type="checkbox" data-ws-order-check="${o.orderNo}" ${wsOrderChecked.has(o.orderNo) ? 'checked' : ''}></td>
          <td>${o.orderNo}</td>
          <td>${o.createdAt}</td>
          <td>${escapeHtml(wsBuyerCompany(o))}</td>
          <td>${itemsLabel}</td>
          <td>${o.paymentMethod === 'card' ? '카드결제' : '계좌이체'}</td>
          <td>${paymentStatusHTML(o)}</td>
          <td>${o.processStatus ? statusTag(o.processStatus) : '-'}</td>
          <td>${orderBadgeHTML(o) || '-'}</td>
          <td class="num">${o.grandTotal.toLocaleString()}원</td>
          <td class="col-actions">${orderRowActionsHTML(o)}</td>
        </tr>`;
    }).join('');

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>주문접수관리</h2>
          </div>

          <div class="filter-bar">
            <select class="filter-select" id="orderReceivePayMethodSelect">
              <option value="all" ${orderReceivePayMethod === 'all' ? 'selected' : ''}>결제수단 전체</option>
              <option value="card" ${orderReceivePayMethod === 'card' ? 'selected' : ''}>카드결제</option>
              <option value="transfer" ${orderReceivePayMethod === 'transfer' ? 'selected' : ''}>계좌이체</option>
            </select>
            <span class="fb-group fb-dates"><input class="filter-select" type="date" id="orderReceiveDateFrom" value="${orderReceiveDateFrom}">
            <span class="fb-tilde">~</span>
            <input class="filter-select" type="date" id="orderReceiveDateTo" value="${orderReceiveDateTo}"></span>
            <span class="fb-group fb-search"><input class="search-input" type="text" id="orderReceiveSearchInput" placeholder="주문번호, 주문자명, 상품명 검색" value="${escapeHtml(orderReceiveSearch)}">
            <button type="button" class="btn-secondary" id="orderReceiveSearchBtn">검색</button></span>
          </div>

          <div class="tab-row">${tab1HTML}</div>
          <div class="tab-row-sub">${tab2HTML}</div>

          <div class="table-toolbar">
            ${selCountHTML('orderReceive', rows.length, selCountReg.orderReceive())}
            <div class="bulk-bar">
              <select class="filter-select" id="wsBulkSelect">
                <option value="">처리 선택</option>
                ${WS_BULK_OPTIONS.map(l => `<option value="${l}">${l}</option>`).join('')}
              </select>
              <button type="button" class="btn-secondary" id="wsBulkApplyBtn">일괄변경</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="tpl-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="wsOrderCheckAll"></th>
                  <th class="c-l">주문번호</th><th class="c-m">주문일시</th><th class="c-m">주문자</th><th class="c-flex">상품정보</th>
                  <th class="c-s">결제수단</th><th class="c-s">결제상태</th><th class="c-s">처리상태</th><th class="c-s">취소·반품</th><th class="c-m">합계금액</th><th class="col-actions">관리</th>
                </tr>
              </thead>
              <tbody>${tr || `<tr><td colspan="11" style="text-align:center; color:var(--text-secondary); padding:32px 0;">해당 조건의 주문이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>

          ${pgOr.html}

        </div>
      </div>`;
  }

  function renderOrderReceivePage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageOrderReceiveHTML();

    wrapper.querySelectorAll('[data-order-tab1]').forEach(btn => {
      btn.addEventListener('click', () => {
        orderReceiveTab1 = btn.dataset.orderTab1;
        orderReceiveTab2 = 'all';
        renderOrderReceivePage();
      });
    });
    wrapper.querySelectorAll('[data-order-tab2]').forEach(btn => {
      btn.addEventListener('click', () => {
        orderReceiveTab2 = btn.dataset.orderTab2;
        renderOrderReceivePage();
      });
    });

    const searchInput = wrapper.querySelector('#orderReceiveSearchInput');
    function runSearch() { orderReceiveSearch = searchInput.value.trim(); renderOrderReceivePage(); }
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    wrapper.querySelector('#orderReceiveSearchBtn').addEventListener('click', runSearch);

    wrapper.querySelector('#orderReceiveDateFrom').addEventListener('change', e => {
      orderReceiveDateFrom = e.target.value;
      renderOrderReceivePage();
    });
    wrapper.querySelector('#orderReceiveDateTo').addEventListener('change', e => {
      orderReceiveDateTo = e.target.value;
      renderOrderReceivePage();
    });
    wrapper.querySelector('#orderReceivePayMethodSelect').addEventListener('change', e => {
      orderReceivePayMethod = e.target.value;
      renderOrderReceivePage();
    });

    wrapper.querySelectorAll('[data-order-detail]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentOrderDetailNo = btn.dataset.orderDetail;
        currentOrderDetailFrom = 'wholesale-order-receive';
        currentItem = 'wholesale-order-detail';
        renderAll();
      });
    });

    // 결제확인 — 결제상태만 결제완료로 전환한다. 처리상태는 변경하지 않는다.
    wrapper.querySelectorAll('[data-payment-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = ORDER_LIST.find(x => x.orderNo === btn.dataset.paymentConfirm);
        if (!o) return;
        o.paymentStatus = '결제완료';
        o.paidAt = mockNowStamp(); // 결제완료 일시 — 매출조회 결제총액의 기준일
        renderOrderReceivePage();
      });
    });

    // 다음 단계 · 되돌리기 · 취소·반품처리 — 목록 관리 컬럼 버튼
    bindWsStageButtons(wrapper, renderOrderReceivePage, true);

    // 일괄변경 — 선택한 주문 중 반영 가능한 건만 처리한다.
    const wsRows = pgPageRows('orderReceive', orderReceiveRows());
    const wsCheckAll = wrapper.querySelector('#wsOrderCheckAll');
    wrapper.querySelectorAll('[data-ws-order-check]').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) wsOrderChecked.add(chk.dataset.wsOrderCheck); else wsOrderChecked.delete(chk.dataset.wsOrderCheck);
        wsCheckAll.checked = wsRows.length > 0 && wsRows.every(o => wsOrderChecked.has(o.orderNo));
      });
    });
    wsCheckAll.checked = wsRows.length > 0 && wsRows.every(o => wsOrderChecked.has(o.orderNo));
    wsCheckAll.addEventListener('change', () => {
      wsRows.forEach(o => { if (wsCheckAll.checked) wsOrderChecked.add(o.orderNo); else wsOrderChecked.delete(o.orderNo); });
      wrapper.querySelectorAll('[data-ws-order-check]').forEach(chk => { chk.checked = wsCheckAll.checked; });
    });
    wrapper.querySelector('#wsBulkApplyBtn').addEventListener('click', () => {
      const label = wrapper.querySelector('#wsBulkSelect').value;
      runBulkChange({
        rows: wsRows, checked: wsOrderChecked, label, note: BULK_NOTI_NOTE_WHOLESALE,
        canApply: o => wsBulkCanApply(o, label),
        apply: o => wsBulkApply(o, label),
        onDone: renderOrderReceivePage,
      });
    });

    // 배송확정 버튼 — 셀렉이 아닌 별도 확인 팝업을 거친다(상세 화면과 동일한 방식).
    wrapper.querySelectorAll('[data-supplier-delivery-confirm]').forEach(btn => {
      btn.addEventListener('click', () => {
        openSupplierDeliveryConfirmModal(btn.dataset.supplierDeliveryConfirm);
      });
    });

    // 취소/반품 승인·반려는 구매자가 제출한 요청 사유를 확인해야 하는 처리이므로 리스트가 아닌 상세 화면(renderOrderDetailPage)에서 처리한다.
  }

  // ---- 주문 상세 (주문접수관리 > 상세보기) ----
  // 조정 모드(구매자 요청 건) 처리 방식 — 승인/반려 2지선다만 제공한다(요청·철회 옵션 없음).
  function crStatusOptions(crType) {
    return [
      { value: `${crType}승인`, label: '승인' },
      { value: `${crType}반려`, label: '반려' },
    ];
  }

  // ---- 취소·반품 처리 팝업 공통(도매·소매) — 금액 조회·환불 입력·환불 방법 ----
  // 환불액은 "총환불금액" 하나로 저장하며, 매출조회의 취소·환불액은 이 값을 그대로 합산한다.
  // - 카드결제: 전체환불 고정, 총환불금액 = 총 결제금액(수정불가). PG사를 통해 환불한다.
  // - 도매 계좌이체: 전체환불이면 총환불금액 = 총 결제금액(수정불가). 부분환불이면 상품환불금액(상품금액 이내) +
  //   배송비 포함 여부를 합산한 값이 총환불금액이 된다(수정불가).
  // - 소매 계좌이체·현장결제: 전체환불이면 총환불금액 = 총 결제금액(수정불가). 부분환불이면 총환불금액을
  //   총 결제금액 이내로 직접 입력한다.
  // - 결제대기 건: 결제된 금액이 없으므로 금액 조회·환불 입력·환불 방법 영역을 모두 노출하지 않고 안내만 남긴다.
  // - 총환불금액이 0원이면 처리 버튼을 비활성화하고 오류 문구를 노출한다.
  function crItemsTotal(o) {
    return o.itemsTotal != null ? o.itemsTotal : o.items.reduce((sum, i) => sum + i.price * i.qty, 0);
  }

  // 도매 부분환불에서 "배송비 포함" 체크박스를 둘 수 있는지 — 무료배송·착불(결제금액에 배송비 0원) 건은 대상이 아니다.
  function crShipRefundable(o) {
    return o.shippingMethod !== 'free' && o.shippingMethod !== 'cod' && (o.shippingFee || 0) > 0;
  }

  function crInfoFieldHTML(label, valueHTML) {
    return `
      <div class="form-field">
        <label>${label}</label>
        <span style="font-size:14px; color:var(--text-body);">${valueHTML}</span>
      </div>`;
  }

  function crAmountRowHTML(label, valueHTML, isTotal) {
    return `
        <div class="cr-amount-row${isTotal ? ' cr-amount-total' : ''}"><span class="cr-amount-label">${label}</span><span class="cr-amount-value">${valueHTML}</span></div>`;
  }

  function crAmountSummaryHTML(o, kind) {
    const rows = [crAmountRowHTML('상품금액', `${crItemsTotal(o).toLocaleString()}원`)];
    if (kind === 'wholesale') rows.push(crAmountRowHTML('배송비', escapeHtml(orderShippingLabel(o))));
    else if (o.salesMethod === 'delivery') rows.push(crAmountRowHTML('배달비', `${(o.shippingFee || 0).toLocaleString()}원`));
    if (o.cardFeeAmount) rows.push(crAmountRowHTML('결제수수료', `${o.cardFeeAmount.toLocaleString()}원`));
    rows.push(crAmountRowHTML('총 결제금액', `${o.grandTotal.toLocaleString()}원`, true));
    return `<div class="cr-amount-list">${rows.join('')}
      </div>`;
  }

  function crWholesaleFullHint(o) {
    return `총 결제금액(${o.cardFeeAmount ? '배송비+상품금액+결제수수료' : '배송비+상품금액'})`;
  }

  function crRefundInputsHTML(o, p, kind) {
    const isCard = o.paymentMethod === 'card';
    const radiosHTML = `
      <div class="form-field form-field-wide">
        <label>환불구분</label>
        <div class="radio-row">
          <label><input type="radio" name="${p}RefundType" value="full" checked ${isCard ? 'disabled' : ''}> 전체환불</label>
          <label><input type="radio" name="${p}RefundType" value="partial" ${isCard ? 'disabled' : ''}> 부분환불</label>
        </div>
      </div>`;
    const errorHTML = `<div class="field-error" id="${p}RefundError" hidden>환불금액을 입력해주세요.</div>`;

    if (kind === 'wholesale') {
      const itemsTotal = crItemsTotal(o);
      const partialHTML = isCard ? '' : `
      <div class="form-field form-field-wide" id="${p}PartialBlock" hidden>
        <label>상품환불금액</label>
        <input class="form-input" type="number" id="${p}ProductRefundAmount" min="0" max="${itemsTotal}" value="${itemsTotal}">
        <div class="field-hint">상품금액(${itemsTotal.toLocaleString()}원) 이내로 입력해주세요.</div>
        ${crShipRefundable(o) ? `<label style="margin-top:4px;"><input type="checkbox" id="${p}ShipIncluded" checked> 배송비 포함 (${o.shippingFee.toLocaleString()}원)</label>` : ''}
      </div>`;
      return `${radiosHTML}${partialHTML}
      <div class="form-field form-field-wide">
        <label>총환불금액</label>
        <input class="form-input" type="number" id="${p}TotalRefundAmount" value="${o.grandTotal}" disabled>
        <div class="field-hint" id="${p}TotalHint">${crWholesaleFullHint(o)}</div>
        ${errorHTML}
      </div>`;
    }

    return `${radiosHTML}
      <div class="form-field form-field-wide">
        <label>총환불금액</label>
        <input class="form-input" type="number" id="${p}TotalRefundAmount" min="0" max="${o.grandTotal}" value="${o.grandTotal}" disabled>
        ${isCard ? '' : `<div class="field-hint">총 결제금액(${o.grandTotal.toLocaleString()}원) 이내로 입력해주세요.</div>`}
        ${errorHTML}
      </div>`;
  }

  // 환불 방법 — 계좌이체만 환불계좌를 입력받고, 카드결제·현장결제는 안내 문구만 노출한다.
  function crRefundMethodHTML(o, p) {
    if (o.paymentMethod === 'card') return `
      <div class="form-field form-field-wide">
        <div class="field-hint">카드결제 건은 승인 시 PG사를 통해 자동으로 결제가 취소됩니다.</div>
      </div>`;
    if (o.paymentMethod === 'onsite') return `
      <div class="form-field form-field-wide">
        <div class="field-hint">현장결제 건은 별도 환불계좌 없이 현장에서 직접 환불 처리합니다.</div>
      </div>`;
    return `
      <div class="form-field">
        <label>환불은행</label>
        <input class="form-input" type="text" id="${p}RefundBank" placeholder="예: 신한은행" value="${escapeHtml(o.refundBank || '')}">
      </div>
      <div class="form-field">
        <label>예금주</label>
        <input class="form-input" type="text" id="${p}RefundHolder" placeholder="예금주명을 입력해주세요." value="${escapeHtml(o.refundHolder || '')}">
      </div>
      <div class="form-field form-field-wide">
        <label>환불계좌번호</label>
        <input class="form-input" type="text" id="${p}RefundAccount" data-fmt="account" inputmode="numeric" maxlength="20" placeholder="'-' 없이 숫자만 입력" value="${escapeHtml(o.refundAccount || '')}">
      </div>`;
  }

  // 승인 시 노출되는 환불 영역 전체(조정 모드에서 반려를 선택하면 통째로 숨긴다).
  // 구획선으로 [금액 조회] / [환불구분·총환불금액·환불 방법] 두 블록을 나눈다. 결제대기 건은 안내 1블록만 둔다.
  function crRefundSectionHTML(o, p, kind) {
    if (o.paymentStatus === '결제대기') return `
      <hr class="modal-divider">
      <div class="field-hint">결제 대기 중인 주문으로 환불은 진행되지 않습니다.</div>`;
    return `
      <hr class="modal-divider">
      ${crAmountSummaryHTML(o, kind)}
      <hr class="modal-divider">
      <div class="form-grid">
        ${crRefundInputsHTML(o, p, kind)}
        ${crRefundMethodHTML(o, p)}
      </div>`;
  }

  // 취소·반품 처리 팝업 공통 골격 — 제목 / 처리 정보 / 처리 방식(조정 모드) / 환불 영역 / 사유·재고 반영 / 버튼을
  // 구획선으로 나눈다. 도매·소매가 같은 배치를 쓰도록 골격을 한 곳에서 만든다.
  function crModalShellHTML({ p, title, infoHTML, statusRadioHTML, refundSectionHTML, reason, note, notePlaceholder, stockRestoreHTML, submitLabel }) {
    return `
      <div class="modal-scrim" id="${p}ModalScrim">
        <div class="modal-box">
          <h3>${title}</h3>
          <hr class="modal-divider">
          <div class="form-grid">${infoHTML}</div>
          ${statusRadioHTML ? `
          <hr class="modal-divider">
          <div class="form-grid">${statusRadioHTML}</div>` : ''}
          <div id="${p}RefundSection">${refundSectionHTML}</div>
          <hr class="modal-divider">
          <div class="form-grid">
            ${reason ? `
            <div class="form-field form-field-wide">
              <label>구매자 요청 사유</label>
              <div class="field-hint">${escapeHtml(reason)}</div>
            </div>` : ''}
            <div class="form-field form-field-wide">
              <label>공급자 처리 사유</label>
              <textarea class="form-input" id="${p}NoteInput" rows="3" placeholder="${notePlaceholder}">${escapeHtml(note || '')}</textarea>
            </div>
          </div>
          ${stockRestoreHTML}
          <hr class="modal-divider">
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="${p}ModalCancelBtn">닫기</button>
            <button type="button" class="btn-primary" id="${p}ModalSubmitBtn">${submitLabel}</button>
          </div>
        </div>
      </div>`;
  }

  function crClampInt(value, min, max) {
    let v = parseInt(value, 10);
    if (isNaN(v)) v = 0;
    return Math.min(Math.max(v, min), max);
  }

  // 제출 시점의 환불 결정값 — 총환불금액은 항상 이 함수로 계산해 화면 표시값과 저장값이 어긋나지 않게 한다.
  function readCrRefund(root, o, p, kind) {
    const itemsTotal = crItemsTotal(o);
    const shipRefundable = kind === 'wholesale' && crShipRefundable(o);
    const checked = root.querySelector(`input[name="${p}RefundType"]:checked`);
    const refundType = o.paymentMethod === 'card' ? 'full' : (checked ? checked.value : 'full');
    if (refundType === 'full') {
      return kind === 'wholesale'
        ? { refundType, totalRefundAmount: o.grandTotal, productRefundAmount: itemsTotal, shippingFeeRefunded: shipRefundable }
        : { refundType, totalRefundAmount: o.grandTotal };
    }
    if (kind === 'wholesale') {
      const productRefundAmount = crClampInt(root.querySelector(`#${p}ProductRefundAmount`).value, 0, itemsTotal);
      const shipCheckbox = root.querySelector(`#${p}ShipIncluded`);
      const shippingFeeRefunded = !!(shipCheckbox && shipCheckbox.checked);
      return { refundType, productRefundAmount, shippingFeeRefunded,
        totalRefundAmount: productRefundAmount + (shippingFeeRefunded ? o.shippingFee : 0) };
    }
    return { refundType, totalRefundAmount: crClampInt(root.querySelector(`#${p}TotalRefundAmount`).value, 0, o.grandTotal) };
  }

  // 환불 입력 조작 바인딩 — 반환하는 validate()는 총환불금액이 0원 초과인지 확인해 오류 문구를 토글한다.
  function bindCrRefundInputs(root, o, p, kind) {
    const totalInput = root.querySelector(`#${p}TotalRefundAmount`);
    if (o.paymentStatus === '결제대기' || !totalInput) return { validate: () => true };
    const errorEl = root.querySelector(`#${p}RefundError`);
    const partialBlock = root.querySelector(`#${p}PartialBlock`);
    const totalHint = root.querySelector(`#${p}TotalHint`);

    const validate = () => {
      const r = readCrRefund(root, o, p, kind);
      if (kind === 'wholesale') totalInput.value = r.totalRefundAmount;
      const ok = r.totalRefundAmount > 0;
      if (errorEl) errorEl.hidden = ok;
      return ok;
    };
    root.querySelectorAll(`input[name="${p}RefundType"]`).forEach(radio => {
      radio.addEventListener('change', () => {
        const isPartial = root.querySelector(`input[name="${p}RefundType"]:checked`).value === 'partial';
        if (kind === 'wholesale') {
          if (partialBlock) partialBlock.hidden = !isPartial;
          if (totalHint) totalHint.textContent = isPartial ? '상품환불금액과 배송비를 합산한 금액입니다.' : crWholesaleFullHint(o);
        } else {
          totalInput.disabled = !isPartial;
          if (!isPartial) totalInput.value = o.grandTotal;
        }
        root.dispatchEvent(new Event('cr-refund-change'));
      });
    });
    [`#${p}ProductRefundAmount`, `#${p}ShipIncluded`].forEach(sel => {
      const el = root.querySelector(sel);
      if (el) el.addEventListener('input', () => root.dispatchEvent(new Event('cr-refund-change')));
      if (el) el.addEventListener('change', () => root.dispatchEvent(new Event('cr-refund-change')));
    });
    if (kind !== 'wholesale') totalInput.addEventListener('input', () => root.dispatchEvent(new Event('cr-refund-change')));
    return { validate };
  }

  // 승인/반려 선택과 환불 입력 상태에 따라 처리 버튼 활성 여부를 갱신한다 — 반려는 환불이 없으므로 항상 처리 가능하다.
  function bindCrSubmitState(root, p, refundCtl, isApproved) {
    const submitBtn = root.querySelector(`#${p}ModalSubmitBtn`);
    const update = () => { submitBtn.disabled = isApproved() ? !refundCtl.validate() : false; };
    root.addEventListener('cr-refund-change', update);
    update();
    return update;
  }

  // 승인 확정 시 주문에 환불 결정값을 기록한다(결제대기 건은 환불이 없으므로 호출하지 않는다).
  function applyCrRefund(o, decision, kind) {
    o.refundType = decision.refundType;
    o.totalRefundAmount = decision.totalRefundAmount;
    if (kind === 'wholesale') {
      o.productRefundAmount = decision.productRefundAmount;
      o.shippingFeeRefunded = decision.shippingFeeRefunded;
    }
  }

  // 주문상세 환불정보 — 승인으로 확정된 환불값(환불구분·총환불금액)을 조회 전용으로 표시한다.
  // 도매 부분환불은 총환불금액의 구성(상품환불금액·배송비 포함 여부)을 함께 표시한다.
  function crRefundDetailHTML(o, kind) {
    if (!o.refundType) return '';
    const partialRows = kind === 'wholesale' && o.refundType === 'partial' ? `
      <div class="detail-item"><span class="detail-label">상품환불금액</span><span class="detail-value">${(o.productRefundAmount || 0).toLocaleString()}원</span></div>
      <div class="detail-item"><span class="detail-label">배송비 환불</span><span class="detail-value">${o.shippingFeeRefunded ? `포함(${(o.shippingFee || 0).toLocaleString()}원)` : '미포함'}</span></div>` : '';
    return `
      <div class="detail-item"><span class="detail-label">환불구분</span><span class="detail-value">${o.refundType === 'partial' ? '부분환불' : '전체환불'}</span></div>
      <div class="detail-item"><span class="detail-label">총환불금액</span><span class="detail-value">${(o.totalRefundAmount || 0).toLocaleString()}원</span></div>${partialRows}`;
  }

  // 취소·반품 정보 섹션 — 주문접수관리(공급자 모드) 전용. 요청이 없으면 안내 문구만 짧게 표시하고,
  // 요청이 있으면 요청 내용 조회 + 승인·반려 처리(셀렉+변경확인)를 이 섹션에서 그대로 진행한다.
  // 환불계좌는 계좌이체 결제 건에 한해 구매자가 취소·반품 요청 시점에 함께 입력하는 정보이므로, 여기서는 조회만 하고 공급자가 수정하지 않는다.
  // 취소·반품 정보 섹션 — 주문접수관리(공급자 모드) 전용. 조회만 하며, 실제 승인·반려·직권처리는
  // 하단 처리 버튼(orderDetailSupplierActionsHTML)에서 팝업(openSupplierCrModal)으로 처리한다.
  function cancelReturnSectionHTML(o, mode) {
    if (mode === 'buyer') return cancelReturnSectionBuyerHTML(o);
    if (!o.cancelReturnStatus) return '';
    const isTransfer = o.paymentMethod === 'transfer';
    const initiatorLabel = o.cancelReturnInitiator === 'noshow' ? '노쇼 처리'
      : o.cancelReturnInitiator === 'supplier' ? '공급자 직권'
      : o.cancelReturnInitiator === 'buyer' ? '구매자 즉시취소' : '구매자 요청';

    // 환불구분·환불금액은 승인 처리 시점에 결정되므로, 아직 요청 단계이거나 반려로 종결된 건에는 노출하지 않는다.
    const refundDecisionBlock = o.refundType ? `
${crRefundDetailHTML(o, o.itemsTotal != null ? 'wholesale' : 'retail')}` : '';

    const refundBlock = isTransfer && (o.paidAt || o.refundBank || o.refundAccount) ? `
      <div class="detail-item"><span class="detail-label">환불은행</span><span class="detail-value">${escapeHtml(o.refundBank || '-')}</span></div>
      <div class="detail-item"><span class="detail-label">예금주</span><span class="detail-value">${escapeHtml(o.refundHolder || '-')}</span></div>
      <div class="detail-item detail-item-wide"><span class="detail-label">환불계좌번호</span><span class="detail-value">${escapeHtml(o.refundAccount || '-')}</span></div>
    ` : '';

    return `
      <section class="form-section">
        <h3 class="form-section-title">취소·반품 정보</h3>
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-label">처리상태</span><span class="detail-value">${stateStampHTML(orderBadgeHTML(o), cancelReturnLatestAt(o))}</span></div>
          <div class="detail-item"><span class="detail-label">처리 주체</span><span class="detail-value">${initiatorLabel}</span></div>
          ${refundDecisionBlock}
          ${refundBlock}
          ${o.cancelReturnReason ? `<div class="detail-item detail-item-wide"><span class="detail-label">구매자 요청 사유</span><span class="detail-value">${escapeHtml(o.cancelReturnReason)}</span></div>` : ''}
          ${o.cancelReturnSellerNote ? `<div class="detail-item detail-item-wide"><span class="detail-label">공급자 처리 사유</span><span class="detail-value">${escapeHtml(o.cancelReturnSellerNote)}</span></div>` : ''}
        </div>
      </section>`;
  }

  // 취소·반품 정보 섹션 — 주문내역(구매자 모드) 전용. 요청·처리 결과 조회만 하며,
  // 요청 버튼은 타이틀 우측 액션(orderDetailHeaderActionsHTML)으로 이동했다.
  function cancelReturnSectionBuyerHTML(o) {
    if (!o.cancelReturnStatus) return '';
    const isTransfer = o.paymentMethod === 'transfer';
    const refundDecisionBlock = o.refundType ? `
${crRefundDetailHTML(o, o.itemsTotal != null ? 'wholesale' : 'retail')}` : '';
    const refundBlock = isTransfer && (o.paidAt || o.refundBank || o.refundAccount) ? `
      <div class="detail-item"><span class="detail-label">환불은행</span><span class="detail-value">${escapeHtml(o.refundBank || '-')}</span></div>
      <div class="detail-item"><span class="detail-label">예금주</span><span class="detail-value">${escapeHtml(o.refundHolder || '-')}</span></div>
      <div class="detail-item detail-item-wide"><span class="detail-label">환불계좌번호</span><span class="detail-value">${escapeHtml(o.refundAccount || '-')}</span></div>
    ` : '';

    return `
      <section class="form-section">
        <h3 class="form-section-title">취소·반품 정보</h3>
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-label">처리상태</span><span class="detail-value">${stateStampHTML(orderBadgeHTML(o), cancelReturnLatestAt(o))}</span></div>
          ${o.cancelReturnInitiator === 'buyer' ? `<div class="detail-item"><span class="detail-label">처리 주체</span><span class="detail-value">구매자 즉시취소</span></div>` : ''}
          ${refundDecisionBlock}
          ${refundBlock}
          <div class="detail-item detail-item-wide"><span class="detail-label">요청 사유</span><span class="detail-value">${escapeHtml(o.cancelReturnReason || '-')}</span></div>
          ${o.cancelReturnSellerNote ? `<div class="detail-item detail-item-wide"><span class="detail-label">공급자 처리 사유</span><span class="detail-value">${escapeHtml(o.cancelReturnSellerNote)}</span></div>` : ''}
        </div>
      </section>`;
  }

  // 취소요청 · 반품요청 · 배송확정 — 주문내역(구매자 모드) 상세 하단 처리 영역(.market-buybar) 버튼.
  // 이미 취소·반품을 요청했거나 배송확정이 끝난 건에는 노출하지 않는다. 공급자 모드는 orderDetailSupplierActionsHTML을 별도로 사용한다.
  // 배송 정보 > 처리상태 — [상태] 처리시점을 한 줄로 표기한다. 배송중인 동안에는 자동 배송확정 예정일시를 함께 표기한다.
  function wholesaleProcessStatusHTML(o) {
    if (!o.processStatus) return '-';
    const baseAt = o.processStatus === '배송중' ? wholesaleAutoConfirmBaseAt(o) : null;
    const note = baseAt ? `(${stampAddDays(baseAt, RETURN_WINDOW_DAYS)} 자동배송확정)` : '';
    return stateStampHTML(statusTag(o.processStatus), baseAt || orderProcessedAt(o), note);
  }

  function orderDetailHeaderActionsHTML(o) {
    if (o.cancelReturnStatus === '반품반려' && o.processStatus === '배송중') {
      return `<button type="button" class="btn-primary" data-delivery-confirm="${o.orderNo}">배송확정</button>`;
    }
    if (o.cancelReturnStatus) return '';
    if (o.processStatus === '주문접수') {
      return buyerCancelButtonHTML(o);
    }
    if (o.processStatus === '배송중') {
      return `
        <button type="button" class="btn-danger" data-cr-open="${o.orderNo}" data-cr-type="반품">반품요청</button>
        <button type="button" class="btn-primary" data-delivery-confirm="${o.orderNo}">배송확정</button>`;
    }
    return '';
  }

  // 취소·반품 처리 · 처리상태 변경 — 주문접수관리(공급자 모드) 상세 하단 처리 영역(.market-buybar) 버튼.
  // 결제확인(paymentBtn)은 결제상태가 결제대기일 때 처리상태와 무관하게 항상 함께 노출된다.
  // - 배송확정 완료 건: 되돌릴 수 없으므로 안내만 노출한다.
  // - 취소·반품 요청 진행중: 처리상태 변경은 숨기고, 취소처리·반품처리 버튼(조정 모드 팝업)만 노출한다. 버튼명은 직권 처리와 동일하게 통일한다.
  // - 취소·반품 승인 완료(종결): 추가 처리 없이 안내만 노출한다.
  // - 그 외(요청 이력 없음 또는 반려로 종료됨, "자율처리"):
  //   · 처리상태는 목록과 동일하게 셀렉+[변경확인]으로 자유롭게 변경한다(주문접수 단계도 동일).
  //   · 주문접수·배송대기 단계에서는 취소처리만, 배송중 단계에서는 반품처리만 노출한다 — 배송 진행 여부에 맞춘 제한이다.
  //   · 배송확정은 셀렉 선택지에서 분리해 배송중 단계 전용 버튼으로 노출한다 — 셀렉으로는 실수로 배송확정까지 선택될 위험이 있어
  //     주문내역(구매자 모드)의 배송확정 버튼과 동일하게 확인 팝업을 거치도록 한다. 배송확정 후에는
  //     처리상태 변경·취소처리·반품처리가 모두 불가능하다.
  function orderDetailSupplierActionsHTML(o) {
    const g = orderTabGroup(o);
    if (o.processStatus === '배송확정') {
      return `${paymentConfirmButtonHTML(o)}<span class="field-hint">배송확정 완료 — 되돌릴 수 없습니다.</span>`;
    }
    if (g === 'cr-approved') {
      return `<span class="field-hint">처리 완료된 주문입니다.</span>`;
    }
    // 상세 하단 처리 영역 — 순서는 되돌리기(텍스트) | 다음단계 | 결제확인 | 취소·반품처리다. 상세보기 버튼은 없다.
    return `${wsRevertButtonHTML(o)}${wsNextButtonHTML(o)}${wsPaymentButtonHTML(o, false)}${wsCancelButtonHTML(o)}`;
  }

  function pageOrderDetailHTML() {

    if (!o) return pagePlaceholder('주문 상세', '주문 정보를 찾을 수 없습니다.');

    // 어느 목록에서 들어왔는지에 따라 화면 성격이 달라진다.
    // supplier(주문접수관리): 내가 판매자 — 구매자 정보를 확인해야 함
    // buyer(주문내역): 내가 구매자 — 공급자 정보를 확인해야 함, 취소·반품은 요청만 가능(공급자 확인 필요)
    const mode = currentOrderDetailFrom === 'wholesale-order-status' ? 'buyer' : 'supplier';

    const counterpartyLabel = mode === 'buyer' ? '공급자' : '구매자';

    const rows = o.items.map(i => `
      <tr>

        <td class="num">${i.price.toLocaleString()}원 / ${escapeHtml(i.unit)}</td>
        <td class="num">${i.qty}</td>
        <td class="num">${(i.price * i.qty).toLocaleString()}원</td>

    return `

            <div class="table-wrap">
              <table class="tpl-table tpl-line">
                <thead><tr><th class="c-flex">상품명</th><th class="c-l">공급가/단위</th><th class="c-s">수량</th><th class="c-m">소계</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">주문 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">주문번호</span><span class="detail-value">${o.orderNo}</span></div>
              <div class="detail-item"><span class="detail-label">주문일시</span><span class="detail-value">${o.createdAt}</span></div>
              ${mode === 'buyer' ? `<div class="detail-item"><span class="detail-label">${counterpartyLabel}</span><span class="detail-value">${escapeHtml(counterpartyValue)}</span></div>` : ''}
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">주문자 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">상호명</span><span class="detail-value">${escapeHtml(wsBuyerCompany(o))}</span></div>
              <div class="detail-item"><span class="detail-label">이름</span><span class="detail-value">${escapeHtml(o.buyerName || '-')}</span></div>
              <div class="detail-item"><span class="detail-label">휴대폰번호</span><span class="detail-value">${escapeHtml(o.buyerPhone || '-')}</span></div>
              <div class="detail-item"><span class="detail-label">이메일</span><span class="detail-value">${escapeHtml(o.buyerEmail || '-')}</span></div>
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">배송 정보</h3>
            <div class="detail-grid">

              <div class="detail-item detail-item-wide"><span class="detail-label">배송지</span><span class="detail-value">${escapeHtml(o.deliveryAddress || '-')}</span></div>
              ${o.requestNote ? `<div class="detail-item detail-item-wide"><span class="detail-label">배송 요청사항</span><span class="detail-value">${escapeHtml(o.requestNote)}</span></div>` : ''}
            </div>
          </section>

          <section class="form-section">
            <h3 class="form-section-title">결제 정보</h3>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">결제상태</span><span class="detail-value">${paymentStatusDetailHTML(o)}</span></div>
              <div class="detail-item"><span class="detail-label">결제수단</span><span class="detail-value">${o.paymentMethod === 'card' ? '카드결제' : '계좌이체'}</span></div>
              ${o.paymentMethod === 'transfer' ? `<div class="detail-item"><span class="detail-label">입금자명</span><span class="detail-value">${escapeHtml(o.depositorName || '-')}</span></div>` : ''}
              <div class="detail-item"><span class="detail-label">상품금액</span><span class="detail-value">${o.itemsTotal.toLocaleString()}원</span></div>
              <div class="detail-item"><span class="detail-label">배송비</span><span class="detail-value">${escapeHtml(orderShippingLabel(o))}</span></div>
              ${o.cardFeeAmount ? `<div class="detail-item"><span class="detail-label">결제수수료</span><span class="detail-value">${o.cardFeeAmount.toLocaleString()}원</span></div>` : ''}
