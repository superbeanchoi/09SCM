  // 내소매상품 원본 — RETAIL_LISTINGS 중 source: 'retail'(도매몰과 무관하게 소매관리에서 단독 등록한 상품).
  // 다른 두 출처와 달리 보유수량을 listing 레코드가 직접 들고 있으며, 보유수량과 판매가능수량이 항상 동일하다.
  function retailOnlySourceRows() {
    return RETAIL_LISTINGS.filter(r => r.source === 'retail').map(r => ({
      source: 'retail',
      sourceCode: r.sourceCode,
      name: r.name,
      cat1: r.cat1,
      cat2: r.cat2,
      supplierName: MY_SELLER_NAME,
      origin: r.origin,
      expiry: r.expiry,
      detailContent: r.detailContent,
      purchasedAt: r.registeredAt,
      holdingQty: r.stock,
    }));
  }

  // 한 소매몰 안에서 같은 상품코드의 소매정보는 1개다(출처가 도매주문상품이어도 상품코드 단위).
  function findRetailListing(source, sourceCode) {
    return RETAIL_LISTINGS.find(r => r.source === source && r.sourceCode === sourceCode);
  }
  // 재고소진(보유수량 0)이면 판매상태는 품절, 노출여부는 미노출로 고정된다. 보유수량이 다시 생기면 잠금만 해제되고
  // 판매상태·노출여부 값은 바꾸지 않는다(품절·미노출 유지) — 판매중·노출 전환은 가맹점이 직접 한다.
  function syncRetailStockLocks() {
    RETAIL_LISTINGS.forEach(l => {
      const hold = retailListingHoldingQty(l);
      if (hold <= 0 && !l.stockLocked) { l.stockLocked = true; l.saleStatus = 'soldout'; l.exposed = false; }
      else if (hold > 0 && l.stockLocked) { l.stockLocked = false; }
    });
  }

  // 목록/상세에서 공통으로 쓰는 결합 뷰모델 — 원본 데이터 + 등록된 소매정보(있으면)를 합친다.
  function retailListingRows() {
    const own = retailOwnSourceRows().map(src => ({ src, listing: findRetailListing('own', src.sourceCode) }));
    const purchase = retailPurchaseSourceRows().map(src => ({ src, listing: findRetailListing('purchase', src.sourceCode) }));
    const retailOnly = retailOnlySourceRows().map(src => ({ src, listing: findRetailListing('retail', src.sourceCode) }));
    return [...own, ...purchase, ...retailOnly].map(({ src, listing }) => {
      const holdingQty = src.holdingQty;
      const availableQty = listing ? listing.availableQty : null;
      const exposed = listing ? retailEffectiveExposed(listing) : false;
      const saleStatus = listing ? retailEffectiveSaleStatus(listing) : null;
      return {
        src, listing,
        displayName: listing ? listing.name : src.name,
        cat1: listing ? listing.cat1 : null,
        cat2: listing ? listing.cat2 : null,
        listPrice: listing ? listing.listPrice : null,
        salePrice: listing ? listing.salePrice : null,
        holdingQty, availableQty, exposed, saleStatus,
        canRegister: !listing && holdingQty > 0,
        registeredAt: listing ? listing.registeredAt : null,
        updatedAt: listing ? listing.updatedAt : null,
        chatOrderEnabled: listing ? !!listing.chatOrderEnabled : false,
      };
    });
  }

  // 목업 기준 "오늘" — 방금 발생한 주문·처리 일시(mockNowStamp)와 동일한 기준일을 사용해
  // 픽업가능기간 경과 여부·노쇼후보 판정 전반에 일관되게 적용한다. 실제 서비스에서는 매일 갱신되는 서버 현재일이다.
  const RETAIL_MOCK_TODAY = '2026-09-20';

  // 픽업가능종료일 경과 여부 — 수령방식이 배달 단독인 상품은 픽업가능기간 자체가 없으므로 항상 false.
  function retailPickupExpired(listing) {
    return !!listing && listing.salesMethod !== 'delivery' && !!listing.pickupEndDate && listing.pickupEndDate < RETAIL_MOCK_TODAY;
  }

  // 소매정보의 현재 보유수량 — 출처(내도매상품: 도매수량, 도매주문상품: 구매수량, 내소매상품: 자체 보유수량)에서 읽는다.
  function retailListingHoldingQty(listing) {
    if (!listing) return 0;
    if (listing.source === 'retail') return listing.stock;
    if (listing.source === 'own') {
      const p = PRODUCT_LIST.find(x => x.code === listing.sourceCode);
      return p ? p.stock : 0;
    }
    const row = retailPurchaseSourceRows().find(r => r.sourceCode === listing.sourceCode);
    return row ? row.holdingQty : 0;
  }

  // 소매판매상태 실효값 — 보유수량 0 또는 판매가능수량 0이면 저장값과 무관하게 품절로 표시한다(자동 전환, 저장 불필요). 픽업가능종료일 경과는 판매상태에 영향을 주지 않는다.
  function retailEffectiveSaleStatus(listing) {
    if (!listing) return null;
    if (retailListingHoldingQty(listing) <= 0 || listing.availableQty === 0) { listing.saleStatus = 'soldout'; return 'soldout'; }
    return listing.saleStatus;
  }

  // 소매노출여부 실효값 — 보유수량이 0이거나 픽업가능종료일이 지나면 저장된 노출 설정과 무관하게 미노출로 표시한다(자동 전환).
  function retailEffectiveExposed(listing) {
    if (!listing) return false;
    if (retailListingHoldingQty(listing) <= 0 || retailPickupExpired(listing)) { listing.exposed = false; return false; }
    return listing.exposed;
  }

  // 보유수량 0 → 노출여부·판매상태 모두 수정 불가 / 판매가능수량 0 → 판매상태만 품절로 고정 / 픽업가능종료일 경과 → 노출여부만 미노출로 고정
  function retailLockState(holdingQty, availableQty, pickupExpired) {
    if (holdingQty <= 0) return { exposeLocked: true, statusLocked: true };
    return { exposeLocked: pickupExpired, statusLocked: availableQty <= 0 };
  }

  // 채팅주문상품명 중복확인 대상 조회 — 전체 채팅주문 허용 상품이 아니라 현재 판매중(품절이 아니고 픽업가능기간이
  // 지나지 않은)이면서 소매몰에 노출 중인 상품만 대상으로 한다(실효 판매상태·노출여부 기준 — retailEffectiveSaleStatus/
  // retailEffectiveExposed와 동일 기준). 과거에 판매를 종료해 비노출·품절로 전환된 상품의 채팅주문상품명은 대상에서
  // 제외되므로, 새 상품이 그 이름을 다시 사용할 수 있다. exclude는 수정 화면에서 현재 수정 중인 자기 자신을 중복확인
  // 대상에서 빼기 위한 선택 인자다.
  function retailActiveChatListing(name, exclude) {
    return RETAIL_LISTINGS.find(r => r !== exclude && r.chatOrderEnabled && r.chatOrderName === name &&
      retailEffectiveExposed(r) && retailEffectiveSaleStatus(r) !== 'soldout');
  }

  // 소매상품 판매가능수량 차감/복원 — 주문 품목에 저장된 소매정보 ID(listingId)로 RETAIL_LISTINGS를 찾는다.
  // ID가 없는 기존 주문 품목은 상품명(name) 또는 채팅주문상품명(chatOrderName)으로 매칭한다.
  // 판매가능수량(availableQty)만 조정한다. 보유수량은 출처(내도매상품은 PRODUCT_LIST.stock, 매입상품은 매입수량)에서
  // 별도로 관리되어 이 함수가 건드리지 않는다 — 다만 내소매상품(source:'retail')은 보유수량과 판매가능수량이 항상
  // 동일해야 하므로 stock 필드도 함께 조정한다.
  function findRetailListingByOrderItem(it) {
    if (it.listingId) return RETAIL_LISTINGS.find(r => r.id === it.listingId) || null;
    return RETAIL_LISTINGS.find(r => r.name === it.name || (r.chatOrderEnabled && r.chatOrderName === it.name)) || null;
  }
  function deductRetailAvailableQty(order) {
    order.items.forEach(it => {
      const listing = findRetailListingByOrderItem(it);
      if (!listing) return;
      listing.availableQty = Math.max(0, listing.availableQty - it.qty);
      if (listing.source === 'retail') listing.stock = listing.availableQty;
    });
  }
  function restoreRetailAvailableQty(order) {
    order.items.forEach(it => {
      const listing = findRetailListingByOrderItem(it);
      if (!listing) return;
      listing.availableQty = listing.availableQty + it.qty;
      if (listing.source === 'retail') listing.stock = listing.availableQty;
    });
  }

  // 취소·반품 처리 대상 주문에 판매가능수량으로 복원 가능한 품목이 하나라도 있는지 — 소매 취소·반품 팝업의
  // 재고 반영 체크박스 노출 여부 판단에 사용한다.
  function retailOrderHasRestorableQty(order) {
    return order.items.some(it => !!findRetailListingByOrderItem(it));
  }

  // 도매수량이 0이거나, 도매수량이 소매에 배정된 판매가능수량(retailAllocatedQty)에 다다르면(=도매 가용재고 소진)
  // 자동으로 [품절]로 전환·잠금한다. 그 외에는 공급자가 판매중/품절을 자유롭게 전환할 수 있다.
  function wholesaleLockState(stock, retailAllocatedQty) {
    const allocated = retailAllocatedQty || 0;
    return { locked: stock <= 0 || stock <= allocated };
  }

  // 도매상품의 실제 판매상태 — 잠금 상태면 무조건 품절, 그 외에는 공급자가 저장한 saleStatus를 따른다(기본값 판매중).
  function wholesaleEffectiveStatus(p) {
    if (wholesaleLockState(p.stock, p.retailAllocatedQty).locked) { p.saleStatus = 'soldout'; return 'soldout'; }
    return p.saleStatus === 'soldout' ? 'soldout' : 'active';
  }

  let retailListTab = 'all';        // all | registered | unregistered — 전체 / 소매등록 / 소매미등록
  let retailListStatus = 'all';     // all | active | soldout — 소매판매상태 셀렉
  let retailListExposed = 'all';    // all | exposed | hidden — 소매노출여부 셀렉
  let retailListChatOrder = 'all';  // all | enabled | disabled — 채팅주문여부 셀렉
  let retailListSource = 'all';     // all | purchase | own | retail — 상품출처 셀렉
  let retailListCat1 = 'all';       // 1차 카테고리 셀렉
  let retailListCat2 = 'all';       // 2차 카테고리 셀렉
  let retailListSearch = '';
  let retailListHoldingOnly = false;
  let retailListChecked = new Set(); // 삭제 가능한(소매정보 등록된) 행의 listing.id
  let retailListSort = 'latest';    // latest(최근등록순) | updated(최근수정순) | qtyAsc(보유수량 적은순)
  let currentRetailRef = null;      // 상세 진입 시 { source, sourceCode }

  // 탭 기준은 소매노출 여부가 아니라 소매정보 등록 여부다 — 미등록 건은 소매노출여부 자체가 없다.
  const RETAIL_TABS = [
    { id: 'all', label: '전체' },
    { id: 'registered', label: '소매등록' },
    { id: 'unregistered', label: '소매미등록' },
  ];

  function retailListRowsFiltered() {
    let rows = retailListingRows();
    if (retailListTab === 'registered') rows = rows.filter(r => !!r.listing);
    if (retailListTab === 'unregistered') rows = rows.filter(r => !r.listing);
    if (retailListStatus === 'active') rows = rows.filter(r => r.saleStatus === 'active');
    if (retailListStatus === 'soldout') rows = rows.filter(r => r.saleStatus === 'soldout');
    if (retailListExposed === 'exposed') rows = rows.filter(r => r.exposed);
    if (retailListExposed === 'hidden') rows = rows.filter(r => !r.exposed);
    if (retailListChatOrder === 'enabled') rows = rows.filter(r => r.chatOrderEnabled);
    if (retailListChatOrder === 'disabled') rows = rows.filter(r => !r.chatOrderEnabled);
    if (retailListSource !== 'all') rows = rows.filter(r => r.src.source === retailListSource);
    if (retailListCat1 !== 'all') rows = rows.filter(r => r.cat1 === retailListCat1);
    if (retailListCat2 !== 'all') rows = rows.filter(r => r.cat2 === retailListCat2);
    if (retailListHoldingOnly) rows = rows.filter(r => r.holdingQty > 0);
    if (retailListSearch.trim()) {
      rows = rows.filter(r => searchMatch(retailListSearch, r.src.sourceCode, r.displayName));
    }
    if (retailListSort === 'qtyAsc') {
      rows = [...rows].sort((a, b) => a.holdingQty - b.holdingQty);
    } else if (retailListSort === 'updated') {
      rows = [...rows].sort((a, b) => (b.updatedAt || b.registeredAt || b.src.purchasedAt || '').localeCompare(a.updatedAt || a.registeredAt || a.src.purchasedAt || ''));
    } else {
      rows = [...rows].sort((a, b) => (b.src.purchasedAt || '').localeCompare(a.src.purchasedAt || ''));
    }
    return rows;
  }

  const RETAIL_SOURCE_LABELS = { purchase: '도매주문상품', own: '내도매상품', retail: '내소매상품' };

  // 관리 컬럼 — 내 도매상품 목록과 동일한 [상세]/[수정] 조합을 기본으로 하되, 소매정보 미등록·재고소진 케이스를 분기한다.
  // 1) 보유수량 있음 + 미등록 → 판매상태 없음 · 노출여부 미노출 · [소매정보등록] 노출
  // 2) 보유수량 있음 + 판매가능수량 0 → 목록에는 품절로 자동 표시, 노출여부는 유지 · [상세]/[수정] 그대로 노출 (수정에서 판매가능수량을 다시 올리면 판매상태 잠금도 함께 풀린다)
  // 3) 보유수량 0 + 등록됨(재고소진) → 강제 품절·미노출로 저장된 상태 · [상세]만 노출, 상세 진입 시 전체 조회 전용
  //    단, 내소매상품(source: 'retail')은 예외다 — 도매 연동 없이 자체 보유수량을 직접 관리하는 상품이므로 재고소진 시에도 [상세]/[수정]을 그대로 노출하고 수정 화면 진입을 막지 않는다.
  //    진입 후에도 판매상태·노출여부 필드는 보유수량 0 기준으로 자동 잠기며(retailLockState), [도매전환]만 전환할 재고가 없으므로 숨긴다.
  // 4) 보유수량 0 + 미등록 → 판매상태 없음 · 노출여부 미노출 · 관리 영역에 버튼 자체를 노출하지 않는다(등록이 불가능하므로)
  // 내소매상품(source: 'retail')은 항상 등록된 상태로만 존재하므로 [상세]/[수정]에 더해, 도매로 전환하는 [도매전환] 진입점을 별도로 노출한다.
  function retailListRowActionsHTML(r) {
    const attrs = `data-source="${r.src.source}" data-code="${r.src.sourceCode || ''}"`;
    if (!r.listing) {
      if (r.canRegister) {
        return `<div class="row-actions row-actions-stack"><button type="button" class="btn-primary" data-retail-register ${attrs}>소매정보등록</button></div>`;
      }
      return '';
    }
    const viewBtn = `<button type="button" data-retail-view ${attrs}>상세보기</button>`;
    const editBtn = `<button type="button" data-retail-edit ${attrs}>수정</button>`;
    const deleteBtn = `<button type="button" data-retail-delete="${r.listing.id}">삭제</button>`;
    // 내소매상품(source: 'retail')은 도매 연동 없이 소매관리에서 직접 보유수량을 관리하는 상품이므로,
    // 보유수량이 소진되어도 조회 전용으로 전환하지 않는다 — [수정]에서 보유수량을 다시 입력해 재고를 복구할 수 있어야 한다.
    if (r.holdingQty <= 0 && r.src.source !== 'retail') {
      return `<div class="row-actions row-actions-stack">${viewBtn}${deleteBtn}</div>`;
    }
    // 내소매상품만 [도매상품전환] 진입점을 별도로 노출한다. 전환은 되돌릴 수 없는 처리이므로 btn-accent를 적용하고,
    // 전환할 재고가 있어야 의미가 있으므로 보유수량이 0이면 노출하지 않는다.
    const convertBtn = (r.src.source === 'retail' && r.holdingQty > 0 && canSupply())
      ? `<button type="button" class="btn-accent" data-retail-convert ${attrs}>도매상품전환</button>` : '';
    return `<div class="row-actions row-actions-stack">${convertBtn}${viewBtn}${editBtn}${deleteBtn}</div>`;
  }

  function retailListRowHTML(r) {
    const sourceLabel = RETAIL_SOURCE_LABELS[r.src.source] || r.src.source;
    const priceCell = r.listPrice != null
      ? `${r.listPrice.toLocaleString()}원 / ${r.salePrice ? r.salePrice.toLocaleString() + '원' : '-'}`
      : '-';
    return `
        <tr>
          <td class="col-check">${r.listing ? `<input type="checkbox" data-retail-list-check="${r.listing.id}" ${retailListChecked.has(r.listing.id) ? 'checked' : ''}>` : ''}</td>
          <td><div class="thumb">IMG</div></td>
          <td>${r.src.sourceCode || '-'}</td>
          <td>${escapeHtml(r.displayName)}</td>
          <td style="white-space:normal; word-break:keep-all;">${r.cat1 ? catLabel(r.cat1, r.cat2, 'r') : '-'}</td>
          <td>${sourceLabel}</td>
          <td class="num">${priceCell}</td>
          <td>${r.holdingQty}</td>
          <td>${r.availableQty != null ? r.availableQty : '-'}</td>
          <td>${r.saleStatus ? statusTag(r.saleStatus === 'active' ? '판매중' : '품절') : '-'}</td>
          <td>${r.listing ? exposureTag(r.exposed) : '<span class="tag" style="background:var(--bg); color:var(--text-secondary);">미노출</span>'}</td>
          <td>${r.chatOrderEnabled ? '<span class="tag tag-key">채팅주문</span>' : '-'}</td>
          <td>${r.registeredAt || '-'}</td>
          <td>${r.updatedAt || '-'}</td>
          <td>${retailListRowActionsHTML(r)}</td>
        </tr>`;
  }

  function pageRetailListingHTML() {
    const rows = retailListRowsFiltered();
    const pgRl = pgSlice('retailList', JSON.stringify([retailListTab, retailListStatus, retailListExposed, retailListChatOrder, retailListSource, retailListCat1, retailListCat2, retailListHoldingOnly, retailListSearch, retailListSort]), rows, { onMove: () => retailListChecked.clear() });
    selCountReg.retailList = () => pgRl.rows.filter(r => r.listing && retailListChecked.has(r.listing.id)).length;
    const tabsHTML = RETAIL_TABS.map(t => `
      <button type="button" class="tab-btn ${retailListTab === t.id ? 'active' : ''}" data-retail-tab="${t.id}">${t.label}</button>`).join('');

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>상품목록</h2>
            <button class="btn-primary" type="button" data-goto="retail-product-register">+ 소매상품등록</button>
          </div>

          <div class="filter-bar">
            <select class="filter-select" id="retailSourceFilter">
              <option value="all" ${retailListSource === 'all' ? 'selected' : ''}>상품출처 전체</option>
              <option value="retail" ${retailListSource === 'retail' ? 'selected' : ''}>내소매상품</option>
              <option value="own" ${retailListSource === 'own' ? 'selected' : ''}>내도매상품</option>
              <option value="purchase" ${retailListSource === 'purchase' ? 'selected' : ''}>도매주문상품</option>
            </select>
            <select class="filter-select" id="retailStatusFilter">
              <option value="all" ${retailListStatus === 'all' ? 'selected' : ''}>소매판매상태 전체</option>
              <option value="active" ${retailListStatus === 'active' ? 'selected' : ''}>판매중</option>
              <option value="soldout" ${retailListStatus === 'soldout' ? 'selected' : ''}>품절</option>
            </select>
            <select class="filter-select" id="retailExposedFilter">
              <option value="all" ${retailListExposed === 'all' ? 'selected' : ''}>소매노출여부 전체</option>
              <option value="exposed" ${retailListExposed === 'exposed' ? 'selected' : ''}>노출</option>
              <option value="hidden" ${retailListExposed === 'hidden' ? 'selected' : ''}>미노출</option>
            </select>
            <select class="filter-select" id="retailChatOrderFilter">
              <option value="all" ${retailListChatOrder === 'all' ? 'selected' : ''}>채팅주문여부 전체</option>
              <option value="enabled" ${retailListChatOrder === 'enabled' ? 'selected' : ''}>허용</option>
              <option value="disabled" ${retailListChatOrder === 'disabled' ? 'selected' : ''}>미허용</option>
            </select>
            <span class="fb-group fb-cats"><select class="filter-select" id="retailCat1Filter">${cat1OptionsHTML(retailListCat1, 'r')}</select>
            <select class="filter-select" id="retailCat2Filter">${cat2OptionsHTML(retailListCat1, retailListCat2, 'r')}</select></span>
            <span class="fb-group fb-search"><input class="search-input" type="text" id="retailSearchInput" placeholder="상품코드, 상품명 검색" value="${escapeHtml(retailListSearch)}">
            <button type="button" class="btn-secondary" id="retailSearchBtn">검색</button></span>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size: 12px; color:var(--text-secondary);">
              <input type="checkbox" id="retailHoldingOnlyCheck" ${retailListHoldingOnly ? 'checked' : ''}> 보유수량 있는 상품만 보기
            </label>
          </div>

          <div class="tab-row">${tabsHTML}</div>

          <div class="table-toolbar">
            ${selCountHTML('retailList', rows.length, selCountReg.retailList())}
            <div class="bulk-bar">
              <button type="button" class="btn-secondary" id="retailListBulkDeleteBtn">일괄삭제</button>
              <select class="filter-select" id="retailSortSelect">
                <option value="latest" ${retailListSort === 'latest' ? 'selected' : ''}>최근등록순</option>
                <option value="updated" ${retailListSort === 'updated' ? 'selected' : ''}>최근수정순</option>
                <option value="qtyAsc" ${retailListSort === 'qtyAsc' ? 'selected' : ''}>보유수량 적은순</option>
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table class="tpl-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="retailListCheckAll"></th>
                  <th class="c-img">이미지</th><th class="c-s">상품코드</th><th class="c-flex">상품명</th><th class="c-m">카테고리</th><th class="c-s">상품출처</th>
                  <th class="c-m">소비자가/할인가</th><th class="c-s">보유수량</th><th class="c-s">판매가능수량</th>
                  <th class="c-s">소매판매상태</th><th class="c-s">소매노출여부</th><th class="c-s">채팅주문여부</th><th class="c-m">등록일시</th><th class="c-m">수정일시</th><th class="col-actions">관리</th>
                </tr>
              </thead>
              <tbody>${rows.length ? pgRl.rows.map(retailListRowHTML).join('') : `<tr><td colspan="15" style="text-align:center; color:var(--text-secondary); padding:32px 0;">조건에 맞는 상품이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>

          ${pgRl.html}
        </div>
      </div>`;
  }

  function renderRetailListingPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailListingHTML();

    wrapper.querySelectorAll('[data-retail-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailListTab = btn.dataset.retailTab;
        renderRetailListingPage();
      });
    });
    wrapper.querySelector('#retailStatusFilter').addEventListener('change', e => {
      retailListStatus = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailExposedFilter').addEventListener('change', e => {
      retailListExposed = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailChatOrderFilter').addEventListener('change', e => {
      retailListChatOrder = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailSourceFilter').addEventListener('change', e => {
      retailListSource = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailCat1Filter').addEventListener('change', e => {
      retailListCat1 = e.target.value;
      retailListCat2 = 'all';
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailCat2Filter').addEventListener('change', e => {
      retailListCat2 = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailSortSelect').addEventListener('change', e => {
      retailListSort = e.target.value;
      renderRetailListingPage();
    });
    wrapper.querySelector('#retailHoldingOnlyCheck').addEventListener('change', e => {
      retailListHoldingOnly = e.target.checked;
      renderRetailListingPage();
    });
    function runSearch() {
      retailListSearch = wrapper.querySelector('#retailSearchInput').value;
      renderRetailListingPage();
    }
    wrapper.querySelector('#retailSearchBtn').addEventListener('click', runSearch);
    wrapper.querySelector('#retailSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    // 소매정보등록 — 미등록 건, 곧바로 등록 폼(수정 화면과 동일 템플릿)으로 진입한다.
    wrapper.querySelectorAll('[data-retail-register]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRetailRef = { source: btn.dataset.source, sourceCode: btn.dataset.code || null };
        currentItem = 'wholesale-retail-listing-edit';
        renderAll();
      });
    });
    // 상세 — 내 도매상품 목록과 동일하게 조회 전용 화면으로 먼저 진입하고, 필요 시 화면 하단 [수정] 버튼으로 넘어간다.
    wrapper.querySelectorAll('[data-retail-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRetailRef = { source: btn.dataset.source, sourceCode: btn.dataset.code || null };
        currentItem = 'wholesale-retail-listing-detail';
        renderAll();
      });
    });
    // 수정 — 목록에서 곧바로 수정 폼으로 진입한다.
    wrapper.querySelectorAll('[data-retail-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRetailRef = { source: btn.dataset.source, sourceCode: btn.dataset.code || null };
        currentItem = 'wholesale-retail-listing-edit';
        renderAll();
      });
    });
    // 체크박스 + 일괄삭제 — 소매정보가 등록된 행만 선택·삭제할 수 있다.
    const retailDeletableRows = pgPageRows('retailList', retailListRowsFiltered()).filter(r => r.listing);
    const retailListCheckAll = wrapper.querySelector('#retailListCheckAll');
    const syncRetailListCheckAll = () => {
      retailListCheckAll.checked = retailDeletableRows.length > 0 && retailDeletableRows.every(r => retailListChecked.has(r.listing.id));
    };
    wrapper.querySelectorAll('[data-retail-list-check]').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) retailListChecked.add(chk.dataset.retailListCheck); else retailListChecked.delete(chk.dataset.retailListCheck);
        syncRetailListCheckAll();
      });
    });
    syncRetailListCheckAll();
    retailListCheckAll.addEventListener('change', () => {
      retailDeletableRows.forEach(r => { if (retailListCheckAll.checked) retailListChecked.add(r.listing.id); else retailListChecked.delete(r.listing.id); });
      wrapper.querySelectorAll('[data-retail-list-check]').forEach(chk => { chk.checked = retailListCheckAll.checked; });
    });
    wrapper.querySelectorAll('[data-retail-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        const listing = RETAIL_LISTINGS.find(x => x.id === btn.dataset.retailDelete);
        if (!listing) return;
        openDeleteConfirm('product', { linked: retailListingDeleteLinked(listing.source) }, () => {
          removeRetailListing(listing);
          retailListChecked.delete(listing.id);
          renderRetailListingPage();
          showBulkToast('삭제되었습니다.');
        });
      });
    });
    wrapper.querySelector('#retailListBulkDeleteBtn').addEventListener('click', () => {
      const targets = retailDeletableRows.filter(r => retailListChecked.has(r.listing.id));
      if (!targets.length) { openBulkAlert({ message: '삭제할 상품을 선택해주세요.' }); return; }
      const linked = targets.some(r => retailListingDeleteLinked(r.listing.source));
      openDeleteConfirm('product', { count: targets.length, linked }, () => {
        targets.forEach(r => { removeRetailListing(r.listing); retailListChecked.delete(r.listing.id); });
        renderRetailListingPage();
        showBulkToast(`${targets.length}건이 삭제되었습니다.`);
      });
    });
    // 도매전환 — 내소매상품 행에서만 노출되며, 도매상품등록 화면(전환 모드)으로 이동한다.
    wrapper.querySelectorAll('[data-retail-convert]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentConvertRef = { sourceCode: btn.dataset.code };
        currentItem = 'wholesale-product-convert';
        renderAll();
      });
    });
    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });
  }

  // ---- 소매설정 > 메인상품진열 ----
  // 좌(전체)/우(메인) 모두 소매몰에 현재 노출 중인 소매상품만 대상이다. 소매정보가 없는 상품은 노출여부가 없어 대상이 아니며,
  // 판매상태가 품절이어도 노출 중이면 대상이고 품절 뱃지로만 구분한다(보유수량 0은 미노출이 우선이라 제외).
  // 노출여부가 미노출이 된 상품은 진열에서 자동 삭제하고, 다시 노출해도 자동 복귀하지 않는다.
  // 추가/제외/순서변경은 화면상에서 즉시 반영되지만, 실제 데이터(MAIN_DISPLAY_ORDER)에는 [저장] 클릭 시에만 반영된다 —
  // 편집 중인 값은 MAIN_DISPLAY_DRAFT에 임시로 담아두고, 페이지에 새로 진입할 때(renderContent 경유)만 초기화한다.
  function retailMainDisplayCandidateRows() {
    return retailListingRows().filter(r => r.listing && r.exposed);
  }
  function pruneMainDisplay() {
    const ok = new Set(retailMainDisplayCandidateRows().map(r => r.listing.id));
    MAIN_DISPLAY_ORDER = MAIN_DISPLAY_ORDER.filter(id => ok.has(id));
    MAIN_DISPLAY_DRAFT = MAIN_DISPLAY_DRAFT.filter(id => ok.has(id));
  }

  let MAIN_DISPLAY_DRAFT = MAIN_DISPLAY_ORDER.slice();

  function pageRetailMainDisplayHTML() {
    const candidates = retailMainDisplayCandidateRows();
    const byId = new Map(candidates.map(r => [r.listing.id, r]));
    const orderedRows = MAIN_DISPLAY_DRAFT.map(id => byId.get(id)).filter(Boolean);
    const orderedIds = new Set(MAIN_DISPLAY_DRAFT);
    const leftRows = candidates.filter(r => !orderedIds.has(r.listing.id));

    const leftHTML = leftRows.length ? leftRows.map(r => `
      <div class="drag-row" data-candidate-id="${r.listing.id}">
        <span class="drag-row-name">${escapeHtml(r.displayName)} ${r.saleStatus === 'soldout' ? statusTag('품절') : ''}</span>
        <button type="button" class="btn-secondary" data-add-display="${r.listing.id}">추가 →</button>
      </div>`).join('') : `<div class="field-hint" style="padding:16px 0;">추가할 수 있는 상품이 없습니다.</div>`;

    const rightHTML = orderedRows.length ? orderedRows.map(r => `
      <div class="drag-row" draggable="true" data-display-id="${r.listing.id}">
        <span class="drag-handle" title="드래그하여 순서 변경">⠿</span>
        <span class="drag-row-name">${escapeHtml(r.displayName)} ${r.saleStatus === 'soldout' ? statusTag('품절') : ''}</span>
        <button type="button" class="btn-secondary" data-remove-display="${r.listing.id}">← 제외</button>
      </div>`).join('') : `<div class="field-hint" style="padding:16px 0;">메인에 진열된 상품이 없습니다.</div>`;

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <div class="card-head">
            <h2>메인상품진열</h2>
          </div>
          <div class="grid12" style="gap:16px;">
            <div class="col-6 card" style="box-shadow:none; border:1px solid var(--border);">
              <h3 class="form-section-title">전체 소매상품 <span class="field-hint" style="font-weight:300; margin-left:6px;">소매몰에 노출 중인 상품만 표시됩니다.</span></h3>
              <div id="mainDisplayLeft">${leftHTML}</div>
            </div>
            <div class="col-6 card" style="box-shadow:none; border:1px solid var(--border);">
              <h3 class="form-section-title">메인상품</h3>
              <div id="mainDisplayRight">${rightHTML}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="market-buybar" style="justify-content:flex-end;">
        <div class="buybar-actions">
          <span class="inline-confirm" id="mainDisplaySaveConfirm" hidden>저장되었습니다.</span>
          <button type="button" class="btn-primary" id="mainDisplaySaveBtn">저장</button>
        </div>
      </div>`;
  }

  function renderRetailMainDisplayPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailMainDisplayHTML();

    wrapper.querySelectorAll('[data-add-display]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.addDisplay;
        if (!MAIN_DISPLAY_DRAFT.includes(id)) MAIN_DISPLAY_DRAFT.push(id);
        renderRetailMainDisplayPage();
      });
    });
    wrapper.querySelectorAll('[data-remove-display]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.removeDisplay;
        MAIN_DISPLAY_DRAFT = MAIN_DISPLAY_DRAFT.filter(x => x !== id);
        renderRetailMainDisplayPage();
      });
    });

    // 드래그핸들 방식 순서 변경(네이티브 HTML5 drag-and-drop) — 우측 진열 목록 내에서만 동작한다.
    const rightPanel = wrapper.querySelector('#mainDisplayRight');
    let dragId = null;
    rightPanel.querySelectorAll('[data-display-id]').forEach(row => {
      row.addEventListener('dragstart', () => { dragId = row.dataset.displayId; row.classList.add('dragging'); });
      row.addEventListener('dragend', () => { row.classList.remove('dragging'); });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragId || dragId === row.dataset.displayId) return;
        const fromIdx = MAIN_DISPLAY_DRAFT.indexOf(dragId);
        const toIdx = MAIN_DISPLAY_DRAFT.indexOf(row.dataset.displayId);
        if (fromIdx === -1 || toIdx === -1) return;
        MAIN_DISPLAY_DRAFT.splice(fromIdx, 1);
        MAIN_DISPLAY_DRAFT.splice(toIdx, 0, dragId);
        renderRetailMainDisplayPage();
      });
    });

    wrapper.querySelector('#mainDisplaySaveBtn').addEventListener('click', () => {
      MAIN_DISPLAY_ORDER = MAIN_DISPLAY_DRAFT.slice();
      const confirmEl = wrapper.querySelector('#mainDisplaySaveConfirm');
      confirmEl.hidden = false;
      setTimeout(() => { confirmEl.hidden = true; }, 2000);
    });
  }

  // ---- 소매관리 > 회원관리 : 목록 ----
  function formatWon(n) { return n.toLocaleString('ko-KR') + '원'; }

  const RETAIL_MEMBER_TABS = [
    { id: 'active', label: '일반회원' },
    { id: 'withdrawn', label: '탈퇴회원' },
  ];
  // 일반회원 탭 하위 2차 탭 — 이용상태(정상/이용제한) 기준 필터. 탈퇴회원 탭에는 노출하지 않는다.
  const RETAIL_MEMBER_USAGE_TABS = [
    { id: 'all', label: '전체' },
    { id: '정상', label: '정상' },
    { id: '이용제한', label: '이용제한' },
  ];


  function pageRetailMemberListHTML() {
    const tabsHTML = RETAIL_MEMBER_TABS.map(t => `
      <button type="button" class="tab-btn ${retailMemberTab === t.id ? 'active' : ''}" data-retail-member-tab="${t.id}">${t.label}</button>`).join('');

    const isWithdrawnTab = retailMemberTab === 'withdrawn';
    const usageTabsHTML = RETAIL_MEMBER_USAGE_TABS.map(t => `
      <button type="button" class="tab-btn-sub ${retailMemberUsageTab === t.id ? 'active' : ''}" data-retail-member-usage-tab="${t.id}">${t.label}</button>`).join('');

    let rows = RETAIL_MEMBERS.filter(m => isWithdrawnTab ? m.status === 'withdrawn' : m.status !== 'withdrawn');
    if (!isWithdrawnTab && retailMemberUsageTab !== 'all') {
      rows = rows.filter(m => m.usageStatus === retailMemberUsageTab);
    }
    if (retailMemberSearch.trim()) {
      rows = rows.filter(m => searchMatch(retailMemberSearch, m.name, m.phone, m.email, m.nicknameCode, m.chatNickname));
    }
    const dateField = isWithdrawnTab ? 'withdrawnAt' : 'joinedAt';
    if (retailMemberDateFrom) {
      const from = inputDateToOrderDate(retailMemberDateFrom);
      rows = rows.filter(m => (m[dateField] || '').slice(0, 8) >= from);
    }
    if (retailMemberDateTo) {
      const to = inputDateToOrderDate(retailMemberDateTo);
      rows = rows.filter(m => (m[dateField] || '').slice(0, 8) <= to);
    }

    if (!isWithdrawnTab) {
      rows = rows.slice().sort((a, b) => {
        if (retailMemberSort === 'name') return a.name.localeCompare(b.name, 'ko');
        if (retailMemberSort === 'lastLoginAt') return (b.lastLoginAt || '').localeCompare(a.lastLoginAt || '');
        return (b.joinedAt || '').localeCompare(a.joinedAt || '');
      });
    } else {
      rows = rows.slice().sort((a, b) => (b.withdrawnAt || '').localeCompare(a.withdrawnAt || ''));
    }

    const colspan = isWithdrawnTab ? 5 : 11;
    const theadHTML = isWithdrawnTab
      ? `<tr><th class="col-check"><input type="checkbox" id="retailMemberCheckAll"></th><th class="c-flex">회원명</th><th class="c-m">휴대폰번호</th><th class="c-m">탈퇴일시</th><th class="col-actions">관리</th></tr>`
      : `<tr><th class="c-m">회원명</th><th class="c-m">휴대폰번호</th><th class="c-flex">이메일</th><th class="c-s">회원주문 코드</th><th class="c-m">채팅주문 닉네임</th><th class="c-s">상품주문건수</th><th class="c-m">주문금액</th><th class="c-s">이용상태</th><th class="c-m">회원가입일시</th><th class="c-m">최종로그인일시</th><th class="col-actions">관리</th></tr>`;

    const pgMb = pgSlice('retailMember', JSON.stringify([retailMemberTab, retailMemberUsageTab, retailMemberSearch, retailMemberSort, retailMemberDateFrom, retailMemberDateTo]), rows, { onMove: () => retailMemberChecked.clear() });
    selCountReg.retailMember = () => pgMb.rows.filter(m => retailMemberChecked.has(m.id)).length;
    const tr = pgMb.rows.map(m => {
      if (isWithdrawnTab) {
        return `
      <tr>
        <td class="col-check"><input type="checkbox" data-member-check="${m.id}" ${retailMemberChecked.has(m.id) ? 'checked' : ''}></td>
        <td>${escapeHtml(m.name)}</td>
        <td>${escapeHtml(m.phone)}</td>
        <td>${m.withdrawnAt || '-'}</td>
        <td>
          <div class="row-actions row-actions-stack">
            <button type="button" data-member-withdraw-reason="${m.id}">상세보기</button>
            <button type="button" data-member-delete="${m.id}">삭제</button>
          </div>
        </td>
      </tr>`;
      }
      return `
      <tr>
        <td>${escapeHtml(m.name)}</td>
        <td>${escapeHtml(m.phone)}</td>
        <td>${escapeHtml(m.email)}</td>
        <td>${escapeHtml(m.nicknameCode)}</td>
        <td>${escapeHtml(m.chatNickname || '-')}</td>
        <td class="num">${m.orderCount}건</td>
        <td class="num">${formatWon(m.orderAmount)}</td>
        <td>${statusTag(m.usageStatus)}</td>
        <td>${m.joinedAt}</td>
        <td>${m.lastLoginAt || '-'}</td>
        <td><div class="row-actions row-actions-stack"><button type="button" data-member-detail="${m.id}">상세보기</button></div></td>
      </tr>`;
    }).join('');

    // 탭 전환 시에도 표 상단 toolbar 높이가 흔들리지 않도록(디자인 시스템 레이아웃 일관성) 정렬 select는 항상 렌더링하고,
    // 탈퇴회원 탭에서는 탈퇴일순 고정으로 비활성화한다.
    const sortSelectHTML = isWithdrawnTab ? `
            <div class="bulk-bar">
              <button type="button" class="btn-secondary" id="retailMemberBulkDeleteBtn">일괄삭제</button>
              <select class="filter-select" id="retailMemberSortSelect" disabled>
                <option selected>탈퇴일시순</option>
              </select>
            </div>` : `
            <select class="filter-select" id="retailMemberSortSelect" style="margin-left:auto;">
              <option value="joinedAt" ${retailMemberSort === 'joinedAt' ? 'selected' : ''}>회원가입일시순</option>
              <option value="lastLoginAt" ${retailMemberSort === 'lastLoginAt' ? 'selected' : ''}>최종로그인일시순</option>
              <option value="name" ${retailMemberSort === 'name' ? 'selected' : ''}>이름순</option>
            </select>`;

    return `
      <div class="grid12">
        <div class="col-12 card">
          <div class="card-head">
            <h2>회원관리</h2>
          </div>

          <div class="filter-bar">
            <span class="fb-group fb-dates"><input class="filter-select" type="date" id="retailMemberDateFrom" value="${retailMemberDateFrom}">
            <span class="fb-tilde">~</span>
            <input class="filter-select" type="date" id="retailMemberDateTo" value="${retailMemberDateTo}"></span>
            <span class="fb-group fb-search"><input class="search-input" type="text" id="retailMemberSearchInput" placeholder="이름, 휴대폰번호, 이메일, 회원주문 코드, 채팅주문 닉네임 검색" value="${escapeHtml(retailMemberSearch)}">
            <button type="button" class="btn-secondary" id="retailMemberSearchBtn">검색</button></span>
          </div>

          <div class="tab-row">${tabsHTML}</div>
          ${isWithdrawnTab ? '' : `<div class="tab-row-sub">${usageTabsHTML}</div>`}

          <div class="table-toolbar">
            ${isWithdrawnTab ? selCountHTML('retailMember', rows.length, selCountReg.retailMember()) : `<span class="table-count">전체 ${rows.length}건</span>`}
            ${sortSelectHTML}
          </div>

          <div class="table-wrap">
            <table class="tpl-table" data-card-head="회원명" data-card-below="휴대폰번호">
              <thead>${theadHTML}</thead>
              <tbody>${tr || `<tr><td colspan="${colspan}" style="text-align:center; color:var(--text-secondary); padding:32px 0;">조건에 맞는 회원이 없습니다.</td></tr>`}</tbody>
            </table>
          </div>

          ${pgMb.html}
        </div>
      </div>`;
  }

  function renderRetailMemberListPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailMemberListHTML();

    wrapper.querySelectorAll('[data-retail-member-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailMemberTab = btn.dataset.retailMemberTab;
        retailMemberUsageTab = 'all';
        retailMemberChecked.clear();
        renderRetailMemberListPage();
      });
    });
    wrapper.querySelectorAll('[data-retail-member-usage-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailMemberUsageTab = btn.dataset.retailMemberUsageTab;
        renderRetailMemberListPage();
      });
    });

    const searchInput = wrapper.querySelector('#retailMemberSearchInput');
    function runSearch() { retailMemberSearch = searchInput.value.trim(); renderRetailMemberListPage(); }
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    wrapper.querySelector('#retailMemberSearchBtn').addEventListener('click', runSearch);

    wrapper.querySelector('#retailMemberDateFrom').addEventListener('change', e => {
      retailMemberDateFrom = e.target.value;
      renderRetailMemberListPage();
    });
    wrapper.querySelector('#retailMemberDateTo').addEventListener('change', e => {
      retailMemberDateTo = e.target.value;
      renderRetailMemberListPage();
    });

    const sortSelect = wrapper.querySelector('#retailMemberSortSelect');
    if (sortSelect) {
      sortSelect.addEventListener('change', e => {
        retailMemberSort = e.target.value;
        renderRetailMemberListPage();
      });
    }

    wrapper.querySelectorAll('[data-member-detail]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRetailMemberId = btn.dataset.memberDetail;
        retailMemberDetailTab = 'member';
        currentItem = 'retail-member-detail';
        renderAll();
      });
    });

    wrapper.querySelectorAll('[data-member-withdraw-reason]').forEach(btn => {
      btn.addEventListener('click', () => {
        openMemberWithdrawReasonModal(btn.dataset.memberWithdrawReason);
      });
    });

    // 탈퇴회원 삭제 — 탈퇴회원만 삭제할 수 있다. 체크박스 + 일괄삭제 포함.
    const withdrawnRows = RETAIL_MEMBERS.filter(m => m.status === 'withdrawn');
    const memberCheckAll = wrapper.querySelector('#retailMemberCheckAll');
    if (memberCheckAll) {
      const visibleIds = Array.from(wrapper.querySelectorAll('[data-member-check]')).map(c => c.dataset.memberCheck);
      const syncMemberCheckAll = () => { memberCheckAll.checked = visibleIds.length > 0 && visibleIds.every(id => retailMemberChecked.has(id)); };
      wrapper.querySelectorAll('[data-member-check]').forEach(chk => {
        chk.addEventListener('change', () => {
          if (chk.checked) retailMemberChecked.add(chk.dataset.memberCheck); else retailMemberChecked.delete(chk.dataset.memberCheck);
          syncMemberCheckAll();
        });
      });
      syncMemberCheckAll();
      memberCheckAll.addEventListener('change', () => {
        visibleIds.forEach(id => { if (memberCheckAll.checked) retailMemberChecked.add(id); else retailMemberChecked.delete(id); });
        wrapper.querySelectorAll('[data-member-check]').forEach(chk => { chk.checked = memberCheckAll.checked; });
      });
      const bulkBtn = wrapper.querySelector('#retailMemberBulkDeleteBtn');
      if (bulkBtn) {
        bulkBtn.addEventListener('click', () => {
          const ids = visibleIds.filter(id => retailMemberChecked.has(id));
          if (!ids.length) { openBulkAlert({ message: '삭제할 회원을 선택해주세요.' }); return; }
          openDeleteConfirm('member', { count: ids.length }, () => {
            ids.forEach(id => {
              const idx = RETAIL_MEMBERS.findIndex(x => x.id === id && x.status === 'withdrawn');
              if (idx !== -1) RETAIL_MEMBERS.splice(idx, 1);
              retailMemberChecked.delete(id);
            });
            renderRetailMemberListPage();
            showBulkToast(`${ids.length}건이 삭제되었습니다.`);
          });
        });
      }
    }
    wrapper.querySelectorAll('[data-member-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.memberDelete;
        openDeleteConfirm('member', {}, () => {
          const idx = RETAIL_MEMBERS.findIndex(x => x.id === id && x.status === 'withdrawn');
          if (idx !== -1) RETAIL_MEMBERS.splice(idx, 1);
          retailMemberChecked.delete(id);
          renderRetailMemberListPage();
          showBulkToast('삭제되었습니다.');
        });
      });
    });
  }

  // ---- 소매관리 > 회원관리 : 탈퇴 처리 팝업 ----
  // 탈퇴 처리는 복원이 불가능하므로 사유 입력을 필수로 받는다.
  function memberWithdrawModalHTML() {
    return `
      <div class="modal-scrim" id="memberWithdrawModalScrim">
        <div class="modal-box">
          <h3>탈퇴 처리</h3>
          <div class="field-hint" style="margin-bottom:12px;">탈퇴 처리된 회원의 정보는 복원할 수 없습니다. 신중하게 처리해주세요.</div>
          <div class="form-grid">

              <label>탈퇴 처리 사유</label>
              <textarea class="form-input" id="memberWithdrawReasonInput" rows="3" placeholder="탈퇴 처리 사유를 입력해주세요."></textarea>
            </div>

          <div id="memberWithdrawModalError" class="field-error" style="padding-top:8px;" hidden></div>

            <button type="button" class="btn-secondary" id="memberWithdrawCancelBtn">취소</button>
            <button type="button" class="btn-danger" id="memberWithdrawSubmitBtn">탈퇴 처리</button>

        </div>
      </div>`;

  function closeMemberWithdrawModal() {
    const root = document.getElementById('memberWithdrawModalRoot');
    if (root) root.remove();
  }

  function openMemberWithdrawModal(memberId) {
    closeMemberWithdrawModal();
    const root = document.createElement('div');
    root.id = 'memberWithdrawModalRoot';
    root.innerHTML = memberWithdrawModalHTML();
    document.body.appendChild(root);
    bindMemberWithdrawModal(memberId);
  }

  function bindMemberWithdrawModal(memberId) {
    const root = document.getElementById('memberWithdrawModalRoot');
    if (!root) return;

    root.querySelector('#memberWithdrawCancelBtn').addEventListener('click', closeMemberWithdrawModal);
    root.querySelector('#memberWithdrawModalScrim').addEventListener('click', e => {
      if (e.target.id === 'memberWithdrawModalScrim') closeMemberWithdrawModal();
    });

    root.querySelector('#memberWithdrawSubmitBtn').addEventListener('click', () => {
      const m = RETAIL_MEMBERS.find(x => x.id === memberId);
      if (!m) { closeMemberWithdrawModal(); return; }
      const reason = root.querySelector('#memberWithdrawReasonInput').value.trim();
      const errorBox = root.querySelector('#memberWithdrawModalError');
      if (!reason) {
        errorBox.hidden = false;
        errorBox.textContent = '탈퇴 처리 사유를 입력해주세요.';
        return;
      }
      errorBox.hidden = true;
      m.status = 'withdrawn';
      m.withdrawnAt = mockNowStamp();
      m.withdrawReason = reason;
      closeMemberWithdrawModal();
      retailMemberTab = 'withdrawn';
      currentItem = 'retail-member';
      renderAll();
    });
  }

  // ---- 소매관리 > 회원관리 : 상세 - 내부메모 탭 (가맹점 상세 > 내부메모 탭과 동일한 구조·동작을 그대로 적용) ----
  function retailMemberMemoTabHTML(m) {
    const rows = m.memos.slice().sort((a, b) => b.id - a.id).map(memo => `
      <div class="franchise-memo-item">
        <div class="franchise-memo-text">${escapeHtml(memo.text)}</div>
        <div class="franchise-memo-meta">

          <button type="button" data-member-memo-delete="${memo.id}">삭제</button>
        </div>

      <section class="form-section">
        <h3 class="form-section-title">내부 메모</h3>

          <input type="text" class="form-input" id="memberMemoInput" placeholder="메모를 입력하세요">
          <button type="button" class="btn-secondary" id="memberMemoAddBtn">추가</button>
        </div>

  function pageRetailMemberDetailHTML() {
    const m = RETAIL_MEMBERS.find(x => x.id === currentRetailMemberId);
    if (!m) return `<div class="grid12"><div class="col-12 card">회원 정보를 찾을 수 없습니다.</div></div>`;

    const TABS = [
      { id: 'member', label: '회원정보' },
      { id: 'memo', label: '내부메모' },
    ];
    const tabsHTML = TABS.map(t => `
      <button type="button" class="tab-btn ${retailMemberDetailTab === t.id ? 'active' : ''}" data-member-detail-tab="${t.id}">${t.label}</button>`).join('');

    const bodyHTML = retailMemberDetailTab === 'memo' ? retailMemberMemoTabHTML(m) : retailMemberInfoTabHTML(m);

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" data-goto="retail-member">← 회원목록으로</button>
          <div class="card-head">
            <h2>회원정보 상세</h2>
          </div>

          <div class="tab-row">${tabsHTML}</div>

          ${bodyHTML}
        </div>
      </div>

      <div class="market-buybar">
        <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
          <div class="form-field" style="margin:0;">
            <label>이용상태</label>
            <select class="form-select" id="memberUsageStatusSelect">
              <option value="정상" ${m.usageStatus !== '이용제한' ? 'selected' : ''}>정상</option>
              <option value="이용제한" ${m.usageStatus === '이용제한' ? 'selected' : ''}>이용제한</option>
            </select>
          </div>
        </div>
        <div class="buybar-actions">
          <span class="inline-confirm" id="memberUsageStatusConfirm" hidden>변경사항이 반영되었습니다.</span>
          <button type="button" class="btn-primary" id="memberUsageStatusChangeBtn">변경확인</button>
          <button type="button" class="btn-danger" id="memberWithdrawBtn">탈퇴 처리</button>
        </div>
      </div>`;
  }

  function renderRetailMemberDetailPage() {
    const wrapper = document.getElementById('contentWrapper');

    const guardMember = RETAIL_MEMBERS.find(x => x.id === currentRetailMemberId);
    if (guardMember && guardMember.status === 'withdrawn') {
      retailMemberTab = 'withdrawn';
      currentItem = 'retail-member';
      renderAll();
      return;
    }

    wrapper.innerHTML = pageRetailMemberDetailHTML();
    const m = RETAIL_MEMBERS.find(x => x.id === currentRetailMemberId);
    if (!m) return;

    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => { currentItem = btn.dataset.goto; renderAll(); });
    });

    wrapper.querySelectorAll('[data-member-detail-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailMemberDetailTab = btn.dataset.memberDetailTab;
        renderRetailMemberDetailPage();
      });
    });

    // 내부메모
    const memoAddBtn = wrapper.querySelector('#memberMemoAddBtn');
    if (memoAddBtn) {
      memoAddBtn.addEventListener('click', () => {
        const input = wrapper.querySelector('#memberMemoInput');
        const text = input.value.trim();
        if (!text) return;
        const nextId = m.memos.length ? Math.max(...m.memos.map(x => x.id)) + 1 : 1;
        const createdAt = mockNowStamp();
        m.memos.push({ id: nextId, text, createdAt });
        renderRetailMemberDetailPage();
      });
    }
    wrapper.querySelectorAll('[data-member-memo-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.memberMemoDelete);
        m.memos = m.memos.filter(x => x.id !== id);
        renderRetailMemberDetailPage();
      });
    });

    // 기본정보 저장
    let nicknameChecked = false;
    let nicknameCheckedValue = null;

    const nicknameDupBtn = wrapper.querySelector('#memberNicknameDupCheckBtn');
    if (nicknameDupBtn) {
      nicknameDupBtn.addEventListener('click', () => {
        const val = wrapper.querySelector('#memberNicknameInput').value.trim();
        const resultBox = wrapper.querySelector('#memberNicknameDupResult');
        resultBox.style.display = 'block';
        if (!val) {
          resultBox.textContent = '회원주문 코드를 입력해주세요.';
          nicknameChecked = false;
          return;
        }
        if (!/^\d{4}$/.test(val)) {
          resultBox.textContent = '회원주문 코드는 숫자 4자리로 입력해주세요.';
          nicknameChecked = false;
          return;
        }
        const dup = RETAIL_MEMBERS.some(x => x.id !== m.id && x.status !== 'withdrawn' && x.nicknameCode === val);
        if (dup) {
          resultBox.textContent = '이미 다른 회원이 사용 중인 코드입니다.';
          nicknameChecked = false;
        } else {
          resultBox.textContent = '사용 가능한 코드입니다.';
          nicknameChecked = true;
          nicknameCheckedValue = val;
        }
      });
    }

    const basicSaveBtn = wrapper.querySelector('#memberBasicSaveBtn');
    if (basicSaveBtn) {
      basicSaveBtn.addEventListener('click', () => {
        const name = wrapper.querySelector('#memberNameInput').value.trim();
        const email = wrapper.querySelector('#memberEmailInput').value.trim();
        const nickname = wrapper.querySelector('#memberNicknameInput').value.trim();
        const chatNickname = wrapper.querySelector('#memberChatNicknameInput').value.trim();
        const errorBox = wrapper.querySelector('#memberBasicError');

        if (!name || !email || !nickname) {
          errorBox.hidden = false;
          errorBox.textContent = '이름 · 이메일 · 회원주문 코드를 모두 입력해주세요.';
          return;
        }
        if (!/^\d{4}$/.test(nickname)) {
          errorBox.hidden = false;
          errorBox.textContent = '회원주문 코드는 숫자 4자리로 입력해주세요.';
          return;
        }
        if (nickname !== m.nicknameCode) {
          if (!nicknameChecked || nicknameCheckedValue !== nickname) {
            errorBox.hidden = false;
            errorBox.textContent = '변경한 회원주문 코드의 중복확인을 먼저 완료해주세요.';
            return;
          }
          const dup = RETAIL_MEMBERS.some(x => x.id !== m.id && x.status !== 'withdrawn' && x.nicknameCode === nickname);
          if (dup) {
            errorBox.hidden = false;
            errorBox.textContent = '이미 다른 회원이 사용 중인 코드입니다.';
            return;
          }
        }

        errorBox.hidden = true;
        m.name = name;
        m.email = email;
        m.nicknameCode = nickname;
        m.chatNickname = chatNickname;
        renderRetailMemberDetailPage();
        const confirmEl = wrapper.querySelector('#memberBasicSaveConfirm');
        if (confirmEl) {
          confirmEl.hidden = false;
          setTimeout(() => { confirmEl.hidden = true; }, 2000);
        }
      });
    }

    // 휴대폰번호 변경
    let dupChecked = false;
    let dupCheckedValue = null;
    let phoneVerified = false;

    const resetPhoneVerification = () => {
      phoneVerified = false;
      const verifiedMsg = wrapper.querySelector('#memberPhoneVerifiedMsg');
      if (verifiedMsg) verifiedMsg.hidden = true;
      const saveBtnEl = wrapper.querySelector('#memberPhoneChangeSaveBtn');
      if (saveBtnEl) saveBtnEl.disabled = true;
    };
    const newPhoneInputEl = wrapper.querySelector('#newMemberPhone');
    if (newPhoneInputEl) {
      newPhoneInputEl.addEventListener('input', () => {
        dupChecked = false;
        dupCheckedValue = null;
        resetPhoneVerification();
        const resultBox = wrapper.querySelector('#memberPhoneDupResult');
        if (resultBox) { resultBox.style.display = 'none'; resultBox.textContent = ''; }
        const sendBtnEl = wrapper.querySelector('#memberPhoneAuthSendBtn2');
        const codeEl = wrapper.querySelector('#memberPhoneAuthCode2');
        const confirmEl = wrapper.querySelector('#memberPhoneAuthConfirmBtn2');
        if (sendBtnEl) sendBtnEl.disabled = true;
        if (codeEl) { codeEl.disabled = true; codeEl.value = ''; }
        if (confirmEl) confirmEl.disabled = true;
      });
    }

    const startBtn = wrapper.querySelector('#memberPhoneChangeStartBtn');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        wrapper.querySelector('#memberPhoneDisplayBlock').hidden = true;
        wrapper.querySelector('#memberPhoneChangeForm').hidden = false;
      });
    }

    const cancelBtn = wrapper.querySelector('#memberPhoneChangeCancelBtn');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => { renderRetailMemberDetailPage(); });
    }

    const dupBtn = wrapper.querySelector('#memberPhoneDupCheckBtn');
    if (dupBtn) {
      dupBtn.addEventListener('click', () => {
        const val = wrapper.querySelector('#newMemberPhone').value.trim();
        const resultBox = wrapper.querySelector('#memberPhoneDupResult');
        const authCodeInput = wrapper.querySelector('#memberPhoneAuthCode2');
        const sendBtn = wrapper.querySelector('#memberPhoneAuthSendBtn2');
        resultBox.style.display = 'block';
        resetPhoneVerification();
        if (!val) {
          resultBox.textContent = '변경할 휴대폰번호를 입력해주세요.';
          dupChecked = false;
          authCodeInput.disabled = true;
          sendBtn.disabled = true;
          return;
        }
        if (!isValidMobilePhone(val)) {
          resultBox.textContent = '휴대폰번호 형식이 올바르지 않습니다.';
          dupChecked = false;
          authCodeInput.disabled = true;
          sendBtn.disabled = true;
          return;
        }
        const dup = RETAIL_MEMBERS.some(x => x.id !== m.id && x.status !== 'withdrawn' && x.phone === val);
        if (dup) {
          resultBox.textContent = '이미 다른 회원이 사용 중인 번호입니다.';
          dupChecked = false;
          authCodeInput.disabled = true;
          sendBtn.disabled = true;
        } else {
          resultBox.textContent = '사용 가능한 번호입니다. 인증번호를 발송해주세요.';
          dupChecked = true;
          dupCheckedValue = val;
          sendBtn.disabled = false;
        }
      });
    }

    const sendBtn2 = wrapper.querySelector('#memberPhoneAuthSendBtn2');
    if (sendBtn2) {
      sendBtn2.addEventListener('click', () => {
        wrapper.querySelector('#memberPhoneAuthCode2').disabled = false;
        wrapper.querySelector('#memberPhoneAuthConfirmBtn2').disabled = false;
      });
    }

    const confirmBtn2 = wrapper.querySelector('#memberPhoneAuthConfirmBtn2');
    if (confirmBtn2) {
      confirmBtn2.addEventListener('click', () => {
        const code = wrapper.querySelector('#memberPhoneAuthCode2').value.trim();
        const errorBox = wrapper.querySelector('#memberPhoneChangeError');
        if (!/^\d{6}$/.test(code)) {
          errorBox.hidden = false;
          errorBox.textContent = '인증번호 6자리를 입력해주세요.';
          return;
        }
        errorBox.hidden = true;
        phoneVerified = true;
        wrapper.querySelector('#memberPhoneVerifiedMsg').hidden = false;
        wrapper.querySelector('#memberPhoneChangeSaveBtn').disabled = false;
      });
    }

    const saveBtn = wrapper.querySelector('#memberPhoneChangeSaveBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const val = wrapper.querySelector('#newMemberPhone').value.trim();
        const errorBox = wrapper.querySelector('#memberPhoneChangeError');
        if (!dupChecked || dupCheckedValue !== val) {
          errorBox.hidden = false;
          errorBox.textContent = '변경할 번호의 중복확인을 먼저 완료해주세요.';
          return;
        }
        if (!phoneVerified) {
          errorBox.hidden = false;
          errorBox.textContent = '본인확인 인증을 먼저 완료해주세요.';
          return;
        }
        errorBox.hidden = true;
        m.phone = val;
        renderRetailMemberDetailPage();
        const confirmEl = wrapper.querySelector('#memberPhoneChangeConfirm');
        if (confirmEl) {
          confirmEl.hidden = false;
          setTimeout(() => { confirmEl.hidden = true; }, 2000);
        }
      });
    }

    // 배달지 정보 저장
    const addressSaveBtn = wrapper.querySelector('#memberAddressSaveBtn');
    if (addressSaveBtn) {
      addressSaveBtn.addEventListener('click', () => {
        if (m.address) {
          const nameInput = wrapper.querySelector('#memberAddrName');
          const addressInput = wrapper.querySelector('#memberAddrAddress');
          const requestInput = wrapper.querySelector('#memberAddrRequest');
          if (nameInput) m.address.name = nameInput.value.trim();
          if (addressInput) m.address.address = addressInput.value.trim();
          if (requestInput) m.address.request = requestInput.value.trim();
        }
        renderRetailMemberDetailPage();
        const confirmEl = wrapper.querySelector('#memberAddressSaveConfirm');
        if (confirmEl) {
          confirmEl.hidden = false;
          setTimeout(() => { confirmEl.hidden = true; }, 2000);
        }
      });
    }

    // 이용상태 변경 — 하단 고정영역의 셀렉+[변경확인]으로 처리한다.
    // 진행중 주문 여부와 무관하게 전환 가능하다(이용제한의 목적은 신규주문 차단이며, 그 차단 로직 자체는
    // 이 관리자 화면 목업 범위 밖이다 — 여기서는 상태값 표시·변경 UI까지만 구현한다).
    const usageStatusBtn = wrapper.querySelector('#memberUsageStatusChangeBtn');
    if (usageStatusBtn) {
      usageStatusBtn.addEventListener('click', () => {
        const select = wrapper.querySelector('#memberUsageStatusSelect');
        m.usageStatus = select.value;
        const confirmEl = wrapper.querySelector('#memberUsageStatusConfirm');
        if (confirmEl) {
          confirmEl.hidden = false;
          setTimeout(() => { confirmEl.hidden = true; }, 2000);
        }
      });
    }

    // 탈퇴 처리
    const withdrawBtn = wrapper.querySelector('#memberWithdrawBtn');
    if (withdrawBtn) {
      withdrawBtn.addEventListener('click', () => {
        openMemberWithdrawModal(m.id);
      });
    }
  }

  function renderRetailBasicSettingsPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = pageRetailBasicSettingsHTML();

    wrapper.querySelectorAll('[data-retail-basic-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        retailBasicTab = btn.dataset.retailBasicTab;
        renderRetailBasicSettingsPage();
      });
    });

    if (retailBasicTab === 'basic') {
      const zipcodeSearchBtn = wrapper.querySelector('#rbZipcodeSearchBtn');
      if (zipcodeSearchBtn) {
        zipcodeSearchBtn.addEventListener('click', () => {
          // 목업 단계 — 실제 우편번호 검색 API 연동 전이므로 예시 주소로 대체(가맹점 상세 화면과 동일 처리)
          wrapper.querySelector('#rbZipcode').value = RETAIL_MALL_INFO.pickupZipcode;
          wrapper.querySelector('#rbRoadAddress').value = RETAIL_MALL_INFO.pickupRoadAddress;
          wrapper.querySelector('#rbDetailAddress').focus();
        });
      }
      wrapper.querySelectorAll('input[name="rbSalesMethod"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const deliveryFeeField = wrapper.querySelector('#rbDeliveryFeeField');
          deliveryFeeField.hidden = radio.value === 'pickup';
        });
      });
      const saveBtn = wrapper.querySelector('#rbSaveBtn');
      saveBtn.addEventListener('click', () => {
        // 필수값 검증 — 상호명, 픽업주소(우편번호·기본주소), 소매몰명
        const rbChecks = [
          ['#rbMallNameError', !wrapper.querySelector('#rbMallName').value.trim(), '상호명을 입력해주세요.'],
          ['#rbPickupAddressError', !wrapper.querySelector('#rbZipcode').value.trim() || !wrapper.querySelector('#rbRoadAddress').value.trim(), '픽업주소를 입력해주세요. 우편번호 검색으로 주소를 선택해주세요.'],
          ['#rbMallDisplayNameError', !wrapper.querySelector('#rbMallDisplayName').value.trim(), '소매몰명을 입력해주세요.'],
        ];
        let rbValid = true;
        rbChecks.forEach(([sel, invalid, msg]) => {
          const el = wrapper.querySelector(sel);
          el.hidden = !invalid;
          if (invalid) { el.textContent = msg; rbValid = false; }
        });
        if (!rbValid) return;
        const checkedMethod = wrapper.querySelector('input[name="rbSalesMethod"]:checked');
        const feeRaw = wrapper.querySelector('#rbDeliveryFee').value.trim();
        const feeErrorEl = wrapper.querySelector('#rbDeliveryFeeError');
        const feeApplicable = !checkedMethod || checkedMethod.value !== 'pickup';
        if (feeApplicable && feeRaw !== '' && !/^\d+$/.test(feeRaw)) {
          feeErrorEl.hidden = false;
          feeErrorEl.textContent = '기본 배달비는 0 이상의 정수로 입력해주세요.';
          return;
        }
        feeErrorEl.hidden = true;
        RETAIL_MALL_INFO.pickupZipcode = wrapper.querySelector('#rbZipcode').value.trim();
        RETAIL_MALL_INFO.pickupRoadAddress = wrapper.querySelector('#rbRoadAddress').value.trim();
        RETAIL_MALL_INFO.name = wrapper.querySelector('#rbMallName').value.trim();
        RETAIL_MALL_INFO.phone = wrapper.querySelector('#rbPhone').value.trim();
        RETAIL_MALL_INFO.businessHours = wrapper.querySelector('#rbBusinessHours').value.trim();
        RETAIL_MALL_INFO.pickupDetailAddress = wrapper.querySelector('#rbDetailAddress').value.trim();
        RETAIL_MALL_INFO.mallName = wrapper.querySelector('#rbMallDisplayName').value.trim();
        const checkedRadio = wrapper.querySelector('input[name="rbSalesMethod"]:checked');
        RETAIL_MALL_INFO.salesMethod = checkedRadio ? checkedRadio.value : RETAIL_MALL_INFO.salesMethod;
        RETAIL_MALL_INFO.baseDeliveryFee = feeApplicable ? (Number(feeRaw) || 0) : RETAIL_MALL_INFO.baseDeliveryFee;
        RETAIL_MALL_INFO.bizRegistrationNo = wrapper.querySelector('#rbBizRegistrationNo').value.trim();
        renderRetailBasicSettingsPage();
        const confirmEl = document.getElementById('rbSaveConfirm');
        if (confirmEl) {
          confirmEl.hidden = false;
          setTimeout(() => { confirmEl.hidden = true; }, 2000);
        }
      });
    }

    if (retailBasicTab === 'terms') {
      wrapper.querySelector('#rbTermsSaveBtn').addEventListener('click', () => {
        RETAIL_TERMS_TEXT = wrapper.querySelector('#rbTermsEditor').innerHTML;
        RETAIL_PRIVACY_TEXT = wrapper.querySelector('#rbPrivacyEditor').innerHTML;
        const confirmEl = wrapper.querySelector('#rbTermsSaveConfirm');
        confirmEl.hidden = false;
        setTimeout(() => { confirmEl.hidden = true; }, 2000);
      });
    }
  }

  // ---- 소매정보등록 / 상세(수정) 페이지 ----
  // ---- 소매정보 상세(조회 전용) — 내 도매상품 상세와 동일한 템플릿. 등록된 건만 진입 가능하다. ----
  function retailListingViewHTML() {
    const ref = currentRetailRef;
    const src = ref && (ref.source === 'own'
      ? retailOwnSourceRows().find(r => r.sourceCode === ref.sourceCode)
      : ref.source === 'retail'
        ? retailOnlySourceRows().find(r => r.sourceCode === ref.sourceCode)
        : retailPurchaseSourceRows().find(r => r.sourceCode === ref.sourceCode));
    const listing = ref && findRetailListing(ref.source, ref.sourceCode);
    if (!src || !listing) return pagePlaceholder('소매정보 상세', '상품 정보를 찾을 수 없습니다.');

    const holdingQty = src.holdingQty;
    // 내소매상품(source: 'retail')은 도매 연동 없이 소매관리에서 직접 보유수량을 관리하므로,
    // 보유수량이 소진되어도 조회 전용으로 전환하지 않는다 — [수정]에서 재고를 복구할 수 있어야 한다.
    const soldOut = holdingQty <= 0 && ref.source !== 'retail';
    const saleStatus = retailEffectiveSaleStatus(listing);
    const effectiveExposed = retailEffectiveExposed(listing);
    const discountRate = (listing.listPrice > 0 && listing.salePrice > 0 && listing.salePrice <= listing.listPrice)
      ? Math.round((1 - listing.salePrice / listing.listPrice) * 100) : 0;
    const salesMethodLabel = { pickup: '픽업', delivery: '배달', both: '픽업+배달' }[listing.salesMethod] || '픽업+배달';
    // 상품출처는 공급자명을 붙이지 않고 출처 구분만 노출한다 — 도매주문상품/내도매상품/내소매상품 모두 동일.
    const sourceLabel = RETAIL_SOURCE_LABELS[ref.source] || ref.source;

    return `
      <div class="grid12">
        <div class="col-12 card" style="padding-bottom:100px;">
          <button type="button" class="back-link" data-goto="retail-product">← 상품목록으로</button>
          <div class="card-head">
            <h2>소매정보 상세</h2>
          </div>

          ${soldOut ? `<div class="notice-banner">보유수량이 모두 소진되어 조회만 가능하며 항목을 수정할 수 없습니다.</div>` : ''}

          <div class="detail-meta">
            <span>상품출처 <strong>${sourceLabel}</strong></span>
            <span>상품코드 <strong>${ref.sourceCode || '-'}</strong></span>
            <span>소매등록일시 <strong>${listing.registeredAt || '-'}</strong></span>
            <span>소매수정일시 <strong>${listing.updatedAt || '-'}</strong></span>
          </div>

          <div class="detail-images">
            <div class="thumb" style="width:84px; height:84px;">IMG</div>
            <div class="thumb" style="width:84px; height:84px;">IMG</div>
          </div>

          <div class="detail-grid">
            <div class="detail-item"><span class="detail-label">소매카테고리</span><span class="detail-value">${catLabel(listing.cat1, listing.cat2, 'r')}</span></div>
            <div class="detail-item"><span class="detail-label">소매상품명</span><span class="detail-value">${escapeHtml(listing.name)}</span></div>
            <div class="detail-item"><span class="detail-label">소비자가 / 할인가</span><span class="detail-value">${(listing.listPrice || 0).toLocaleString()}원 / ${listing.salePrice ? listing.salePrice.toLocaleString() + '원' : '-'}</span></div>
            <div class="detail-item"><span class="detail-label">할인율</span><span class="detail-value">${discountRate}%</span></div>

              <div class="form-field ${isNew ? 'form-field-wide' : ''}">

              </div>
              ${isRetailOnly ? `

                <label>보유수량<span class="req">*</span></label>
                <input type="number" class="form-input" id="rtlHoldingQty" value="${holdingQty}" min="0">
              </div>
              <div class="form-field">
                <label>판매가능수량</label>
                <input type="text" class="form-input" id="rtlAvailableQtyDisplay" value="${holdingQty}개" disabled>
                <div class="field-hint">내소매상품은 보유수량과 판매가능수량이 항상 동일하게 유지됩니다.</div>
              </div>` : `
              <div class="form-field">
                <label>보유수량</label>
                <input type="text" class="form-input" value="${holdingQty}개" disabled>
              </div>
              <div class="form-field">
                <label>판매가능수량<span class="req">*</span></label>
                <input type="number" class="form-input" id="rtlAvailableQty" value="${listing ? availableQty : ''}" placeholder="0" min="0">
                <div class="field-hint">보유수량(${holdingQty}개)을 초과할 수 없습니다.</div>
                <div class="field-error" id="rtlAvailableQtyError" hidden></div>

              <div class="form-field">
                <label>수령방식</label>

  function renderRetailListingEditPage() {
    const wrapper = document.getElementById('contentWrapper');
    wrapper.innerHTML = retailListingEditHTML();
    wrapper.querySelectorAll('[data-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.goto;
        renderAll();
      });
    });

    const ref = currentRetailRef;
    if (!ref) return;
    const cat1Select = wrapper.querySelector('#rtlCat1');
    const cat2Select = wrapper.querySelector('#rtlCat2');
    if (!cat1Select) return; // 원본을 찾지 못해 placeholder만 렌더된 경우
    cat1Select.addEventListener('change', () => {
      cat2Select.innerHTML = cat2FormOptionsHTML(cat1Select.value, '', 'r');
    });

    const listPriceInput = wrapper.querySelector('#rtlListPrice');
    const salePriceInput = wrapper.querySelector('#rtlSalePrice');
    const discountRateInput = wrapper.querySelector('#rtlDiscountRate');
    function updateDiscountRate() {
      const listPrice = parseFloat(listPriceInput.value) || 0;
      const salePrice = parseFloat(salePriceInput.value) || 0;
      discountRateInput.value = (listPrice > 0 && salePrice > 0 && salePrice <= listPrice)
        ? `${Math.round((1 - salePrice / listPrice) * 100)}%` : '0%';
    }
    listPriceInput.addEventListener('input', updateDiscountRate);
    salePriceInput.addEventListener('input', updateDiscountRate);
    updateDiscountRate();

    // 채팅주문 허용 — 수령방식이 배달이면 블록 자체를 숨기고 허용 상태를 해제한다(채팅주문은 픽업 건만 지원).
    // 체크박스를 켜면 채팅주문상품명 입력란이 나타나며, 저장 전 반드시 중복확인을 통과해야 한다.
    const rtlListingForDupCheck = findRetailListing(ref.source, ref.sourceCode);
    let chatNameChecked = !!(rtlListingForDupCheck && rtlListingForDupCheck.chatOrderEnabled && rtlListingForDupCheck.chatOrderName);
    let chatNameCheckedValue = rtlListingForDupCheck ? (rtlListingForDupCheck.chatOrderName || '') : null;
    const chatOrderBlock = wrapper.querySelector('#rtlChatOrderBlock');
    const chatOrderToggle = wrapper.querySelector('#rtlChatOrderEnabled');
    const chatOrderNameField = wrapper.querySelector('#rtlChatOrderNameField');
    const chatOrderNameInput = wrapper.querySelector('#rtlChatOrderName');
    const chatOrderDupResult = wrapper.querySelector('#rtlChatOrderDupResult');
    const pickupStartField = wrapper.querySelector('#rtlPickupStartField');
    const pickupEndField = wrapper.querySelector('#rtlPickupEndField');
    wrapper.querySelectorAll('input[name="rtlSalesMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        // 채팅주문은 픽업 건만 지원하므로, 배달 선택 시 체크박스를 숨기지 않고 영역만 비운다(레이아웃 유지).
        chatOrderBlock.style.visibility = radio.value === 'delivery' ? 'hidden' : 'visible';
        if (radio.value === 'delivery') {
          chatOrderToggle.checked = false;
          chatOrderNameField.style.display = 'none';
        }
        // 픽업가능기간도 배달 단독 수령방식에는 해당하지 않으므로 필드 자체를 접어 아래 항목이 밀려 올라오게 한다.
        pickupStartField.style.display = radio.value === 'delivery' ? 'none' : '';
        pickupEndField.style.display = radio.value === 'delivery' ? 'none' : '';
      });
    });
    chatOrderToggle.addEventListener('change', () => {
      chatOrderNameField.style.display = chatOrderToggle.checked ? '' : 'none';
    });
    wrapper.querySelector('#rtlChatOrderDupCheckBtn').addEventListener('click', () => {
      const val = chatOrderNameInput.value.trim();
      chatOrderDupResult.style.display = 'block';
      if (!val) {
        chatOrderDupResult.textContent = '채팅주문상품명을 입력해주세요.';
        chatNameChecked = false;
        return;
      }
      const dup = retailActiveChatListing(val, rtlListingForDupCheck);
      if (dup) {
        chatOrderDupResult.textContent = '이미 등록된 채팅주문상품명입니다.';
        chatNameChecked = false;
      } else {
        chatOrderDupResult.textContent = '사용 가능한 채팅주문상품명입니다.';
        chatNameChecked = true;
        chatNameCheckedValue = val;
      }
    });

    const isRetailOnly = ref.source === 'retail';
    const availableQtyInput = wrapper.querySelector('#rtlAvailableQty');
    const availableQtyError = wrapper.querySelector('#rtlAvailableQtyError');
    const holdingQtyInput = wrapper.querySelector('#rtlHoldingQty');
    const availableQtyDisplay = wrapper.querySelector('#rtlAvailableQtyDisplay');
    const saleStatusSelect = wrapper.querySelector('#rtlSaleStatus');
    const saleStatusHint = wrapper.querySelector('#rtlSaleStatusHint');
    const src = ref.source === 'own'
      ? retailOwnSourceRows().find(r => r.sourceCode === ref.sourceCode)
      : ref.source === 'retail'
        ? retailOnlySourceRows().find(r => r.sourceCode === ref.sourceCode)
        : retailPurchaseSourceRows().find(r => r.sourceCode === ref.sourceCode);
    const existingListing = findRetailListing(ref.source, ref.sourceCode);
    const initialPickupExpired = existingListing ? retailPickupExpired(existingListing) : false;
    const exposedSelectEl = wrapper.querySelector('#rtlExposed');
    const exposedHintEl = wrapper.querySelector('#rtlExposedHint');
    // 보유수량 0이면 판매상태·노출여부를 잠그고(내소매상품은 보유수량 재입력 시 즉시 해제), 판매가능수량이 0이면 판매상태만 품절로 고정한다.
    function updateSaleStatusLock() {
      const curHolding = isRetailOnly ? (parseInt(holdingQtyInput.value, 10) || 0) : src.holdingQty;
      const allocated = isRetailOnly ? curHolding : (parseInt(availableQtyInput.value, 10) || 0);
      const holdingEmpty = curHolding <= 0;
      if (exposedSelectEl) {
        const exposeLocked = holdingEmpty || initialPickupExpired;
        exposedSelectEl.disabled = exposeLocked;
        if (exposeLocked) exposedSelectEl.value = 'hidden';
        if (exposedHintEl) {
          exposedHintEl.hidden = !exposeLocked;
          exposedHintEl.textContent = holdingEmpty ? '보유수량이 모두 소진되어 수정할 수 없습니다.' : '픽업가능종료일이 지나 미노출로 고정됩니다.';
        }
      }
      if (!saleStatusSelect) return; // 신규 등록(isNew)에는 판매상태 필드가 없다 — 저장 시점에 판매가능수량으로 자동 산정한다.
      const locked = holdingEmpty || allocated === 0;
      saleStatusSelect.disabled = locked;
      saleStatusHint.hidden = !locked;
      saleStatusHint.textContent = holdingEmpty ? '보유수량이 모두 소진되어 수정할 수 없습니다.' : '판매가능수량이 0이 되어 품절로 고정됩니다.';
      if (locked) saleStatusSelect.value = 'soldout';
    }
    if (isRetailOnly) {
      // 내소매상품 — 보유수량을 직접 입력하고, 판매가능수량 조회란은 그 값을 그대로 실시간 미러링한다.
      holdingQtyInput.addEventListener('input', () => {
        const qty = parseInt(holdingQtyInput.value, 10) || 0;
        availableQtyDisplay.value = `${qty}개`;
        updateSaleStatusLock();
      });
    } else {
      availableQtyInput.addEventListener('input', () => {
        const holdingQty = src.holdingQty;
        const allocated = parseInt(availableQtyInput.value, 10) || 0;
        availableQtyError.hidden = allocated <= holdingQty;
        if (!availableQtyError.hidden) availableQtyError.textContent = `보유수량(${holdingQty}개)을 초과할 수 없습니다.`;
        updateSaleStatusLock();
      });
    }
    updateSaleStatusLock();

    wrapper.querySelector('#rtlSaveBtn').addEventListener('click', () => {
      const name = wrapper.querySelector('#rtlName').value.trim();
      const cat1 = cat1Select.value;
      const cat2 = cat2Select.value || null;
      const listPrice = parseInt(listPriceInput.value, 10) || 0;
      const salePrice = parseInt(salePriceInput.value, 10) || null;
      const holdingQty = isRetailOnly ? (parseInt(holdingQtyInput.value, 10) || 0) : src.holdingQty;
      const availableQty = isRetailOnly ? holdingQty : (parseInt(availableQtyInput.value, 10) || 0);
      const salesMethod = wrapper.querySelector('input[name="rtlSalesMethod"]:checked').value;
      const composition = wrapper.querySelector('#rtlComposition').value.trim();
      const maxQty = parseInt(wrapper.querySelector('#rtlMaxQty').value, 10) || null;
      const origin = wrapper.querySelector('#rtlOrigin').value.trim();
      const expiry = wrapper.querySelector('#rtlExpiry').value.trim();
      const detailContent = wrapper.querySelector('#rtlDetailEditor').textContent.trim();
      const exposedSelect = wrapper.querySelector('#rtlExposed');
      // 수령방식이 배달이면 채팅주문은 항상 비허용으로 저장한다(체크 상태가 남아있어도 강제로 끈다).
      const chatOrderEnabled = salesMethod !== 'delivery' && chatOrderToggle.checked;
      const chatOrderName = chatOrderNameInput.value.trim();
      // 수령방식이 배달 단독이면 픽업가능기간 자체가 없으므로 저장하지 않는다(채팅주문허용과 동일한 처리 방식).
      const pickupStart = wrapper.querySelector('#rtlPickupStart').value.trim();
      const pickupEnd = wrapper.querySelector('#rtlPickupEnd').value.trim();

      const errors = [...imageCountErrors(wrapper.querySelector('[data-img-uploader]'))];
      if (!name) errors.push('상품명을 입력해주세요.');
      if (!cat1) errors.push('카테고리 1차를 선택해주세요.');
      errors.push(...priceErrors(listPriceInput.value, '소비자가'));
      errors.push(...discountErrors(salePriceInput.value, parseInt(listPriceInput.value, 10) || 0));
      if (isRetailOnly) {
        errors.push(...qtyErrors(holdingQtyInput.value, '보유수량'));
      } else {
        errors.push(...qtyErrors(availableQtyInput.value, '판매가능수량'));
        if (availableQty > holdingQty) errors.push('판매가능수량은 보유수량을 초과할 수 없습니다.');
      }
      if (chatOrderEnabled) {
        if (!chatOrderName) errors.push('채팅주문상품명을 입력해주세요.');
        else if (!chatNameChecked || chatNameCheckedValue !== chatOrderName) errors.push('채팅주문상품명 중복확인을 먼저 완료해주세요.');
        else {
          // 판매종료 상태였던 상품을 다시 노출·판매로 전환하는 저장에서는, 그 사이 다른 상품이 같은 이름을 쓰고 있을 수 있어 저장 시점에 다시 검사한다.
          const willExpose = !exposedSelect.disabled && exposedSelect.value === 'exposed';
          const willSell = saleStatusSelect ? (!saleStatusSelect.disabled && saleStatusSelect.value !== 'soldout') : availableQty > 0;
          if (willExpose && willSell && retailActiveChatListing(chatOrderName, rtlListingForDupCheck)) errors.push('이미 등록된 채팅주문상품명입니다. 채팅주문상품명을 변경한 뒤 중복확인을 완료해주세요.');
        }
      }
      if (salesMethod !== 'delivery') {
        {
          const existingListing = findRetailListing(ref.source, ref.sourceCode);
          errors.push(...pickupErrors(pickupStart, pickupEnd, existingListing ? pickupEnd !== (existingListing.pickupEndDate || '') : true));
        }
      }

      const banner = wrapper.querySelector('#retailFormErrorBanner');
      if (errors.length) {
        banner.hidden = false;
        banner.innerHTML = errors.map(e => `· ${escapeHtml(e)}`).join('<br>');
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      banner.hidden = true;

      const today = mockNowStamp();
      const exposed = exposedSelect.disabled ? false : exposedSelect.value === 'exposed';
      // isNew(신규 등록)에는 판매상태 필드 자체가 없다 — 최초 판매가능수량 기준으로 자동 산정한다.
      const saleStatus = saleStatusSelect ? (saleStatusSelect.disabled ? 'soldout' : saleStatusSelect.value) : (availableQty === 0 ? 'soldout' : 'active');
      let listing = findRetailListing(ref.source, ref.sourceCode);
      const isNew = !listing;
      if (isNew) {
        listing = { id: `RTL${String(retailListingSeq++).padStart(4, '0')}`, source: ref.source, sourceCode: ref.sourceCode, registeredAt: today };
        RETAIL_LISTINGS.push(listing);
      }
      Object.assign(listing, {
        name, image: listing.image || null, detailContent, cat1, cat2,
        listPrice, salePrice, salesMethod, composition, maxQty: maxQty || null,
        origin, expiry, availableQty, exposed, saleStatus, updatedAt: today,
        pickupStartDate: salesMethod !== 'delivery' ? pickupStart : null,
        pickupEndDate: salesMethod !== 'delivery' ? pickupEnd : null,
        chatOrderEnabled, chatOrderName: chatOrderEnabled ? chatOrderName : '',
      });
      if (isRetailOnly) listing.stock = holdingQty; // 내소매상품의 보유수량은 원본이 아닌 listing 레코드 자신이 직접 보유한다.

      // 내도매상품인 경우 PRODUCT_LIST의 기존 소매 요약 필드(노출여부·판매가능수량)를 함께 갱신해 정합성을 유지한다.
      if (ref.source === 'own') {
        const p = PRODUCT_LIST.find(x => x.code === ref.sourceCode);
        if (p) { p.retailExposed = exposed; p.retailAllocatedQty = availableQty; }
      }

      currentItem = 'retail-product';
      renderAll();
    });
  }

  // ---- 소매상품등록(내소매상품 신규) — 도매몰과 무관하게 소매관리에서 단독으로 등록한다. ----
  // 입력 항목과 화면 구성은 도매상품등록 페이지와 동일한 방식(기본정보/상세정보 섹션 구분, form-grid 배치)을 따른다.
  function retailProductRegisterHTML() {

                <select class="form-select" id="rpCat2">${cat2FormOptionsHTML('', '', 'r')}</select>

              <div class="form-field form-field-wide">
