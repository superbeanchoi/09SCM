  function bindFranchiseEvents() {
    const searchInput = document.getElementById('franchiseSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', e => { franchiseSearchDraft = e.target.value; });
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { franchiseSearchQuery = franchiseSearchDraft; franchisePage = 1; reRenderFranchise(); }
      });
    }
    const franchiseExcelBtn = document.getElementById('franchiseExcelBtn');
    if (franchiseExcelBtn) franchiseExcelBtn.addEventListener('click', () => {
      const rows = filteredFranchiseList().map(f => {
        const hq = findHq(f.hqId);
        return [hq ? hq.companyName : '', f.companyName, f.ceoName, franchiseMallUrl(f), salesMonth(f.id).net, f.feeAmount, f.status, fmtD(f.appliedAt)];
      });
      downloadListFile('가맹점정보.csv', ['소속 본사', '상호명', '대표자명', '소매몰 URL', '당월 매출액', '적용이용료', '이용상태', '가입신청일시'], rows);
    });
    const searchBtn = document.getElementById('franchiseSearchBtn');
    if (searchBtn) searchBtn.addEventListener('click', () => { franchiseSearchQuery = franchiseSearchDraft; franchisePage = 1; reRenderFranchise(); });
    const sortSelect = document.getElementById('franchiseSortSelect');
    if (sortSelect) sortSelect.addEventListener('change', e => { franchiseSort = e.target.value; franchisePage = 1; reRenderFranchise(); });
    bindPager('data-franchise-page', n => { franchisePage = n; reRenderFranchise(); });
    document.querySelectorAll('[data-franchise-filter]').forEach(btn => {
      btn.addEventListener('click', () => { franchiseStatusFilter = btn.dataset.franchiseFilter; franchisePage = 1; reRenderFranchise(); });
    });
    document.querySelectorAll('[data-franchise-detail]').forEach(btn => {
      btn.addEventListener('click', () => { franchiseDetailId = btn.dataset.franchiseDetail; reRenderFranchise(); });
    });
    const backBtn = document.getElementById('franchiseBackBtn');
    if (backBtn) backBtn.addEventListener('click', () => {
      const cur = findFranchise(franchiseDetailId);
      if (cur) { cur.payappEditing = false; cur.payappDraft = null; cur.payappAlertPending = false; }
      franchiseDetailId = null; reRenderFranchise();
    });

    // PayApp 연동 정보 수정
    const frCur = franchiseDetailId ? findFranchise(franchiseDetailId) : null;
    if (frCur) {
      const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
      on('frPayappEditBtn', 'click', () => {
        if (frCur.payapp.userid || frCur.payapp.linkkey || frCur.payapp.linkval) frCur.payappAlertPending = true;
        else { frCur.payappEditing = true; frCur.payappDraft = { ...frCur.payapp }; }
        reRenderFranchise();
      });
      on('frPayappAlertCancel', 'click', () => { frCur.payappAlertPending = false; reRenderFranchise(); });
      on('frPayappAlertContinue', 'click', () => {
        frCur.payappAlertPending = false; frCur.payappEditing = true;
        frCur.payappDraft = { ...frCur.payapp, verified: false };
        reRenderFranchise();
      });
      on('frPayappUserId', 'input', e => { frCur.payappDraft.userid = e.target.value; frCur.payappDraft.verified = false; });
      on('frPayappKey', 'input', e => { frCur.payappDraft.linkkey = e.target.value; frCur.payappDraft.verified = false; });
      on('frPayappValue', 'input', e => { frCur.payappDraft.linkval = e.target.value; frCur.payappDraft.verified = false; });
      on('frPayappVerifyBtn', 'click', () => {
        frCur.payappDraft.verified = !!(frCur.payappDraft.userid && frCur.payappDraft.linkkey && frCur.payappDraft.linkval);
        reRenderFranchise();
      });
      on('frPayappCancelBtn', 'click', () => { frCur.payappEditing = false; frCur.payappDraft = null; reRenderFranchise(); });
      on('frPayappCommitBtn', 'click', () => {
        if (!frCur.payappDraft.verified) return;
        frCur.payapp = { ...frCur.payappDraft };
        frCur.payappEditing = false; frCur.payappDraft = null;
        reRenderFranchise();
      });
    }
    // 관리자접속 — 이용상태와 무관하게 항상 노출한다(내부 전용 어드민이므로 조건 게이팅 없음).
    // 안내 후 새 창으로 연결하며, 목업은 09SCM 관리자 목업으로 대체한다.
    const adminAccessBtn = document.getElementById('franchiseAdminAccessBtn');
    if (adminAccessBtn) adminAccessBtn.addEventListener('click', () => {
      const f = findFranchise(franchiseDetailId);
      openAdminAccessModal('franchise', f ? f.companyName : '');
    });
    const goSettlementBtn = document.getElementById('franchiseGoSettlementBtn');
    if (goSettlementBtn) goSettlementBtn.addEventListener('click', () => {
      resetSalesState();
      currentItem = 'sales';
      salesTab = 'franchise';
      const ff = findFranchise(franchiseDetailId);
      if (ff) { salesQueryDraft.franchise = ff.companyName; salesQuery.franchise = ff.companyName; salesSelected.franchise = ff.id; }
      renderAll();
    });
  }

  // ---- Render ----
  let currentItem = 'dashboard';
  const openGroups = new Set();

  function findItem(id) {
    for (const item of MENU) {
      if (item.id === id) return { item, parent: null };
      if (item.children) {
        const c = item.children.find(c => c.id === id);
        if (c) return { item: c, parent: item };
      }
    }
    return null;
  }

  function findParentOf(id) {
    for (const item of MENU) {
      if (item.children && item.children.some(c => c.id === id)) return item.id;
    }
    return null;
  }

  function renderMenu() {
    const el = document.getElementById('menu');
    el.innerHTML = MENU.map(item => {
      if (item.children) {
        const isOpen = openGroups.has(item.id) || findParentOf(currentItem) === item.id;
        const subItems = item.children.map(c => `
          <button class="menu-item ${c.id === currentItem ? 'active' : ''}" data-id="${c.id}">${c.label}</button>
        `).join('');
        return `
          <div class="menu-group ${isOpen ? 'open' : ''}" data-group="${item.id}">
            <button class="menu-item" data-toggle="${item.id}">
              <span>${item.label}</span><span class="chev">▸</span>
            </button>
            <div class="submenu">${subItems}</div>
          </div>`;
      }
      return `<button class="menu-item ${item.id === currentItem ? 'active' : ''}" data-id="${item.id}">${item.label}</button>`;
    }).join('');

    el.querySelectorAll('[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = btn.dataset.id;
        refreshRealtimeStamp();
        if (currentItem === 'hq-manage') { hqDetailId = null; hqDetailTab = 'apply'; hqRegisterMode = false; hqStatusFilter = '전체'; hqSearchDraft = ''; hqSearchQuery = ''; hqPage = 1; hqSelectedIds.clear(); }
        if (currentItem === 'sales') resetSalesState();
        if (currentItem === 'notice') resetNoticeState();
        if (currentItem === 'terms') resetTermsState();
        if (currentItem === 'franchise-info') { franchiseDetailId = null; franchiseSearchDraft = ''; franchiseSearchQuery = ''; franchisePage = 1; franchiseStatusFilter = '전체'; franchiseSort = 'appliedAt'; }
        renderAll();
        closeNavOnMobile();
      });
    });
    el.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
        renderMenu();
      });
    });
  }

  // ---- 거래/매출 현황 ----
  // 조회 전용 화면. 정산·수수료·미수납 데이터는 다루지 않으며, 결제완료 건만 판매 주체(본사·가맹점 각자의 PayApp 계정) 기준으로 집계한다.
  //  - 결제총액: 결제완료 일시 기준 / 취소·환불액: 승인일시 기준 / 매출액 = 결제총액 − 취소·환불액(0 미만 가능)
  //  - 본사 = 본사 자체 몰(소매 판매 + 도매 공급) 매출만, 가맹점 = 가맹점 자체 매출만 집계한다(소속 가맹점 합산 없음).
  //  - 전체 현황 = 모든 본사·가맹점의 자체 매출 단순 합. 이용료 수납액은 매출과 별개(본사 = 소속 가맹점 이용료 수납 합계).
  //  - 목데이터는 임의 생성값이며 본사 관리·가맹점 정보·대시보드의 매출 수치와 같은 생성 로직을 공유한다.
  const SALES_TODAY = '2026-09-30';
  const SALES_DATA_START = '2026-04-01';
  const SALES_DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const SALES_PROFILE = {
    hq2:    { retail: { pay: 14, off: 5 }, wholesale: { pay: 3, off: 1 } },
    hq3:    { retail: { pay: 6, off: 3 },  wholesale: { pay: 1, off: 1 } },
    hj365:  { retail: { pay: 5, off: 2 },  wholesale: { pay: 1, off: 0 } },
    hm7218: { retail: { pay: 0, off: 2 },  wholesale: { pay: 0.5, off: 0 } },
  };
  const SALES_AVG = { retail: 32000, wholesale: 420000 };
  const SALES_SERIES = [
    { k: 'payNet', name: '페이앱 매출액', cls: 'pay' },
    { k: 'offNet', name: '현장결제·계좌이체 매출액', cls: 'off' },
    { k: 'total', name: '총매출액', cls: 'total' },
    { k: 'fee', name: '이용료 수납액', cls: 'fee' },
  ];

  function sDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function sStr(dt) { return dt.toISOString().slice(0, 10); }
  function sAddDays(s, n) { const dt = sDate(s); dt.setUTCDate(dt.getUTCDate() + n); return sStr(dt); }
  function sMonday(s) { return sAddDays(s, -((sDate(s).getUTCDay() + 6) % 7)); }
  function sHash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function sRng(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function sFmt(n) { return Math.round(n).toLocaleString(); }
  function sShort(v) {
    const a = Math.abs(v), sign = v < 0 ? '-' : '';
    if (a >= 1e8) return sign + (a / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
    if (a >= 1e4) return sign + Math.round(a / 1e4).toLocaleString() + '만';
    return sign + a.toLocaleString();
  }
  function sNiceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }
  function sZero() { return { pay: 0, off: 0, cPay: 0, cOff: 0, n: 0, nc: 0, fee: 0 }; }
  function sAccum(a, b) { for (const k of ['pay', 'off', 'cPay', 'cOff', 'n', 'nc', 'fee']) a[k] += b[k]; return a; }

  const salesRecCache = new Map();
  function salesGenRec(id, date, type) {
    const key = `${id}|${date}|${type}`;
    if (salesRecCache.has(key)) return salesRecCache.get(key);
    const rec = sZero();
    const prof = SALES_PROFILE[id] && SALES_PROFILE[id][type];
    if (prof) {
      const rnd = sRng(sHash(key));
      const dow = sDate(date).getUTCDay();
      const fac = ((dow === 0 || dow === 6) ? 0.7 : 1) * (date === SALES_TODAY ? 0.4 : 1); // 오늘은 조회 시점까지의 부분 값
      const avg = SALES_AVG[type];
      const nPay = Math.round(prof.pay * fac * (0.5 + rnd()));
      const nOff = Math.round(prof.off * fac * (0.5 + rnd()));
      rec.pay = Math.round(nPay * avg * (0.85 + 0.3 * rnd()) / 100) * 100;
      rec.off = Math.round(nOff * avg * (0.85 + 0.3 * rnd()) / 100) * 100;
      rec.n = nPay + nOff;
      if (rec.n > 0 && rnd() < Math.min(0.9, 0.2 + rec.n * 0.06)) {
        rec.nc = rnd() < 0.2 && rec.n > 6 ? 2 : 1;
        const amt = Math.round(rec.nc * avg * (0.6 + 0.8 * rnd()) / 100) * 100;
        if (rnd() < 0.7 && rec.pay > 0) rec.cPay = amt; else if (rec.off > 0) rec.cOff = amt; else rec.cPay = amt;
      }
    }
    salesRecCache.set(key, rec);
    return rec;
  }
  function salesHqFee(hqId, date) {
    const day = Number(date.slice(8, 10));
    return FRANCHISE_LIST
      .filter(f => f.hqId === hqId && f.feeRegistered && (f.status === '이용승인' || f.status === '이용제한') && f.billingDay === day)
      .reduce((acc, f) => acc + f.feeAmount, 0);
  }
  function salesDaily(ids, date, type) {
    const r = sZero();
    const types = type === '소매' ? ['retail'] : type === '도매' ? ['wholesale'] : ['retail', 'wholesale'];
    ids.forEach(id => {
      types.forEach(t => sAccum(r, salesGenRec(id, date, t)));
      if (HQ_LIST.some(h => h.id === id) || DELETED_SALES_IDS.includes(id)) r.fee += salesHqFee(id, date);
    });
    return r;
  }
  const DELETED_SALES_IDS = []; // 삭제된 본사의 매출 이력(전체 현황 합계에만 포함)
  function salesIds(scope, id) {
    if (scope === 'all') return [...HQ_LIST.filter(h => h.provisioned).map(h => h.id), ...DELETED_SALES_IDS, ...FRANCHISE_LIST.map(f => f.id)];
    return [id];
  }
  function salesBuckets(ids, from, to, type, unit) {
    const map = new Map();
    for (let d = from; d <= to; d = sAddDays(d, 1)) {
      let key, label;
      if (unit === 'day') { key = d; label = `${fmtD(d)}(${SALES_DOW[sDate(d).getUTCDay()]})`; }
      else if (unit === 'week') {
        const mon = sMonday(d); key = mon;
        const s = mon < from ? from : mon, e = sAddDays(mon, 6) > to ? to : sAddDays(mon, 6);
        label = `${fmtD(s)} ~ ${fmtD(e)}`;
      } else { key = d.slice(0, 7); label = key.slice(2).replace('-', '.'); }
      if (!map.has(key)) map.set(key, { key, label, ...sZero() });
      sAccum(map.get(key), salesDaily(ids, d, type));
    }
    return [...map.values()].map(b => ({
      ...b, payNet: b.pay - b.cPay, offNet: b.off - b.cOff, total: (b.pay - b.cPay) + (b.off - b.cOff),
    }));
  }

  function salesPresetRange(p) {
    const y = sAddDays(SALES_TODAY, -1), first = SALES_TODAY.slice(0, 7) + '-01';
    if (p === '오늘') return { from: SALES_TODAY, to: SALES_TODAY };
    if (p === '어제') return { from: y, to: y };
    if (p === '이번주') return { from: sMonday(SALES_TODAY), to: SALES_TODAY };
    if (p === '이번달') return { from: first, to: SALES_TODAY };
    if (p === '저번달') { const end = sAddDays(first, -1); return { from: end.slice(0, 7) + '-01', to: end }; }
    return null;
  }
  // 당월(1일~기준일) 본사·가맹점 자체 매출 합계 — 본사 관리·가맹점 정보의 목록/상세 요약이 거래/매출 현황과 같은 값을 쓰도록 같은 생성 로직을 사용한다.
  const salesMonthCache = new Map();
  function salesMonth(id) {
    if (salesMonthCache.has(id)) return salesMonthCache.get(id);
    const T = sZero();
    for (let d = SALES_TODAY.slice(0, 7) + '-01'; d <= SALES_TODAY; d = sAddDays(d, 1)) sAccum(T, salesDaily([id], d, '전체'));
    const r = { pay: T.pay, off: T.off, gross: T.pay + T.off, net: T.pay + T.off - T.cPay - T.cOff, fee: T.fee };
    salesMonthCache.set(id, r);
    return r;
  }
  const SALES_DEFAULT = () => ({ preset: '이번달', ...salesPresetRange('이번달'), type: '전체' });
  let salesTab = 'all'; // 'all' | 'hq' | 'franchise'
  let salesDraft = SALES_DEFAULT();
  let salesApplied = SALES_DEFAULT();
  let salesUnit = 'day'; // 'day' | 'week' | 'month'
  let salesPage = 1;
  let salesFilterError = '';
  let salesNotice = '';
  let salesQueryDraft = { hq: '', franchise: '' };
  let salesQuery = { hq: '', franchise: '' };
  let salesSelected = { hq: null, franchise: null };
  let salesListPage = { hq: 1, franchise: 1 };
  let salesListSort = { hq: 'sales', franchise: 'sales' }; // 'sales'(매출액순) | 'order'(주문순) | 'name'(상호명순)
  const SALES_PAGE_SIZE = 10;
  const SALES_LIST_SIZE = 20;

  function resetSalesState() {
    salesTab = 'all'; salesDraft = SALES_DEFAULT(); salesApplied = SALES_DEFAULT();
    salesUnit = 'day'; salesPage = 1; salesFilterError = ''; salesNotice = '';
    salesQueryDraft = { hq: '', franchise: '' }; salesQuery = { hq: '', franchise: '' };
    salesSelected = { hq: null, franchise: null }; salesListPage = { hq: 1, franchise: 1 }; salesListSort = { hq: 'sales', franchise: 'sales' };
  }

  function salesSearchMatches(scope, q) {
    const s = q.trim().toLowerCase();
    const digits = s.replace(/\D/g, '');
    const hit = (...vals) => vals.some(v => v && (v.toLowerCase().includes(s) || (digits && v.replace(/\D/g, '').includes(digits))));
    let list;
    if (scope === 'hq') list = HQ_LIST.filter(h => h.provisioned && (!s || hit(h.companyName, h.ceoName, h.bizRegNo)));
    else list = FRANCHISE_LIST.filter(f => { const hq = HQ_LIST.find(h => h.id === f.hqId); return !s || hit(f.companyName, f.ceoName, f.bizRegNo, hq && hq.companyName); });
    return list.slice().sort((a, b) => a.companyName.localeCompare(b.companyName, 'ko'));
  }

  function salesChartHTML(buckets, showFee) {
    const ser = SALES_SERIES.filter(s => showFee || s.k !== 'fee');
    const vals = buckets.flatMap(b => ser.map(s => b[s.k]));
    let yMax = Math.max(0, ...vals), yMin = Math.min(0, ...vals);
    if (yMax === 0 && yMin === 0) yMax = 1;
    const step = sNiceStep((yMax - yMin) / 4);
    const top = Math.ceil(yMax / step) * step, bottom = Math.floor(yMin / step) * step;
    const H = 200, padL = 56, padR = 12, padT = 10, padB = 28, gap = 3, groupGap = 6;
    const wrap = document.getElementById('contentWrapper');
    const avail = Math.max(560, (wrap ? wrap.clientWidth : 1100) - 48 - 48 - 18);
    const fitSlot = (avail - padL - padR) / buckets.length;
    const maxBar = buckets.length <= 12 ? 36 : 16;
    const barW = Math.max(4, Math.min(maxBar, Math.floor((fitSlot * 0.6 - (ser.length - 1) * gap) / ser.length)));
    const groupW = ser.length * barW + (ser.length - 1) * gap;
    const W = Math.max(padL + padR + buckets.length * (groupW + groupGap * 2), avail);
    const y = v => padT + (top - v) / (top - bottom) * (H - padT - padB);
    const slot = (W - padL - padR) / buckets.length;
    let g = '';
    for (let t = bottom; t <= top + 1e-9; t += step) {
      g += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-text" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${sShort(t)}</text>`;
    }
    g += `<line class="base-line" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
    const skip = Math.ceil(buckets.length / Math.max(4, Math.floor(W / 150)));
    buckets.forEach((b, i) => {
      const gx = padL + i * slot + (slot - groupW) / 2;
      ser.forEach((s, j) => {
        const v = b[s.k], x = gx + j * (barW + gap);
        const yy = Math.min(y(v), y(0)), hh = v === 0 ? 0 : Math.max(1, Math.abs(y(v) - y(0)));
        g += `<rect class="s-${s.cls}" x="${x}" y="${yy}" width="${barW}" height="${hh}" rx="2"><title>${b.label} · ${s.name} ${sFmt(v)}원</title></rect>`;
      });
      if (i % skip === 0) g += `<text class="axis-text" x="${padL + i * slot + slot / 2}" y="${H - 10}" text-anchor="middle">${b.label}</text>`;
    });
    const legend = ser.map(s => `<span><i class="lg-${s.cls}"></i>${s.name}</span>`).join('');
    return `<div class="sales-legend">${legend}</div>
      <div class="sales-chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="매출 추이 막대차트">${g}</svg></div>`;
  }

  function salesViewHTML(scope, id) {
    const { from, to, type } = salesApplied;
    const ids = salesIds(scope, id);
    const showFee = scope !== 'franchise';
    const buckets = salesBuckets(ids, from, to, type, salesUnit);
    const T = buckets.reduce((a, b) => sAccum(a, b), sZero());
    const gross = T.pay + T.off, cancel = T.cPay + T.cOff, net = gross - cancel;
    const card = (label, value, sub, basis) => `
      <div class="col-4 stat-card">
        <div class="stat-label">${label}</div>
        <div class="stat-value">${sFmt(value)}원</div>
        <div class="stat-sub">${sub || '&nbsp;'}</div>
        <div class="stat-basis">${basis}</div>
      </div>`;
    const cards = [
      card('결제총액', gross, `주문 ${sFmt(T.n)}건`, '결제완료 일시 기준 결제금액 합계'),
      card('취소·환불액', cancel, `취소·환불 ${sFmt(T.nc)}건`, '승인일시 기준 취소·반품 금액 합계'),
      card('매출액', net, '', '결제총액 − 취소·환불액'),
      card('페이앱 결제액', T.pay, '', '결제수단이 카드결제인 결제총액'),
      card('현장결제·계좌이체 결제액', T.off, '', '결제수단이 현장결제·계좌이체인 결제총액'),
      showFee ? card('이용료 수납액', T.fee, '', scope === 'hq' ? '소속 가맹점 이용료 결제완료·수기완납 합계 (매출 미포함)' : '이용료 결제완료·수기완납 합계 (매출 미포함)') : '',
    ].join('');

    const rowsAll = buckets.slice().reverse();
    const pages = Math.max(1, Math.ceil(rowsAll.length / SALES_PAGE_SIZE));
    if (salesPage > pages) salesPage = pages;
    const rows = rowsAll.slice((salesPage - 1) * SALES_PAGE_SIZE, salesPage * SALES_PAGE_SIZE);
    const numTd = v => `<td class="num ${v < 0 ? 'neg' : ''}">${sFmt(v)}</td>`;
    const tr = (b, cls) => `<tr class="${cls || ''}"><td>${b.label}</td>${numTd(b.payNet)}${numTd(b.offNet)}${numTd(b.total)}<td class="num">${sFmt(b.n)}</td><td class="num">${sFmt(b.nc)}</td>${showFee ? numTd(b.fee) : ''}</tr>`;
    const sumRow = tr({ label: '합계', payNet: T.pay - T.cPay, offNet: T.off - T.cOff, total: net, n: T.n, nc: T.nc, fee: T.fee }, 'sum-row');
    const pager = pagerHTML('data-sales-page', salesPage, rowsAll.length, SALES_PAGE_SIZE);
    const unitTabs = [['day', '일별'], ['week', '주별'], ['month', '월별']].map(([k, l]) =>
      `<button type="button" class="filter-tab ${salesUnit === k ? 'active' : ''}" data-sales-unit="${k}">${l}</button>`).join('');
    const ncol = showFee ? 6 : 5;
    const colgroup = `<colgroup><col style="width:16%">${Array.from({ length: ncol }, () => `<col style="width:${(84 / ncol).toFixed(2)}%">`).join('')}</colgroup>`;

    return `
      <div class="grid12 stat-grid" style="margin-bottom:6px;">${cards}</div>
      <p class="sales-hint">※ 페이앱 결제액 + 현장결제·계좌이체 결제액 = 결제총액 · 결제 완료된 건만 집계하며 미수납·결제대기 건은 제외합니다.</p>
      <div class="sales-chart-head">
        <h3 class="sales-sub-title">매출 추이</h3>
        <div class="hq-filter-tabs" style="margin:0;">${unitTabs}</div>
      </div>
      ${salesChartHTML(buckets, showFee)}
      <div class="table-scroll">
        <table class="hq-table sales-table">
          ${colgroup}
          <thead><tr><th>기간</th><th class="num">페이앱 매출액</th><th class="num">현장결제·계좌이체 매출액</th><th class="num">총매출액</th><th class="num">주문건수</th><th class="num">취소·환불건수</th>${showFee ? '<th class="num">이용료 수납액</th>' : ''}</tr></thead>
          <tbody>${sumRow}${rows.map(b => tr(b)).join('')}</tbody>
        </table>
      </div>
      ${pager}`;
  }

  function salesListHTML(scope) {
    const isHq = scope === 'hq';
    const q = salesQuery[scope];
    // 주문건수·매출액은 상단에서 적용한 조회기간·거래유형 기준이다.
    const metric = new Map();
    const matched = salesSearchMatches(scope, q);
    matched.forEach(e => {
      const bs = salesBuckets(salesIds(scope, e.id), salesApplied.from, salesApplied.to, salesApplied.type, 'month');
      metric.set(e.id, bs.reduce((a, b) => ({ n: a.n + b.n, total: a.total + b.total }), { n: 0, total: 0 }));
    });
    const sortKey = salesListSort[scope];
    const list = matched.slice().sort((a, b) => {
      const ma = metric.get(a.id), mb = metric.get(b.id);
      if (sortKey === 'sales' && mb.total !== ma.total) return mb.total - ma.total;
      if (sortKey === 'order' && mb.n !== ma.n) return mb.n - ma.n;
      return a.companyName.localeCompare(b.companyName, 'ko');
    });
    const pages = Math.max(1, Math.ceil(list.length / SALES_LIST_SIZE));
    if (salesListPage[scope] > pages) salesListPage[scope] = pages;
    const cur = salesListPage[scope];
    const rows = list.slice((cur - 1) * SALES_LIST_SIZE, cur * SALES_LIST_SIZE).map(e => {
      const hq = isHq ? null : HQ_LIST.find(h => h.id === e.hqId);
      const badge = isHq ? `<span class="badge ${hqStatusBadgeClass(e.status)}">${e.status}</span>` : `<span class="badge ${franchiseStatusBadgeClass(e.status)}">${e.status}</span>`;
      const mid = isHq ? `<td>${hqFranchiseStats(e).totalCount}개</td>` : `<td>${hq ? escapeHtml(hq.companyName) : '-'}</td>`;
      return `<tr><td><div class="hq-cell-main">${escapeHtml(e.companyName)}</div><div class="hq-cell-sub">${escapeHtml(e.ceoName)}</div></td>${mid}<td>${sFmt(metric.get(e.id).n)}건</td><td>${sFmt(metric.get(e.id).total)}원</td><td>${badge}</td><td class="manage-col"><div class="manage-cell"><button type="button" class="btn-secondary btn-sm" data-sales-view="${e.id}">보기</button></div></td></tr>`;
    }).join('');
    const pager = pagerHTML('data-sales-lpage', cur, list.length, SALES_LIST_SIZE);
    return `
      <div class="table-toolbar">
        <span class="table-count">전체 ${list.length}건</span>
        <select class="sort-select" id="salesListSort">${[['sales', '매출액순'], ['order', '주문순'], ['name', '상호명순']].map(([k, l]) => `<option value="${k}" ${sortKey === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      ${list.length ? `<div class="table-scroll"><table class="hq-table sales-list-table">
        <thead><tr><th>${isHq ? '본사정보' : '가맹점정보'}</th><th>${isHq ? '가맹점 수' : '소속 본사'}</th><th>주문건수</th><th>매출액</th><th>${isHq ? '운영상태' : '이용상태'}</th><th class="manage-col">관리</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pager}` : `<div class="sales-empty">검색 결과가 없습니다.</div>`}`;
  }

  function salesSearchTabHTML(scope) {
    const isHq = scope === 'hq';
    const sel = salesSelected[scope];
    if (sel) {
      const e = isHq ? HQ_LIST.find(h => h.id === sel) : FRANCHISE_LIST.find(f => f.id === sel);
      const hq = isHq ? null : HQ_LIST.find(h => h.id === e.hqId);
      const badge = isHq ? `<span class="badge ${hqStatusBadgeClass(e.status)}">${e.status}</span>` : `<span class="badge ${franchiseStatusBadgeClass(e.status)}">${e.status}</span>`;
      return `
        <div class="sales-selected">
          <div class="sales-selected-main"><strong>${escapeHtml(e.companyName)}</strong>${badge}<span class="sales-base">${isHq ? '' : `소속 본사 ${hq ? escapeHtml(hq.companyName) : '-'} · `}사업자번호 ${escapeHtml(e.bizRegNo)}</span></div>
          <div class="hq-actions-cell">
            <button type="button" class="btn-secondary btn-sm" data-sales-open="${e.id}">${isHq ? '본사 상세 이동' : '가맹점 상세 이동'} →</button>
            <button type="button" class="btn-secondary btn-sm" data-sales-clear="1">목록으로</button>
          </div>
        </div>
        ${salesViewHTML(scope, e.id)}`;
    }
    const ph = isHq ? '상호명, 대표자명, 사업자번호 검색' : '소속본사 상호명, 가맹 상호명, 가맹 대표자명, 가맹 사업자번호 검색';
    return `
      <div class="sales-search">
        <input type="text" class="form-input" id="salesSearchInput" data-scope="${scope}" placeholder="${ph}" value="${escapeHtml(salesQueryDraft[scope])}">
        <button type="button" class="btn-secondary" id="salesSearchBtn" data-scope="${scope}">검색</button>
      </div>
      ${salesListHTML(scope)}`;
  }

  function salesPageHTML() {
    const d = salesDraft;
    const custom = d.preset === '기간';
    const tabs = [['all', '전체 현황'], ['hq', '본사별 현황'], ['franchise', '가맹점별 현황']];
    const tabsHTML = tabs.map(([k, l]) => `<button type="button" class="tab-item ${salesTab === k ? 'active' : ''}" data-sales-tab="${k}">${l}</button>`).join('');
    const content = salesTab === 'all' ? salesViewHTML('all') : salesSearchTabHTML(salesTab);
    const chips = SALES_PRESET_OPTIONS.map(p => `<button type="button" class="filter-tab ${d.preset === p ? 'active' : ''}" data-sales-preset="${p}">${p}</button>`).join('');
    return `
      <div class="grid12">
        <div class="col-12 page-section">
          <div class="card-head">
            <h2>거래/매출 현황</h2>
            <div class="sales-head-right">
              ${salesNotice ? `<span class="sales-notice">${salesNotice}</span>` : ''}
              <button type="button" class="btn-secondary btn-sm" id="salesExcelBtn">엑셀 다운로드</button>
            </div>
          </div>
          <div class="sales-filter">
            <div class="form-row">
              <label class="field-label">조회기간</label>
              <div class="hq-filter-tabs" style="margin:0;">${chips}</div>
              <input type="date" class="form-input date" id="salesFrom" value="${d.from}" min="${SALES_DATA_START}" max="${SALES_TODAY}" ${custom ? '' : 'disabled'}>
              <span>~</span>
              <input type="date" class="form-input date" id="salesTo" value="${d.to}" min="${SALES_DATA_START}" max="${SALES_TODAY}" ${custom ? '' : 'disabled'}>
              <label class="field-label" style="margin-left:12px;">거래유형</label>
              <select class="sort-select" id="salesType">${['전체', '소매', '도매'].map(t => `<option ${d.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
              <div class="sales-filter-actions">
                <button type="button" class="btn-secondary" id="salesResetBtn">초기화</button>
                <button type="button" class="btn-primary" id="salesApplyBtn">조회</button>
              </div>
            </div>
            ${salesFilterError ? `<div class="sales-filter-error">${salesFilterError}</div>` : ''}
          </div>
          <div class="sales-base" style="margin:12px 0 4px;">${realtimeLabel()}</div>
          <div class="tabs">${tabsHTML}</div>
          <div class="sales-body">${content}</div>
        </div>
      </div>`;
  }
  const SALES_PRESET_OPTIONS = ['오늘', '어제', '이번주', '이번달', '저번달', '기간'];

  function salesRerender() { renderContent(); }

  function bindSalesEvents() {
    const $ = id => document.getElementById(id);
    const cs = document.querySelector('.sales-chart-scroll');
    if (cs) {
      cs.scrollLeft = cs.scrollWidth; // 넘칠 때만 — 최근 기간이 보이도록 우측 끝에서 시작
      if (cs.scrollWidth > cs.clientWidth + 16) {
        cs.classList.add('draggable');
        let sx = 0, sl = 0, down = false;
        cs.addEventListener('mousedown', e => { down = true; sx = e.clientX; sl = cs.scrollLeft; cs.classList.add('dragging'); });
        window.addEventListener('mousemove', e => { if (down) cs.scrollLeft = sl - (e.clientX - sx); });
        window.addEventListener('mouseup', () => { down = false; cs.classList.remove('dragging'); });
      }
    }
    document.querySelectorAll('[data-sales-preset]').forEach(b => b.addEventListener('click', () => {
      salesDraft.preset = b.dataset.salesPreset;
      const rg = salesPresetRange(salesDraft.preset);
      if (rg) { salesDraft.from = rg.from; salesDraft.to = rg.to; }
      salesFilterError = '';
      salesRerender();
    }));
    $('salesFrom').addEventListener('change', e => { salesDraft.from = e.target.value; });
    $('salesTo').addEventListener('change', e => { salesDraft.to = e.target.value; });
    $('salesType').addEventListener('change', e => { salesDraft.type = e.target.value; });
    $('salesResetBtn').addEventListener('click', () => {
      salesDraft = SALES_DEFAULT(); salesApplied = SALES_DEFAULT(); salesFilterError = ''; salesNotice = ''; salesPage = 1;
      salesRerender();
    });
    $('salesApplyBtn').addEventListener('click', () => {
      const d = salesDraft;
      if (d.preset === '기간') {
        if (!d.from || !d.to) { salesFilterError = '조회 시작일과 종료일을 모두 선택해 주세요.'; salesRerender(); return; }
        if (d.from > d.to) { salesFilterError = '조회 시작일은 종료일보다 이후일 수 없습니다.'; salesRerender(); return; }
      }
      salesFilterError = ''; salesNotice = ''; salesPage = 1;
      salesApplied = { ...d };
      salesRerender();
    });
    $('salesExcelBtn').addEventListener('click', () => {
      const name = { all: '전체 현황', hq: '본사별 현황', franchise: '가맹점별 현황' }[salesTab];
      salesNotice = `${name} · 현재 조회 조건 기준으로 다운로드됩니다.`;
      salesRerender();
    });
    document.querySelectorAll('[data-sales-tab]').forEach(b => b.addEventListener('click', () => {
      salesTab = b.dataset.salesTab; salesPage = 1; salesNotice = ''; salesRerender();
    }));
    document.querySelectorAll('[data-sales-unit]').forEach(b => b.addEventListener('click', () => {
      salesUnit = b.dataset.salesUnit; salesPage = 1; salesRerender();
    }));
    document.querySelectorAll('[data-sales-page]').forEach(b => b.addEventListener('click', () => {
      salesPage = Number(b.dataset.salesPage); salesRerender();
    }));
    if (salesTab === 'all') return;
    const scope = salesTab;
    const input = $('salesSearchInput');
    if (input) {
      const run = () => { salesQuery[scope] = salesQueryDraft[scope].trim(); salesListPage[scope] = 1; salesRerender(); };
      input.addEventListener('input', () => { salesQueryDraft[scope] = input.value; });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
      $('salesSearchBtn').addEventListener('click', run);
    }
    const lsort = $('salesListSort');
    if (lsort) lsort.addEventListener('change', e => { salesListSort[scope] = e.target.value; salesListPage[scope] = 1; salesRerender(); });
    document.querySelectorAll('[data-sales-lpage]').forEach(b => b.addEventListener('click', () => {
      salesListPage[scope] = Number(b.dataset.salesLpage); salesRerender();
    }));
    document.querySelectorAll('[data-sales-view]').forEach(b => b.addEventListener('click', () => {
      salesSelected[scope] = b.dataset.salesView; salesPage = 1; salesRerender();
    }));
    document.querySelectorAll('[data-sales-clear]').forEach(b => b.addEventListener('click', () => {
      salesSelected[scope] = null; salesRerender();
    }));
    document.querySelectorAll('[data-sales-open]').forEach(b => b.addEventListener('click', () => {
      if (scope === 'hq') { currentItem = 'hq-manage'; hqDetailId = b.dataset.salesOpen; hqDetailTab = 'apply'; }
      else { currentItem = 'franchise-info'; franchiseDetailId = b.dataset.salesOpen; }
      renderAll();
    }));
  }

  function currentLabel() {
    const found = findItem(currentItem);
    return found ? found.item.label : '';
  }

  function renderTopbar() {
    // 헤더 타이틀은 상위 대메뉴명 기준으로 고정한다(09SCM 파트너어드민과 동일한 원칙).
    const parentId = findParentOf(currentItem);
    const titleId = parentId || currentItem;
    document.getElementById('pageTitle').textContent = findItem(titleId).item.label;
  }


  // ---- 대시보드 ----
  // 모든 수치는 페이지 진입·새로고침 시점의 최신 데이터(실시간)이며, 매출 수치는 거래/매출 현황 전체 현황(이번달·전체)과 같은 값이다.
  function dashMonthStart(back) {
    let [y, m] = SALES_TODAY.slice(0, 7).split('-').map(Number);
    m -= back;
    while (m < 1) { m += 12; y -= 1; }
    return `${y}-${String(m).padStart(2, '0')}-01`;
  }

  function dashboardHTML() {
    const wait = HQ_LIST.filter(h => h.status === '승인대기').sort((a, b) => (a.appliedAt < b.appliedAt ? 1 : a.appliedAt > b.appliedAt ? -1 : 0));
    const hqOperating = HQ_LIST.filter(h => h.status === '운영중' || h.status === '운영제한');
    const hqLimited = HQ_LIST.filter(h => h.status === '운영제한');
    const frOperating = FRANCHISE_LIST.filter(f => f.status === '이용승인' || f.status === '이용제한');
    const frLimited = FRANCHISE_LIST.filter(f => f.status === '이용제한');
    const frNew = FRANCHISE_LIST.filter(f => (f.appliedAt || '').slice(0, 7) === MOCK_NOW_MONTH).length;

    const ids = salesIds('all');
    const first = SALES_TODAY.slice(0, 7) + '-01';
    const cur = salesBuckets(ids, first, SALES_TODAY, '전체', 'month')[0] || { ...sZero() };
    const gross = cur.pay + cur.off;
    const pct = v => (gross > 0 ? `결제총액 대비 ${Math.round(v / gross * 100)}%` : '결제총액 대비 -');
    const buckets = salesBuckets(ids, dashMonthStart(5), SALES_TODAY, '전체', 'month');

    const stat = (label, value, sub, opt = {}) => `
      <div class="col-3 card dash-stat ${opt.emph || ''} ${opt.go ? 'link' : ''}" ${opt.go ? `data-dash-go="${opt.go}" role="button" tabindex="0"` : ''}>
        <div class="stat-label">${label}</div>
        <div class="stat-value">${value}</div>
        <div class="stat-sub">${sub || '&nbsp;'}</div>
        ${opt.basis ? `<div class="stat-basis">${opt.basis}</div>` : ''}
      </div>`;

    const row1 = [
      stat('승인 대기 본사', `${wait.length}개`, '확인이 필요한 신청', { emph: 'emph-warn', go: 'hq-wait' }),
      stat('운영 본사', `${hqOperating.length}개`, `전체 ${HQ_LIST.length}개 중`),
      stat('운영 가맹점', `${frOperating.length}개`, `전체 ${FRANCHISE_LIST.length}개 중`),
      stat('당월 신규 가입 가맹점', `${frNew}개`, ''),
    ].join('');
    const row2 = [
      stat('당월 결제총액', `${sFmt(gross)}원`, `주문 ${sFmt(cur.n)}건`, { basis: '결제완료 일시 기준 결제금액 합계' }),
      stat('당월 페이앱 결제액', `${sFmt(cur.pay)}원`, pct(cur.pay), { basis: '결제수단이 카드결제인 결제총액' }),
      stat('당월 현장결제·계좌이체 결제액', `${sFmt(cur.off)}원`, pct(cur.off), { basis: '결제수단이 현장결제·계좌이체인 결제총액' }),
      stat('당월 이용료 수납액', `${sFmt(cur.fee)}원`, '', { basis: '이용료 결제완료·수기완납 합계 (매출 미포함)' }),
    ].join('');

    const waitRows = wait.slice(0, 5).map(h => `
      <tr>
        <td>${fmtD(h.appliedAt)}</td>
        <td><div class="hq-cell-main">${escapeHtml(h.companyName)}</div><div class="hq-cell-sub">${escapeHtml(h.ceoName)}</div></td>
        <td><div class="hq-cell-main">${escapeHtml(h.name)}</div><div class="hq-cell-sub">${escapeHtml(formatPhone(h.phone))}</div></td>
        <td class="manage-col"><div class="manage-cell"><button type="button" class="btn-secondary btn-sm" data-dash-hq="${h.id}">상세보기</button></div></td>
      </tr>`).join('');
    const waitBody = wait.length
      ? `<div class="table-scroll"><table class="hq-table"><colgroup><col style="width:22%"><col style="width:34%"><col style="width:34%"><col style="width:120px"></colgroup>
          <thead><tr><th>도입신청일시</th><th>본사정보</th><th>회원정보</th><th class="manage-col">관리</th></tr></thead><tbody>${waitRows}</tbody></table></div>`
      : '<div class="dash-empty">승인 대기 중인 본사가 없습니다.</div>';

    const limRate = (n, d, base) => (d > 0 ? `${base} 대비 ${Math.round(n / d * 100)}%` : `${base} 대비 -`);

    return `
      <div class="dash-page">
        <div class="dash-head">
          <p>${PAGE_DESC.dashboard}</p>
          <span class="section-base">${realtimeLabel()}</span>
        </div>
        <div class="grid12">${row1}</div>
        <div class="grid12">${row2}</div>

        <div class="card">
          <div class="card-head">
            <h2>월별 매출 추이</h2>
            <button type="button" class="btn-secondary btn-sm" data-dash-go="sales">거래/매출 현황 보기 →</button>
          </div>
          <div class="dash-card-sub">최근 6개월 · 당월은 조회 시점까지의 값</div>
          ${salesChartHTML(buckets, true)}
        </div>

        <div class="grid12">
        <div class="col-6 card">
          <div class="card-head">
            <div class="dash-title-row"><h2>승인 대기 본사</h2><span class="badge badge-warning">${wait.length}건</span></div>
            <button type="button" class="btn-secondary btn-sm" data-dash-go="hq-wait">본사 관리 보기 →</button>
          </div>
          <div class="dash-card-sub">최신 신청순 · 최대 5건</div>
          ${waitBody}
        </div>

        <div class="col-6 card">
          <div class="card-head"><h2>운영 현황</h2></div>
          <div class="grid12 stat-grid" style="margin-bottom:0;">
            <div class="col-6 stat-card dash-link" data-dash-go="hq-limited" role="button" tabindex="0">
              <div class="stat-label">운영제한 본사</div>
              <div class="stat-value">${hqLimited.length}개</div>
              <div class="stat-sub">${limRate(hqLimited.length, hqOperating.length, '운영 본사')}</div>
            </div>
            <div class="col-6 stat-card dash-link" data-dash-go="franchise-limited" role="button" tabindex="0">
              <div class="stat-label">이용제한 가맹점</div>
              <div class="stat-value">${frLimited.length}개</div>
              <div class="stat-sub">${limRate(frLimited.length, frOperating.length, '운영 가맹점')}</div>
            </div>
          </div>
        </div>
        </div>
      </div>`;
  }

  function bindDashboardEvents() {
    const go = key => {
      if (key === 'hq-wait' || key === 'hq-limited') {
        currentItem = 'hq-manage';
        hqDetailId = null; hqDetailTab = 'apply'; hqRegisterMode = false;
        hqSearchDraft = ''; hqSearchQuery = ''; hqPage = 1; hqSelectedIds.clear();
        hqStatusFilter = key === 'hq-wait' ? '승인대기' : '운영제한';
      } else if (key === 'franchise-limited') {
        currentItem = 'franchise-info';
        franchiseDetailId = null; franchiseSearchDraft = ''; franchiseSearchQuery = ''; franchisePage = 1;
        franchiseStatusFilter = '이용제한'; franchiseSort = 'appliedAt';
      } else if (key === 'sales') {
        resetSalesState();
        currentItem = 'sales';
      }
      renderAll();
    };
    document.querySelectorAll('[data-dash-hq]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItem = 'hq-manage';
        hqDetailId = btn.dataset.dashHq; hqDetailTab = 'apply'; hqRegisterMode = false;
        renderAll();
      });
    });
    document.querySelectorAll('[data-dash-go]').forEach(el => {
      el.addEventListener('click', () => go(el.dataset.dashGo));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(el.dataset.dashGo); } });
    });
  }

  // ================================================================
  // 시스템 관리 > 공지사항 / 약관 관리
  //  - 데이터는 실제 연동 전 placeholder(목데이터)이며, 본문은 형식 확인용 예시 문구다.
  //  - 현재 일자는 거래/매출 현황과 같은 기준일(SALES_TODAY)을 사용한다.
  // ================================================================
  const NOTICE_BLOCKED_EXT = ['exe', 'bat', 'cmd', 'com', 'msi', 'scr', 'sh', 'js', 'jar', 'vbs', 'ps1'];
  const NOTICE_MAX_FILES = 5;
  const NOTICE_MAX_SIZE = 10 * 1024 * 1024;

  function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; }
  function clipIcon() { return '<span class="attach-ico" title="첨부파일"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></span>'; }

  let toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById('toastEl');
    if (!el) { el = document.createElement('div'); el.id = 'toastEl'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
  }

  // 공통 확인 창 (body에 직접 붙여 화면 재렌더와 무관하게 동작)
  function openConfirm({ msg, sub, ok, danger, cancel, onOk }) {
    const root = openSimModal(`
      <p style="margin:0 0 4px; font-size:14px;">${msg}</p>
      ${sub ? `<p style="margin:0; font-size:12px; color:var(--text-secondary);">${sub}</p>` : ''}
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cfCancel">${cancel || '취소'}</button>
        <button type="button" class="${danger ? 'btn-danger' : 'btn-primary'}" id="cfOk">${ok}</button>
      </div>`);
    root.querySelector('#cfCancel').addEventListener('click', closeSimModal);
    root.querySelector('#cfOk').addEventListener('click', () => { closeSimModal(); onOk(); });
  }
  const DELETE_SUB = '삭제한 데이터는 복구할 수 없습니다. 신중하게 삭제해 주세요.';

  // ---------------- 리치 텍스트 에디터 (공지사항·약관 내용 공통) ----------------

  function startNoticeForm(id) {
    noticeEditId = id || null;
    const n = id ? NOTICES.find(x => x.id === id) : null;
    noticeForm = n
      ? { target: n.target, exposed: n.exposed ? '노출' : '미노출', date: n.date, title: n.title, content: n.content, files: n.files.map(f => ({ ...f })) }
      : { target: '', exposed: '', date: SALES_TODAY, title: '', content: '', files: [] };
    noticeFormInit = JSON.stringify(noticeForm);
    noticeErr = {};
    noticeView = 'form';
    renderContent();

  function leaveNoticeForm() {
    if (noticeEditId) { noticeView = 'detail'; noticeDetailId = noticeEditId; } else { noticeView = 'list'; }
    noticeEditId = null; renderContent();
  }
  function deleteNotices(ids) {
    ids.forEach(id => { const i = NOTICES.findIndex(n => n.id === id); if (i !== -1) NOTICES.splice(i, 1); noticeSel.delete(id); });
    noticeView = 'list'; noticeDetailId = null;
    renderContent(); showToast('삭제되었습니다.');
  }
  function confirmDeleteNotice(ids) {
    openConfirm({ msg: ids.length === 1 ? '공지사항을 삭제하시겠습니까?' : `선택한 ${ids.length}건을 삭제하시겠습니까?`, sub: DELETE_SUB, ok: '삭제', danger: true, onOk: () => deleteNotices(ids) });
  }

  function bindNotice() {
    const $ = id => document.getElementById(id);
    if (noticeView === 'list') {
      const run = () => { noticeQ = noticeQDraft; noticePage = 1; noticeSel.clear(); renderContent(); };
      $('noticeSearchInput').addEventListener('input', e => { noticeQDraft = e.target.value; });
      $('noticeSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
      $('noticeSearchBtn').addEventListener('click', run);
      $('noticeExposeSel').addEventListener('change', e => { noticeExpose = e.target.value; noticePage = 1; noticeSel.clear(); renderContent(); });
      document.querySelectorAll('[data-notice-tab]').forEach(b => b.addEventListener('click', () => { noticeTab = b.dataset.noticeTab; noticePage = 1; noticeSel.clear(); renderContent(); }));
      bindPager('data-notice-page', n => { noticePage = n; noticeSel.clear(); renderContent(); });
      $('noticeRegBtn').addEventListener('click', () => startNoticeForm(null));
      $('noticeBulkDelBtn').addEventListener('click', () => { if (noticeSel.size) confirmDeleteNotice(Array.from(noticeSel)); });
      const all = $('noticeSelAll');
      if (all) all.addEventListener('change', e => { noticePageRows().forEach(n => { e.target.checked ? noticeSel.add(n.id) : noticeSel.delete(n.id); }); renderContent(); });

      document.querySelectorAll('[data-notice-open]').forEach(b => b.addEventListener('click', () => { noticeDetailId = b.dataset.noticeOpen; noticeView = 'detail'; renderContent(); }));
      document.querySelectorAll('[data-notice-edit]').forEach(b => b.addEventListener('click', () => startNoticeForm(b.dataset.noticeEdit)));
      document.querySelectorAll('[data-notice-del]').forEach(b => b.addEventListener('click', () => confirmDeleteNotice([b.dataset.noticeDel])));
      return;
    }
    if (noticeView === 'detail') {
      const back = () => { noticeView = 'list'; renderContent(); };
      $('noticeBackBtn').addEventListener('click', back);
      $('noticeDetailListBtn').addEventListener('click', back);
      $('noticeDetailEditBtn').addEventListener('click', () => startNoticeForm(noticeDetailId));
      $('noticeDetailDelBtn').addEventListener('click', () => confirmDeleteNotice([noticeDetailId]));
      document.querySelectorAll('[data-notice-dl]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
      return;
    }
    // form
    const f = noticeForm;
    document.querySelectorAll('input[name="nfTarget"]').forEach(r => r.addEventListener('change', e => { f.target = e.target.value; }));
    document.querySelectorAll('input[name="nfExposed"]').forEach(r => r.addEventListener('change', e => { f.exposed = e.target.value; }));
    $('nfDate').addEventListener('input', e => { f.date = e.target.value; });
    $('nfTitle').addEventListener('input', e => { f.title = e.target.value; });
    bindRichEditor('nfEditor', h => { f.content = h; });
    $('nfAddFile').addEventListener('click', () => $('nfFileInput').click());
    $('nfFileInput').addEventListener('change', e => {
      const picked = Array.from(e.target.files);
      let msg = '';
      for (const file of picked) {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (f.files.length >= NOTICE_MAX_FILES) { msg = `첨부파일은 최대 ${NOTICE_MAX_FILES}개까지 추가할 수 있습니다.`; break; }
        if (NOTICE_BLOCKED_EXT.includes(ext)) { msg = `${file.name}: 허용되지 않는 형식입니다.`; continue; }
        if (file.size > NOTICE_MAX_SIZE) { msg = `${file.name}: 파일당 10MB 이내만 추가할 수 있습니다.`; continue; }
        f.files.push({ name: file.name, size: file.size });
      }
      noticeErr = msg ? { file: msg } : {};
      renderContent();
    });
    document.querySelectorAll('[data-notice-rmfile]').forEach(b => b.addEventListener('click', () => { f.files.splice(Number(b.dataset.noticeRmfile), 1); noticeErr = {}; renderContent(); }));
    const cancel = () => {
      const dirty = JSON.stringify(noticeForm) !== noticeFormInit;
      if (!dirty) return leaveNoticeForm();
      openConfirm({ msg: '작성 중인 내용을 버리고 돌아가시겠습니까?', sub: '입력한 내용은 저장되지 않습니다.', ok: '나가기', onOk: leaveNoticeForm });
    };
    $('noticeFormBack').addEventListener('click', cancel);
    $('noticeFormCancel').addEventListener('click', cancel);
    $('noticeFormSave').addEventListener('click', () => {
      const e = {};
      if (!f.target) e.target = '노출대상을 선택해 주세요.';
      if (!f.exposed) e.exposed = '노출여부를 선택해 주세요.';
      if (!f.date) e.date = '등록일을 선택해 주세요.';
      if (!f.title.trim()) e.title = '제목을 입력해 주세요.';
      if (richEmpty(f.content)) e.content = '내용을 입력해 주세요.';
      noticeErr = e;
      if (Object.keys(e).length) { renderContent(); return; }
      if (noticeEditId) {
        const n = NOTICES.find(x => x.id === noticeEditId);
        Object.assign(n, { target: f.target, exposed: f.exposed === '노출', date: f.date, title: f.title.trim(), content: f.content, files: f.files.map(x => ({ ...x })) });
        noticeView = 'detail'; noticeDetailId = noticeEditId; noticeEditId = null;
        renderContent(); showToast('저장되었습니다.');
      } else {
        noticeSeq += 1;
        NOTICES.push({ id: 'n' + noticeSeq, seq: noticeSeq, title: f.title.trim(), target: f.target, exposed: f.exposed === '노출', author: '0SCM 운영자', date: f.date, views: 0, files: f.files.map(x => ({ ...x })), content: f.content });
        noticeView = 'list'; noticePage = 1;
        renderContent(); showToast('등록되었습니다.');
      }
    });
  }

  function termsMainHTML() {
    const type = termsTab, cur = termCurrent(type), all = termHistory(type);
    termsPage[type] = clampPage(termsPage[type], all.length, LIST_PAGE_SIZE);
    const pg = termsPage[type];
    const base = all.length - (pg - 1) * LIST_PAGE_SIZE;
    const rows = all.slice((pg - 1) * LIST_PAGE_SIZE, pg * LIST_PAGE_SIZE).map((v, i) => `
      <tr>
        <td>${base - i}</td><td>v${v.ver}</td><td>${fmtD(v.regDate)}</td><td>${fmtD(v.effective)}</td><td>${escapeHtml(v.regBy)}</td>
        <td class="manage-col"><div class="manage-cell"><button type="button" class="btn-secondary btn-sm" data-term-view="${v.ver}">상세보기</button></div></td>
      </tr>`).join('');
    const tabs = TERM_TYPES.map(([k, l]) => `<button type="button" class="tab-item ${termsTab === k ? 'active' : ''}" data-terms-tab="${k}">${l}</button>`).join('');
    return `
      <div class="grid12">
        <div class="col-12 page-section">
          <div class="card-head"><h2>약관 관리</h2></div>
          <div class="tabs">${tabs}</div>
          <div class="terms-block" style="margin-top:20px;">
            <div class="terms-block-head">
              <div style="display:flex; align-items:baseline; gap:10px;">
                <h3 class="form-section-title" style="margin:0;">현재 시행본</h3>
                <span class="terms-meta" style="margin:0;">v${cur.ver} · 등록일시 ${fmtD(cur.regDate)} · 시행일 ${fmtD(cur.effective)}</span>
              </div>
              <button type="button" class="btn-primary btn-sm" id="termsRegBtn">개정 등록</button>
            </div>
            ${viewerHTML(cur.content)}
          </div>
          <div class="terms-block">
            <h3 class="form-section-title">개정 이력</h3>
            <div class="table-toolbar"><span class="table-count">전체 ${all.length}건</span></div>
            ${rows ? `<div class="table-scroll"><table class="hq-table"><thead><tr>
              <th>번호</th><th>버전</th><th>등록일시</th><th>시행일</th><th>등록자</th><th class="manage-col">관리</th>
            </tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="sales-empty">등록된 개정 이력이 없습니다.</div>'}
            ${pagerHTML('data-terms-page', pg, all.length, LIST_PAGE_SIZE)}
          </div>
        </div>
      </div>`;
  }

  function termsFormHTML() {
    const type = termsTab, label = termLabel(type), f = termsForm, e = termsErr;
    const ver = termCurrent(type).ver + 1;
    const err = k => (e[k] ? `<div class="field-error">${e[k]}</div>` : '');
    return `
      <div class="hq-detail">
        <div class="detail-header">
          <div class="detail-header-title">
            <button type="button" class="btn-secondary btn-sm" id="termsFormBack">← 목록으로</button>
            <span class="hq-name">${label} 개정 등록</span>
          </div>
        </div>
        <div class="tab-body">
          <section class="form-section">
            <div class="form-row"><label class="field-label">약관 종류</label><span class="readonly-value">${label}</span></div>
            <div class="form-row"><label class="field-label">버전</label><span class="readonly-value">v${ver}</span></div>
            <div class="form-row">
              <label class="field-label">시행일 <span class="tag-required">*</span></label>
              <input type="date" class="form-input ${e.effective ? 'invalid' : ''}" id="tfEffective" style="flex:none; width:180px;" value="${escapeAttr(f.effective)}">
            </div>
            ${err('effective')}
            <div class="form-row">
              <label class="field-label">변경 사유 <span class="tag-required">*</span></label>
              <input type="text" class="form-input ${e.reason ? 'invalid' : ''}" id="tfReason" value="${escapeAttr(f.reason)}">
            </div>
            ${err('reason')}
            <div class="form-row" style="align-items:flex-start;">
              <label class="field-label">내용 <span class="tag-required">*</span></label>
              ${richEditorHTML('tfEditor', f.content, e.content)}
            </div>
            ${err('content')}
            <div style="margin:0 0 10px 150px;"><button type="button" class="btn-secondary btn-sm" id="tfLoadCur">현재 시행본 불러오기</button></div>
          </section>
        </div>
      </div>
      <div class="bottom-bar">
        <div></div>
        <div class="bottom-bar-actions">
          <button type="button" class="btn-secondary" id="termsFormCancel">취소</button>
          <button type="button" class="btn-primary" id="termsFormSave">등록</button>
        </div>
      </div>`;
  }

  function openTermDetail(type, ver) {
    const v = TERMS[type].find(x => x.ver === ver); if (!v) return;
    const root = openSimModal(`
      <h3 class="form-section-title">${termLabel(type)} v${v.ver}</h3>
      <dl class="detail-grid" style="margin-bottom:12px;">
        <dt>버전</dt><dd>v${v.ver}</dd><dt>등록일시</dt><dd>${fmtD(v.regDate)}</dd><dt>시행일</dt><dd>${fmtD(v.effective)}</dd>
        <dt>등록자</dt><dd>${escapeHtml(v.regBy)}</dd><dt>변경 사유</dt><dd>${escapeHtml(v.reason)}</dd>
      </dl>
      ${viewerHTML(v.content)}
      <div class="modal-actions"><button type="button" class="btn-secondary" id="tdClose">닫기</button></div>`);
    root.querySelector('.modal-box').classList.add('term-modal');
    root.querySelector('#tdClose').addEventListener('click', closeSimModal);
  }

  function bindTerms() {
    const $ = id => document.getElementById(id);
    if (termsView === 'main') {
      document.querySelectorAll('[data-terms-tab]').forEach(b => b.addEventListener('click', () => { termsTab = b.dataset.termsTab; termsPage[termsTab] = 1; renderContent(); }));
      bindPager('data-terms-page', n => { termsPage[termsTab] = n; renderContent(); });
      $('termsRegBtn').addEventListener('click', () => { termsForm = { effective: '', reason: '', content: '' }; termsFormInit = JSON.stringify(termsForm); termsErr = {}; termsView = 'form'; renderContent(); });
      document.querySelectorAll('[data-term-view]').forEach(b => b.addEventListener('click', () => openTermDetail(termsTab, Number(b.dataset.termView))));
      return;
    }
    const f = termsForm, type = termsTab;
    $('tfEffective').addEventListener('input', e => { f.effective = e.target.value; });
    $('tfReason').addEventListener('input', e => { f.reason = e.target.value; });
    const tfEd = bindRichEditor('tfEditor', h => { f.content = h; });
    $('tfLoadCur').addEventListener('click', () => {
      const fill = () => { f.content = toHtml(termCurrent(type).content); tfEd.setHtml(f.content); };
      if (!richEmpty(f.content)) openConfirm({ msg: '입력된 내용이 있습니다. 현재 시행본으로 덮어쓰시겠습니까?', ok: '덮어쓰기', onOk: fill });
      else fill();
    });
    const leave = () => { termsView = 'main'; renderContent(); };
    const cancel = () => {
      if (JSON.stringify(termsForm) === termsFormInit) return leave();
      openConfirm({ msg: '작성 중인 내용을 버리고 돌아가시겠습니까?', sub: '입력한 내용은 저장되지 않습니다.', ok: '나가기', onOk: leave });
    };
    $('termsFormBack').addEventListener('click', cancel);
    $('termsFormCancel').addEventListener('click', cancel);
    $('termsFormSave').addEventListener('click', () => {
      const e = {};
      if (!f.effective.trim()) e.effective = '시행일을 입력해 주세요.';
      if (!f.reason.trim()) e.reason = '변경 사유를 입력해 주세요.';
      if (richEmpty(f.content)) e.content = '내용을 입력해 주세요.';
      termsErr = e;
      if (Object.keys(e).length) { renderContent(); return; }
      const ver = termCurrent(type).ver + 1;
      openConfirm({
        msg: `${termLabel(type)} v${ver}을 등록하시겠습니까?`,
        sub: '등록 즉시 현재 시행본으로 교체되며 이후 수정·삭제할 수 없습니다. 이전 시행본은 개정 이력으로 이동합니다.',
        ok: '등록',
        onOk: () => {
          TERMS[type].push({ ver, regDate: SALES_TODAY + ' ' + new Date().toTimeString().slice(0, 5), effective: f.effective.trim(), regBy: '0SCM 운영자', reason: f.reason.trim(), content: f.content });
          termsView = 'main'; termsPage[type] = 1;
          renderContent(); showToast('등록되었습니다.');
        },
      });
    });
  }

  function renderContent() {
    if (currentItem === 'dashboard') {
      document.getElementById('contentWrapper').innerHTML = dashboardHTML();
      bindDashboardEvents();
      return;
    }
    if (currentItem === 'hq-manage') {
      document.getElementById('contentWrapper').innerHTML = hqDetailId ? hqDetailPageHTML() : hqListPageHTML();
      bindHqEvents();
      return;
    }
    if (currentItem === 'franchise-info') {
      document.getElementById('contentWrapper').innerHTML = franchiseDetailId ? franchiseDetailPageHTML() : franchiseListPageHTML();
      bindFranchiseEvents();
      return;
    }
    if (currentItem === 'notice') {
      document.getElementById('contentWrapper').innerHTML = noticeView === 'detail' ? noticeDetailHTML() : noticeView === 'form' ? noticeFormHTML() : noticeListHTML();
      bindNotice();
      return;
    }
    if (currentItem === 'terms') {
      document.getElementById('contentWrapper').innerHTML = termsView === 'form' ? termsFormHTML() : termsMainHTML();
      bindTerms();
      return;
    }
    if (currentItem === 'sales') {
      document.getElementById('contentWrapper').innerHTML = salesPageHTML();
      bindSalesEvents();
      return;
    }
    const label = currentLabel();
    document.getElementById('contentWrapper').innerHTML = pagePlaceholder(label, PAGE_DESC[currentItem] || '');
  }

  let lastRenderedItem = null;
  function renderAll() {
    if (currentItem !== lastRenderedItem || !realtimeStamp) refreshRealtimeStamp();
    lastRenderedItem = currentItem;
    renderMenu();
    renderTopbar();
    renderContent();
  }

  function closeNavOnMobile() {
    document.getElementById('app').classList.remove('nav-open');
  }

  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('app').classList.toggle('nav-open');
  });
  document.getElementById('scrim').addEventListener('click', closeNavOnMobile);

  // ---- 로그인 / 로그아웃 ----
  // 목업용 단일 계정(최고관리자). 실제 인증·잠금 상태 저장은 서버에서 처리하며, 목업의 잠금 상태는 새로고침하면 초기화된다.
  const LOGIN_ACCOUNT = { id: 'admin', pw: 'admin1234' };
  const LOGIN_MAX_FAIL = 5;
  let loginFailCount = 0;
  let loginLocked = false;
  let captchaCode = '';

  function drawCaptcha() {
    captchaCode = Array.from({ length: 6 }, () => Math.floor(Math.random() * 10)).join('');
    const cv = document.getElementById('loginCaptchaCanvas');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = 'rgba(107,107,107,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.random() * cv.width, Math.random() * cv.height);
      ctx.lineTo(Math.random() * cv.width, Math.random() * cv.height);
      ctx.stroke();
    }
    ctx.font = '700 24px "Noto Sans", sans-serif';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < captchaCode.length; i++) {
      ctx.save();
      ctx.translate(12 + i * 22, 20 + (Math.random() * 6 - 3));
      ctx.rotate((Math.random() - 0.5) * 0.5);
      ctx.fillStyle = '#1A1A1A';
      ctx.fillText(captchaCode[i], 0, 0);
      ctx.restore();
    }
    for (let i = 0; i < 25; i++) {
      ctx.fillStyle = 'rgba(107,107,107,0.5)';
      ctx.fillRect(Math.random() * cv.width, Math.random() * cv.height, 1.5, 1.5);
    }
  }

  function setLoginError(msg) { document.getElementById('loginError').textContent = msg || ''; }

  function resetLoginForm() {
    document.getElementById('loginId').value = '';
    document.getElementById('loginPw').value = '';
    document.getElementById('loginCaptcha').value = '';
    setLoginError('');
    drawCaptcha();
  }

  function failLogin(msg) {
    setLoginError(msg);
    document.getElementById('loginPw').value = '';
    document.getElementById('loginCaptcha').value = '';
    drawCaptcha();
  }

  function resetAdminViewState() {
    currentItem = 'dashboard';
    hqDetailId = null; hqRegisterMode = false; hqDeleteConfirm = null; hqSelectedIds = new Set();
    hqSearchQuery = ''; hqSearchDraft = ''; hqStatusFilter = '전체'; hqPage = 1;
    franchiseDetailId = null; franchiseSearchQuery = ''; franchiseSearchDraft = ''; franchiseStatusFilter = '전체'; franchisePage = 1;
    noticeView = 'list'; noticeDetailId = null; noticeEditId = null;
    termsView = 'main';
    salesTab = 'all'; salesDraft = SALES_DEFAULT(); salesApplied = SALES_DEFAULT(); salesUnit = 'day'; salesPage = 1;
    salesSelected = { hq: null, franchise: null };
    closeNavOnMobile();
  }

  function tryLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const cap = document.getElementById('loginCaptcha').value.trim();
    if (!id) { setLoginError('아이디를 입력해 주세요.'); return; }
    if (!pw) { setLoginError('비밀번호를 입력해 주세요.'); return; }
    if (!cap) { setLoginError('자동등록방지 숫자를 입력해 주세요.'); return; }
    if (cap !== captchaCode) { failLogin('자동등록방지 숫자가 일치하지 않습니다.'); return; }
    if (id !== LOGIN_ACCOUNT.id) { failLogin('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }
    if (loginLocked) { failLogin('비밀번호 5회 오류로 계정이 잠겼습니다. 운영 담당자에게 잠금 해제를 요청해 주세요.'); return; }
    if (pw !== LOGIN_ACCOUNT.pw) {
      loginFailCount += 1;
      if (loginFailCount >= LOGIN_MAX_FAIL) {
        loginLocked = true;
        failLogin('비밀번호 5회 오류로 계정이 잠겼습니다. 운영 담당자에게 잠금 해제를 요청해 주세요.');
      } else {
        failLogin('아이디 또는 비밀번호가 올바르지 않습니다.');
      }
      return;
    }
    loginFailCount = 0;
    resetLoginForm();
    resetAdminViewState();
    document.body.classList.add('logged-in');
    renderAll();
    window.scrollTo(0, 0);
  }

  function logout() {
    document.body.classList.remove('logged-in');
    resetAdminViewState();
    resetLoginForm();
    window.scrollTo(0, 0);
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); tryLogin(); });
  document.getElementById('loginCaptchaRefresh').addEventListener('click', () => {
    document.getElementById('loginCaptcha').value = '';
    drawCaptcha();
  });
  document.getElementById('loginCaptcha').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  drawCaptcha();

  renderAll();
</script>




</body>
