<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>0SCM 통합관리자 화면보기</title>
</head>
<body>


<meta charset="utf-8">

<style>
  /*
    0SCM 통합관리자 — 골격(스켈레톤) 목업
    - 레이아웃·컴포넌트: 09SCM 본사/가맹점 관리자(partner_admin_skeleton.html)와 동일한 디자인 시스템을 그대로 재사용
      (근거: 0SCM_디자인시스템_레이아웃표준_260918.md — "레이아웃은 4개 시스템 모두 완전히 동일, 시스템별로 다른 것은 키컬러 하나뿐")
    - 키컬러만 교체: 0SCM 통합어드민 확정 키컬러 #0B3B2E(딥그린) 적용 (파트너어드민은 #1D5CFF 블루)
    - LNB 메뉴 구조: 기존 러프 목업(zero-scm-unified-admin-mockup.csb62929.chatgpt.site) 확인 내용을 참고
    - GNB/LNB만 구성하고 내부 콘텐츠는 전부 placeholder 상태 — 상세 화면·정책은 이후 별도 작업
  */
  :root {
    --bg: #F4F4F4;
    --surface: #FFFFFF;
    --border: #EBEBEB;
    --text-secondary: #6B6B6B;
    --text-body: #1A1A1A;
    --key: #0B3B2E;
    --key-tint: rgba(11, 59, 46, 0.1);
    --success: #0F9D8C;
    --warning: #E5A100;
    --error: #E0362E;
    --lnb-w: 232px;
    --topbar-h: 61px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181B;
      --surface: #1F2024;
      --border: #303236;
      --text-secondary: #9A9CA3;
      --text-body: #F2F2F3;
      --key-tint: rgba(15, 110, 84, 0.24);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181B;
    --surface: #1F2024;
    --border: #303236;
    --text-secondary: #9A9CA3;
    --text-body: #F2F2F3;
    --key-tint: rgba(15, 110, 84, 0.24);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: 'Noto Sans KR', 'Noto Sans', -apple-system, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.5;
  }

  button, input { font-family: inherit; }
  a { color: inherit; text-decoration: none; }

  /* ---------- App shell ---------- */
  .app { display: flex; min-height: 100vh; }

  /* ---------- LNB ---------- */
  .lnb {
    width: var(--lnb-w);
    min-width: var(--lnb-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }

  .lnb-logo {
    height: var(--topbar-h);
    min-height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }
  .lnb-logo .mark { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .lnb-logo .sub { font-size: 12px; font-weight: 300; color: var(--text-secondary); white-space: nowrap; }

  .lnb-group-title {
    padding: 16px 16px 0;
    font-size: 12px;
    font-weight: 300;
    color: var(--text-secondary);
  }

  .lnb-menu {
    flex: 1;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .menu-item {
    height: 42px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }
  .menu-item:hover { background: var(--bg); }
  .menu-item.active { background: var(--key-tint); color: var(--key); font-weight: 700; }
  .menu-item .chev { font-size: 12px; color: var(--text-secondary); transition: transform .12s ease; }
  .menu-item.active .chev { color: var(--key); }
  .menu-group.open > .menu-item .chev { transform: rotate(90deg); }

  .submenu { display: none; flex-direction: column; gap: 2px; padding: 2px 0 4px 20px; }
  .menu-group.open > .submenu { display: flex; }
  .submenu .menu-item { height: 38px; font-size: 14px; font-weight: 300; position: relative; padding-left: 16px; }
  .submenu .menu-item::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--border);
    transform: translateY(-50%);
  }
  .submenu .menu-item.active::before { background: var(--key); }

  .menu-divider { height: 1px; background: var(--border); margin: 8px 4px; }

  .lnb-footer {
    padding: 14px 16px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .logout-btn {
    height: 38px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: color .12s ease;
  }
  .logout-btn:hover { color: var(--text-body); }
  .lnb-footer .lnb-shortcut-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 38px; text-decoration: none; font-size: 12px; }

  /* ---------- Main column ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    height: var(--topbar-h);
    min-height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar-loc { min-width: 0; }
  .topbar-loc .title {
    font-size: 20px;
    font-weight: 700;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; flex: none; }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    position: relative;
  }
  .icon-btn .dot {
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--error);
  }

  .divider-v { width: 1px; height: 24px; background: var(--border); }

  .account { display: flex; align-items: center; gap: 8px; }
  .account-text { text-align: right; line-height: 1.3; }
  .account-name { font-size: 14px; font-weight: 700; }
  .account-id { font-size: 12px; font-weight: 300; color: var(--text-secondary); }
  .role-badge {
    height: 22px;
    padding: 0 8px;
    border-radius: 4px;
    background: var(--key-tint);
    color: var(--key);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap;
  }

  /* ---------- Content ---------- */
  .main { background: var(--surface); }
  .content-wrapper { padding: 20px 24px 60px; max-width: 1920px; margin: 0 auto; width: 100%; }
  /* 페이지 섹션: 12컬럼 전체폭 최상위 영역은 별도 배경·보더·radius·패딩 없이 본문 위에 직접 배치한다 */
  .page-section { background: transparent; border: none; border-radius: 0; padding: 0; }

  .grid12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .col-3 { grid-column: span 3; }
  .col-4 { grid-column: span 4; }
  .col-6 { grid-column: span 6; }
  .col-8 { grid-column: span 8; }
  .col-12 { grid-column: span 12; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 { font-size: 20px; font-weight: 700; margin: 0; }

  .tag {
    height: 24px; padding: 0 10px; border-radius: 4px;
    font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center;
  }
  .tag-key { background: var(--key-tint); color: var(--key); }

  .placeholder {
    min-height: 220px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 4px;
  }

  /* ---------- Mobile ---------- */
  .menu-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-body);
    flex: none;
  }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9; }

  @media (max-width: 860px) {
    .lnb {
      position: fixed; left: 0; top: 0; z-index: 10;
      transform: translateX(-100%);
      transition: transform .18s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
    }
    .app.nav-open .lnb { transform: translateX(0); }
    .app.nav-open .scrim { display: block; }
    .menu-btn { display: flex; }
    .account-text { display: none; }
    .col-3, .col-4, .col-6, .col-8 { grid-column: span 12; }
    .topbar { padding: 0 16px; }
    .content-wrapper { padding: 16px 16px 40px; }
  }

  /* ---------- 본사 관리 : 공통 컴포넌트 ---------- */
  .btn-primary, .btn-secondary {
    height: 36px;
    padding: 0 14px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--key); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--text-body); border-color: var(--border); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

  .form-section { margin-bottom: 28px; }
  .form-section-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
  .form-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .field-label { width: 140px; min-width: 140px; font-size: 14px; color: var(--text-secondary); }
  .form-input {
    flex: 1; min-width: 160px;
    height: 36px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface); color: var(--text-body);
    font-size: 14px;
  }
  .form-input:disabled, .form-input[readonly] { background: var(--bg); color: var(--text-secondary); cursor: not-allowed; }
  textarea.form-input { height: auto; padding: 8px 12px; resize: vertical; }
  .field-hint { font-size: 12px; color: var(--text-secondary); margin: 2px 0 14px 150px; }
  .field-error { font-size: 12px; color: var(--error); margin: 2px 0 10px 150px; }
  .readonly-value { flex: 1; font-size: 14px; color: var(--text-body); }
  .radio-label { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-right: 16px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .input-pair { display: flex; gap: 8px; }

  .terms-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .terms-row:last-child { border-bottom: none; }
  .tag-required { font-size: 12px; font-weight: 700; color: var(--error); }
  .tag-optional { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .terms-status { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--success); }

  .badge { height: 24px; padding: 0 10px; border-radius: 4px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
  .badge-neutral { background: var(--bg); color: var(--text-secondary); }
  .badge-success { background: rgba(15,157,140,0.12); color: var(--success); }
  .badge-warning { background: rgba(229,161,0,0.12); color: var(--warning); }
  .badge-error { background: rgba(224,54,46,0.12); color: var(--error); }

  .hq-list-toolbar { margin-bottom: 14px; display: flex; gap: 8px; }
  .hq-list-toolbar .form-input { flex: 1; max-width: 420px; }
  .hq-filter-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-tab {
    height: 32px; padding: 0 14px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 12px; font-weight: 400; color: var(--text-secondary); cursor: pointer;
  }
  .filter-tab.active { background: var(--key-tint); color: var(--key); border-color: var(--key-tint); font-weight: 700; }

  .table-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 12px; flex-wrap: wrap; }
  .table-count { font-size: 12px; color: var(--text-secondary); }
  .sort-select {
    min-width: 140px; height: 36px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface); color: var(--text-body); font-size: 14px;
  }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 4px; padding-top: 16px; font-size: 12px; color: var(--text-secondary); }
  .pagination span { cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .pagination span.current { background: var(--key-tint); color: var(--key); font-weight: 700; }
  .pagination span.disabled { opacity: .35; cursor: default; }
  .btn-danger { background: var(--error); color: #fff; border: 1px solid transparent; height: 36px; padding: 0 14px; border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-danger:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  /* 목록 관리 컬럼: 폭 120px, 버튼은 세로 나열하고 셀 폭에 맞춰 같은 길이로 표시 */
  .hq-table th.manage-col, .hq-table td.manage-col { width: 120px; min-width: 120px; max-width: 120px; }
  .manage-cell { display: flex; flex-direction: column; gap: 6px; }
  .manage-cell .btn-sm { width: 100%; }
  .manage-cell .btn-danger { height: 28px; padding: 0 10px; font-size: 12px; }
  .list-count { font-size: 12px; color: var(--text-secondary); }
  .notice-link { color: var(--text-body); cursor: pointer; background: none; border: none; padding: 0; font: inherit; text-align: left; }
  .notice-link:hover { color: var(--key); text-decoration: underline; }
  .attach-ico { display: inline-flex; vertical-align: -2px; margin-left: 6px; color: var(--text-secondary); }
  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row .sort-select { min-width: 120px; }
  .editor-wrap { flex: 1; min-width: 280px; }
  .editor-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
  .editor-toolbar .btn-sm { min-width: 32px; }
  .editor { min-height: 220px; max-height: 420px; overflow-y: auto; padding: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-body); font-size: 14px; line-height: 1.6; }
  .editor:focus { outline: none; border-color: var(--key); }
  .form-input:focus, .sort-select:focus { outline: none; border-color: var(--key); }
  .form-input.invalid, .editor.invalid { border-color: var(--error); }
  .viewer { padding: 16px; border: 1px solid var(--border); border-radius: 4px; max-height: 360px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  .attach-list { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 6px; }
  .attach-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 14px; }
  .attach-item .size { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }
  .detail-grid { display: grid; grid-template-columns: 140px 1fr; row-gap: 12px; column-gap: 10px; font-size: 14px; margin-bottom: 20px; }
  .detail-grid dt { color: var(--text-secondary); margin: 0; }
  .detail-grid dd { margin: 0; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1A1A1A; color: #fff; padding: 10px 18px; border-radius: 4px; font-size: 14px; z-index: 30; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .term-modal { width: 640px; }
  .terms-block { margin-bottom: 28px; }
  .terms-block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .terms-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }

  .table-scroll { overflow-x: auto; }
  .hq-table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  .hq-table th, .hq-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
  .hq-table th { color: var(--text-secondary); font-weight: 700; background: var(--bg); }
  .hq-table td.num, .hq-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .hq-actions-cell { display: flex; gap: 6px; }
  .hq-cell-main { color: var(--text-body); }
  .hq-cell-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .hq-mall-url { color: var(--key); text-decoration: none; }
  .hq-mall-url:hover { text-decoration: underline; }

  .hq-detail { display: flex; flex-direction: column; gap: 16px; padding-bottom: 76px; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .detail-header-title { display: flex; align-items: center; gap: 10px; }
  .hq-name { font-size: 20px; font-weight: 700; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab-item {
    height: 42px; padding: 0 16px;
    border: none; background: transparent;
    font-size: 14px; font-weight: 400; color: var(--text-secondary);
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab-item.active { color: var(--key); font-weight: 700; border-bottom-color: var(--key); }
  .tab-body { background: transparent; border: none; border-radius: 0; padding: 24px 0 0; }

  /* 가맹점상세 하단 고정영역(market-buybar)과 동일한 fixed 패턴 */
  .bottom-bar {
    position: fixed;
    left: var(--lnb-w);
    right: 0;
    bottom: 0;
    z-index: 6;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
  }
  .bottom-bar-field { display: flex; align-items: center; gap: 10px; }
  .bottom-bar-field .form-input { min-width: 220px; flex: none; }
  .bottom-bar-actions { display: flex; align-items: center; gap: 10px; }
  .inline-confirm { font-size: 12px; color: var(--success); }

  @media (max-width: 860px) {
    .bottom-bar { left: 0; padding: 12px 16px; }
  }

  .memo-list { display: flex; flex-direction: column; gap: 10px; }
  .memo-item { border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; }
  .memo-text { font-size: 14px; margin-bottom: 6px; }
  .memo-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
  .memo-meta button { border: none; background: transparent; color: var(--error); cursor: pointer; font-size: 12px; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .section-head .form-section-title { margin: 0; }
  .section-base { font-size: 12px; color: var(--text-secondary); }
  .stat-grid { gap: 12px; margin-bottom: 14px; }
  .stat-card { border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .section-actions { display: flex; justify-content: flex-end; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  .modal-box {
    width: 420px; max-width: calc(100vw - 32px);

  async function downloadListFile(filename, headers, rows) {
    const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
    let saver = null;
    try { saver = window.claude && (await window.claude.use('downloads')); } catch (e) { saver = null; }
    if (saver) {
      try { await saver.save({ filename, data: csv }); } catch (e) { /* 저장 취소 등 */ }
      return;
    }
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const LIST_PAGE_SIZE = 20;
  function clampPage(page, total, size) { return Math.min(Math.max(1, page), Math.max(1, Math.ceil(total / size))); }
  function pagerHTML(attr, page, total, size) {
    const last = Math.max(1, Math.ceil(total / size));
    let st, en;
    if (last <= 5) { st = 1; en = last; }
    else if (page <= 3) { st = 1; en = 5; }
    else if (page >= last - 2) { st = last - 4; en = last; }
    else { st = page - 2; en = page + 2; }
    let h = `<span class="${page <= 1 ? 'disabled' : ''}" ${page <= 1 ? '' : `${attr}="${page - 1}"`}>◀</span>`;
    for (let i = st; i <= en; i++) h += `<span class="${i === page ? 'current' : ''}" ${attr}="${i}">${i}</span>`;
    h += `<span class="${page >= last ? 'disabled' : ''}" ${page >= last ? '' : `${attr}="${page + 1}"`}>▶</span>`;
    return `<div class="pagination">${h}</div>`;
  }
  function bindPager(attr, fn) {
    document.querySelectorAll(`[${attr}]`).forEach(el => el.addEventListener('click', () => fn(Number(el.getAttribute(attr)))));

  function hqDeleteConfirmModalHTML() {
    if (!hqDeleteConfirm) return '';
    const isBulk = hqDeleteConfirm.type === 'bulk';
    const target = !isBulk ? findHq(hqDeleteConfirm.id) : null;
    const desc = isBulk
      ? `선택한 본사 계정 ${hqDeleteConfirm.ids.length}건을 삭제하시겠습니까?`
      : `${escapeHtml(target ? target.companyName : '')} 계정을 삭제하시겠습니까?`;
    const targetIds = isBulk ? hqDeleteConfirm.ids : [hqDeleteConfirm.id];
    const hasFranchise = FRANCHISE_LIST.some(f => targetIds.includes(f.hqId));
    return `
      <div class="modal-overlay">
        <div class="modal-box">
          <p style="margin:0 0 4px; font-size:14px;">${desc}</p>
          <p style="margin:0 0 ${hasFranchise ? '4px' : '16px'}; font-size:12px; color:var(--text-secondary);">삭제한 데이터는 복구할 수 없습니다. 신중하게 삭제해 주세요.</p>
          ${hasFranchise ? '<p style="margin:0 0 16px; font-size:12px; color:var(--error);">소속 가맹점이 있는 본사를 삭제하면 해당 가맹점과 본사의 연결이 끊어집니다.</p>' : ''}
          <div class="modal-actions">

  function hqDetailPageHTML() {
    const h = findHq(hqDetailId);
    if (!h) return pagePlaceholder('본사 상세', '대상을 찾을 수 없습니다.');

    const TABS = [
      { id: 'apply', label: '신청정보' },
      { id: 'payapp', label: '페이앱 연동' },
      { id: 'trade', label: '가맹점·매출 요약' },
      { id: 'memo', label: '내부메모' },
    ];
    const tabsHTML = TABS.map(t => `
      <button type="button" class="tab-item ${hqDetailTab === t.id ? 'active' : ''}" data-hq-tab="${t.id}">${t.label}</button>`).join('');

    let bodyHTML;
    if (hqDetailTab === 'payapp') bodyHTML = hqPayappTabHTML(h);
    else if (hqDetailTab === 'trade') bodyHTML = hqTradeTabHTML(h);
    else if (hqDetailTab === 'memo') bodyHTML = hqMemoTabHTML(h);
    else bodyHTML = hqApplyTabHTML(h);

    const showAdminAccess = (h.status === '운영중' || h.status === '운영제한');
    const confirmText = hqStatusMessage;
    hqStatusMessage = '';
    const confirmHTML = `<span class="inline-confirm" id="hqStatusConfirm" ${confirmText ? '' : 'hidden'}>${escapeHtml(confirmText)}</span>`;
    const currentBadge = `<span class="badge ${hqStatusBadgeClass(h.status)}">${h.status}</span>`;

    let statusBarHTML;
    if (h.status === '승인대기') {
      const verified = h.payapp.verified;
      statusBarHTML = `
          <div class="bottom-bar-field">
            <label class="field-label" style="width:auto; min-width:0;">상태</label>
            ${currentBadge}
            ${verified ? '' : '<span class="field-hint" style="margin:0;">페이앱 연동 검증을 완료해야 운영승인할 수 있습니다.</span>'}
          </div>
          <div class="bottom-bar-actions">
            ${confirmHTML}
            <button type="button" class="btn-secondary" id="hqRejectBtn">승인불가</button>
            <button type="button" class="btn-primary" id="hqApproveBtn" ${verified ? '' : 'disabled'}>운영승인</button>
          </div>`;
    } else if (h.status === '승인불가') {
      statusBarHTML = `
          <div class="bottom-bar-field">
            <label class="field-label" style="width:auto; min-width:0;">상태</label>
            ${currentBadge}
          </div>
          <div class="bottom-bar-actions">
            ${confirmHTML}
            <button type="button" class="btn-primary" id="hqRevokeBtn">반려철회</button>
          </div>`;
    } else {
      statusBarHTML = `
          <div class="bottom-bar-field">
            <label class="field-label" style="width:auto; min-width:0;">상태</label>
            <label class="radio-label" style="margin-right:8px;"><input type="radio" name="hqStatusRadio" value="운영중" ${h.status === '운영중' ? 'checked' : ''}> 운영중</label>
            <label class="radio-label" style="margin-right:8px;"><input type="radio" name="hqStatusRadio" value="운영제한" ${h.status === '운영제한' ? 'checked' : ''}> 운영제한</label>
            <span class="field-hint" id="hqLimitHint" style="margin:0;" ${h.status === '운영제한' ? '' : 'hidden'}>가맹점 이용제한과 동일한 제재가 적용되고, 신규 가맹점 유치가 불가합니다.</span>
          </div>
          <div class="bottom-bar-actions">
            ${confirmHTML}
            <button type="button" class="btn-primary" id="hqStatusChangeBtn" disabled>변경확인</button>
          </div>`;
    }

    return `
      <div class="hq-detail">
        <div class="detail-header">
          <div class="detail-header-title">
            <button type="button" class="btn-secondary btn-sm" id="hqBackBtn">← 목록으로</button>
            <span class="hq-name">${escapeHtml(h.companyName)}</span>
            <span class="badge ${hqStatusBadgeClass(h.status)}">${h.status}</span>
          </div>
          ${showAdminAccess ? `<button type="button" class="btn-secondary" id="hqAdminAccessBtn">관리자접속</button>` : ''}
        </div>

        <div class="tabs">${tabsHTML}</div>
        <div class="tab-body">${bodyHTML}</div>

        <div class="bottom-bar">${statusBarHTML}
        </div>
      </div>
      ${hqPayappAlertHTML()}
      ${smsModalHTML()}`;
  }

  function bindHqEvents() {
    const searchInput = document.getElementById('hqSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', e => { hqSearchDraft = e.target.value; });
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { hqSearchQuery = hqSearchDraft; hqPage = 1; hqSelectedIds.clear(); reRenderHq(); }
      });
    }
    const hqExcelBtn = document.getElementById('hqExcelBtn');
    if (hqExcelBtn) hqExcelBtn.addEventListener('click', () => {
      const rows = filteredHqList().map(h => {
        const st = hqFranchiseStats(h), sm = salesMonth(h.id);
        return [fmtD(h.appliedAt), h.companyName, h.ceoName, h.name, formatPhone(h.phone), h.provisioned ? hqMallUrl(h) : '-',
          st.totalCount, sm.net, sm.fee, h.status];
      });
      downloadListFile('본사관리.csv', ['도입신청일시', '상호명', '대표자명', '이름', '휴대폰번호', '소매몰 URL', '가맹점 수', '당월 매출액', '당월 이용료 수납액', '상태'], rows);
    });
    const searchBtn = document.getElementById('hqSearchBtn');
    if (searchBtn) searchBtn.addEventListener('click', () => { hqSearchQuery = hqSearchDraft; hqPage = 1; hqSelectedIds.clear(); reRenderHq(); });
    document.querySelectorAll('[data-hq-filter]').forEach(btn => {
      btn.addEventListener('click', () => { hqStatusFilter = btn.dataset.hqFilter; hqPage = 1; hqSelectedIds.clear(); reRenderHq(); });
    });
    const sortSelect = document.getElementById('hqSortSelect');
    if (sortSelect) sortSelect.addEventListener('change', e => { hqSort = e.target.value; hqPage = 1; hqSelectedIds.clear(); reRenderHq(); });
    bindPager('data-hq-page', n => { hqPage = n; hqSelectedIds.clear(); reRenderHq(); });
    const backBtn = document.getElementById('hqBackBtn');
    if (backBtn) backBtn.addEventListener('click', () => { hqDetailId = null; reRenderHq(); });
    const registerBtn = document.getElementById('hqDirectRegisterBtn');
    if (registerBtn) registerBtn.addEventListener('click', () => {
      hqRegisterMode = true;
      hqRegisterDraft = defaultHqRegisterDraft();
      hqRegisterError = '';
      reRenderHq();
    });
    const registerBackBtn = document.getElementById('hqRegisterBackBtn');
    if (registerBackBtn) registerBackBtn.addEventListener('click', () => { hqRegisterMode = false; reRenderHq(); });

    document.querySelectorAll('[data-hq-detail]').forEach(btn => {
      btn.addEventListener('click', () => {
        hqDetailId = btn.dataset.hqDetail;
        hqDetailTab = 'apply';
        reRenderHq();
      });
    });
    document.querySelectorAll('[data-hq-sms]').forEach(btn => {
      btn.addEventListener('click', () => {
        smsModalTarget = btn.dataset.hqSms;
        reRenderHq();
      });
    });

    // 목록 : 선택 체크박스(일괄/개별) 및 삭제
    const selectAllCb = document.getElementById('hqSelectAllCheckbox');
    if (selectAllCb) selectAllCb.addEventListener('change', e => {
      hqPageRows().forEach(row => {
        if (e.target.checked) hqSelectedIds.add(row.id); else hqSelectedIds.delete(row.id);
      });
      reRenderHq();
    });
    document.querySelectorAll('[data-hq-row-check]').forEach(cb => {
      cb.addEventListener('change', e => {
        const id = cb.dataset.hqRowCheck;
        if (e.target.checked) hqSelectedIds.add(id); else hqSelectedIds.delete(id);
        reRenderHq();
      });
    });
    const bulkDeleteBtn = document.getElementById('hqBulkDeleteBtn');
    if (bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', () => {
      if (hqSelectedIds.size === 0) return;
      hqDeleteConfirm = { type: 'bulk', ids: Array.from(hqSelectedIds) };
      reRenderHq();
    });
    document.querySelectorAll('[data-hq-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        hqDeleteConfirm = { type: 'single', id: btn.dataset.hqDelete };
        reRenderHq();
      });
    });
    const deleteCancelBtn = document.getElementById('hqDeleteCancelBtn');
    if (deleteCancelBtn) deleteCancelBtn.addEventListener('click', () => { hqDeleteConfirm = null; reRenderHq(); });
    const deleteConfirmBtn = document.getElementById('hqDeleteConfirmBtn');
    if (deleteConfirmBtn) deleteConfirmBtn.addEventListener('click', () => {
      if (!hqDeleteConfirm) return;
      const ids = hqDeleteConfirm.type === 'bulk' ? hqDeleteConfirm.ids : [hqDeleteConfirm.id];
      ids.forEach(id => {
        const idx = HQ_LIST.findIndex(x => x.id === id);
        if (idx !== -1) {
          // 삭제한 본사의 매출 이력은 남아 있으므로 거래/매출 현황 전체 합계에는 계속 포함한다(목록·본사별 조회에서는 제외).
          if (HQ_LIST[idx].provisioned) DELETED_SALES_IDS.push(id);
          HQ_LIST.splice(idx, 1);
        }
        hqSelectedIds.delete(id);
      });
      hqDeleteConfirm = null;
      reRenderHq();
    });

    // 본사 직접등록 화면 — 모든 입력을 hqRegisterDraft에 실시간 동기화한다(re-render 시 값 유실 방지).
    // 텍스트 입력은 'input' 리스너에서 draft만 갱신하고 reRenderHq()를 호출하지 않는다(호출하면 매 타이핑마다
    // 화면이 다시 그려져 포커스가 흔들리기 때문). 화면 갱신이 실제로 필요한 동작(검증, 오류표시, 저장)만 재렌더한다.
    if (hqRegisterMode) {
      const d = hqRegisterDraft;
      const bindDraftText = (id, field) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', e => { d[field] = e.target.value; });
      };
      bindDraftText('hqRegUserId', 'userId');
      const regUserIdEl = document.getElementById('hqRegUserId');
      if (regUserIdEl) regUserIdEl.addEventListener('input', () => setFieldMsg('hqRegIdMsg', '', true));
      bindDraftText('hqRegPassword', 'password');
      bindDraftText('hqRegPasswordConfirm', 'passwordConfirm');
      bindDraftText('hqRegName', 'name');
      bindDraftText('hqRegEmail', 'email');
      bindDraftText('hqRegCompanyName', 'companyName');
      bindDraftText('hqRegCeoName', 'ceoName');
      const regBizEl = document.getElementById('hqRegBizRegNo');
      if (regBizEl) regBizEl.addEventListener('input', e => {
        e.target.value = formatBizRegNo(e.target.value);
        d.bizRegNo = e.target.value;
        setFieldMsg('hqRegBizMsg', '', true);
      });
      const regCorpEl = document.getElementById('hqRegCorpRegNo');
      if (regCorpEl) regCorpEl.addEventListener('input', e => {
        e.target.value = formatCorpRegNo(e.target.value);
        d.corpRegNo = e.target.value;
      });
      bindDraftText('hqRegBizCategory1', 'bizCategory1');
      bindDraftText('hqRegBizCategory2', 'bizCategory2');
      bindDraftText('hqRegAddressDetail', 'addressDetail');

      const phoneInput = document.getElementById('hqRegPhone');
      if (phoneInput) phoneInput.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 11);
        d.phone = e.target.value;
      });

      document.querySelectorAll('input[name="hqRegBizType"]').forEach(radio => {
        radio.addEventListener('change', e => {
          d.bizType = e.target.value;
          const row = document.getElementById('hqRegCorpRegNoRow');
          if (row) row.style.display = e.target.value === '법인' ? 'flex' : 'none';
        });
      });

      const payappUserIdInput = document.getElementById('hqRegPayappUserId');
      if (payappUserIdInput) payappUserIdInput.addEventListener('input', e => { d.payapp.userid = e.target.value; d.payapp.verified = false; });
      const payappKeyInput = document.getElementById('hqRegPayappKey');
      if (payappKeyInput) payappKeyInput.addEventListener('input', e => { d.payapp.linkkey = e.target.value; d.payapp.verified = false; });
      const payappValueInput = document.getElementById('hqRegPayappValue');
      if (payappValueInput) payappValueInput.addEventListener('input', e => { d.payapp.linkval = e.target.value; d.payapp.verified = false; });
      const payappVerifyBtn = document.getElementById('hqRegPayappVerifyBtn');
      if (payappVerifyBtn) payappVerifyBtn.addEventListener('click', () => {
        if (!(d.payapp.userid && d.payapp.linkkey && d.payapp.linkval)) {
          d.payapp.verified = false;
          setFieldMsg('hqRegPayappMsg', '판매자 아이디, 연동 KEY, 연동 VALUE를 모두 입력해 주세요.', false);
          return;
        }
        d.payapp.verified = true;
        reRenderHq();
      });

      const regCheckIdBtn = document.getElementById('hqRegCheckIdBtn');
      if (regCheckIdBtn) regCheckIdBtn.addEventListener('click', () => {
        const r = mockCheckUserId(d.userId, null);
        setFieldMsg('hqRegIdMsg', r.msg, r.ok);
      });
      const regBizAuthBtn = document.getElementById('hqRegBizAuthBtn');
      if (regBizAuthBtn) regBizAuthBtn.addEventListener('click', () => {
        const r = mockCheckBizRegNo(d.bizRegNo, null);
        setFieldMsg('hqRegBizMsg', r.msg, r.ok);
      });
      const regAddressFindBtn = document.getElementById('hqRegAddressFindBtn');
      if (regAddressFindBtn) regAddressFindBtn.addEventListener('click', () => {
        const a = pickMockAddress();
        d.zipCode = a.zip;
        d.address = a.addr;
        document.getElementById('hqRegZip').value = a.zip;
        document.getElementById('hqRegAddress').value = a.addr;
      });

      const termsServiceCb = document.getElementById('hqRegTermsService');
      if (termsServiceCb) termsServiceCb.addEventListener('change', e => { d.termsService = e.target.checked; });
      const termsPrivacyCb = document.getElementById('hqRegTermsPrivacy');
      if (termsPrivacyCb) termsPrivacyCb.addEventListener('change', e => { d.termsPrivacy = e.target.checked; });
      const termsMarketingCb = document.getElementById('hqRegTermsMarketing');
      if (termsMarketingCb) termsMarketingCb.addEventListener('change', e => { d.termsMarketing = e.target.checked; });

      const registerCancelBtn = document.getElementById('hqRegisterCancelBtn');
      if (registerCancelBtn) registerCancelBtn.addEventListener('click', () => {
        hqRegisterMode = false;
        hqRegisterError = '';
        reRenderHq();
      });
      const registerSaveBtn = document.getElementById('hqRegisterSaveBtn');
      if (registerSaveBtn) registerSaveBtn.addEventListener('click', () => {
        // 등록 시 필수 입력은 이용약관·개인정보처리방침 동의뿐이다. 값이 입력된 항목은 항목별 텍스트 규칙을 지켜야 한다.
        const values = {
          userId: d.userId.trim(), password: d.password, name: d.name.trim(), phone: d.phone.trim(), email: d.email.trim(),
          bizType: d.bizType, companyName: d.companyName.trim(), ceoName: d.ceoName.trim(), bizRegNo: d.bizRegNo.trim(),
          corpRegNo: d.corpRegNo.trim(), bizCategory1: d.bizCategory1.trim(), bizCategory2: d.bizCategory2.trim(),
          addressDetail: d.addressDetail.trim(),
        };
        let err = validateHqFields(values);
        if (!err && (d.password || d.passwordConfirm) && d.password !== d.passwordConfirm) {
          err = '비밀번호와 비밀번호 확인이 일치하지 않습니다.';
        }
        if (!err && values.userId) {
          const idCheck = mockCheckUserId(values.userId, null);
          if (!idCheck.ok) err = idCheck.msg;
        }
        if (!err && values.bizRegNo) {
          const bizCheck = mockCheckBizRegNo(values.bizRegNo, null);
          if (!bizCheck.ok && bizCheck.msg.startsWith('이미')) err = bizCheck.msg;
        }
        if (!err && (!d.termsService || !d.termsPrivacy)) {
          err = '이용약관과 개인정보처리방침에 모두 동의해 주세요.';
        }
        if (err) {
          hqRegisterError = err;
          reRenderHq();
          return;
        }

        const newId = 'hq' + hqNextId;
        hqNextId += 1;
        HQ_LIST.push({
          id: newId,
          appliedAt: SALES_TODAY + ' ' + new Date().toTimeString().slice(0, 5),
          name: d.name.trim(), userId: d.userId.trim(), email: d.email.trim(), phone: d.phone.trim(),
          bizType: d.bizType, companyName: d.companyName.trim(), ceoName: d.ceoName.trim(), bizRegNo: d.bizRegNo.trim(),
          corpRegNo: d.bizType === '법인' ? d.corpRegNo.trim() : '',
          bizCategory1: d.bizCategory1.trim(), bizCategory2: d.bizCategory2.trim(),
          zipCode: d.zipCode, address: d.address, addressDetail: d.addressDetail.trim(),
          expectedFranchiseCount: '', inquiry: '',
          termsService: d.termsService, termsPrivacy: d.termsPrivacy, termsMarketing: d.termsMarketing,
          password: d.password ? 'set' : null, passwordEditing: false,

  let realtimeStamp = '';
  function refreshRealtimeStamp() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    realtimeStamp = `${fmtD(SALES_TODAY)} ${z(d.getHours())}:${z(d.getMinutes())}`;

  // FRANCHISE_LIST를 단일 출처로 집계한다.
  //  - 운영 가맹점: 이용상태 이용승인 + 이용제한
  //  - 당월 거래발생: 운영 가맹점 중 당월 결제완료 거래 1건 이상(목업은 페이앱+계좌이체·현장결제 거래액 합 > 0으로 대체)
  //  - 당월 신규가입: 가입신청일시이 당월인 가맹점(이용상태 무관)
  //  - 매출액·이용료 수납액은 본사·가맹점 자체 매출 기준으로 salesMonth()에서 산출한다(소속 가맹점 합산 없음, 이용료 없는 본사는 0원 정상)
  function hqFranchiseStats(h) {
    const list = FRANCHISE_LIST.filter(f => f.hqId === h.id);
    const operating = list.filter(f => f.status === '이용승인' || f.status === '이용제한');
    return {
      totalCount: list.length,
      operatingCount: operating.length,
      tradingCount: operating.filter(f => salesMonth(f.id).gross > 0).length,
      idleCount: operating.filter(f => salesMonth(f.id).gross <= 0).length,
      newCount: list.filter(f => (f.appliedAt || '').slice(0, 7) === MOCK_NOW_MONTH).length,
    };
  }

  function findFranchise(id) {
    return FRANCHISE_LIST.find(x => x.id === id);
  }

  function franchiseMallUrl(f) {
    return `mall.zeroscm.kr/${f.userId}`;
  }

  function franchiseStatusBadgeClass(status) {
    if (status === '이용승인') return 'badge-success';
    if (status === '이용제한') return 'badge-warning';
    if (status === '이용불가') return 'badge-error';
    return 'badge-neutral'; // 이용대기
  }

  function filteredFranchiseList() {
    const q = normSearch(franchiseSearchQuery.trim());
    const rows = FRANCHISE_LIST.filter(f => {
      if (franchiseStatusFilter !== '전체' && f.status !== franchiseStatusFilter) return false;
      if (!q) return true;
      const hq = findHq(f.hqId);
      const hqName = hq ? normSearch(hq.companyName) : '';
      return normSearch(f.companyName).includes(q) || normSearch(f.ceoName).includes(q)
        || normSearch(f.bizRegNo || '').includes(q) || hqName.includes(q);
    });
    if (franchiseSort === 'hqName') {
      rows.sort((a, b) => {
        const an = (findHq(a.hqId) || {}).companyName || '';
        const bn = (findHq(b.hqId) || {}).companyName || '';
        return an.localeCompare(bn, 'ko');
      });
    } else if (franchiseSort === 'franchiseName') {
      rows.sort((a, b) => a.companyName.localeCompare(b.companyName, 'ko'));
    } else if (franchiseSort === 'amount') {
      rows.sort((a, b) => salesMonth(b.id).net - salesMonth(a.id).net);
    } else {
      // 'appliedAt' — 가입신청일시 최신순
      rows.sort((a, b) => (a.appliedAt < b.appliedAt ? 1 : a.appliedAt > b.appliedAt ? -1 : 0));
    }
    return rows;
  }
